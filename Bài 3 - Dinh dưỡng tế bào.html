<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái về dinh dưỡng tế bào | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Sự khác biệt cốt lõi nhất giữa \"Dinh dưỡng dạ dày\" và \"Dinh dưỡng tế bào\" là gì?", "opts": ["Dinh dưỡng dạ dày dành cho người béo, còn Dinh dưỡng tế bào dành cho người gầy.", "Dinh dưỡng dạ dày chỉ làm lấp đầy cái bụng đói; còn Dinh dưỡng tế bào đi thẳng qua vi nhung mao vào máu để nuôi dưỡng từng tế bào.", "Dinh dưỡng dạ dày chỉ cung cấp chất đạm, còn Dinh dưỡng tế bào chỉ cung cấp chất xơ và nước.", "Dinh dưỡng dạ dày cần đun nấu ở nhiệt độ cao, còn Dinh dưỡng tế bào bắt buộc phải ăn sống."], "answer": "B", "explain": "Ăn no dạ dày chỉ là cảm giác làm đầy cơ học. Cơ thể khỏe mạnh hay bệnh tật lại phụ thuộc vào việc các tế bào có nhận đủ dinh dưỡng tinh sạch hay không. Dinh dưỡng tế bào được chế biến dạng phân tử siêu nhỏ, giúp hấp thu trực tiếp qua nhung mao ruột vào máu mà không làm dạ dày phải gồng mình tiêu hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Cả người béo và người gầy đều cần Dinh dưỡng tế bào để phục hồi cơ thể.\nPhương án C chưa đúng: Dinh dưỡng tế bào cung cấp trọn vẹn cả đạm, vitamin, khoáng chất và chất xơ chứ không chỉ có xơ và nước.\nPhương án D chưa đúng: Dinh dưỡng tế bào được sản xuất theo công nghệ sinh học hiện đại chứ không liên quan đến việc ăn sống hay chín."}, {"n": 2, "q": "\"Vi nhung mao\" (nhung mao đường ruột) đóng vai trò sinh học quan trọng nào trong hệ tiêu hóa của chúng ta?", "opts": ["Là cơ quan co bóp chính giúp nghiền nát các loại thức ăn thô.", "Là thảm lông nhỏ lót ở thành ruột non, đóng vai trò như \"cánh cửa\" hấp thu dinh dưỡng và ngăn chặn chất độc vào máu.", "Là nơi tích trữ toàn bộ lượng mỡ thừa của cơ thể trước khi đẩy ra ngoài.", "Là tuyến tiết ra axit chính để phân hủy các loại thịt động vật."], "answer": "B", "explain": "Vi nhung mao là hàng triệu sợi lông li ti phủ đầy niêm mạc ruột non. Chúng làm tăng diện tích tiếp xúc lên gấp hàng trăm lần, giúp chắt lọc vi chất dinh dưỡng đi nuôi cơ thể, đồng thời cản lại các mầm bệnh và chất độc hại.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Việc nghiền nát thức ăn là do răng nhai và dạ dày co bóp, không phải do vi nhung mao.\nPhương án C chưa đúng: Vi nhung mao là cơ quan hấp thu dinh dưỡng, không phải nơi tích trữ mỡ thừa.\nPhương án D chưa đúng: Tiết axit là chức năng của dạ dày, không phải của vi nhung mao ở ruột non."}, {"n": 3, "q": "Thủ phạm hàng đầu gây tổn thương và vón dính hệ vi nhung mao ruột non trong lối sống hiện đại là gì?", "opts": ["Uống quá nhiều nước ấm và ăn nhiều rau củ luộc.", "Thức ăn chiên xào nhiều dầu mỡ tái chế, chất bảo quản, đường tinh luyện, khói thuốc, rượu bia và sự căng thẳng.", "Ăn các loại đạm thực vật từ đậu nành và các loại hạt.", "Ngủ đủ 8 tiếng mỗi ngày và vận động thể dục nhẹ nhàng."], "answer": "B", "explain": "Dầu mỡ chiên lại, hóa chất bảo quản, phụ gia thực phẩm, chất kích thích và căng thẳng tâm lý chính là \"rác thải\" làm cho vi nhung mao bị dính bết, gãy rụng và teo tấy. Khi vi nhung mao bị tổn thương, cỗ máy hấp thu bị rỉ sét hoàn toàn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nước ấm và rau luộc giúp làm sạch vi nhung mao chứ không gây tổn thương.\nPhương án C chưa đúng: Đạm thực vật lành tính giúp nuôi dưỡng hệ tiêu hóa khỏe mạnh.\nPhương án D chưa đúng: Ngủ đủ và vận động nhẹ giúp phục hồi và trẻ hóa vi nhung mao."}, {"n": 4, "q": "Hậu quả nghiêm trọng nhất khi hệ vi nhung mao ruột bị tổn thương và đóng mảng bám độc tố lâu ngày là gì?", "opts": ["Giúp cơ thể tự động ngưng hấp thu chất béo nên không bao giờ bị tăng cân.", "Cơ thể bị độc tố ngấm ngược vào máu, mất khả năng hấp thu chất bổ, dẫn tới gầy yếu mệt mỏi hoặc béo phì tích mỡ.", "Giúp dạ dày tiết ra nhiều vi khuẩn có lợi hơn để tiêu hóa thức ăn.", "Làm tăng gấp đôi tốc độ chuyển hóa tự nhiên của cơ thể."], "answer": "B", "explain": "Vi nhung mao bị tổn thương giống như bộ lưới lọc bị tắc nghẽn và ô nhiễm: Chất bổ ăn vào không hấp thu được (gây gầy gò, suy nhược), trong khi độc tố và mỡ xấu lại tràn vào máu gây béo phì, gan nhiễm mỡ và bệnh mãn tính.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nhung mao hỏng vẫn khiến chất béo xấu ngấm vào máu gây tăng mỡ nội tạng.\nPhương án C chưa đúng: Mảng bám độc tố tiêu diệt vi khuẩn có lợi chứ không làm tăng vi khuẩn có lợi.\nPhương án D chưa đúng: Nhung mao tổn thương làm suy giảm tốc độ chuyển hóa của cơ thể."}, {"n": 5, "q": "Tại sao nhiều người \"Gầy gò ăn rất nhiều thực phẩm bổ dưỡng đắt tiền nhưng mãi không thể tăng cân\"?", "opts": ["Do cơ thể họ có cơ chế tự đốt cháy toàn bộ thức ăn thành hơi nước.", "Do vi nhung mao ruột bị tổn thương và đóng mảng bám, khiến chất bổ đi qua đường tiêu hóa rồi bị đào thải ra ngoài.", "Do họ uống quá nhiều nước lọc ấm trước bữa ăn.", "Do dạ dày của họ chứa quá nhiều đạm thực vật."], "answer": "B", "explain": "\"Đường ống bị tắc thì nước bổ đến mấy cũng trôi đi!\" Khi vi nhung mao bị teo tấy và đóng mảng độc tố, dẫu bạn có ăn yến sào, nhân sâm hay thực phẩm đắt tiền thì tế bào vẫn không nhận được vi chất, dẫn tới gầy gò suy nhược kéo dài.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Không có cơ chế tự đốt thức ăn thành hơi nước trong sinh học.\nPhương án C chưa đúng: Uống nước ấm đúng cách giúp làm sạch đường ruột hỗ trợ tăng cân tốt hơn.\nPhương án D chưa đúng: Đạm thực vật dễ hấp thu và không phải nguyên nhân gây gầy gò."}, {"n": 6, "q": "Nguyên nhân khiến nhiều người \"Nỗ lực nhịn ăn, hít không khí thôi cũng vẫn bị tích mỡ bụng\" dưới góc nhìn Dinh dưỡng tế bào là gì?", "opts": ["Do tế bào của họ có khả năng tự sản sinh ra mỡ từ ánh nắng mặt trời.", "Do vi nhung mao bị rối loạn, không hấp thu được vi chất nên tế bào liên tục phát tín hiệu đói, ép cơ thể tích trữ mỡ dư thừa.", "Do họ uống quá nhiều nước lọc trong ngày.", "Do tế bào cơ bắp biến thành tế bào mỡ khi không vận động."], "answer": "B", "explain": "Đây là hiện tượng \"Đói tế bào!\" Dù bạn nhịn ăn nhưng do vi nhung mao hỏng, tế bào bị bỏ đói vi chất nên não bộ liên tục phát tín hiệu thèm ăn. Đồng thời, cơ thể rơi vào chế độ sinh tồn: nạp chút thức ăn nào vào cũng lập tức chuyển thành mỡ trữ ở bụng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Con người không thể tự tổng hợp mỡ từ ánh nắng như thực vật quang hợp.\nPhương án C chưa đúng: Nước lọc 0 Calo không thể gây tích mỡ bụng.\nPhương án D chưa đúng: Tế bào cơ và tế bào mỡ là hai loại tế bào hoàn toàn khác nhau, không thể biến đổi qua lại."}, {"n": 7, "q": "Quy trình chuẩn để phục hồi sức khỏe hệ vi nhung mao tại Nhóm Dinh Dưỡng là gì?", "opts": ["Nạp ngay thật nhiều thuốc bổ và các loại chất béo động vật.", "Làm sạch mảng bám độc tố trước -> Phục hồi vi nhung mao -> Cung cấp Dinh dưỡng cấp độ tế bào tinh sạch.", "Nhịn ăn hoàn toàn trong 7 ngày để đường ruột tự teo lại.", "Uống thật nhiều nước đá lạnh để đóng băng các vi khuẩn có hại."], "answer": "B", "explain": "Nguyên lý vàng: \"Muốn sơn nhà mới phải cạo sạch lớp vôi cũ!\" Đầu tiên cần làm sạch đường ruột bằng Lô hội và nước ấm, sau đó phục hồi vi nhung mao và nạp Bữa ăn F1 tinh sạch để tế bào hấp thu trọn vẹn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Đưa chất bổ vào đường ruột bẩn chỉ gây lãng phí và làm tăng gánh nặng cho gan thận.\nPhương án C chưa đúng: Nhịn ăn 7 ngày làm vi nhung mao bị teo tóp và hoại tử thêm.\nPhương án D chưa đúng: Nước đá lạnh làm co quắt và tổn thương vi nhung mao nghiêm trọng hơn."}, {"n": 8, "q": "Lô Hội Thảo Mộc Cô Đặc được ví như \"Vàng lỏng\" tráng rửa đường ruột nhờ công dụng đặc biệt nào?", "opts": ["Xoa dịu niêm mạc tổn thương, bóc tách mảng bám dầu mỡ tích tụ, làm sạch không gian giữa các vi nhung mao.", "Thay thế hoàn toàn Bữa ăn sáng dinh dưỡng F1.", "Cung cấp một lượng Calo rất lớn để bù đắp năng lượng cho cơ thể.", "Làm ngưng trệ quá trình tiêu hóa để dạ dày được nghỉ ngơi."], "answer": "A", "explain": "Chiết xuất lô hội cao cấp giống như \"xà phòng thiên nhiên\" lành tính, giúp rửa sạch các mảng bám dầu mỡ lâu ngày dính trên thảm vi nhung mao, xoa dịu các vết viêm loét và trả lại sự thông thoáng cho ruột non.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lô hội làm sạch đường ruột, không chứa đạm và vi chất nên không thay thế F1.\nPhương án C chưa đúng: Lô hội chứa rất ít Calo, không gây tăng Calo rỗng.\nPhương án D chưa đúng: Lô hội hỗ trợ tiêu hóa tốt hơn chứ không làm ngưng trệ tiêu hóa."}, {"n": 9, "q": "Tại sao Bữa ăn lành mạnh F1 Herbalife được gọi là \"Dinh dưỡng cấp độ tế bào\"?", "opts": ["Vì sản phẩm được tiêm trực tiếp vào tế bào qua đường máu.", "Vì thực phẩm được phân tách thành dạng vi phân tử tinh sạch, giúp vi nhung mao hấp thu ngay lập tức mà không cần tiêu hóa phức tạp.", "Vì sản phẩm chứa các tế bào động vật còn sống.", "Vì chỉ có tế bào thần kinh mới sử dụng được sản phẩm này."], "answer": "B", "explain": "Bữa ăn F1 được sản xuất bằng công nghệ sinh học tiên tiến, loại bỏ toàn bộ tạp chất và chất béo xấu. Dinh dưỡng đã được bẻ gãy thành các phân tử nhỏ gọn, khi uống vào sẽ được vi nhung mao hấp thu thẳng vào máu nuôi tế bào chỉ sau vài phút.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: F1 là sản phẩm dinh dưỡng dạng uống qua đường tiêu hóa tự nhiên, không tiêm.\nPhương án C chưa đúng: F1 có nguồn gốc chính từ đạm thực vật (đậu nành), không chứa tế bào động vật sống.\nPhương án D chưa đúng: Mọi tế bào trong cơ thể (cơ, da, gan, tim, thần kinh) đều nhận dinh dưỡng từ F1."}, {"n": 10, "q": "Tỷ lệ hấp thu dinh dưỡng của hệ vi nhung mao thay đổi như thế nào giữa trạng thái \"Tổn thương\" và \"Khỏe mạnh\"?", "opts": ["Khi tổn thương hấp thu được 100%, khi khỏe mạnh hấp thu được 0%.", "Khi bị tổn thương chỉ hấp thu được từ 5–20%; Khi khỏe mạnh làm sạch có thể hấp thu lên tới 80–100% dinh dưỡng.", "Trạng thái vi nhung mao không ảnh hưởng gì đến tỷ lệ hấp thu dinh dưỡng.", "Cả hai trạng thái đều hấp thu cố định đúng 50% lượng thức ăn nạp vào."], "answer": "B", "explain": "Khi nhung mao bị dính bết và teo tấy, 80-95% giá trị thức ăn bạn nạp vào sẽ bị trôi ra ngoài qua đường xả. Khi ruột được làm sạch và nhung mao dựng đứng khỏe mạnh, cơ thể sẽ hấp thu trọn vẹn 80-100% vi chất để tái tạo sức khỏe.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Trái ngược hoàn toàn với thực tế sinh học.\nPhương án C chưa đúng: Sức khỏe vi nhung mao quyết định trực tiếp khả năng hấp thu của cơ thể.\nPhương án D chưa đúng: Tỷ lệ hấp thu biến đổi linh hoạt theo mức độ sạch sẽ của đường ruột."}, {"n": 11, "q": "Sự khác biệt lớn nhất giữa \"Dinh dưỡng tế bào tinh sạch\" và \"Thực phẩm thô thông thường\" đối với gánh nặng tiêu hóa là gì?", "opts": ["Dinh dưỡng tế bào giúp dạ dày và gan thận không phải làm việc vất vả để lọc bỏ độc tố; Thực phẩm thô bắt cơ thể tốn nhiều năng lượng để tiêu hóa và lọc tạp chất.", "Thực phẩm thô hấp thu nhanh hơn Dinh dưỡng tế bào gấp 10 lần.", "Dinh dưỡng tế bào chứa nhiều chất béo bão hòa hơn thực phẩm thô.", "Thực phẩm thô hoàn toàn không chứa bất kỳ Calo nào."], "answer": "A", "explain": "Tiêu hóa thịt mỡ hay đồ chiên xào bắt dạ dày co bóp liên tục 4-6 tiếng và làm gan thận gồng mình lọc độc tố. Dinh dưỡng tế bào F1 đã được làm sạch sẵn, giúp cơ thể đón nhận vi chất nhẹ nhàng mà không tiêu tốn năng lượng tiêu hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dinh dưỡng tế bào hấp thu nhanh hơn thực phẩm thô rất nhiều.\nPhương án C chưa đúng: Dinh dưỡng tế bào đã loại bỏ hoàn toàn chất béo bão hòa xấu.\nPhương án D chưa đúng: Thực phẩm thô chứa rất nhiều Calo."}, {"n": 12, "q": "Tại sao làm sạch và nuôi dưỡng tế bào lại là chìa khóa gốc rễ để \"Đẩy lùi các bệnh mãn tính không lây\"?", "opts": ["Vì Dinh dưỡng tế bào là một loại thuốc đặc trị bệnh mãn tính.", "Vì khi từng tế bào khỏe mạnh và sạch sẽ, cơ thể sẽ tự kích hoạt cơ chế tự sửa chữa và nâng cao hệ miễn dịch tự nhiên.", "Vì Dinh dưỡng tế bào tiêu diệt toàn bộ các vi khuẩn trong cơ thể.", "Vì Dinh dưỡng tế bào làm ngưng trệ quá trình lão hóa của xương."], "answer": "B", "explain": "Cơ thể con người là một cỗ máy sinh học kỳ diệu. Khi được làm sạch độc tố và nạp đủ nguyên liệu tinh sạch, các tế bào sẽ tự phục hồi tổn thương, nâng cao sức đề kháng và tự điều chỉnh các rối loạn chuyển hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Dinh dưỡng tế bào là thực phẩm dinh dưỡng lành mạnh, không phải là thuốc chữa bệnh.\nPhương án C chưa đúng: Cơ thể cần các vi khuẩn có lợi (lợi khuẩn) để sống khỏe mạnh, không thể tiêu diệt toàn bộ.\nPhương án D chưa đúng: Dinh dưỡng tế bào hỗ trợ nuôi dưỡng tế bào xương chứ không làm ngưng trệ lão hóa hoàn toàn."}, {"n": 13, "q": "\"Phản ứng làm sạch\" (thải độc) khi bắt đầu sử dụng Dinh dưỡng tế bào và Lô hội biểu hiện như thế nào?", "opts": ["Cơ thể lập tức tăng 5kg mỡ thừa vùng bụng.", "Nổi vài hạt mụn, xáo trộn nhẹ đường tiêu hóa, ngứa nhẹ hoặc đi tiểu nhiều hơn do tế bào đang trút bỏ độc tố tích tụ lâu ngày.", "Bị rụng toàn bộ tóc và móng tay.", "Bị mất hoàn toàn khả năng vận động."], "answer": "B", "explain": "Giống như dọn dẹp một ngôi nhà lâu năm không quét: khi rác bẩn được xới lên để đẩy ra ngoài, bạn có thể thấy hiện tượng nổi mụn, đi tiểu nhiều hay ngứa nhẹ. Đây là dấu hiệu mừng cho thấy tế bào đang được làm sạch!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Dinh dưỡng tế bào ít Calo nên không gây tăng 5kg mỡ bụng.\nPhương án C chưa đúng: Dinh dưỡng tế bào nuôi dưỡng tóc và móng chắc khỏe chứ không gây rụng.\nPhương án D chưa đúng: Thải độc nhẹ nhàng không làm mất khả năng vận động."}, {"n": 14, "q": "Mối liên hệ giữa \"Dinh dưỡng tế bào\" và việc \"Trẻ hóa làn da, vóc dáng\" của phụ nữ được giải thích như thế nào?", "opts": ["Làn da là gương phản chiếu sức khỏe tế bào bên trong; khi tế bào sạch và đủ vi chất, da sẽ tự động sáng hồng, căng mịn và săn chắc.", "Dinh dưỡng tế bào hoạt động như một lớp kem phấn trang điểm che phủ bề mặt da.", "Dinh dưỡng tế bào làm triệt tiêu toàn bộ lớp mỡ tự nhiên dưới da mặt.", "Dinh dưỡng tế bào chỉ có tác dụng với vóc dáng, hoàn toàn không tác động tới làn da."], "answer": "A", "explain": "\"Đẹp tự nhiên bắt đầu từ tế bào!\" Thoa kem đắt tiền chỉ tác động lớp tế bào chết bên ngoài. Uống Dinh dưỡng tế bào nuôi dưỡng lớp tế bào sống từ bên trong, giúp sản sinh collagen tự nhiên, cho làn da rạng rỡ và vóc dáng thon gọn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dinh dưỡng tế bào nuôi dưỡng từ bên trong, không phải kem trang điểm bên ngoài.\nPhương án C chưa đúng: Sản phẩm giữ lại lớp đệm collagen và chất béo tốt bảo vệ da.\nPhương án D chưa đúng: Làn da là nơi thể hiện rõ nhất hiệu quả nuôi dưỡng của Dinh dưỡng tế bào."}, {"n": 15, "q": "Tại sao việc uống \"Đủ nước ấm\" lại là điều kiện bắt buộc để Dinh dưỡng tế bào phát huy tối đa tác dụng?", "opts": ["Vì nước ấm làm biến đổi Dinh dưỡng tế bào thành chất xơ.", "Vì nước ấm là \"môi trường vận chuyển\" đưa vi chất vào tế bào và cuốn trôi độc tố ra ngoài.", "Vì nếu không có nước ấm thì Bữa ăn F1 sẽ biến thành chất béo xấu.", "Vì nước ấm làm triệt tiêu toàn bộ Calo của Bữa ăn F1."], "answer": "B", "explain": "Dinh dưỡng giống như hàng hóa, còn nước ấm chính là dòng sông để chở hàng. Thiếu nước, dòng sông bị cạn quánh, dinh dưỡng không thể tìm đến tế bào và rác thải độc tố không thể thoát ra ngoài.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nước ấm không biến dinh dưỡng thành chất xơ.\nPhương án C chưa đúng: Thiếu nước chỉ làm giảm hiệu quả hấp thu chứ F1 không biến thành chất béo xấu.\nPhương án D chưa đúng: Nước ấm 0 Calo không triệt tiêu Calo của F1."}, {"n": 16, "q": "Hiện tượng \"Gãy rụng vi nhung mao\" do căng thẳng thần kinh (stress) kéo dài diễn ra như thế nào?", "opts": ["Stress làm co thắt mạch máu ruột, giảm nuôi dưỡng niêm mạc, khiến vi nhung mao bị suy yếu, gãy rụng và giảm hấp thu.", "Stress làm vi nhung mao phát triển quá nhanh gây tắc nghẽn đường ruột.", "Stress biến vi nhung mao thành các mô mỡ nội tạng.", "Stress không có bất kỳ ảnh hưởng nào đến hệ tiêu hóa."], "answer": "A", "explain": "Báo động đỏ! Khi căng thẳng, não bộ phát tín hiệu co thắt các mạch máu ở cơ quan tiêu hóa để dồn máu về tim và cơ. Ruột bị thiếu máu nuôi dưỡng kéo dài sẽ làm thảm vi nhung mao bị tổn thương, gãy rụng và kém hấp thu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Stress làm vi nhung mao gãy rụng teo tóp chứ không phát triển nhanh.\nPhương án C chưa đúng: Nhung mao là mô niêm mạc, không thể biến thành mô mỡ.\nPhương án D chưa đúng: Hệ tiêu hóa là nơi chịu tác động cực kỳ nhạy cảm từ cảm xúc thần kinh."}, {"n": 17, "q": "Ý nghĩa của sản phẩm Cell Activator (Hoạt Hóa Tế Bào) trong chương trình Dinh dưỡng tế bào là gì?", "opts": ["Thay thế hoàn toàn cho công việc vận động thể dục hàng ngày.", "Giúp tối ưu hóa năng lượng của tế bào, tăng cường khả năng hấp thu vi chất và chống oxy hóa bảo vệ tế bào.", "Giúp làm đông đặc lượng chất béo từ thức ăn thô.", "Giúp tăng cân nhanh bằng cách tích trữ nước dưới da."], "answer": "B", "explain": "Cell Activator được ví như \"chìa khóa mở cửa ty thể\" (tiểu thể tạo năng lượng cho tế bào). Nó giúp kích hoạt tế bào suy yếu hoạt động trở lại, tăng hiệu suất hấp thu vi chất từ F1 và chống lại các gốc do gây lão hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Sản phẩm hỗ trợ tế bào, không thể thay thế vận động thể chất.\nPhương án C chưa đúng: Sản phẩm không làm đông đặc chất béo.\nPhương án D chưa đúng: Sản phẩm không gây tích nước dưới da."}, {"n": 18, "q": "Tác hại của việc lạm dụng các loại \"Thuốc tẩy ruột, thuốc giảm cân siêu tốc\" đối với vi nhung mao là gì?", "opts": ["Lột sạch lớp nhầy bảo vệ, tàn phá vi nhung mao, làm liệt cơ ruột và khiến đường ruột mất hoàn toàn khả năng tự hấp thu.", "Giúp vi nhung mao mọc dài ra và khỏe mạnh hơn gấp 2 lần.", "Giúp biến toàn bộ mỡ nội tạng thành cơ bắp chỉ sau 1 đêm.", "Giúp tăng cường hệ vi sinh vật có lợi cho ruột."], "answer": "A", "explain": "Thuốc tẩy ruột hay thuốc giảm cân xả đồ xổ cực kỳ nguy hiểm! Chúng bào mòn niêm mạc ruột, tàn phá thảm vi nhung mao và ép ruột xả nước cấp tốc. Hậu quả là ruột bị chai liệt, mất khả năng hấp thu và càng dễ tích mỡ về sau.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thuốc xả làm tàn phá chứ không giúp nhung mao mọc khỏe.\nPhương án C chưa đúng: Không có loại thuốc nào biến mỡ thành cơ sau 1 đêm.\nPhương án D chưa đúng: Thuốc xả tiêu diệt sạch sẽ cả vi khuẩn có lợi trong ruột."}, {"n": 19, "q": "Thời gian trung bình để tế bào niêm mạc ruột non tái tạo và phục hồi một lớp vi nhung mao mới là bao lâu?", "opts": ["Chỉ mất đúng 5 phút sau khi uống 1 ly nước.", "Khoảng từ 3 đến 7 ngày đối với tế bào niêm mạc ruột, và cần 30 đến 90 ngày để phục hồi toàn diện hệ thống.", "Phải mất tối thiểu 10 năm không ăn uống gì.", "Tế bào niêm mạc ruột không bao giờ có khả năng tái tạo lại."], "answer": "B", "explain": "Kỳ diệu sinh học! Tế bào niêm mạc ruột là một trong những tế bào tái tạo nhanh nhất cơ thể (thay mới mỗi 3-7 ngày). Nếu bạn kiên trì làm sạch và nuôi dưỡng bằng Dinh dưỡng tế bào trong 30-90 ngày, bạn sẽ sở hữu một hệ tiêu hóa hoàn toàn mới!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: 5 phút là quá ngắn, không đủ thời gian sinh học để phân chia tế bào.\nPhương án C chưa đúng: Khung thời gian 10 năm là phi thực tế.\nPhương án D chưa đúng: Niêm mạc ruột có khả năng tái tạo kỳ diệu nếu được chăm sóc đúng cách."}, {"n": 20, "q": "Thông điệp cốt lõi và giá trị sâu sắc nhất của Chủ đề 3 \"Dinh Dưỡng Tế Bào\" tại Nhóm Dinh Dưỡng là gì?", "opts": ["\"LÀM SẠCH ĐƯỜNG RUỘT - PHỤC HỒI VI NHUNG MAO - NUÔI DƯỠNG TẾ BÀO: Chìa khóa gốc rễ cho vóc dáng thon gọn, sức đề kháng vững chắc và sức khỏe An Vui trọn đời!\"", "Chỉ cần ăn thật nhiều thực phẩm đắt tiền là chắc chắn cơ thể sẽ khỏe mạnh.", "Nhịn ăn tối đa là phương pháp tốt nhất để làm sạch tế bào.", "Dinh dưỡng tế bào chỉ dành cho những người đang có bệnh lý nghiêm trọng."], "answer": "A", "explain": "Muốn có một cơ thể khỏe mạnh và vóc dáng chuẩn đẹp bền vững, hãy bắt đầu từ việc chăm sóc \"ngôi nhà tế bào\"! Làm sạch mảng bám, phục hồi nhung mao ruột và nạp Dinh dưỡng F1 tinh sạch mỗi ngày chính là khoản đầu tư thông thái nhất cho sức khỏe trọn đời!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thực phẩm đắt tiền mà ruột bẩn thì không hấp thu được, gây lãng phí.\nPhương án C chưa đúng: Nhịn ăn làm teo tóp tế bào và tổn thương niêm mạc ruột.\nPhương án D chưa đúng: Dinh dưỡng tế bào là giải pháp chăm sóc sức khỏe chủ động cho tất cả mọi người muốn trẻ đẹp và phòng bệnh."}];
const TKP_LESSON=3;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VỀ<br>DINH DƯỠNG TẾ BÀO</h1><div class="subtitle">LÀM SẠCH ĐƯỜNG RUỘT – HẤP THU TỐI ĐA</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
