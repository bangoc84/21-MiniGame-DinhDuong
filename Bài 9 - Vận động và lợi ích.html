:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#f7faff;background:#101b40}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 10% 15%,#34498a 0,transparent 40%),radial-gradient(circle at 85% 75%,#51325d 0,transparent 45%),#101b40}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe291;outline-offset:3px}.slide{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;min-height:100dvh;padding:clamp(12px,2vw,30px);animation:slideIn .38s ease both;isolation:isolate}.slide.active{display:flex;flex-direction:column}.slide::before{content:'✦  NHÓM DINH DƯỠNG THIỆU TRUNG  ✦\A đồng hành kiến tạo\A sức khỏe toàn diện';white-space:pre-wrap;text-align:center;position:fixed;top:50%;left:50%;width:85%;transform:translate(-50%,-50%) rotate(-12deg);font-size:clamp(22px,3.4vw,54px);font-weight:900;line-height:1.65;color:#e5f7ff;opacity:.065;pointer-events:none;z-index:0}.slide::after{content:'♡';position:fixed;top:46%;left:50%;transform:translate(-50%,-50%);font-size:min(65vw,60vh);color:#99dcff;opacity:.035;pointer-events:none;z-index:0}.shell{position:relative;z-index:1;width:min(1320px,100%);margin:auto;display:flex;flex-direction:column;gap:clamp(9px,1.35vh,18px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.06em;color:#c6f5ff;font-size:clamp(12px,1.15vw,17px)}.pill{border:1px solid #ffffff55;border-radius:999px;padding:8px 14px;background:#ffffff13;font-weight:800;font-size:clamp(12px,1.15vw,16px)}.sound{border:1px solid #ffffff55;border-radius:999px;padding:9px 15px;background:#ffffff18;color:white;font-weight:700}.progress{height:8px;border-radius:10px;background:#ffffff20;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#68d9e8,#ffe58d);transition:width .3s}.glass{border:1px solid #ffffff32;background:linear-gradient(125deg,#ffffff18,#ffffff0c);border-radius:24px;box-shadow:0 15px 40px #0002;backdrop-filter:blur(6px)}.question{padding:clamp(15px,2.4vw,30px)}.topic{font-size:clamp(13px,1.3vw,19px);color:#ffdb8a;font-weight:900;text-transform:uppercase;letter-spacing:.045em;margin-bottom:8px}.context{font-size:clamp(14px,1.35vw,20px);line-height:1.48;color:#e4eafa;margin:0 0 12px}.prompt{font-size:clamp(20px,2.25vw,34px);font-weight:900;line-height:1.33;margin:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1.2vw,16px)}.answer{display:flex;gap:14px;align-items:center;min-height:clamp(84px,11vh,140px);padding:clamp(12px,1.5vw,22px);color:white;text-align:left;background:#172c5dcc;border:2px solid #6385d166;border-radius:19px;font-size:clamp(14px,1.45vw,22px);font-weight:650;line-height:1.38;transition:transform .16s,border-color .16s,background .16s}.answer:not(:disabled):hover{transform:translateY(-3px) scale(1.008);border-color:#ffe0a3;background:#2b427d}.answer .letter{flex:0 0 auto;width:clamp(36px,3.2vw,49px);height:clamp(36px,3.2vw,49px);display:grid;place-items:center;border-radius:13px;background:#ffffff23;font-weight:950;font-size:clamp(18px,1.6vw,24px)}.answer:disabled{cursor:default}.answer.correct{background:linear-gradient(110deg,#0d744f,#167b55);border-color:#a2ffd5;box-shadow:0 0 22px #31ffab66;animation:glow .7s ease}.answer.wrong{background:#8b3144;border-color:#ffafbb}.answer.dim{opacity:.42}.feedback{display:none;padding:clamp(14px,1.5vw,22px);animation:slideIn .25s ease}.feedback.show{display:block}.feedback.good{border-color:#63e5b0}.feedback.bad{border-color:#ffad9f}.feedback.neutral{border-color:#ffe29e}.feedback-title{font-size:clamp(18px,2vw,29px);font-weight:950;margin:0 0 9px}.explain-title{color:#ffe19d;font-size:clamp(14px,1.2vw,18px);font-weight:900;margin-bottom:6px}.explain{font-size:clamp(13px,1.2vw,18px);line-height:1.55;white-space:pre-line;max-height:22vh;overflow:auto;padding-right:8px;color:#f2f5ff}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:clamp(12px,1.25vw,17px) clamp(20px,2.3vw,32px);font-weight:950;font-size:clamp(15px,1.4vw,20px);background:linear-gradient(120deg,#ffdd82,#ffb76c);color:#18203b;box-shadow:0 8px 20px #0003}.btn.secondary{background:#ffffff20;color:white;border:1px solid #ffffff66}.btn:disabled{opacity:.4;cursor:not-allowed}.foot{text-align:center;color:#a9bedb;font-size:12px;margin-top:4px}.hero{text-align:center;align-items:center;justify-content:center;min-height:75vh;gap:24px}.eyebrow{color:#ffe09d;letter-spacing:.14em;font-weight:900}.hero h1{font-size:clamp(36px,5.3vw,84px);line-height:1.13;margin:0;text-shadow:0 8px 30px #0004}.hero h2{font-size:clamp(18px,2vw,28px);font-weight:700;color:#b7eaff;margin:0}.hero p{max-width:790px;line-height:1.7;color:#e3eaff;font-size:clamp(16px,1.45vw,21px)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px 10px;text-align:center}.stat strong{display:block;font-size:clamp(30px,4.4vw,65px);color:#ffe18d}.stat span{color:#d4e8ff;font-size:clamp(12px,1.2vw,18px)}.score{font-size:clamp(70px,12vw,170px);font-weight:1000;line-height:1;color:#ffe28f;text-shadow:0 0 45px #ffdb6b5a}.confetti{position:fixed;top:-25px;width:9px;height:15px;pointer-events:none;animation:fall 2.7s linear forwards;z-index:30}@keyframes fall{to{transform:translateY(110vh) rotate(760deg);opacity:0}}@keyframes glow{50%{transform:scale(1.016);box-shadow:0 0 38px #3dffab99}}@keyframes slideIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.answers{grid-template-columns:1fr}.answer{min-height:65px}.slide{padding:12px}.question{padding:14px}.context{font-size:14px}.prompt{font-size:20px}.stats{grid-template-columns:1fr 1fr}.explain{max-height:28vh}.hero{min-height:85vh}.brand{max-width:60%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="app"></div><script>
const QUESTIONS=[{"title": "CÂU 01 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Bản chất thực sự của quy tắc \"80% Dinh Dưỡng & 20% Vận Động\" trong việc giảm mỡ và kiến tạo vóc dáng là gì?", "options": ["Vận động chỉ chiếm 20% vì bài tập nào cũng đốt rất ít calo, còn dinh dưỡng chiếm 80% vì chỉ cần nhịn ăn là sẽ giảm cân.", "Dinh dưỡng chiếm 80% vì quyết định cấu trúc tế bào, mỡ nội tạng và tổng calo nạp vào; Vận động chiếm 20% đóng vai trò chất xúc tác tăng chuyển hóa, săn chắc cơ bắp và lưu thông khí huyết.", "Vận động chiếm 80% đối với người trẻ muốn tăng cơ, còn dinh dưỡng chiếm 80% chỉ áp dụng cho người lớn tuổi không vận động được.", "Vận động và dinh dưỡng luôn đóng góp 50/50 vì nếu không tập luyện thì dinh dưỡng hoàn toàn không thể tự chuyển hóa thành cơ bắp."], "answer": "B", "explanation": "Vận động là chất kích hoạt giúp cơ thể dẻo dai và đốt thêm calo, nhưng chính Dinh dưỡng mới là nguyên liệu quyết định vóc dáng (xây cơ hay tích mỡ). Nếu dinh dưỡng sai (nạp dư calo rỗng/đường/mỡ xấu), dù tập cật lực 2 tiếng mỗi ngày cũng không thể bù đắp được!"}, {"title": "CÂU 02 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tại sao nhiều người \"Chạy bộ hoặc tập Aerobic 1 - 2 tiếng mỗi ngày\" nhưng mỡ bụng vẫn không giảm, thậm chí người ngày càng lỏng nhão?", "options": ["Do cơ thể đã quen với bài tập nên không còn tiêu hao calo nữa.", "Do dính \"Bẫy ăn bù\" (nạp thừa calo sau tập) kết hợp thiếu Đạm sạch, khiến cơ thể tự phân hủy cơ bắp để lấy năng lượng, làm hạ thấp tốc độ chuyển hóa (BMR).", "Do tập luyện quá ít thời gian nên chưa chạm đến vùng đốt mỡ nội tạng.", "Do uống quá nhiều nước lọc trong lúc tập làm cản trở quá trình đốt mỡ."], "answer": "B", "explanation": "Chạy bộ 1 tiếng đốt khoảng 300 kcal, nhưng sau tập vì đói nên ăn 1 tô phở hoặc uống 1 ly trà sữa (500–600 kcal) -> dư thừa calo! Đồng thời, nếu không nạp đủ đạm, cơ thể sẽ đốt chính mô cơ để bù năng lượng, làm người bị teo cơ, chảy xệ và tụt BMR."}, {"title": "CÂU 03 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Khái niệm \"Cửa sổ cơ bắp 30 phút\" (Anabolic Window) ngay sau khi vận động được hiểu chuẩn xác nhất là gì?", "options": ["Khoảng thời gian 30 phút dạ dày ngưng hoạt động, tuyệt đối không được ăn uống gì để cơ thể tiếp tục đốt mỡ tự do.", "Khoảng thời gian tế bào cơ bắp nhạy cảm nhất với dinh dưỡng, cần nạp ngay ĐẠM SẠCH hấp thu nhanh và đường đơn/kép tốt để phục hồi sợi cơ và chặn đứng dị hóa.", "Khung giờ vàng để ăn thoải mái các món tinh bột GI cao vì toàn bộ năng lượng sẽ biến thành cơ bắp chứ không tích mỡ.", "Thời gian bàng quang hoạt động mạnh nhất, cần uống ngay 1 lít nước đá để hạ thân nhiệt."], "answer": "B", "explanation": "Trong 30 phút sau tập, các vi sợi cơ bị tổn thương cần nguyên liệu gấp. Nạp ngay 1 ly Shake F1 + PPP hoặc H24 Rebuild Endurance giúp đưa axit amin thẳng vào tế bào cơ, tái tạo khối cơ săn chắc và dập tắt quá trình dị hóa."}, {"title": "CÂU 04 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Hiện tượng \"Dị hóa cơ bắp\" (Muscle Catabolism) khi vận động xảy ra trong trường hợp nào dưới đây?", "options": ["Khi tập luyện ở nhịp tim nhẹ nhàng và uống đủ nước ấm.", "Khi vận động cường độ cao khi bụng rỗng thiếu đạm, buộc cơ thể phải bóc tách đạm từ mô cơ bắp ra chuyển hóa thành đường năng lượng.", "Khi bổ sung quá nhiều đạm thực vật trước buổi tập.", "Khi tập luyện dưới ánh nắng mặt trời buổi sáng."], "answer": "B", "explanation": "Khi máu thiếu sẵn axit amin và glycogen bị cạn kiệt, tập luyện nặng sẽ ép cơ thể tự \"ăn thịt chính mình\". Đây là lý do nhiều người tập rất nặng nhưng chân tay ngày càng teo tóp, bụng vẫn nhiều mỡ!"}, {"title": "CÂU 05 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Sự khác biệt cốt lõi giữa \"Tập ở Nhịp tim đốt mỡ\" và \"Tập ở Nhịp tim tối đa\" là gì?", "options": ["Nhịp tim tối đa giúp đốt mỡ nhanh gấp 3 lần nhịp tim đốt mỡ.", "Nhịp tim đốt mỡ (60–70% nhịp tim tối đa) sử dụng MỠ THỪA làm nhiên liệu chính; Nhịp tim tối đa (>85%) sử dụng ĐƯỜNG (Glycogen) làm nhiên liệu chính và mau gây kiệt sức.", "Nhịp tim đốt mỡ chỉ dành cho người già, người trẻ bắt buộc phải tập ở nhịp tim tối đa.", "Hai mức nhịp tim này có tỷ lệ đốt mỡ và đốt đường hoàn toàn giống nhau."], "answer": "B", "explanation": "\"Tập vừa sức mới đốt được mỡ!\" Khi tập ở cường độ vừa phải (vẫn nói được câu ngắn mà không đứt hơi), oxy cung cấp đủ cho phản ứng thủy phân mỡ. Tập quá sức khiến cơ thể thiếu oxy, bắt buộc phải chuyển sang đốt đường, gây thèm ăn đồ ngọt dữ dội sau tập!"}, {"title": "CÂU 06 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Mối quan hệ sinh học giữa Khối lượng cơ bắp (Muscle Mass) và Tốc độ chuyển hóa cơ bản (BMR) khi nghỉ ngơi là gì?", "options": ["1kg cơ bắp tiêu hao calo gấp 3–5 lần 1kg mỡ; càng nhiều cơ bắp thì cỗ máy BMR càng cao, ngay cả khi nằm ngủ cơ thể vẫn tự động đốt mỡ.", "Cơ bắp và mỡ thừa tiêu hao lượng calo hoàn toàn bằng nhau khi nghỉ ngơi.", "Càng nhiều cơ bắp thì BMR càng giảm để tiết kiệm năng lượng cho cơ thể.", "Khối lượng cơ bắp chỉ giúp tăng sức mạnh nâng vát chứ không ảnh hưởng đến tiêu hao calo."], "answer": "A", "explanation": "Cơ bắp là \"động cơ tiêu thụ calo\" hoạt động 24/7. Tăng khối lượng cơ nhờ tập luyện đúng + ăn đủ đạm là cách duy nhất nâng cao BMR bền vững, giúp bạn sở hữu vóc dáng \"ăn ngon mà không lo béo lại\"."}, {"title": "CÂU 07 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Chất Nitric Oxide (NO) sinh ra trong quá trình vận động hợp lý mang lại giá trị kỳ diệu nào cho hệ tim mạch?", "options": ["Làm co thắt các động mạch lớn để tăng áp lực máu về tim.", "Làm giãn nở mạch máu, tăng độ đàn hồi thành mạch, ngăn ngừa mảng bám xơ vữa và hỗ trợ điều hòa huyết áp.", "Làm đông đặc máu để ngăn ngừa xuất huyết nội tạng.", "Thay thế hoàn toàn vai trò của hormone Insulin."], "answer": "B", "explanation": "Tăng cường lưu thông máu khi vận động kích thích lớp nội mạc mạch máu tiết ra Nitric Oxide (NO) – chất đạt giải Nobel Y học. NO giúp làm dẻo dai thành mạch, tráng sạch lòng mạch và bảo vệ tim khỏi nguy cơ đột quỵ!"}, {"title": "CÂU 08 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tại sao việc \"Nhấp từng ngụm nước nhỏ trong khi tập\" lại tốt hơn nhiều so với việc \"Chờ tập xong uống liền nửa lít nước lạnh\"?", "options": ["Vì uống nước lạnh sau tập làm ruột bị co thắt gây đau bụng ngay lập tức.", "Nhấp ngụm nhỏ giúp duy trì thể tích máu ổn định, bù nước từ từ cho tế bào mà không làm pha loãng điện giải đột ngột hay gây áp lực vọt tăng cho tim.", "Vì uống nửa lít nước sau tập sẽ biến toàn bộ nước đó thành mỡ dưới da.", "Nhấp ngụm nhỏ giúp tiêu hao calo nhiều hơn uống ngụm lớn."], "answer": "B", "explanation": "Trút nửa lít nước vào bụng lúc tim đang đập nhanh làm tăng thể tích tuần hoàn đột ngột, ép tim gồng mình co bóp và dễ gây hạ Natri máu (xung huyết điện giải). Nhấp từng ngụm rải đều là kỹ thuật bù nước an toàn nhất."}, {"title": "CÂU 09 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Vận động thể dục hỗ trợ người bị \"Kháng Insulin\" (Tiền tiểu đường / Tiểu đường tuýp 2) theo cơ chế nào?", "options": ["Kích thích các thụ thể GLUT4 trên màng tế bào cơ tự động mở cửa hút đường trong máu vào mà KHÔNG CẦN phụ thuộc hoàn toàn vào Insulin.", "Tiêu diệt hoàn toàn lượng đường dư thừa trong máu thông qua tuyến mồ hôi.", "Ép tuyến tụy tiết ra lượng Insulin gấp 10 lần bình thường.", "Làm chậm quá trình tiêu hóa thức ăn ở dạ dày."], "answer": "A", "explanation": "Khi vận động, sự co bóp của cơ bắp kích hoạt con đường vận chuyển đường độc lập (GLUT4). Điều này giúp tế bào \"mở cửa đón đường\" hiệu quả, làm hạ đường huyết tức thì và giảm gánh nặng cho tuyến tụy đang suy kiệt!"}, {"title": "CÂU 10 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tại sao \"Việc nhà lặt vặt cả ngày\" (quét nhà, nấu ăn, rửa bát) không thể thay thế cho \"30 phút Vận động thể thao có cấu trúc\"?", "options": ["Vì việc nhà không làm cơ thể đổ mồ hôi.", "Vì việc nhà không đưa nhịp tim vào \"Vùng nhịp tim mục tiêu\" và thường chỉ gây mỏi cục bộ một nhóm cơ, không kích hoạt hệ hô hấp – tuần hoàn toàn thân.", "Vì việc nhà tạo ra calo rỗng không có giá trị tiêu hao năng lượng.", "Vì làm việc nhà gây tích mỡ bụng nhiều hơn ngồi yên."], "answer": "B", "explanation": "Làm việc nhà là hoạt động thể lực thụ động, nhịp tim không đủ ngưỡng để kích hoạt phản ứng phân hủy mỡ và hay gây đau mỏi cột sống do sai tư thế. Tập thể thao có cấu trúc mới giúp rèn luyện sức bền tim mạch và tái cấu trúc vóc dáng."}, {"title": "CÂU 11 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tác hại ngầm của bẫy \"Tập luyện quá sức\" (Overtraining - không có ngày nghỉ phục hồi) đối với vóc dáng là gì?", "options": ["Làm vọt tăng hormone Cortisol mạn tính, gây viêm toàn thân, dị hóa cơ bắp, rối loạn giấc ngủ và kích thích TÍCH MỠ NỘI TẠNG VÙNG BỤNG.", "Làm mất hoàn toàn lớp mỡ dưới da khiến da bị khô ráp.", "Làm vọt tăng lượng canxi trong máu gây vôi hóa khớp.", "Làm triệt tiêu hoàn toàn cảm giác thèm ăn."], "answer": "A", "explanation": "Tập quá sức mà thiếu nghỉ ngơi khiến cơ thể coi đó là \"mối đe dọa sinh tồn\". Nồng độ Cortisol cao kéo dài sẽ khóa chặt cánh cửa đốt mỡ, phá hủy cơ bắp và ép cơ thể đắp thêm mỡ đệm quanh ổ bụng để bảo vệ tạng phủ!"}, {"title": "CÂU 12 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Ý nghĩa của một \"Bữa ăn nhẹ GI thấp + Đạm nhẹ (như 1/2 ly F1 hoặc Trà thảo mộc)\" trước khi tập 30–45 phút là gì?", "options": ["Tạo lớp mỡ đệm trong dạ dày để chống xóc hông khi chạy nhảy.", "Cung cấp đường tốt ổn định cho Não bộ và nạp sẵn axit amin trong máu, giúp tập sung sức, không bị tụt đường huyết hay dị hóa cơ.", "Bắt dạ dày phải hoạt động hết công suất để đốt cháy calo của bữa ăn đó.", "Giúp cơ thể đổ mồ hôi gấp 2 lần bình thường."], "answer": "B", "explanation": "Não bộ sống bằng đường Glucose. Nếu tập khi rỗng hoàn toàn, não bị thiếu nhiên liệu sẽ gây hoa mắt, tụt huyết áp. Bữa ăn nhẹ tinh sạch cung cấp năng lượng êm ái, giúp duy trì sức bền và bảo vệ khối cơ."}, {"title": "CÂU 13 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Đổ mồ hôi do Vận động khác gì so với Đổ mồ hôi do Xông hơi nóng thụ động?", "options": ["Xông hơi nóng giúp đào thải mỡ nội tạng tốt hơn đổ mồ hôi do vận động.", "Đổ mồ hôi do vận động đi kèm với tiêu hao Calo và kích thích dòng Hệ Bạch Huyết lưu thông; Xông hơi chỉ là sự MẤT NƯỚC TẠM THỜI do nhiệt độ môi trường.", "Hai hình thức đổ mồ hôi này giúp giảm mỡ thừa hoàn toàn giống nhau.", "Đổ mồ hôi do xông hơi giúp tăng khối lượng cơ bắp."], "answer": "B", "explanation": "Bước ra khỏi phòng xông hơi bạn thấy giảm 0.5kg – đó thuần túy là mất nước, uống 2 ly nước vào sẽ tăng lại ngay! Chỉ có đổ mồ hôi do vận động mới gắn liền với quá trình chuyển hóa calo, đốt mỡ và bơm rửa hệ bạch huyết."}, {"title": "CÂU 14 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tại sao vận động thể thao lại được coi là \"Liều thuốc chống trầm cảm & giải tỏa căng thẳng\" tự nhiên nhất?", "options": ["Giúp kích thích não bộ sản sinh bộ ba Hormone hạnh phúc (Endorphin, Dopamine, Serotonin), làm giảm Cortisol và xua tan lo âu.", "Vì vận động làm tiêu diệt các tế bào thần kinh gây căng thẳng.", "Vì vận động bắt não bộ phải ngừng hoạt động hoàn toàn.", "Vì vận động làm giảm lượng máu lưu thông lên não."], "answer": "A", "explanation": "Khi vận động vừa sức, não xả ra Endorphin – chất xoa dịu tinh thần tự nhiên. Tinh thần sảng khoái giúp chị em giảm căng thẳng, ngủ sâu giấc hơn và vô hiệu hóa công tắc tích mỡ bụng do stress!"}, {"title": "CÂU 15 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Vai trò của thức uống vận động chuyên sâu (như CR7 Drive) khi tập luyện trên 45 phút hoặc dưới thời tiết nắng nóng là gì?", "options": ["Bổ sung thật nhiều calo để thay thế cho bữa ăn chính F1.", "Cung cấp dung dịch đẳng trương (Isotonic) chứa hỗn hợp đường đôi/đơn hấp thu nhanh và vi khoáng điện giải (Natri, Kali, Magie) giúp chống chuột rút, duy trì sức bền.", "Làm ngưng trệ quá trình thoát mồ hôi để giữ nước cho cơ thể.", "Giúp tăng nhanh khối lượng mỡ dưới da."], "answer": "B", "explanation": "Mồ hôi thoát ra mang theo các khoáng chất điện giải quý giá. Uống nước lọc đơn thuần khi tập nặng dễ gây nhức mỏi, chuột rút do thiếu Kali/Magie. CR7 Drive giúp bù điện giải siêu tốc, giữ cơ bắp dẻo dai."}, {"title": "CÂU 16 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Vận động tác động tích cực đến Mật độ Xương (Bone Density) ở người lớn tuổi theo cơ chế nào?", "options": ["Áp lực cơ học từ sự co bóp cơ bắp kích thích tế bào tạo xương (Osteoblast) hút Canxi từ máu đọng vào khung xương, ngăn ngừa loãng xương.", "Vận động làm xương tự sản sinh ra Canxi mà không cần ăn uống.", "Vận động làm bào mòn lớp vôi hóa giúp xương mỏng và dẻo hơn.", "Vận động làm tiêu biến hoàn toàn các ổ khớp."], "answer": "A", "explanation": "\"Xương chỉ chắc khi được thử thách!\" Uống Canxi (như Xtra-Cal) mà nằm lười một chỗ thì Canxi rất khó đi vào xương. Vận động vừa sức tạo lực nén nhẹ, phát tín hiệu bắt xương phải hấp thu Canxi để trở nên vững chắc!"}, {"title": "CÂU 17 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tại sao người bị Thừa cân béo phì / Mỡ nội tạng cao KHÔNG NÊN bắt đầu bằng các bài tập nhảy dây, chạy bộ cường độ cao?", "options": ["Vì khớp gối phải chịu áp lực gấp 3–5 lần trọng lượng cơ thể, dễ gây thoái hóa khớp, rách sụn chêm và chấn thương nghiêm trọng.", "Vì chạy bộ làm tăng mỡ nội tạng nhanh hơn.", "Vì người béo phì không có khả năng đổ mồ hôi.", "Vì chạy bộ làm tiêu biến khối cơ chân."], "answer": "A", "explanation": "Cân nặng quá lớn giống như chiếc xe tải chở quá tải: chạy nhảy liên tục sẽ làm nát bộ sóc (khớp gối). Người thừa nhiều kg mỡ nên bắt đầu bằng đi bộ nhẹ nhàng, đạp xe, bơi lội hoặc tập kháng lực ngồi để bảo vệ khớp."}, {"title": "CÂU 18 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Nguyên tắc chọn thời điểm vận động vào chiều muộn để không làm ảnh hưởng đến Giấc Ngủ Đêm là gì?", "options": ["Tập thật nặng ngay trước khi đi ngủ 15 phút để cơ thể mệt gục xuống ngủ ngay.", "Hoàn thành bài tập cường độ cao trước giờ đi ngủ ít nhất 2–3 tiếng để thân nhiệt và nhịp tim hạ về mức bình thường, giúp thần kinh thư thái.", "Tuyệt đối không được vận động vào buổi chiều muộn.", "Chỉ tập luyện vào lúc 12h đêm."], "answer": "B", "explanation": "Tập nặng sát giờ ngủ làm hormone Adrenaline vọt cao, nhịp tim đập nhanh và thân nhiệt tăng – làm não bộ bị kích thích gây trằn trọc mất ngủ. Hoàn thành bài tập trước 2-3 tiếng giúp cơ thể dịu lại để đi vào giấc ngủ sâu."}, {"title": "CÂU 19 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Tác động của Vận động đều đặn đến Hệ Miễn Dịch của cơ thể được giải thích như thế nào?", "options": ["Thúc đẩy dòng máu lưu thông, tăng tốc độ tuần hoàn của các tế bào bạch cầu và tế bào NK đi tuần tra tiêu diệt mầm bệnh khắp cơ thể.", "Làm suy giảm số lượng tế bào bạch cầu do bị tiêu hao trong lúc tập.", "Làm tăng nguy cơ nhiễm trùng đường hô hấp.", "Không có bất kỳ mối liên hệ nào với đề kháng."], "answer": "A", "explanation": "Vận động giúp \"bơm rửa\" dòng máu! Dòng máu chảy mượt mà giúp các chiến sĩ miễn dịch (bạch cầu) tiếp cận nhanh chóng đến các ổ viêm nhiễm hay tế bào lạ để tiêu diệt, giúp cơ thể ít bị ốm vặt."}, {"title": "CÂU 20 • VẬN ĐỘNG & DINH DƯỠNG", "context": "", "question": "Thông điệp cốt lõi và tư duy chuẩn xác nhất về Chủ đề 9 \"Vận Động Và Lợi Ích\" tại Nhóm Dinh Dưỡng là gì?", "options": ["\"DINH DƯỠNG CHUẨN (80%) nuôi dưỡng tế bào – VẬN ĐỘNG HỢP LÝ (20%) kích hoạt chuyển hóa: Bộ đôi hoàn hảo cho vóc dáng Săn Chắc & Sức Khỏe An Vui!\"", "Tập luyện là tất cả, ăn uống không quan trọng.", "Nhịn ăn tối đa kết hợp tập cật lực là con đường ngắn nhất để giảm cân.", "Vận động chỉ dành cho người trẻ tuổi, người già chỉ nên nằm nghỉ ngơi."], "answer": "A", "explanation": "Đừng bao giờ coi vận động là hình phạt cho bữa ăn lỡ miệng, cũng đừng coi vận động là phương pháp duy nhất để giảm cân! Hãy coi vận động là món quà tri ân cơ thể, kết hợp cùng đĩa ăn dinh dưỡng lành mạnh để sống khỏe đẹp trọn đời!"}];
const TKP_LESSON=9;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


const CONFIG={brand:'NHÓM DINH DƯỠNG THIỆU TRUNG',watermark:'Nhóm dinh dưỡng THIỆU TRUNG đồng hành kiến tạo sức khỏe toàn diện'};
let index=0,results=[],soundOn=true,audioCtx=null;
const app=document.getElementById('app');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function btn(text,fn,secondary=false){let b=el('button','btn'+(secondary?' secondary':''),text);b.type='button';b.addEventListener('click',fn);return b}
function sound(kind){if(!soundOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;let notes=kind==='good'?[523,659,784,1047]:kind==='win'?[523,659,784,1047,1319]:kind==='bad'?[330,294]:kind==='drum'?[160,145,130]:[660];notes.forEach((freq,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='drum'?'triangle':'sine';o.frequency.setValueAtTime(freq,t+i*.105);g.gain.setValueAtTime(.0001,t+i*.105);g.gain.exponentialRampToValueAtTime(.09,t+i*.105+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.105+.18);o.connect(g).connect(audioCtx.destination);o.start(t+i*.105);o.stop(t+i*.105+.2)})}catch(e){}}
function confetti(){for(let i=0;i<45;i++){let p=el('div','confetti');p.style.left=Math.random()*100+'vw';p.style.background=['#ffd875','#71e3ce','#f39fbe','#fff'][i%4];p.style.animationDelay=Math.random()*.5+'s';document.body.append(p);setTimeout(()=>p.remove(),3300)}}
function slide(){let s=el('section','slide active');return s}
function topbar(label,progress){let r=el('div','top'),b=el('div','brand',CONFIG.brand),p=el('div','pill',label),a=el('button','sound',soundOn?'🔊 Âm thanh: BẬT':'🔇 Âm thanh: TẮT');a.onclick=()=>{soundOn=!soundOn;a.textContent=soundOn?'🔊 Âm thanh: BẬT':'🔇 Âm thanh: TẮT';if(soundOn)sound('click')};r.append(b,p,a);let bar=el('div','progress'),fill=el('div');fill.style.width=progress+'%';bar.append(fill);return[r,bar]}
function mount(s){app.replaceChildren(s);s.scrollTop=0}
function intro(){tkpShuffle();let s=slide(),shell=el('div','shell hero');shell.append(el('div','eyebrow','✦ MINI GAME TƯƠNG TÁC ✦'),el('h1','', 'VẬN ĐỘNG & DINH DƯỠNG THÔNG THÁI'),el('h2','','20 câu hỏi động não • Làm chủ tư duy vận động'),el('p','','Cùng khám phá kiến thức vận động, dinh dưỡng và sức khỏe toàn diện. Chọn A, B, C hoặc D để nhận kết quả và lời giải thích ngay lập tức. Mỗi câu chỉ được trả lời một lần.'));shell.append(el('div','pill',QUESTIONS.length+' CÂU HỎI • TỰ ĐỘNG CHẤM ĐIỂM'));shell.append(btn('🎮 BẮT ĐẦU TRÒ CHƠI',()=>{sound('click');index=0;results=[];showQuestion()}));shell.append(el('div','foot',CONFIG.watermark));s.append(shell);mount(s)}
function showQuestion(){let q=QUESTIONS[index],s=slide(),shell=el('div','shell');const [top,bar]=topbar('CÂU '+String(index+1).padStart(2,'0')+' / '+QUESTIONS.length,100*index/QUESTIONS.length);shell.append(top,bar);let card=el('div','glass question');card.append(el('div','topic',q.title),...(q.context?[el('p','context','📍 '+q.context)]:[]),el('h2','prompt',q.question));shell.append(card);let answers=el('div','answers'),buttons=[];let feedback=el('div','glass feedback'),title=el('div','feedback-title'),exTitle=el('div','explain-title','💡 LỜI GIẢI THÍCH CHI TIẾT'),ex=el('div','explain',q.explanation);feedback.append(title,exTitle,ex);let controls=el('div','controls'),reveal=btn('👁 XEM ĐÁP ÁN',()=>finish(null),true),next=btn(index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡ CÂU TIẾP THEO',()=>{sound('click');if(index===QUESTIONS.length-1)summary();else{index++;showQuestion()}});next.disabled=true;controls.append(reveal,next);
function finish(choice){if(results[index]!==undefined)return;const correct=choice===q.answer,view=choice===null;results[index]=view?'view':correct?'correct':'wrong';buttons.forEach((b,i)=>{let letter='ABCD'[i];b.disabled=true;b.classList.add(letter===q.answer?'correct':letter===choice?'wrong':'dim')});feedback.classList.add('show',view?'neutral':correct?'good':'bad');title.textContent=view?'💡 ĐÁP ÁN ĐÚNG LÀ: '+q.answer:correct?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! ĐÁP ÁN ĐÚNG LÀ: '+q.answer;reveal.disabled=true;next.disabled=false;sound(view?'drum':correct?'good':'bad');if(correct)confetti();setTimeout(()=>{feedback.scrollIntoView({behavior:'smooth',block:'nearest'})},80)}
q.options.forEach((option,i)=>{let b=el('button','answer');b.type='button';b.append(el('span','letter','ABCD'[i]),el('span','',option));b.onclick=()=>finish('ABCD'[i]);buttons.push(b);answers.append(b)});shell.append(answers,feedback,controls,el('div','foot',CONFIG.watermark));s.append(shell);mount(s)}
function summary(){let total=QUESTIONS.length,good=results.filter(x=>x==='correct').length,bad=results.filter(x=>x==='wrong').length,view=results.filter(x=>x==='view').length,percent=total?100*good/total:0;tkpRecord(percent);let praise=percent>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':percent>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':percent>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';let s=slide(),shell=el('div','shell hero');shell.append(el('div','eyebrow','✦ TỔNG KẾT TRÒ CHƠI ✦'),el('h1','','HOÀN THÀNH THỬ THÁCH!'),el('div','score',(Math.round(percent*10)/10).toLocaleString('vi-VN')+'%'),el('h2','',praise));let stats=el('div','stats');[['TỔNG SỐ CÂU',total],['TRẢ LỜI ĐÚNG',good],['TRẢ LỜI SAI',bad],['XEM ĐÁP ÁN',view]].forEach(([label,value])=>{let c=el('div','glass stat');c.append(el('strong','',String(value)),el('span','',label));stats.append(c)});shell.append(stats,btn('🔄 CHƠI LẠI TỪ ĐẦU',()=>{sound('click');results=[];index=0;intro()}),el('div','foot',CONFIG.watermark));s.append(shell);mount(s);sound('win');if(percent>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
