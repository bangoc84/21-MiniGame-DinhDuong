<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái về bữa ăn sáng lành mạnh | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Vai trò sinh học cốt lõi nhất của Bữa ăn sáng đối với \"Cỗ máy chuyển hóa tự nhiên\" của cơ thể là gì?", "opts": ["Cung cấp năng lượng Calo thật lớn để dạ dày không phải co bóp trong suốt cả ngày.", "Khởi động cỗ máy đốt Calo tự nhiên sau đêm dài, đánh thức các tế bào và cung cấp vi chất cho các cơ quan hoạt động.", "Tạo ra lớp mỡ đệm dày xung quanh dạ dày để bảo vệ hệ tiêu hóa khỏi bị lạnh.", "Thay thế hoàn toàn vai trò của nước lọc và chất xơ trong cả ngày."], "answer": "B", "explain": "Sau 8-12 tiếng ngủ đêm, các tế bào rơi vào trạng thái cạn kiệt vi chất. Bữa ăn sáng lành mạnh chính là \"tiếng chuông thức tỉnh\" giúp kích hoạt cỗ máy đốt Calo tự nhiên, cung cấp nguyên liệu tinh sạch để bộ não, tim và cơ bắp vận hành mượt mà suốt cả ngày.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Bữa sáng không cần Calo thật lớn vì Calo dư thừa sẽ biến thành mỡ tích tụ.\nPhương án C chưa đúng: Bữa sáng lành mạnh giúp giảm mỡ bụng chứ không tạo lớp mỡ đệm.\nPhương án D chưa đúng: Bữa sáng không thể thay thế nước lọc và chất xơ cần thiết trong ngày."}, {"n": 2, "q": "Sai lầm phổ biến nhất của thói quen \"Nhịn ăn sáng để giảm cân\" dẫn tới hậu quả tiêu cực nào đối với vóc dáng?", "opts": ["Làm dạ dày bị giãn to gấp đôi, khiến các bữa sau tự động ăn ít đi.", "Làm cỗ máy đốt Calo tự nhiên bị hạ thấp, gây mất cơ bắp, khiến cơ thể bị tích mỡ bụng nhanh hơn ở các bữa ăn sau.", "Giúp cơ thể tự động đốt cháy toàn bộ mỡ nội tạng chỉ sau 3 ngày.", "Làm tăng cường độ dẻo dai của khung xương."], "answer": "B", "explain": "Nhịn ăn sáng làm cơ thể phát tín hiệu \"thiếu hụt sinh tồn\". Để có năng lượng hoạt động, cơ thể bắt buộc phải tự phân hủy mô cơ bắp ra dùng. Mất cơ làm cỗ máy đốt Calo bị suy yếu. Đến bữa trưa và chiều, thức ăn nạp vào sẽ bị tích thành mỡ bụng nhanh gấp đôi.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nhịn ăn sáng không làm dạ dày giãn to ra.\nPhương án C chưa đúng: Nhịn ăn sáng gây đốt cơ bắp chứ không thể tự đốt mỡ nội tạng.\nPhương án D chưa đúng: Bỏ bữa sáng làm thiếu hụt vi chất khiến xương dễ bị suy yếu chứ không tăng độ dẻo dai."}, {"n": 3, "q": "Cơ chế gây tích mỡ bụng từ thói quen ăn bữa sáng truyền thống chứa nhiều tinh bột xát trắng (phở, xôi, bánh mì, bún)?", "opts": ["Tinh bột xát trắng chứa nhiều chất xơ làm dạ dày bị quá tải.", "Làm đường huyết vọt tăng cao, tuyến tụy xả ồ ạt hormone tích mỡ để kéo đường xuống và biến đường dư thành mỡ bụng.", "Tinh bột xát trắng làm ngưng trệ quá trình lưu thông nước trong cơ thể.", "Do các món ăn này chứa quá nhiều vitamin B làm kích thích cơ thể tích mỡ."], "answer": "B", "explain": "Bánh phở, xôi, bánh mì là những thực phẩm có chỉ số đường huyết rất cao. Khi ăn vào, đường ngấm nhanh vào máu làm vọt tăng đường huyết. Tuyến tụy phải làm việc quá tải xả ra hormone tích mỡ, gom toàn bộ lượng đường thừa chuyển hóa thành mỡ nội tạng và mỡ bụng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Tinh bột xát trắng đã bị xát bỏ lớp vỏ cám nên rất nghèo chất xơ.\nPhương án C chưa đúng: Tinh bột không làm ngưng trệ quá trình lưu thông nước.\nPhương án D chưa đúng: Vitamin B không gây tích mỡ; tích mỡ là do thừa Calo và dư đường từ tinh bột xấu."}, {"n": 4, "q": "Hiện tượng \"Đã ăn một bát phở to hoặc đĩa xôi thịt nhưng đến 9–10 giờ sáng lại bị đói cồn cào và thèm đồ ngọt\" được giải thích như thế nào?", "opts": ["Do hiện tượng \"tụt đường huyết phản ứng\": Đường huyết tăng quá nhanh làm xả ra quá nhiều hormone kéo đường xuống thấp giật cục.", "Do bát phở chứa quá ít Calo làm dạ dày rỗng quá nhanh.", "Do cơ thể đã tiêu hóa hết toàn bộ thịt và bánh phở thành cơ bắp.", "Do nước dùng phở làm triệt tiêu toàn bộ dưỡng chất trong dạ dày."], "answer": "A", "explain": "Khi nạp bữa sáng đường cao, đường huyết vọt lên đỉnh rồi tụt dốc thê thảm do hormone tích mỡ làm việc quá mức. Sự tụt đường huyết giật cục này phát tín hiệu đói cồn cào lên não bộ, ép bạn phải đi tìm bánh kẹo, trà sữa hay đồ ngọt ăn tiếp vào lúc 9-10h sáng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bát phở chứa rất nhiều Calo (500–600 Calo) chứ không ít Calo.\nPhương án C chưa đúng: Tinh bột xấu và mỡ màng không thể biến thành cơ bắp sau vài tiếng.\nPhương án D chưa đúng: Nước dùng phở không làm triệt tiêu dưỡng chất."}, {"n": 5, "q": "Tiêu chuẩn vàng của một \"Bữa ăn sáng lành mạnh chuẩn Cấp độ Tế bào\" cần đáp ứng các tiêu chí nào?", "opts": ["Calo thật cao, thật nhiều dầu mỡ và ăn thật nhanh trong 2 phút.", "Calo thấp, chỉ số đường huyết rất thấp, giàu đạm sạch, đầy đủ 21 vi chất và hấp thu tinh sạch không gây gánh nặng tiêu hóa.", "Chỉ chứa nước lọc và chất xơ, hoàn toàn không có chất đạm.", "Phải được đun nấu liên tục trên 5 tiếng để ninh nhừ các dưỡng chất."], "answer": "B", "explain": "Bữa sáng hoàn hảo cho tế bào cần: tối giản Calo rỗng (chỉ khoảng 90 Calo), chỉ số đường huyết rất thấp (không làm vọt đường), giàu đạm sạch nuôi cơ bắp và đầy đủ 21 vitamin khoáng chất để khởi động cỗ máy chuyển hóa đầu ngày.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Calo cao và nhiều dầu mỡ sẽ gây tích mỡ nội tạng và mỏi mệt.\nPhương án C chưa đúng: Thiếu đạm sẽ làm teo cơ bắp và chảy xệ da.\nPhương án D chưa đúng: Đun nấu quá lâu làm biến chất và phân hủy hầu hết các vitamin nhạy cảm với nhiệt."}, {"n": 6, "q": "So sánh chuẩn xác nhất giữa 1 Bát phở bò truyền thống (khoảng 500–600 Calo) và 1 Ly Bữa ăn lành mạnh F1 (khoảng 90 Calo):", "opts": ["Bát phở bò tốt hơn vì nó giúp dạ dày phải co bóp nhiều hơn nên đốt Calo tốt hơn.", "Bát phở Calo cao gấp 5–6 lần, giàu mỡ xấu và đường cao; Ly F1 chỉ 90 Calo nhưng giàu 21 vi chất, đạm sạch và đường huyết rất thấp.", "Cả hai bữa ăn đều có giá trị dinh dưỡng và mức Calo hoàn toàn bằng nhau.", "Ly F1 chứa ít Calo nên chắc chắn sẽ làm cơ thể bị thiếu hụt năng lượng vận động."], "answer": "B", "explain": "Bát phở cung cấp năng lượng dư thừa (mỡ động vật đun nóng, bánh phở tinh bột) nhưng lại thiếu hụt vi chất do bị phân hủy bởi nhiệt độ. Ly F1 là dinh dưỡng tinh sạch: chỉ 90 Calo nhưng đong đầy 21 vi chất và đạm đậu nành phân lập, giúp tràn đầy sinh lực mà không tích mỡ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Dạ dày co bóp vất vả với đồ nhiều mỡ chỉ làm nặng bụng và mệt mỏi.\nPhương án C chưa đúng: Calo và chất lượng dinh dưỡng của 2 bữa ăn này hoàn toàn trái ngược.\nPhương án D chưa đúng: F1 cung cấp dinh dưỡng cân bằng nuôi tế bào nên cơ thể luôn sung sức, không thiếu năng lượng."}, {"n": 7, "q": "Tác hại của thói quen \"Nhâm nhi 1 ly cà phê sữa đá ngọt hoặc trà đặc khi bụng rỗng vào buổi sáng\"?", "opts": ["Giúp làm sạch đường ruột và nuôi dưỡng các vi nhung mao ruột khỏe mạnh.", "Kích ứng niêm mạc dạ dày, gây vọt tăng đường huyết từ đường sữa và làm cơ thể bị rút mất nước tế bào.", "Giúp bổ sung đầy đủ 21 vitamin và khoáng chất thiết yếu cho ngày mới.", "Giúp tăng cường khối lượng cơ bắp chân tay."], "answer": "B", "explain": "Cà phê sữa chứa nhiều đường tinh luyện và béo bão hòa làm vọt tăng đường huyết; đồng thời chất kích thích khi bụng rỗng gây cào xé niêm mạc dạ dày và tác dụng lợi tiểu làm rút nước khỏi tế bào, khiến bạn mệt mỏi và xỉn màu da.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Chất kích thích khi bụng rỗng làm tổn thương chứ không làm sạch vi nhung mao.\nPhương án C chưa đúng: Cà phê sữa hay trà đặc không chứa 21 vi chất thiết yếu.\nPhương án D chưa đúng: Cà phê sữa không chứa đạm sạch để xây dựng cơ bắp."}, {"n": 8, "q": "Tại sao Bữa ăn sáng F1 có chỉ số đường huyết rất thấp (17–29) lại được gọi là \"Bữa ăn sáng lý tưởng cho người tiểu đường và người muốn giảm mỡ\"?", "opts": ["Giúp đường thấm rất từ từ vào máu, giữ đường huyết êm ả, không kích hoạt hormone tích mỡ và bảo vệ tuyến tụy.", "Vì sản phẩm có khả năng triệt tiêu toàn bộ lượng đường có sẵn trong cơ thể.", "Vì sản phẩm làm ngưng trệ quá trình hấp thu chất béo từ các bữa ăn sau.", "Vì sản phẩm chứa các loại thuốc hạ đường huyết nhân tạo."], "answer": "A", "explain": "Chỉ số đường huyết từ 17–29 là ngưỡng siêu an toàn. Khi uống F1, đường giải phóng từ từ vào máu như một dòng sông êm đềm, không làm vọt đường huyết, không bắt tuyến tụy gồng mình làm việc và hoàn toàn không kích hoạt công tắc tích mỡ bụng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: F1 không triệt tiêu đường tự nhiên mà giúp ổn định đường huyết.\nPhương án C chưa đúng: F1 không làm ngưng trệ tiêu hóa của các bữa ăn sau.\nPhương án D chưa đúng: F1 là thực phẩm dinh dưỡng tự nhiên tinh sạch, hoàn toàn không chứa thuốc tây."}, {"n": 9, "q": "Hậu quả đối với khối cơ bắp và làn da khi duy trì bữa sáng qua loa (chỉ ăn vài miếng biscuit hoặc củ khoai) trong thời gian dài?", "opts": ["Giúp cơ bắp săn chắc hơn và da mặt trẻ ra 5 tuổi.", "Thiếu đạm sạch khiến cơ bắp bị nhão xệ, tốc độ đốt Calo tự nhiên bị giảm và da dẻ bị nhăn nheo, thiếu sức sống.", "Giúp tăng cường độ đàn hồi của các sợi collagen dưới da.", "Không gây ra bất kỳ ảnh hưởng nào nếu vẫn uống đủ nước."], "answer": "B", "explain": "Bữa sáng chỉ có tinh bột (khoai, bánh quy) bị thiếu hụt trầm trọng đạm sạch. Thiếu đạm kéo dài làm cơ thể phải rút đạm từ mô cơ ra xài, khiến đùi tay lỏng nhão, ngực mông chảy xệ và làn da bị mất độ đàn hồi.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Bữa sáng thiếu đạm làm tàn phá cơ bắp và da dẻ chứ không giúp trẻ ra.\nPhương án C chưa đúng: Thiếu đạm sạch sẽ làm suy giảm collagen chứ không tăng đàn hồi.\nPhương án D chưa đúng: Dù uống đủ nước nhưng thiếu đạm thì tế bào cơ vẫn bị suy thoái."}, {"n": 10, "q": "Khung giờ \"vàng\" sau khi thức dậy để nạp Bữa ăn sáng lành mạnh giúp cơ thể hoạt động tối ưu nhất là khi nào?", "opts": ["Sau khi thức dậy từ 3 đến 4 tiếng đồng hồ.", "Trong vòng 30 đến 60 phút sau khi thức dậy (sau khi đã uống 1 ly nước ấm làm sạch đường ruột).", "Vào lúc 12 giờ trưa gộp chung với bữa ăn trưa.", "Nhất thiết phải ăn ngay trong khi vẫn đang nằm trên giường."], "answer": "B", "explain": "30–60 phút sau khi thức dậy là \"cửa sổ thời gian vàng\"! Nạp dinh dưỡng vào lúc này giúp dập tắt quá trình tự phân hủy cơ đêm, cung cấp nhiên liệu kịp thời để não bộ tỉnh táo và đánh thức cỗ máy chuyển hóa đầu ngày.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Chờ 3-4 tiếng mới ăn sẽ khiến tế bào bị bỏ đói quá lâu và làm tụt tốc độ chuyển hóa.\nPhương án C chưa đúng: Nhịn đến trưa gộp bữa sẽ làm tuyến tụy bị quá tải và tích mỡ bụng dữ dội.\nPhương án D chưa đúng: Cần vận động nhẹ nhàng và làm sạch đường ruột trước khi nạp bữa sáng."}, {"n": 11, "q": "Sự kết hợp hoàn hảo giữa \"1 ly Lô hội thảo mộc ấm\" và \"1 ly Bữa ăn F1\" vào buổi sáng mang lại hiệu quả kép gì?", "opts": ["Ly Lô hội tráng rửa sạch sẽ mảng bám đường ruột; Ly F1 cung cấp dinh dưỡng tinh sạch được vi nhung mao hấp thu tối đa.", "Giúp triệt tiêu 100% Calo của tất cả các món ăn trong ngày.", "Làm cho dạ dày bị đóng băng không thể tiêu hóa được thịt mỡ.", "Thay thế hoàn toàn cho việc tập thể dục buổi sáng."], "answer": "A", "explain": "\"Làm sạch trước - Nuôi dưỡng sau!\" Ly Lô hội ấm giống như dòng nước mát tráng rửa sạch sẽ các mảng bám dầu mỡ ở vi nhung mao ruột. Đường ruột thông thoáng ngay lập tức đón nhận ly F1, giúp vi chất hấp thu trọn vẹn vào máu nuôi tế bào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lô hội và F1 không triệt tiêu Calo của các bữa ăn khác.\nPhương án C chưa đúng: Sản phẩm giúp làm sạch và phục hồi hệ tiêu hóa chứ không làm đóng băng dạ dày.\nPhương án D chưa đúng: Dinh dưỡng không thể thay thế cho việc vận động thể chất."}, {"n": 12, "q": "Tại sao nạp một bữa sáng giàu đạm sạch và chất xơ lại giúp kiểm soát cơn thèm ăn hiệu quả suốt cả ngày?", "opts": ["Giúp kéo dài thời gian tiêu hóa êm ái, giữ đường huyết ổn định và kích thích phát tín hiệu no bền vững lên não bộ.", "Vì đạm sạch và xơ làm dạ dày bị liệt cơ nên không thể co bóp đòi ăn.", "Vì đạm sạch làm triệt tiêu toàn bộ cảm giác thèm ăn trọn đời.", "Vì chất xơ biến thành chất béo bão hòa lấp đầy dạ dày."], "answer": "A", "explain": "Đạm sạch (từ đậu nành phân lập) và chất xơ cần thời gian tiêu hóa vừa phải, không làm xáo trộn đường huyết. Khi đường huyết êm ả, não bộ luôn ở trạng thái thư thái, không phát ra các cơn thèm ăn vặt vô cớ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm sạch và xơ nuôi dưỡng cơ ruột khỏe mạnh chứ không làm liệt cơ.\nPhương án C chưa đúng: Dinh dưỡng giúp kiểm soát thèm ăn lành mạnh chứ không triệt tiêu cảm giác thèm ăn tự nhiên.\nPhương án D chưa đúng: Chất xơ hoàn toàn không biến thành chất béo bão hòa."}, {"n": 13, "q": "Sự khác biệt giữa \"Cảm giác no do căng dạ dày\" từ phở/xôi và \"Cảm giác no nuôi dưỡng tế bào\" từ Bữa ăn F1?", "opts": ["No do căng dạ dày giúp cơ thể trẻ hóa nhanh hơn no tế bào.", "No căng dạ dày làm nặng bụng, mệt mỏi và mỏi ngủ; No tế bào giúp cơ thể nhẹ nhõm, tràn đầy năng lượng và tỉnh táo.", "Cả hai cảm giác no này đều có tác động giống hệt nhau đối với sức khỏe.", "No tế bào làm cơ thể bị tích nhiều nước dưới da hơn no căng dạ dày."], "answer": "B", "explain": "Ăn phở/xôi làm dạ dày bị nhồi căng thức ăn thô, máu phải dồn hết về dạ dày để co bóp khiến não bị thiếu máu gây buồn ngủ, mệt mỏi. Uống F1 cung cấp đủ vi chất cho tế bào mà dạ dày lại nhẹ nhàng, giúp bạn tỉnh táo và tràn đầy năng lượng làm việc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: No căng dạ dày làm cơ thể mau lão hóa do phải làm việc vất vả xử lý Calo rỗng.\nPhương án C chưa đúng: Hai cảm giác no này hoàn toàn khác nhau về bản chất sinh học.\nPhương án D chưa đúng: No tế bào F1 không gây tích nước dưới da."}, {"n": 14, "q": "Tại sao Bữa ăn sáng F1 lại cực kỳ phù hợp cho người bận rộn nhưng vẫn muốn duy trì lối sống khỏe đẹp?", "opts": ["Pha chế siêu nhanh trong 1 phút, tiện lợi mang đi, không mất thời gian đun nấu mà vẫn đảm bảo bữa ăn chuẩn 5 sao.", "Vì sản phẩm bắt buộc phải đun nấu cầu kỳ trong 30 phút.", "Vì uống F1 xong không cần phải uống thêm nước lọc trong ngày.", "Vì sản phẩm có thể để được 10 năm ngoài không khí mà không hỏng."], "answer": "A", "explain": "Giải pháp cho cuộc sống hiện đại! Chỉ cần 1 phút lắc nhẹ F1 với nước ấm hoặc nước mát là bạn đã có ngay một bữa sáng thơm ngon, đầy đủ dinh dưỡng chuẩn khoa học mà không phải xếp hàng chờ đợi hay nấu nướng khói bụi.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: F1 không cần đun nấu, chỉ cần pha/lắc là dùng được ngay.\nPhương án C chưa đúng: Vẫn cần uống đủ nước lọc trong ngày theo công thức 0,4l/10kg.\nPhương án D chưa đúng: Sản phẩm dinh dưỡng tự nhiên cần bảo quản đúng quy cách sau khi mở hộp."}, {"n": 15, "q": "Tác động của bữa sáng giàu đường và tinh bột xát trắng đối với tuyến tụy và nồng độ hormone tích mỡ?", "opts": ["Giúp tuyến tụy được nghỉ ngơi hoàn toàn và triệt tiêu hormone tích mỡ.", "Ép tuyến tụy gồng mình xả ra lượng lớn hormone kéo đường xuống, mở kích hoạt công tắc tích mỡ bụng dữ dội.", "Giúp làm hạ chỉ số đường huyết về mức 0.", "Giúp tuyến tụy sản sinh ra thêm nhiều đạm sạch."], "answer": "B", "explain": "Bữa sáng giàu đường tinh chế giống như \"cú sốc\" đối với tuyến tụy. Tuyến tụy phải làm việc hết công suất để tiết ra hormone thu gom đường thừa. Quá trình này bật công tắc khóa chặt việc đốt mỡ và bắt cơ thể tích trữ mỡ bụng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Đường cao ép tuyến tụy làm việc quá tải chứ không được nghỉ ngơi.\nPhương án C chưa đúng: Đường cao làm vọt tăng đường huyết chứ không hạ về 0.\nPhương án D chưa đúng: Tuyến tụy tiết hormone điều hòa đường huyết chứ không sản sinh ra đạm."}, {"n": 16, "q": "Sự khác biệt giữa \"Ăn sáng cho no cái bụng\" và \"Ăn sáng đúng nguyên liệu cho tế bào\"?", "opts": ["Ăn no bụng tập trung vào số lượng/thể tích thức ăn; Ăn đúng cho tế bào tập trung vào chất lượng vi chất và sự tinh sạch.", "Ăn no bụng giúp giảm mỡ nhanh hơn ăn đúng cho tế bào.", "Ăn đúng cho tế bào bắt buộc phải ăn thật nhiều mỡ động vật.", "Cả hai khái niệm này hoàn toàn giống nhau."], "answer": "A", "explain": "Ăn no bụng là thói quen ăn theo cảm giác sướng miệng, nhồi nhét Calo rỗng. Ăn đúng nguyên liệu cho tế bào là tư thế của người thông thái: chọn thực phẩm ít Calo nhưng giàu đạm và 21 vi chất để nuôi dưỡng cơ thể khỏe mạnh từ gốc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Ăn no bụng Calo rỗng dễ gây béo phì tích mỡ.\nPhương án C chưa đúng: Ăn cho tế bào cần đạm sạch và chất béo tốt chứ không ăn mỡ động vật xấu.\nPhương án D chưa đúng: Hai tư duy ăn uống này hoàn toàn khác biệt."}, {"n": 17, "q": "Tại sao trẻ em và học sinh ăn Bữa ăn sáng lành mạnh F1 lại tập trung học tập và ghi nhớ tốt hơn bữa sáng tinh bột xấu?", "opts": ["Nhờ đường huyết ổn định giúp não bộ nhận đủ nguyên liệu êm ái, kết hợp 21 vi chất giúp kích thích tế bào thần kinh.", "Vì F1 chứa chất kích thích giúp não không bao giờ cần ngủ.", "Vì F1 làm triệt tiêu toàn bộ lượng máu đi về dạ dày.", "Vì ăn F1 giúp trẻ em không cần phải học bài vẫn nhớ."], "answer": "A", "explain": "Não bộ chiếm 20% năng lượng cơ thể và chỉ thích đường huyết ổn định. Bữa sáng F1 giữ đường huyết êm ả, cung cấp vitamin nhóm B và khoáng chất giúp não trẻ nhỏ tỉnh táo, tư duy nhanh nhạy và không bị buồn ngủ gật trong giờ học.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: F1 là dinh dưỡng tự nhiên, hoàn toàn không chứa chất kích thích.\nPhương án C chưa đúng: F1 giúp điều hòa tuần hoàn máu tốt chứ không triệt tiêu máu về dạ dày.\nPhương án D chưa đúng: Dinh dưỡng hỗ trợ khả năng ghi nhớ của não, vẫn cần sự nỗ lực học tập."}, {"n": 18, "q": "Mối liên hệ giữa việc thường xuyên bỏ bữa sáng và nguy cơ hình thành sỏi mật hoặc đau dạ dày vào buổi sáng?", "opts": ["Mật bị tích tụ không được co bóp xả ra để tiêu hóa thức ăn dễ đóng cặn thành sỏi; Axit dạ dày dư thừa cào xé niêm mạc gây loét.", "Bỏ bữa sáng giúp làm sạch toàn bộ túi mật và dạ dày.", "Bỏ bữa sáng làm túi mật tự biến mất.", "Bỏ bữa sáng giúp triệt tiêu hoàn toàn axit dạ dày."], "answer": "A", "explain": "Đêm dài túi mật tích trữ dịch mật để sẵn sàng tiêu hóa thức ăn sáng. Nhịn ăn sáng khiến dịch mật bị ứ đọng, lâu ngày lắng cặn kết tinh thành sỏi mật. Đồng thời, dạ dày tiết axit theo nhịp sinh học mà không có thức ăn sẽ tự cào xé niêm mạc gây viêm loét.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bỏ bữa sáng tàn phá túi mật và dạ dày chứ không làm sạch.\nPhương án C chưa đúng: Túi mật không thể tự biến mất do bỏ bữa sáng.\nPhương án D chưa đúng: Axit dạ dày vẫn tiếp tục tiết ra gây tổn thương niêm mạc."}, {"n": 19, "q": "Tại sao người gầy muốn tăng cân lành mạnh cũng bắt buộc phải bắt đầu từ Bữa ăn sáng lành mạnh F1?", "opts": ["Vì F1 giúp phục hồi hệ vi nhung mao ruột, cung cấp đạm sạch và vi chất dễ hấp thu để xây dựng khối CƠ BẮP chứ không tăng mỡ.", "Vì F1 chứa nhiều chất béo động vật giúp tích mỡ mặt cấp tốc.", "Vì F1 bắt dạ dày phải làm việc gấp 5 lần để nở to ra.", "Vì F1 giúp tăng cân bằng cách tích trữ thật nhiều nước dưới da."], "answer": "A", "explain": "Người gầy tăng cân cần tăng CƠ BẮP chứ không cần tăng mỡ sồ sề! Bữa sáng F1 giúp làm sạch đường ruột, nạp nguồn đạm sạch phân tử nhỏ giúp cơ thể hấp thu tối đa, tái tạo mô cơ săn chắc và giúp vóc dáng đầy đặn khỏe mạnh.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: F1 không chứa chất béo động vật xấu và không tăng mỡ sồ sề.\nPhương án C chưa đúng: F1 rất dễ tiêu hóa, không bắt dạ dày làm việc vất vả.\nPhương án D chưa đúng: F1 giúp tăng cơ thật chứ không gây tích nước giả tạo."}, {"n": 20, "q": "Thông điệp cốt lõi và giá trị sâu sắc nhất của Bài học \"Bữa Ăn Sáng Lành Mạnh\" tại Nhóm Dinh Dưỡng là gì?", "opts": ["\"THAY ĐỔI BỮA SÁNG - THAY ĐỔI CUỘC ĐỜI: Bắt đầu ngày mới bằng ly F1 lành mạnh là khởi đầu thông thái nhất cho vóc dáng thon gọn và sức khỏe An Vui trọn đời!\"", "Ăn sáng bằng món gì cũng được, miễn sao ăn thật no bụng là đủ.", "Bỏ bữa sáng là phương pháp giảm cân nhanh và an toàn nhất.", "Bữa ăn sáng F1 chỉ dành cho những người đang bị bệnh nặng."], "answer": "A", "explain": "\"Bữa sáng quyết định sức khỏe cả đời!\" Thay thế bữa sáng nhiều dầu mỡ, đường cao bằng 1 ly Bữa ăn lành mạnh F1 là quyết định đơn giản nhưng mang lại bước ngoặt vĩ đại cho vóc dáng, sự trẻ trung và sức khỏe lâu bền của bạn và gia đình!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Ăn sai bữa sáng Calo rỗng sẽ tàn phá sức khỏe và tích mỡ bụng.\nPhương án C chưa đúng: Bỏ bữa sáng gây mất cơ, tàn phá cỗ máy chuyển hóa và tăng mỡ béo lại.\nPhương án D chưa đúng: Bữa sáng F1 là giải pháp chăm sóc sức khỏe chủ động tuyệt vời cho tất cả mọi người."}];
const TKP_LESSON=4;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VỀ<br>BỮA ĂN SÁNG LÀNH MẠNH</h1><div class="subtitle">KHỞI ĐỘNG CHUYỂN HÓA – TỰ ĐỘNG ĐỐT MỠ</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
