<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bậc thầy đọc nhãn dinh dưỡng | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Sai lầm phổ biến nhất của người tiêu dùng khi nhìn vào con số Calo in trên nhãn dinh dưỡng mặt sau gói thực phẩm là gì?", "opts": ["Nhìn con số Calo và tưởng rằng thực phẩm đó hoàn toàn không chứa chất béo.", "Nhầm tưởng con số Calo đó là cho CẢ BÁO/CẢ HỘP, trong khi nhà sản xuất chỉ tính cho MỘT KHẨU PHẦN RẤT NHỎ.", "Nghĩ rằng con số Calo in trên nhãn cao gấp 10 lần so với thực tế.", "Cho rằng con số Calo chỉ áp dụng khi ăn thực phẩm đó vào buổi tối."], "answer": "B", "explain": "\"Bẫy kích thước khẩu phần!\" Nhìn mặt sau thấy ghi \"100 Calo\", nhiều người mừng rỡ ăn hết cả gói. Nhưng đọc kỹ hàng trên cùng mới thấy gói đó chứa... 5 khẩu phần! Ăn hết cả gói nghĩa là bạn đã nạp vào $100 \\times 5 = 500$ Calo (bằng cả bát phở) mà không hề hay biết!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Con số Calo chỉ phản ánh năng lượng, không chứng minh gói đồ ăn có chứa chất béo hay không.\nPhương án C chưa đúng: Con số in trên nhãn là kết quả kiểm nghiệm chuẩn xác, không phải tự nhiên cao gấp 10 lần.\nPhương án D chưa đúng: Calo của thực phẩm là cố định khi nạp vào cơ thể, không thay đổi theo thời gian sáng hay tối."}, {"n": 2, "q": "Quy tắc vàng về \"Thứ tự các thành phần\" được liệt kê trong bảng danh sách nguyên liệu (Ingredients) ở mặt sau sản phẩm?", "opts": ["Thành phần nào đắt tiền nhất và bổ dưỡng nhất sẽ được xếp lên vị trí đầu tiên.", "Thành thành phần nào chiếm TRỌNG LƯỢNG NHIỀU NHẤT trong sản phẩm sẽ bắt buộc phải xếp ở VỊ TRÍ ĐẦU TIÊN.", "Các thành phần được sắp xếp hoàn toàn ngẫu nhiên theo sở thích của nhà sản xuất.", "Thành phần dạng chất lỏng xếp trước, thành phần dạng chất rắn xếp sau."], "answer": "B", "explain": "Theo quy định ghi nhãn thực phẩm, nguyên liệu nào có khối lượng lớn nhất sẽ đứng đầu bảng, giảm dần cho đến nguyên liệu ít nhất. Nếu đọc gói \"Bánh yến mạch ăn kiêng\" mà thấy chữ \"Đường\" hoặc \"Dầu thực vật\" đứng đầu danh sách, thì đó thực chất là bánh đường mỡ chứ không phải yến mạch lành mạnh!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Mức độ đắt tiền hay bổ dưỡng không quyết định thứ tự; thứ tự hoàn toàn dựa vào khối lượng.\nPhương án C chưa đúng: Luật ghi nhãn bắt buộc phải tuân thủ thứ tự khối lượng giảm dần, không được xếp ngẫu nhiên.\nPhương án D chưa đúng: Trạng thái lỏng hay rắn không quyết định thứ tự niêm yết trên nhãn."}, {"n": 3, "q": "Bẫy tiếp thị của nhãn hàng mang khẩu hiệu \"0% Chất Béo\" (Fat-Free) được bóc trần như thế nào?", "opts": ["Sản phẩm 0% chất béo sẽ giúp người ăn giảm ngay 2kg mỡ thừa sau 1 ngày.", "Để bù lại vị ngậy béo bị mất, nhà sản xuất thường ĐỘN THÊM RẤT NHIỀU ĐƯỜNG và tinh bột, khiến tổng Calo vẫn cao ngất ngưởng.", "Sản phẩm 0% chất béo chỉ dành riêng cho trẻ em dưới 5 tuổi.", "0% chất béo có nghĩa là sản phẩm đó được làm hoàn toàn từ nước lọc."], "answer": "B", "explain": "Khi rút bỏ chất béo, thực phẩm sẽ trở nên nhạt nhẽo và khó ăn. Để giữ hương vị hấp dẫn người tiêu dùng, nhà sản xuất phải cho thêm lượng lớn đường tinh luyện và tinh bột xấu. Ăn đồ \"0% béo\" này còn làm vọt đường huyết và tích mỡ bụng nhanh hơn!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nạp nhiều đường từ đồ 0% chất béo còn gây tăng mỡ chứ không thể giảm 2kg.\nPhương án C chưa đúng: Đây là dòng sản phẩm tiếp thị cho người muốn giảm cân, không phải chỉ cho trẻ em.\nPhương án D chưa đúng: Sản phẩm vẫn làm từ tinh bột, đường, hương liệu chứ không phải từ nước lọc."}, {"n": 4, "q": "Dấu hiệu nhận biết \"Chất Béo Chuyển Hóa\" (Trans Fat độc hại) ẩn nấp trong bảng thành phần dù mặt trước ghi \"0g Trans Fat\"?", "opts": ["Trong bảng thành phần xuất hiện tên gọi \"Dầu thực vật hydro hóa\" hoặc \"Dầu hydro hóa một phần\" (Hydrogenated Oil).", "Trong bảng thành phần có chứa chất xơ hòa tan và vitamin C.", "Bảng thành phần có chứa đạm thực vật từ đậu nành.", "Bảng thành phần ghi có chứa nước khoáng tinh khiết."], "answer": "A", "explain": "Theo luật, nếu lượng Trans Fat dưới 0,5g trên mỗi khẩu phần, nhà sản xuất được quyền làm tròn thành \"0g Trans Fat\". Nhưng nếu bạn lật mặt sau thấy từ \"Dầu hydro hóa\" (Hydrogenated Oil), nghĩa là sản phẩm đó chắc chắn chứa chất béo chuyển hóa gây xơ vữa mạch máu!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Chất xơ hòa tan và vitamin C là dưỡng chất tốt, không liên quan đến chất béo chuyển hóa.\nPhương án C chưa đúng: Đạm đậu nành là nguồn đạm sạch lành tính, không phải chất béo xấu.\nPhương án D chưa đúng: Nước khoáng không chứa chất béo bão hòa hay chất béo chuyển hóa."}, {"n": 5, "q": "\"Tên gọi ngụy trang\" nào dưới đây thực chất chính là ĐƯỜNG TINH LẠI ẩn nấp trong các gói thực phẩm gắn mác \"Không thêm đường\"?", "opts": ["Đạm đậu nành phân lập, chất xơ yến mạch.", "Siro ngô (Corn Syrup), Maltodextrin, Đường Mía, Đường Fructose, Mật Khẩu, Nước ép trái cây cô đặc.", "Canxi hữu cơ, Vitamin nhóm B, Muối khoáng.", "Tinh chất Lô hội, Chiết xuất trà xanh."], "answer": "B", "explain": "Nhà sản xuất rất khéo \"giấu đường\"! Họ không ghi chữ \"Đường\" mà chia nhỏ thành Siro ngô, Maltodextrin, Fructose, Mật ong... Mục đích là để không có tên \"Đường\" đứng đầu danh sách thành phần, nhưng tổng lượng đường ngầm nạp vào cơ thể vẫn làm vọt đường huyết dữ dội.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Đạm đậu nành và chất xơ yến mạch là các dưỡng chất nuôi cơ và ổn định đường huyết, không phải đường.\nPhương án C chưa đúng: Canxi và vitamin B là vi chất dinh dưỡng thiết yếu, không phải tên ngụy trang của đường.\nPhương án D chưa đúng: Lô hội và trà xanh là thảo mộc hỗ trợ làm sạch và chống oxy hóa."}, {"n": 6, "q": "Chỉ số \"Natri\" (Muối) in trên nhãn dinh dưỡng có tác động thế nào đến vóc dáng và sức khỏe người giảm mỡ?", "opts": ["Ăn bao nhiêu Natri cũng được vì Natri giúp làm tiêu biến hoàn toàn mỡ nội tạng.", "Natri cao (trên 140mg/khẩu phần) làm cơ thể BỊ TÍCH NƯỚC DƯỚI DA gây sưng phù, tăng huyết áp và cản trở giảm mỡ.", "Natri làm cho khối cơ bắp bị teo tóp ngay lập tức sau 5 phút.", "Natri là chất cung cấp lượng Calo lớn nhất trong thực phẩm."], "answer": "B", "explain": "1 phân tử Natri ngậm 6 phân tử nước! Ăn thực phẩm chứa nhiều Natri (đồ đóng hộp, mì ăn liền, bún phở, đồ khô) sẽ làm cơ thể giữ nước dưới da, khiến bước lên cân thấy tăng kg, người sồ sề, mặt phù và làm tăng áp lực máu lên thành mạch.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Natri cao gây tích nước và tăng huyết áp chứ không làm tiêu mỡ nội tạng.\nPhương án C chưa đúng: Natri gây tích nước dưới da, không làm teo cơ bắp ngay sau 5 phút.\nPhương án D chưa đúng: Muối/Natri chứa 0 Calo, không phải chất cung cấp năng lượng."}, {"n": 7, "q": "Ý nghĩa của chỉ số \"% Giá Trị Hàng Ngày\" (% Daily Value - %DV) in trên bảng dinh dưỡng là gì?", "opts": ["Cho biết 1 khẩu phần thực phẩm đó cung cấp bao nhiêu % nhu cầu của chất đó trong 1 ngày (tính trên chế độ ăn 2.000 Calo).", "Cho biết tỷ lệ phần trăm thực phẩm đó sẽ biến thành mỡ thừa sau khi ăn.", "Cho biết số giờ bạn cần phải đi bộ để đốt hết thực phẩm đó.", "Cho biết mức độ đắt rẻ của thực phẩm so với thị trường."], "answer": "A", "explain": "Cột %DV giúp bạn đánh giá nhanh: Nếu %DV của một chất từ 5% trở xuống là THẤP (tốt đối với chất béo bão hòa, natri, đường); nếu từ 20% trở lên là CAO (tốt đối với chất xơ, đạm, vitamin, canxi).\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: %DV đo lường mức độ đáp ứng nhu cầu dinh dưỡng hàng ngày, không đo tỷ lệ biến thành mỡ.\nPhương án C chưa đúng: %DV không quy đổi ra số giờ đi bộ tiêu hao năng lượng.\nPhương án D chưa đúng: %DV không phản ánh giá tiền hay độ đắt rẻ của sản phẩm."}, {"n": 8, "q": "Tại sao các loại \"Nước Ép Trái Cây Đóng Chai\" ghi mác \"100% Tự Nhiên\" vẫn là cái bẫy làm tăng mỡ bụng nguy hiểm?", "opts": ["Vì nước ép đóng chai chứa quá nhiều chất đạm làm cơ thể bị quá tải.", "Vì đã bị loại bỏ sạch chất xơ, chỉ còn lại nước đường Fructose tự do làm vọt tăng đường huyết và tích mỡ gan.", "Vì nước ép đóng chai làm triệt tiêu toàn bộ lượng nước lọc trong cơ thể.", "Vì nước ép đóng chai chứa lượng Calo bằng 0 nên làm hạ chuyển hóa."], "answer": "B", "explain": "Dù ghi \"100% tự nhiên\", nước ép đóng chai đã qua xử lý nhiệt làm mất hết vitamin nhạy cảm và lọc sạch chất xơ. Một chai nước ép chứa lượng đường của 4–5 quả trái cây, nạp vào làm đường huyết tăng vọt và đường Fructose dư thừa đi thẳng về gan biến thành mỡ nội tạng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Trái cây và nước ép hầu như không chứa chất đạm.\nPhương án C chưa đúng: Nước ép không làm triệt tiêu nước lọc trong cơ thể.\nPhương án D chưa đúng: Nước ép trái cây chứa lượng Calo và đường rất cao (150–200 Calo/chai), không phải 0 Calo."}, {"n": 9, "q": "Sự thật đằng sau các gói \"Bánh Quy Yến Mạch Ăn Kiêng\" được bán tràn ngập trên thị trường?", "opts": ["Nhìn nhãn phía sau thấy Yến mạch chiếm tỷ lệ rất ít, còn Đường, Bơ thực vật và Bột mì tinh chế lại đứng đầu bảng.", "Bánh quy yến mạch hoàn toàn không chứa bất kỳ Calo nào nên ăn bao nhiêu cũng được.", "Bánh quy yến mạch được làm 100% từ đạm đậu nành phân lập.", "Bánh quy yến mạch giúp làm sạch mỡ máu chỉ sau 30 phút ăn."], "answer": "A", "explain": "Bẫy từ khóa \"Ăn Kiêng\"! Nhiều chị em mua bánh yến mạch về ăn thay cơm vì nghĩ giảm cân. Nhưng lật nhãn ra xem: 1 cái bánh nhỏ đã 120 Calo (ăn 3 cái = 1 bát cơm), thành phần chủ yếu là bột mì, bơ mỡ và đường. Yến mạch chỉ chiếm vài % để lấy tên tiếp thị!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bánh quy yến mạch chứa mật độ Calo rất cao từ đường và chất béo.\nPhương án C chưa đúng: Bánh quy làm từ tinh bột và chất béo, chứa rất ít hoặc không có đạm đậu nành phân lập.\nPhương án D chưa đúng: Bánh quy giàu béo xấu và đường làm tăng mỡ máu chứ không thể làm sạch mỡ máu."}, {"n": 10, "q": "Khi đọc nhãn sản phẩm, tiêu chuẩn của một món ăn được coi là \"Giàu Chất Xơ\" (Fiber) tốt cho tiêu hóa là gì?", "opts": ["Hàm lượng chất xơ đạt từ 0,1g đến 0,5g cho mỗi khẩu phần.", "Hàm lượng chất xơ đạt từ 3g đến 5g trở lên cho mỗi khẩu phần (hoặc %DV chất xơ đạt từ 20% trở lên).", "Chất xơ phải được làm hoàn toàn từ mỡ động vật.", "Sản phẩm hoàn toàn không chứa chất xơ nhưng có nhiều đường."], "answer": "B", "explain": "Một sản phẩm được coi là nguồn cung cấp xơ tốt khi có tối thiểu 3g–5g xơ/khẩu phần. Chất xơ giúp làm chậm hấp thu đường, kéo dài cảm giác no, làm sạch vi nhung mao ruột và ngăn ngừa táo bón hiệu quả.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Mức 0,1g–0,5g là lượng xơ quá nghèo nghêu, không có giá trị hỗ trợ tiêu hóa.\nPhương án C chưa đúng: Chất xơ chỉ có trong thực phẩm nguồn gốc thực vật, không có trong mỡ động vật.\nPhương án D chưa đúng: Không có xơ mà nhiều đường là đặc trưng của thực phẩm xấu làm vọt đường huyết."}, {"n": 11, "q": "Sự khác biệt lớn khi đọc nhãn giữa \"Ngũ Cốc Nguyên Cám 100%\" (Whole Grain) và \"Bột Ngũ Cốc Tinh Chế\" (Refined Grain)?", "opts": ["Nguyên cám giữ lại lớp vỏ giàu xơ & mầm vi chất (GI thấp); Tinh chế đã bị chà sạch vỏ xơ, chỉ còn lại lõi tinh bột (GI cao).", "Bột ngũ cốc tinh chế chứa ít Calo hơn ngũ cốc nguyên cám gấp 5 lần.", "Ngũ cốc nguyên cám chứa nhiều chất béo bão hòa gây mỡ máu.", "Cả hai loại ngũ cốc này có lượng chất xơ và chỉ số đường huyết hoàn toàn như nhau."], "answer": "A", "explain": "\"Lớp vỏ cám là quà tặng của thiên nhiên!\" Ngũ cốc nguyên cám giữ trọn lớp vỏ chứa xơ và vitamin B, giúp đường ngấm chậm (GI thấp). Bột ngũ cốc tinh chế bị xát trắng, tan nhanh như đường trong máu, kích hoạt hormone tích mỡ bụng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Ngũ cốc tinh chế có Calo tương đương nhưng làm vọt đường huyết nhanh hơn.\nPhương án C chưa đúng: Ngũ cốc nguyên cám chứa chất xơ và vitamin, hầu như không chứa chất béo bão hòa.\nPhương án D chưa đúng: Tỷ lệ chất xơ và chỉ số đường huyết của 2 loại này trái ngược hoàn toàn."}, {"n": 12, "q": "Khi đọc nhãn hộp Bữa ăn lành mạnh F1 Herbalife, thông số dinh dưỡng minh bạch nào chứng minh đây là bữa ăn chuẩn Cấp độ Tế bào?", "opts": ["Chứa 1.000 Calo rỗng và 50g chất béo bão hòa.", "Chỉ khoảng 90 Calo, 0 béo xấu, 9g đạm sạch, 21 vitamin khoáng chất và chỉ số GI siêu thấp (17–29).", "Chứa nhiều chất bảo quản và dầu ăn công nghiệp.", "Hoàn toàn không chứa đạm và không có vitamin."], "answer": "B", "explain": "Nhãn F1 thể hiện sự minh bạch đẳng cấp quốc tế: Cung cấp đầy đủ 21 vi chất, 9g đạm đậu nành tinh khiết, giàu xơ, hoàn toàn 0 chất béo bão hòa/Trans fat và chỉ số GI siêu thấp 17–29 giúp bạn an tâm nuôi dưỡng tế bào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: F1 chỉ có 90 Calo tinh sạch, không chứa Calo rỗng hay béo bão hòa.\nPhương án C chưa đúng: F1 hoàn toàn không chứa chất bảo quản độc hại hay dầu ăn công nghiệp.\nPhương án D chưa đúng: F1 là bữa ăn đong đầy 21 vitamin khoáng chất và đạm sạch."}, {"n": 13, "q": "Phân biệt ý nghĩa giữa hai thuật ngữ \"Hạn Sử Dụng\" (Use by / Expiry Date) và \"Sử Dụng Tốt Nhất Trước Ngày\" (Best Before)?", "opts": ["\"Hạn sử dụng\" là mốc tuyệt đối không dùng sau ngày đó; \"Tốt nhất trước ngày\" chỉ chất lượng đỉnh cao trước mốc đó.", "Hai thuật ngữ này hoàn toàn giống hệt nhau, không có sự khác biệt.", "\"Tốt nhất trước ngày\" có nghĩa là sản phẩm sẽ biến thành chất độc ngay ngày hôm sau.", "\"Hạn sử dụng\" chỉ áp dụng cho các loại rau củ tươi."], "answer": "A", "explain": "Kỹ năng tiêu dùng! \"Use by\" (Hạn sử dụng) áp dụng cho đồ dễ hỏng (sữa, thịt) – quá ngày là nguy cơ vi khuẩn gây độc. \"Best before\" (Tốt nhất trước) áp dụng cho đồ khô (F1, trà) – quá ngày ngắn sản phẩm vẫn an toàn nhưng hương vị/dinh dưỡng có thể giảm nhẹ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đây là hai chuẩn quy định ghi nhãn hoàn toàn khác nhau về mức độ an toàn và chất lượng.\nPhương án C chưa đúng: \"Best before\" chỉ giảm nhẹ chất lượng cảm quan chứ không biến thành chất độc ngay hôm sau.\nPhương án D chưa đúng: Hạn sử dụng áp dụng cho tất cả các loại thực phẩm đóng gói."}, {"n": 14, "q": "Bẫy tiếp thị từ các gói \"Hoa Quả Sấy Khô, Rau Củ Sấy Chân Không\" được bóc trần trên nhãn dinh dưỡng như thế nào?", "opts": ["Rau củ sấy hoàn toàn không chứa Calo vì đã bị bốc hơi hết nước.", "Nhãn phía sau ghi nhận lượng ĐƯỜNG NGỐC cao vọt do cô đặc, thêm dầu chiên sấy làm Calo tăng gấp 4–5 lần rau tươi.", "Rau củ sấy chứa hàm lượng đạm cao gấp 10 lần thịt bò.", "Rau củ sấy giúp giảm mỡ bụng nhanh hơn ăn rau tươi luộc."], "answer": "B", "explain": "Khi sấy khô, nước mất đi làm lượng đường cô đặc lại. Hơn nữa, đa phần \"rau củ sấy giòn\" trên thị trường là chiên sấy trong dầu ở nhiệt độ cao, nhồi thêm muối và đường. Ăn 100g rau sấy nạp tới 400–500 Calo (bằng đĩa cơm mỡ) mà không hề no!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Mất nước làm Calo cô đặc theo khối lượng chứ không triệt tiêu Calo.\nPhương án C chưa đúng: Rau củ chứa rất ít đạm, sấy khô không làm tăng đạm thành thịt bò.\nPhương án D chưa đúng: Rau sấy nhiều Calo và béo xấu làm tăng mỡ bụng chứ không giúp giảm mỡ."}, {"n": 15, "q": "Khái niệm \"Đường Tự Do\" (Added Sugars / Free Sugars) mới xuất hiện trên các nhãn dinh dưỡng hiện đại nghĩa là gì?", "opts": ["Lượng đường do nhà sản xuất CỐ TÌNH CHO THÊM VÀO trong quá trình chế biến (khác với đường tự nhiên có sẵn trong quả/sữa).", "Lượng đường được miễn phí không tính Calo vào cơ thể.", "Lượng đường tự do di chuyển trong không khí xung quanh sản phẩm.", "Lượng đường chỉ tồn tại trong các loại rau xanh luộc."], "answer": "A", "explain": "\"Added Sugars\" là thủ phạm chính gây béo phì! Nhãn hiện đại tách riêng lượng đường tự nhiên (trong táo, sữa tươi) và Đường cho thêm (đường cát, siro ngô). Người giảm mỡ cần chọn sản phẩm có chỉ số Added Sugars càng gần 0g càng tốt!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đường cho thêm chứa rất nhiều Calo rỗng, không phải miễn phí Calo.\nPhương án C chưa đúng: Đây là thuật ngữ dinh dưỡng chỉ thành phần cho thêm, không liên quan đến không khí.\nPhương án D chưa đúng: Rau xanh luộc chứa rất ít đường tự nhiên, không chứa đường cho thêm."}, {"n": 16, "q": "Tại sao các loại \"Sữa Chua Có Vị / Sữa Chua Trái Cây\" lại chứa hàm lượng đường cao không kém gì một chai nước ngọt?", "opts": ["Vì sữa chua tự lên men sinh ra đường tinh luyện.", "Để át vị chua lên men tự nhiên, nhà sản xuất đã nạp thêm từ 15g–20g ĐƯỜNG CHO THÊM vào mỗi hũ sữa chua nhỏ.", "Vì sữa chua được làm hoàn toàn từ mỡ động vật đun sôi.", "Vì sữa chua chứa hàm lượng Natri cao gấp 10 lần muối ăn."], "answer": "B", "explain": "Nhầm lẫn tai hại! Nhiều người ăn sữa chua trái cây để \"giảm cân\", nhưng lật nhãn ra xem: 1 hũ sữa chua nhỏ chứa tới 18g đường (tương đương 4 thìa đường cát!). Muốn ăn tốt cho đường ruột và giảm mỡ, hãy chọn Sữa chua không đường!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Quá trình lên men tiêu thụ đường lactose tạo axit lactic, không tự sinh ra đường tinh luyện.\nPhương án C chưa đúng: Sữa chua làm từ sữa tươi lên men, không phải từ mỡ động vật đun sôi.\nPhương án D chưa đúng: Sữa chua chứa hàm lượng Natri rất thấp."}, {"n": 17, "q": "Tác dụng của việc kiểm tra thành phần \"Đạm\" (Protein) in trên nhãn đối với người đang thực hiện mục tiêu Giảm Mỡ Giữ Cơ?", "opts": ["Giúp chọn sản phẩm có hàm lượng đạm cao (≥10g/khẩu phần) để nuôi cơ bắp, kéo dài độ no và giữ cỗ máy đốt Calo.", "Để tìm sản phẩm có đạm làm tăng mỡ nội tạng xung quanh tim.", "Đạm trên nhãn giúp dự đoán màu sắc của sản phẩm.", "Kiểm tra đạm để đảm bảo sản phẩm hoàn toàn không chứa vi chất."], "answer": "A", "explain": "Đọc nhãn tìm Đạm! Chọn bữa phụ hay thực phẩm có lượng đạm cao sẽ giúp bạn đáp ứng đủ Con số đạm cá nhân trong ngày, giúp bảo vệ khối cơ bắp, săn chắc vóc dáng và làm cỗ máy đốt Calo hoạt động bền bỉ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm sạch nuôi cơ bắp, không gây tăng mỡ nội tạng.\nPhương án C chưa đúng: Hàm lượng đạm không quyết định màu sắc của sản phẩm.\nPhương án D chưa đúng: Đạm là chất dinh dưỡng vĩ mô tốt, không liên quan đến việc loại bỏ vi chất."}, {"n": 18, "q": "Khi lật mặt sau gói thực phẩm và thấy nhãn ghi \"Serving Size: 1/2 Bag (30g)\" có nghĩa là gì?", "opts": ["Cả gói thực phẩm đó chỉ nặng đúng 1/2 gram.", "Mọi chỉ số Calo, Đường, Béo in bên dưới chỉ tính cho MỘT NỬA GÓI (30g); nếu ăn hết cả gói phải NHÂN ĐÔI các chỉ số đó.", "Bạn bắt buộc phải chia gói thực phẩm đó cho 30 người cùng ăn.", "Gói thực phẩm đó chỉ được ăn trong 30 giây."], "answer": "B", "explain": "Kỹ năng đọc nhãn thực chiến! \"Serving size = 1/2 bag\" nghĩa là 1 khẩu phần bằng một nửa gói. Nếu bên dưới ghi 150 Calo và 10g đường, mà bạn tiện tay ăn hết cả gói, thì thực tế bạn đã nạp $150 \\times 2 = 300$ Calo và 20g đường!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: 1/2 Bag (30g) có nghĩa là một nửa gói có trọng lượng 30g.\nPhương án C chưa đúng: Đây là kích thước 1 khẩu phần khuyến nghị, không phải số người chia ăn.\nPhương án D chưa đúng: 30g là khối lượng khẩu phần, không phải số giây ăn."}, {"n": 19, "q": "Thói quen \"Lật mặt sau bao bì đọc Nhãn Dinh Dưỡng trước khi quyết định mua hàng\" mang lại giá trị vĩ đại gì cho hội viên?", "opts": ["Biến hội viên thành \"Người tiêu dùng thông thái\", không bị sập bẫy quảng cáo, kiểm soát chuẩn Calo và làm chủ sức khỏe.", "Làm cho siêu thị bị thất thu và phải đóng cửa ngay lập tức.", "Làm cho hội viên bị tốn thời gian vô ích mà không thu lại giá trị gì.", "Giúp hội viên tự động tăng 3kg cơ bắp ngay tại chỗ."], "answer": "A", "explain": "Lật mặt sau là tư thế của người thông thái! Mặt trước bao bì là nơi nhà tiếp thị \"vẽ hoa vẽ vượn\" (ngon, bổ, rẻ, ăn kiêng). Chỉ có Mặt sau – Bảng nhãn dinh dưỡng mới nói lên SỰ THẬT về Calo, Đường, Béo rỗng giúp bạn bảo vệ sức khỏe gia đình!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đọc nhãn giúp chọn sản phẩm lành mạnh, không làm siêu thị đóng cửa.\nPhương án C chưa đúng: Dành 10 giây đọc nhãn giúp bạn tiết kiệm tiền viện phí và bảo vệ vóc dáng trọn đời.\nPhương án D chưa đúng: Đọc nhãn giúp chọn đúng đồ ăn nuôi cơ, không phải làm tăng cơ ngay tại chỗ."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 8 \"Đọc Nhãn Dinh Dưỡng\" tại Nhóm Dinh Dưỡng?", "opts": ["\"MẶT TRƯỚC LÀ QUẢNG CÁO – MẶT SAU MỚI LÀ SỰ THẬT: Hãy luôn lật mặt sau đọc nhãn để bóc trần bẫy Calo rỗng và làm chủ vóc dáng!\"", "Chỉ cần nhìn hình ảnh minh họa đẹp mắt ở mặt trước là đủ quyết định mua hàng.", "Thực phẩm nào càng đắt tiền thì càng không cần phải đọc nhãn dinh dưỡng.", "Không cần đọc nhãn vì tất cả các loại thực phẩm đóng gói đều tốt như nhau."], "answer": "A", "explain": "\"Đừng tin những gì bao bì quảng cáo ở mặt trước, hãy nhìn vào con số sự thật ở mặt sau!\" Rèn luyện thói quen đọc nhãn dinh dưỡng mỗi khi đi siêu thị là chìa khóa vàng giúp bạn làm chủ đĩa ăn, kiểm soát Con số Calo kỳ diệu và bảo vệ vóc dáng An Vui trọn đời!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Mặt trước chủ yếu là hình ảnh tiếp thị đã qua chỉnh sửa bắt mắt.\nPhương án C chưa đúng: Đồ đắt tiền vẫn có thể chứa lượng lớn đường ngầm và béo xấu.\nPhương án D chưa đúng: Mỗi sản phẩm đóng gói có giá trị dinh dưỡng và độ tốt/xấu hoàn toàn khác nhau."}];
const TKP_LESSON=8;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>BẬC THẦY ĐỌC NHÃN DINH DƯỠNG<br>BÓC TRẦN BẪY TÍCH MỠ</h1><div class="subtitle">LÀM CHỦ ĐĨA ĂN – LÀM CHỦ SỨC KHỎE</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
</body></html>
