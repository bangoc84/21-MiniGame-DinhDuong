<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bậc thầy chuỗi cung ứng Seed to Feed | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Bản chất cốt lõi và mục tiêu tối thượng của cam kết \"Từ Gieo Hạt Đến Bàn Ăn\" (Seed to Feed) do Herbalife thực thi là gì?", "opts": ["Tối ưu hóa lợi nhuận thương mại bằng cách cắt giảm các khâu kiểm nghiệm trung gian.", "Kiểm soát khép kín 14 bước từ chọn giống, trồng trọt, chiết xuất đến bàn ăn để đảm bảo độ tinh khiết và an toàn tuyệt đối.", "Mua lại toàn bộ các trang trại nông nghiệp thô trên khắp thế giới để độc quyền thị trường.", "Thay thế hoàn toàn quy trình chế biến thức ăn tươi của các bà nội trợ tại gia đình."], "answer": "B", "explain": "Chuỗi giá trị toàn vẹn! \"Seed to Feed\" là lời cam kết vàng về chất lượng. Herbalife tự chủ kiểm soát nghiêm ngặt qua 14 bước khép kín: từ hạt giống không biến đổi gen, thổ nhưỡng trang trại, thu hoạch, công nghệ phân lập, kiểm định phòng lab đến khi ly dinh dưỡng đến tay hội viên.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: \"Seed to Feed\" tăng chi phí kiểm nghiệm lên hàng triệu USD chứ không cắt giảm để tìm kiếm lợi nhuận ngắn hạn.\n• Phương án C chưa đúng: Mục tiêu là kiểm soát chất lượng chuẩn sinh học, không phải mua thâu tóm đất đai thương mại.\n• Phương án D chưa đúng: Quy trình tạo ra dinh dưỡng bổ sung chuẩn tế bào, không thay thế việc ăn uống thực phẩm tươi lành mạnh."}, {"n": 2, "q": "Tiêu chuẩn chọn lựa \"Hạt Giống\" (Seed) đầu vào trong chuỗi quy trình \"Seed to Feed\" quy định điều gì?", "opts": ["Sử dụng hạt giống biến đổi gen (GMO) để tăng năng suất thu hoạch gấp 5 lần.", "Tuyển chọn 100% hạt giống thuần chủng không biến đổi gen (Non-GMO), giàu hàm lượng vi chất và sức sống sinh học cao.", "Mua các loại hạt giống giá rẻ trôi nổi trên thị trường tự do.", "Chỉ sử dụng hạt giống đã qua xử lý hóa chất bảo quản công nghiệp."], "answer": "B", "explain": "Sự thuần khiết từ gốc! Hạt giống là khởi đầu của sự sống. Herbalife chỉ chọn lựa nguồn hạt giống đậu nành, trà xanh thuần chủng Non-GMO, được kiểm định gen di truyền nghiêm ngặt để đảm bảo an toàn tuyệt đối cho sức khỏe người tiêu dùng dài hạn.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Herbalife nói KHÔNG với hạt giống biến đổi gen (GMO) tiềm ẩn nguy cơ dị ứng và rối loạn chuyển hóa.\n• Phương án C chưa đúng: Hạt giống giá rẻ không đạt tiêu chuẩn phân tích gen Y học.\n• Phương án D chưa đúng: Hóa chất bảo quản trên hạt giống bị cấm tuyệt đối trong tiêu chuẩn Seed to Feed."}, {"n": 3, "q": "Việc lựa chọn \"Thổ Nhượng & Trang Trại Trồng Trọt\" (Farming) trong quy trình Seed to Feed được thực hiện như thế nào?", "opts": ["Canh tác tại các cánh đồng sinh học đạt chuẩn (Mỹ, Mexico, Trung Quốc) với nguồn đất, nước không nhiễm kim loại nặng.", "Trồng trọt tại các khu công nghiệp ven thành phố để tiện vận chuyển.", "Sử dụng tối đa phân bón hóa học và thuốc trừ sâu để cây phát triển nhanh.", "Thổ nhưỡng trồng trọt không cần kiểm tra vì vi chất sẽ được bổ sung sau."], "answer": "A", "explain": "Đất sạch tạo nên cây lành! Các trang trại trồng trọt của Herbalife nằm ở những vùng sinh thái nguyên sơ, nguồn nước ngầm tinh khiết, thổ nhưỡng giàu khoáng chất tự nhiên và được theo dõi bằng công nghệ vệ tinh để không bị ô nhiễm hóa chất.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Khu công nghiệp ven đô chứa nhiều khí thải và kim loại nặng ô nhiễm nguồn đất.\n• Phương án C chưa đúng: Thuốc trừ sâu và phân bón hóa học bị nghiêm cấm trong tiêu chuẩn canh tác sinh học của tập đoàn.\n• Phương án D chưa đúng: Đất bạc màu ô nhiễm sẽ truyền chất độc vào cây trồng, không thể khắc phục hoàn toàn ở khâu sau."}, {"n": 4, "q": "Kỹ thuật \"Thu Hoạch & Bảo Quản Ban Đầu\" (Harvesting) trong quy trình Seed to Feed có điểm gì đặc biệt?", "opts": ["Dùng hóa chất ép chín đồng loạt để thu hoạch nhanh chóng.", "Thu hoạch đúng \"độ chín sinh học\" có hàm lượng dưỡng chất cao nhất và vận chuyển bằng xe lạnh kiểm soát nhiệt độ.", "Phơi nắng trực tiếp trên mặt đất nhiều ngày để tiết kiệm chi phí.", "Để nguyên liệu ngoài trời mưa nắng tự nhiên trong nhiều tuần trước khi chế biến."], "answer": "B", "explain": "Giữ trọn sức sống của thảo mộc! Búp trà hay hạt đậu nành được thu hoạch chính xác vào khung giờ có dưỡng chất đỉnh cao nhất trong ngày, sau đó lập tức đưa vào hệ thống bảo quản lạnh sinh học để ngăn chặn sự oxy hóa và phân hủy vi chất.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Ép chín bằng hóa chất làm phá hủy cấu trúc vitamin tự nhiên trong thảo mộc.\n• Phương án C chưa đúng: Phơi đất thủ công gây nhiễm nấm mốc, vi khuẩn và ô nhiễm bụi bẩn.\n• Phương án D chưa đúng: Để ngoài trời làm ô xy hóa và phân hủy hoàn toàn các vi chất nhạy cảm."}, {"n": 5, "q": "Công nghệ \"Chiết Xuất & Phân Lập\" (Extraction) đỉnh cao giải quyết vấn đề gì đối với hạt đậu nành thô?", "opts": ["Bóc tách sạch chất béo xấu, loại bỏ đường khó tiêu gây đầy hơi, chỉ giữ lại ĐẠM TINH KHIỆT có chỉ số hấp thu PDCAAS = 1.", "Giữ nguyên toàn bộ dầu mỡ thô và tạp chất để làm tăng khối lượng bột.", "Dùng nhiệt độ 300°C đun nấu liên tục để tiêu diệt mọi dưỡng chất.", "Chuyển hóa đạm đậu nành thành đạm động vật bão hòa."], "answer": "A", "explain": "Đỉnh cao phân lập sinh học! Hạt đậu nành thô chứa chất béo bão hòa và đường oligosaccharide gây trướng bụng. Công nghệ chiết xuất của Herbalife bóc tách sạch tạp chất này, cô đọng thành Đạm Phân Lập tinh khiết hấp thu siêu tốc vào tế bào.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Giữ lại mỡ thô làm giảm chất lượng sản phẩm và gây gánh nặng cho hệ tiêu hóa.\n• Phương án C chưa đúng: Nhiệt độ quá cao 300°C làm biến tính và tàn phá các chuỗi axit amin.\n• Phương án D chưa đúng: Đạm thực vật phân lập giữ nguyên bản chất thực vật lành tính, không biến thành đạm động vật."}, {"n": 6, "q": "Tiêu chuẩn sản xuất \"GMP\" (Good Manufacturing Practices) tại các nhà máy HIM (Herbalife Innovation and Manufacturing) nghĩa là gì?", "opts": ["Tiêu chuẩn sản xuất thực phẩm gia đình thủ công.", "Thực hành sản xuất tốt chuẩn Y Dược: không khí vô trùng, áp suất âm, dây chuyền tự động hóa 100% ngăn chặn nhiễm khuẩn.", "Tiêu chuẩn chỉ áp dụng cho ngành sản xuất nước đóng chai.", "Tiêu chuẩn cho phép công nhân dùng tay trần bốc nguyên liệu."], "answer": "B", "explain": "Dây chuyền chuẩn Dược phẩm! Các nhà máy HIM đạt chuẩn GMP khắt khe: hệ thống lọc không khí HEPA loại bỏ 99.99% bụi mịn, kiểm soát nhiệt độ - độ ẩm tự động, công nhân mặc bảo hộ vô trùng, đảm bảo từng muỗng bột F1 hoàn toàn tinh sạch.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Chế biến thủ công gia đình không thể kiểm soát được vi khuẩn và nấm mốc vi mô.\n• Phương án C chưa đúng: GMP là chuẩn sản xuất quốc tế áp dụng cho Dược phẩm và Thực phẩm Dinh dưỡng cao cấp.\n• Phương án D chưa đúng: Tiếp xúc tay trần bị nghiêm cấm tuyệt đối trong quy chuẩn GMP."}, {"n": 7, "q": "Hệ thống Phòng Thí Nghiệm đạt chuẩn \"ISO/IEC 17025\" của Herbalife thực hiện bao nhiêu lượt kiểm nghiệm mỗi năm?", "opts": ["Khoảng 100 lượt kiểm tra ngẫu nhiên.", "Hơn 150.000 lượt kiểm nghiệm khắt khe mỗi năm trên từng lô nguyên liệu và thành phẩm.", "Chỉ kiểm tra 1 lần duy nhất khi thành lập nhà máy.", "Hoàn toàn không kiểm tra phòng lab nếu nguyên liệu nhìn sạch sẽ."], "answer": "B", "explain": "Con số biết nói về độ an toàn! Trung tâm kiểm nghiệm ISO/IEC 17025 thực hiện hơn 150.000 lượt thử nghiệm/năm. Mỗi sản phẩm phải vượt qua hàng loạt bài kiểm tra sinh hóa, vi sinh, dư lượng trước khi được xuất xưởng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Con số 100 lượt là quá nhỏ bé, không thể kiểm soát chuỗi cung ứng toàn cầu.\n• Phương án C chưa đúng: Kiểm tra phải diễn ra liên tục trên từng lô hàng hàng ngày.\n• Phương án D chưa đúng: Mắt thường không thể nhìn thấy vi khuẩn, dư lượng thuốc trừ sâu hay kim loại nặng."}, {"n": 8, "q": "Bài kiểm tra \"Kim Loại Nặng & Độc Tố\" (Heavy Metals Testing) trong quy trình Seed to Feed đảm bảo điều gì?", "opts": ["Loại bỏ 100% rủi ro nhiễm Thủy ngân, Chì, Asen, Cadimi – bảo vệ tuyệt đối cho Gan và Thận của người dùng.", "Cho phép tồn tại một lượng chì nhỏ để tăng hương vị đậm đà.", "Kim loại nặng sẽ tự động tiêu biến khi pha vào nước nóng nên không cần kiểm tra.", "Chỉ kiểm tra kim loại nặng đối với các sản phẩm dạng viên nén."], "answer": "A", "explain": "Tấm lá chắn bảo vệ Gan Thận! Kim loại nặng tích tụ lâu ngày sẽ gây suy gan, hỏng thận và ung thư. Dây chuyền phân tích phổ khối Plasma (ICP-MS) của Herbalife phát hiện và loại bỏ tạp chất ở cấp độ phần tỷ (ppb), mang lại sự an toàn tuyệt đối.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Chì và kim loại nặng là chất độc tuyệt đối bị cấm, không phải chất tăng hương vị.\n• Phương án C chưa đúng: Nước nóng không thể làm đun sôi hay tiêu biến kim loại nặng.\n• Phương án D chưa đúng: Tất cả sản phẩm (dạng bột, dạng kem, dạng viên) đều phải trải qua bài kiểm tra kim loại nặng."}, {"n": 9, "q": "Chứng nhận độc lập từ tổ chức \"NSF International / Informed-Sport\" kiểm định điều gì trên sản phẩm?", "opts": ["Chứng nhận sản phẩm có giá tiền rẻ nhất thị trường.", "Xác nhận thành phần đúng 100% như nhãn công bố và HOÀN TOÀN KHÔNG CHỨA CHẤT CẤP DÙNG TRONG THI ĐẤU (Doping).", "Chứng nhận sản phẩm có thể thay thế hoàn toàn giấc ngủ ban đêm.", "Chứng nhận sản phẩm chỉ dành cho người trên 80 tuổi."], "answer": "B", "explain": "Bảo chứng vàng toàn cầu! NSF và Informed-Sport là hai cơ quan kiểm định độc lập uy tín nhất thế giới. Dòng sản phẩm Herbalife 24 đạt chứng nhận này là bằng chứng minh bạch rằng sản phẩm sạch 100%, được các siêu sao như Cristiano Ronaldo tin dùng khi thi đấu Olympic.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: NSF kiểm định độ an toàn chất lượng, không kiểm định giá cả thương mại.\n• Phương án C chưa đúng: Dinh dưỡng bổ sung không thay thế giấc ngủ sinh lý của con người.\n• Phương án D chưa đúng: Sản phẩm phục vụ cho các vận động viên và người vận động mọi lứa tuổi."}, {"n": 10, "q": "Khâu \"Lưu Kho & Vận Chuyển Bảo Quản\" (Storage & Transportation) trong quy trình Seed to Feed được kiểm soát ra sao?", "opts": ["Sử dụng container thông minh kiểm soát Nhiệt độ & Độ ẩm 24/7 để dinh dưỡng không bị biến tính bởi thời tiết.", "Vận chuyển bằng xe tải mui bạt hở dưới nắng nóng 40°C để tiết kiệm chi phí.", "Đóng gói trong bao tải dứa thông thường không chống ẩm.", "Vận chuyển càng chậm càng tốt để sản phẩm tự lên men."], "answer": "A", "explain": "Giữ nguyên phẩm chất từ nhà máy đến người dùng! Vi chất dinh dưỡng rất nhạy cảm với nhiệt độ và độ ẩm. Toàn bộ chuỗi vận chuyển đường biển, đường hàng không và kho vận địa phương đều trang bị cảm biến nhiệt độ tự động, đảm bảo lon F1 không bị vón cục hay biến tính.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nắng nóng 40°C sẽ làm chảy gelatin, phân hủy vitamin và biến tính đạm trong sản phẩm.\n• Phương án C chưa đúng: Bao tải dứa không chống được ẩm mốc và vi khuẩn xâm nhập.\n• Phương án D chưa đúng: Vận chuyển cần nhanh chóng và kiểm soát môi trường tiêu chuẩn, không để tự lên men hỏng."}, {"n": 11, "q": "Việc \"Bộ Y Tế hơn 90 Quốc Gia\" phê duyệt cấp phép lưu hành minh chứng cho điều gì trong quy trình Seed to Feed?", "opts": ["Minh chứng Herbalife đã mua bản quyền y tế của tất cả các nước.", "Khẳng định sản phẩm vượt qua hàng rào pháp lý Y tế khắt khe nhất của từng quốc gia về Vệ sinh An toàn Thực phẩm.", "Minh chứng sản phẩm là thuốc điều trị bệnh chuyên khoa.", "Cấp phép chỉ là thủ tục hành chính ngẫu nhiên không có giá trị."], "answer": "B", "explain": "Hộ chiếu niềm tin toàn cầu! Mỗi quốc gia (từ FDA Mỹ, EFSA Châu Âu đến Bộ Y tế Việt Nam) đều có hàng rào tiêu chuẩn kiểm định độc lập. Việc vượt qua các đợt hậu kiểm kiểm nghiệm của hơn 90 quốc gia là bằng chứng vững chắc về độ an toàn của Seed to Feed.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Không ai có thể mua bản quyền pháp lý Y tế của một quốc gia.\n• Phương án C chưa đúng: Sản phẩm là Dinh dưỡng bổ sung làm sạch tế bào, không phải thuốc chữa bệnh.\n• Phương án D chưa đúng: Thủ tục cấp phép Y tế đòi hỏi hồ sơ kiểm nghiệm sinh học cực kỳ khắt khe."}, {"n": 12, "q": "Sự khác biệt giữa sản phẩm đạt chuẩn \"Seed to Feed\" và các loại \"Thực phẩm chức năng thô trôi nổi\" trên thị trường?", "opts": ["Seed to Feed minh bạch 100% nguồn gốc, kiểm soát từ hạt giống; Đồ trôi nổi gom nguyên liệu thô gom nhặt, dễ nhiễm độc.", "Đồ trôi nổi tốt hơn vì được sản xuất thủ công không qua máy móc.", "Hai dòng sản phẩm này có độ tinh khiết và công nghệ sản xuất hoàn toàn như nhau.", "Sản phẩm Seed to Feed chứa nhiều chất bảo quản hơn đồ trôi nổi."], "answer": "A", "explain": "Sự thật về độ tinh khiết! Các loại bột thô hay thực phẩm chức năng không rõ nguồn gốc thường mua gom nguyên liệu trôi nổi nhiễm phân bón, kim loại nặng và nấm mốc. Seed to Feed theo dõi vết từng hạt giống, mang lại sự an tâm tuyệt đối cho người dùng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Sản xuất thủ công dễ bị nhiễm khuẩn, nấm mốc và không định lượng chuẩn vi chất.\n• Phương án C chưa đúng: Công nghệ phân lập và kiểm định phòng lab ISO hoàn toàn khác biệt với chế biến thủ công.\n• Phương án D chưa đúng: Seed to Feed ứng dụng công nghệ cô đặc vi chất tự nhiên, không dùng chất bảo quản độc hại."}, {"n": 13, "q": "Khái niệm \"Tính Minh Bạch Nhãn Mác\" (Traceability & Label Transparency) trong chuỗi Seed to Feed được thể hiện như thế nào?", "opts": ["Nhà sản xuất cố tình giấu kín các con số dinh dưỡng để bảo mật công nghệ.", "Mọi thông số Calo, Vi chất, Đường, Béo, Mã lô hàng (Batch Number) đều được niêm yết chính xác, dễ dàng truy xuất nguồn gốc.", "Nhãn mác chỉ in hình ảnh minh họa đẹp mắt, không có con số cụ thể.", "Nhãn mác thay đổi các chỉ số dinh dưỡng liên tục tùy theo tâm lý khách hàng."], "answer": "B", "explain": "Minh bạch là thước đo uy tín! Trên mỗi lon F1 hay hộp Herbalifeline đều có mã số lô hàng (Batch Number). Từ mã số này, tập đoàn có thể truy xuất ngược lại chính xác lô nguyên liệu đó được thu hoạch ngày nào, tại trang trại nào và ai là người kiểm nghiệm!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Herbalife công khai 100% bảng thành phần theo quy định pháp luật quốc tế.\n• Phương án C chưa đúng: Nhãn mác in đầy đủ bảng giá trị dinh dưỡng chi tiết (Nutrition Facts).\n• Phương án D chưa đúng: Con số dinh dưỡng là kết quả kiểm nghiệm cố định chuẩn xác, không thay đổi ngẫu nhiên."}, {"n": 14, "q": "Tại sao bước \"Pha Chế Đúng Kỹ Thuật\" tại Nhóm Dinh Dưỡng lại là mắt xích cuối cùng hoàn thiện quy trình Seed to Feed?", "opts": ["Giúp bảo toàn vi chất nhạy cảm (không pha nước quá nóng >50°C), đúng tỷ lệ, giúp vi nhung mao hấp thu 100% vào tế bào.", "Để làm cho ly F1 có màu sắc đậm đà hơn.", "Pha chế tại Nhóm Dinh Dưỡng chỉ để phục vụ mục đích chụp ảnh check-in.", "Pha nước sôi 100°C để tiêu diệt hết các loại vitamin trong lon F1."], "answer": "A", "explain": "Bàn ăn thông thái! Sản phẩm tốt nhất thế giới nếu pha nước sôi 100°C sẽ làm biến tính đạm và phân hủy vitamin. HLV tại Nhóm Dinh Dưỡng hướng dẫn pha nước nguội/ấm <50°C, đánh mịn lắc đều, giúp trọn vẹn dinh dưỡng Seed to Feed đi vào tế bào.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Pha đúng kỹ thuật để bảo vệ giá trị dinh dưỡng sinh học, không phải chỉnh màu.\n• Phương án C chưa đúng: Pha chế chuẩn kỹ thuật quyết định tốc độ hấp thu và kết quả vóc dáng của hội viên.\n• Phương án D chưa đúng: Nước sôi 100°C làm tàn phá vi chất, là sai lầm kỹ thuật cần tránh."}, {"n": 15, "q": "Ý nghĩa của việc ứng dụng \"Trí Tuệ Nhân Tạo (AI) & Công Nghệ Sinh Học\" trong chuỗi Seed to Feed tương lai?", "opts": ["Để thay thế hoàn toàn con người trong việc ăn uống hàng ngày.", "Tự động hóa giám sát dinh dưỡng đất, dự báo thời điểm thu hoạch đỉnh cao và tối ưu hóa công thức dinh dưỡng cá nhân hóa.", "Để tạo ra các loại thực phẩm nhân tạo hoàn toàn từ hóa chất.", "Công nghệ AI chỉ dùng để tính tiền tại kho hàng."], "answer": "B", "explain": "Tiên phong tiên tiến! Herbalife liên tục đầu tư công nghệ AI và sinh học phân tử để phân tích bộ gen cây trồng, kiểm soát sâu bệnh sinh học không dùng thuốc, giúp chất lượng nguồn nguyên liệu đầu vào ngày càng tinh khiết và giàu vi chất hơn.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Công nghệ hỗ trợ nâng cao chất lượng nguồn ăn, không thay thế việc ăn uống của con người.\n• Phương án C chưa đúng: Tập đoàn kiên định con đường Dinh dưỡng thảo mộc tự nhiên, không làm thực phẩm hóa chất.\n• Phương án D chưa đúng: AI ứng dụng sâu vào nghiên cứu sinh học nông nghiệp và kiểm soát chất lượng Seed to Feed."}, {"n": 16, "q": "Trách nhiệm \"Bảo Vệ Môi Trường & Phát Triển Bền Vững\" trong quy trình Seed to Feed của Herbalife?", "opts": ["Sử dụng năng lượng mặt trời tại trang trại, giảm nhựa bao bì, tái chế phụ phẩm nông nghiệp thành phân bón hữu cơ.", "Xả thải trực tiếp hóa chất ra các dòng sông xung quanh nhà máy.", "Chặt phá rừng nguyên sinh để lấy đất làm trang trại trồng trọt.", "Tăng cường sử dụng túi nilon một lần trong khâu đóng gói."], "answer": "A", "explain": "Dinh dưỡng Xanh cho Trái Đất! Quyết tâm \"Go Green\", Herbalife cắt giảm hàng trăm tấn nhựa mỗi năm trên nắp hộp, ưu tiên năng lượng tái tạo tại nhà máy HIM và trả lại cho đất mẹ sự phì nhiêu bằng canh tác hữu cơ bền vững.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Các nhà máy HIM đạt chuẩn xử lý chất thải sinh học nghiêm ngặt trước khi ra môi trường.\n• Phương án C chưa đúng: Herbalife bảo vệ hệ sinh thái rừng và chỉ canh tác trên quỹ đất nông nghiệp chuẩn hóa.\n• Phương án D chưa đúng: Tập đoàn đang cắt giảm tối đa nhựa và nilon đơn dùng trên toàn cầu."}, {"n": 17, "q": "Tại sao người tiêu dùng lại cảm thấy \"An Nhiên & Yên Tâm Tuyệt Đối\" khi sử dụng sản phẩm có bảo chứng Seed to Feed?", "opts": ["Vì sản phẩm được bán ở các cửa hàng tạp hóa ven đường.", "Vì biết rõ nguồn gốc tinh sạch từ hạt giống, không lo kim loại nặng, nấm mốc hay hóa chất độc hại tàn phá cơ thể.", "Vì sản phẩm có mùi vị ngọt lịm giống bánh kẹo công nghiệp.", "Vì không cần phải uống nước hay vận động khi dùng sản phẩm."], "answer": "B", "explain": "An tâm từ cội nguồn! Trong thời đại thực phẩm bẩn, ô nhiễm kim loại nặng tràn lan, việc biết rõ ly F1 mình uống mỗi sáng được kiểm soát 14 bước từ hạt giống sạch giúp hội viên hoàn toàn an tâm bảo vệ sức khỏe cho cả gia đình.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Cửa hàng tạp hóa trôi nổi không bảo chứng được chuỗi bảo quản chuẩn nhiệt độ.\n• Phương án C chưa đúng: Sản phẩm có vị ngọt thanh tự nhiên GI thấp, không phải ngọt gắt hóa chất.\n• Phương án D chưa đúng: Dinh dưỡng chuẩn luôn đi kèm lối sống năng động: uống đủ nước 3Đ và vận động."}, {"n": 18, "q": "Tác động của quy trình Seed to Feed đối với việc giữ vững \"Mật Độ Dinh Dưỡng Cao - Calo Thấp\" trong ly F1?", "opts": ["Chiết xuất sinh học giúp cô đọng 21 vi chất & đạm sạch trong dung lượng chỉ 90 Calo, loại bỏ hoàn toàn Calo rỗng.", "Làm cho ly F1 tăng Calo lên gấp 10 lần để người ăn mau béo.", "Làm triệt tiêu toàn bộ lượng đạm đậu nành trong sản phẩm.", "Tạo ra nhiều chất béo bão hòa hơn trong bột F1."], "answer": "A", "explain": "Kỳ tích công nghệ dinh dưỡng! Quy trình chiết xuất Seed to Feed giúp \"loại bỏ những thứ không tốt\" (béo xấu, đường ngầm, Calo rỗng) và \"cô đọng những thứ tốt nhất\" (vitamin, khoáng chất, đạm sạch) vào trong một ly Shake 90 Calo gọn nhẹ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: F1 giữ mức Calo thấp (90 Calo) giúp kiểm soát vóc dáng thon gọn.\n• Phương án C chưa đúng: Quy trình giúp cô đọng và nâng cao tinh chất đạm đậu nành phân lập.\n• Phương án D chưa đúng: Seed to Feed loại bỏ sạch chất béo bão hòa xấu ra khỏi F1."}, {"n": 19, "q": "Sự đóng góp của Ban Cố Vấn Dinh Dưỡng NAB vào quy trình Seed to Feed là gì?", "opts": ["Trực tiếp giám sát các tiêu chuẩn nghiên cứu khoa học, thử nghiệm độ an toàn sinh học tại từng mắt xích quy trình.", "Chỉ tham gia đóng gói sản phẩm tại khâu vận chuyển.", "NAB không quan tâm đến quy trình trồng trọt và thu hoạch.", "NAB chỉ phê duyệt sản phẩm qua hình ảnh trên máy tính."], "answer": "A", "explain": "Trí tuệ Y khoa giám sát! Hơn 300 nhà khoa học NAB (dẫn dắt bởi GS. David Heber, GS. Louis Ignarro) trực tiếp cố vấn công thức sinh học, thiết lập tiêu chuẩn phòng lab và duyệt các nghiên cứu lâm sàng của quy trình Seed to Feed.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Các nhà khoa học chịu trách nhiệm cố vấn nghiên cứu sinh học, không phải công nhân đóng gói.\n• Phương án C chưa đúng: Trồng trọt và thu hoạch là gốc rễ quyết định chất lượng vi chất mà NAB đặc biệt kiểm soát.\n• Phương án D chưa đúng: Kiểm tra dựa trên dữ liệu phân tích sinh hóa lâm sàng thực tế tại phòng lab."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 13 \"QUY TRÌNH TỪ GIEO HẠT ĐẾN BÀN ĂN\" tại Nhóm Dinh Dưỡng?", "opts": ["\"TỪ GIEO HẠT ĐẾN BÀN ĂN (SEED TO FEED) - BẢO CHỨNG CHẤT LƯỢNG VÀNG: Trọn vẹn sự an tâm cho bữa ăn Cấp độ Tế bào, nâng tầm sức khỏe An Vui trọn đời!\"", "Chỉ cần chọn thực phẩm giá rẻ nhất, không cần quan tâm đến quy trình sản xuất.", "Quy trình sản xuất không ảnh hưởng gì đến sức khỏe của người tiêu dùng.", "Có thể tự làm bột F1 tại nhà bằng cách xay các loại đậu thô mua ngoài chợ."], "answer": "A", "explain": "\"Trao Bữa Ăn - Trao Sự An Tâm!\" Mỗi ly Shake F1 bạn uống không đơn thuần là bữa ăn, mà là đằng sau đó là cả một chuỗi khoa học 14 bước \"Seed to Feed\" đỉnh cao nhân loại. Hãy trân trọng và tự hào chia sẻ giải pháp dinh dưỡng tuyệt vời này đến mọi gia đình!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thực phẩm giá rẻ trôi nổi tiềm ẩn nguy cơ ô nhiễm độc tố tàn phá gan thận.\n• Phương án C chưa đúng: Quy trình sản xuất quyết định 100% độ sạch, độ an toàn và giá trị vi chất của thực phẩm.\n• Phương án D chưa đúng: Đậu thô mua ngoài chợ chưa được tách béo xấu, chưa bóc tạp chất và không thể đong đầy 21 vi chất như F1."}];
const TKP_LESSON=13;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}

function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>BẬC THẦY CHUỖI CUNG ỨNG<br>TỪ GIEO HẠT ĐẾN BÀN ĂN</h1><div class="subtitle">KHÁM PHÁ QUY TRÌNH SEED TO FEED – HÀNH TRÌNH CHẤT LƯỢNG</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
