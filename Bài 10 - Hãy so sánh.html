<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái so sánh | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "So sánh về \"Độ đắt - rẻ thực sự\" giữa 1 Bát phở bò truyền thống (khoảng 45.000–50.000 VNĐ) và 1 Ly Bữa ăn lành mạnh F1 (chi phí tương đương)?", "opts": ["Bát phở rẻ hơn rất nhiều vì nó cho cảm giác nặng bụng và đầy đặn hơn.", "Bát phở đắt hơn vì nạp 500 Calo rỗng, mỡ xấu và đường cao; Ly F1 rẻ hơn vì chỉ 90 Calo nhưng đong đầy 21 vi chất và đạm sạch.", "Hai bữa ăn này có giá trị dinh dưỡng và chi phí hoàn toàn giống hệt nhau.", "Ly F1 đắt hơn vì nó không chứa các loại thịt động vật thô."], "answer": "B", "explain": "\"Đắt hay rẻ nằm ở GIÁ TRỊ, không nằm ở GIÁ TIỀN!\" Cùng số tiền ~50.000 VNĐ: Bát phở mua về năng lượng dư thừa (500 Calo), mỡ động vật đun nóng và đường cao gây tích mỡ bụng. Ly F1 mua về giải pháp sức khỏe chuẩn 5 sao: 21 vitamin khoáng chất, đạm đậu nành phân lập, 0 béo xấu và bảo vệ tuyến tụy.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Cảm giác nặng bụng là do dạ dày vất vả tiêu hóa mỡ xấu, không phản ánh giá trị rẻ hay đắt.\n• Phương án C chưa đúng: Chi phí tiền mặt như nhau nhưng giá trị dinh dưỡng nuôi tế bào của F1 vượt trội hoàn toàn.\n• Phương án D chưa đúng: Đạm thực vật phân lập công nghệ cao trong F1 tinh sạch và giá trị hơn đạm thịt mỡ thô rất nhiều."}, {"n": 2, "q": "So sánh giữa \"Chi phí đầu tư Dinh Dưỡng Chủ Động\" hàng ngày và \"Chi phí Chữa Bệnh Thụ Động\" tại Bệnh viện khi về già?", "opts": ["Dinh dưỡng chủ động là khoản đầu tư nhỏ, an vui, tạo ra sức khỏe; Chữa bệnh thụ động là chi phí khổng lồ, đau đớn và mất mát.", "Chi phí chữa bệnh tại bệnh viện rẻ hơn rất nhiều so với việc ăn uống lành mạnh hàng ngày.", "Hai loại chi phí này hoàn toàn bằng nhau về cả giá trị tiền bạc lẫn tinh thần.", "Bệnh viện là nơi duy nhất có thể cung cấp dinh dưỡng cấp độ tế bào cho cơ thể."], "answer": "A", "explain": "Bài toán kinh tế thông thái! Đầu tư vài chục ngàn cho bữa ăn F1 mỗi ngày giúp bạn bảo vệ mạch máu, giữ vòng eo thon và phòng bệnh mãn tính. Nếu tiếc tiền ăn đúng, sau này một giường bệnh cấp cứu có thể tiêu tốn hàng trăm triệu cùng sự đau đớn, kiệt quệ của cả gia đình.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Chi phí thuốc men, phẫu thuật, nằm viện đắt đỏ hơn chi phí ăn uống lành mạnh gấp hàng chục lần.\n• Phương án C chưa đúng: Bệnh tật mang lại sự lo âu, mất tự do; dinh dưỡng mang lại sự an vui và chủ động.\n• Phương án D chưa đúng: Bệnh viện là nơi điều trị bệnh bằng y khoa, không phải nơi giáo dục lối sống ăn uống hàng ngày."}, {"n": 3, "q": "So sánh tác động đến vóc dáng giữa \"Giảm cân bằng phương pháp Nhịn Ăn Cấp Tốc\" và \"Giảm Mỡ bằng Giải Pháp Nhóm Dinh Dưỡng\"?", "opts": ["Nhịn ăn cấp tốc giúp giảm mỡ bụng nhanh hơn và không bao giờ bị béo lại.", "Nhịn ăn gây teo cơ, nhão da, hạ BMR và tăng mỡ lại; Nhóm Dinh Dưỡng giúp giảm mỡ thật, giữ cơ bắp, da căng và bền vững.", "Cả hai phương pháp này đều mang lại kết quả săn chắc cơ bắp giống hệt nhau.", "Nhịn ăn cấp tốc giúp làn da trẻ hóa nhanh hơn giảm mỡ tại Nhóm Dinh Dưỡng."], "answer": "B", "explain": "Bản chất sinh học! Nhịn ăn là \"tra tấn cơ thể\", vắt kiệt nước và teo mô cơ bắp khiến cỗ máy đốt Calo bị phá hủy, người hốc hác chảy xệ. Giải pháp Nhóm Dinh Dưỡng cắt Calo rỗng nhưng nạp đủ đạm sạch và 21 vi chất, giúp đốt mỡ nội tạng, săn cơ và trẻ hóa làn da.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Nhịn ăn chỉ giảm nước và cơ, khi ăn lại sẽ bị tích mỡ béo lại gấp đôi.\n• Phương án C chưa đúng: Nhịn ăn tàn phá cơ bắp, trong khi dinh dưỡng chuẩn nuôi dưỡng cơ bắp.\n• Phương án D chưa đúng: Thiếu đạm do nhịn ăn làm gãy collagen khiến da nhăn nheo, xám xịt."}, {"n": 4, "q": "So sánh mật độ dinh dưỡng giữa \"1 Quả Táo Tây tươi\" và \"1 Ly Nước Ép Táo đóng chai\":", "opts": ["Táo tươi giàu chất xơ, đường thấm chậm (GI thấp); Nước ép bỏ mất xơ, đường Fructose vọt nhanh làm tích mỡ gan.", "Nước ép táo đóng chai bổ dưỡng và giàu chất xơ hơn quả táo tươi nguyên vỏ.", "Hai lựa chọn này có tác động lên chỉ số đường huyết hoàn toàn giống nhau.", "Quả táo tươi chứa nhiều chất béo bão hòa hơn nước ép đóng chai."], "answer": "A", "explain": "So sánh bộ phanh chất xơ! Quả táo tươi chứa chất xơ nguyên vẹn giúp đường thấm từ từ vào máu. Ly nước ép bị lọc bỏ sạch xơ, tập trung lượng đường của 3–4 quả táo, nạp vào làm đường huyết tăng vọt và đường Fructose dư thừa biến thành mỡ nội tạng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Quá trình ép loại bỏ hầu hết chất xơ và làm mất nhiều vitamin nhạy cảm.\n• Phương án C chưa đúng: Chỉ số đường huyết của nước ép cao hơn rất nhiều so với táo quả tươi.\n• Phương án D chưa đúng: Táo tươi là trái cây tự nhiên, hầu như hoàn toàn không chứa chất béo bão hòa."}, {"n": 5, "q": "So sánh cảm giác sau khi ăn giữa \"Bữa ăn giàu Tinh Bột Xấu (Cơm trắng, bánh mì)\" và \"Bữa ăn giàu Đạm Sạch & Xơ (F1 + PPP)\"?", "opts": ["Tinh bột xấu giúp cơ thể tỉnh táo và tràn đầy năng lượng suốt 6 tiếng liên tục.", "Tinh bột xấu làm vọt đường rồi tụt dốc gây buồn ngủ, thèm ăn vặt; Đạm & Xơ giữ đường êm ả, tỉnh táo và no lâu 4–5 tiếng.", "Cả hai bữa ăn đều gây ra hiện tượng tụt đường huyết phản ứng lúc 10h sáng.", "Đạm và Xơ làm cho dạ dày bị nặng nề và khó tiêu hơn tinh bột xấu."], "answer": "B", "explain": "So sánh đường nhịp tim! Tinh bột xấu xả đường nhanh làm tụt đường huyết giật cục, khiến bạn buồn ngủ gật gù sau ăn và cồn cào thèm đồ ngọt. F1 + PPP giải phóng năng lượng bền bỉ, giữ đường huyết phẳng lặng, giúp tinh thần minh mẫn và no êm ái cả buổi.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Tinh bột xấu gây sương mù não và buồn ngủ sau ăn do đường huyết sụt giảm.\n• Phương án C chưa đúng: F1 + PPP có GI siêu thấp nên không gây tụt đường huyết phản ứng.\n• Phương án D chưa đúng: Đạm thực vật phân lập rất nhẹ bụng và dễ tiêu hóa hơn đạm mỡ hay tinh bột xấu."}, {"n": 6, "q": "So sánh nguồn \"Đạm Thịt Bò Đỏ\" và \"Đạm Đậu Nành Phân Lập (PPP / F1)\" về tác động đối với sức khỏe dài hạn?", "opts": ["Thịt bò chứa đạm nhưng kèm béo bão hòa, cholesterol và axit uric; Đạm PPP là đạm tinh khiết 100%, 0 béo xấu, an toàn cho gan thận.", "Thịt bò đỏ hoàn toàn không chứa chất béo bão hòa nên tốt hơn đạm đậu nành.", "Đạm đậu nành phân lập làm tăng nguy cơ mắc bệnh gút cao hơn thịt bò.", "Hai nguồn đạm này có chỉ số hấp thu và độ sạch hoàn toàn bằng nhau."], "answer": "A", "explain": "So sánh độ sạch của Đạm! 100g thịt bò nạp đạm nhưng \"khuyến mãi\" thêm béo bão hòa gây mỡ máu và purin gây gút. Đạm PPP chiết xuất từ đậu nành đã tách bỏ chất béo xấu và tạp chất, đạt chỉ số hấp thu tuyệt đối PDCAAS = 1, giúp nuôi cơ bắp mà không gây gánh nặng cho thận.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thịt bò đỏ chứa lượng lớn chất béo bão hòa và cholesterol bẩn.\n• Phương án C chưa đúng: Thịt bò đỏ mới là nguyên nhân chính gây tăng axit uric và bệnh gút.\n• Phương án D chưa đúng: Đạm đậu nành phân lập có chỉ số hấp thu cao hơn và sạch hơn đạm thịt bò thô."}, {"n": 7, "q": "So sánh thói quen \"Tự giảm cân một mình tại nhà\" và \"Tham gia sinh hoạt đều đặn tại Nhóm Dinh Dưỡng\"?", "opts": ["Tự giảm cân tại nhà dễ thành công hơn vì không bị ai quản lý.", "Ở nhà dễ bỏ cuộc do thiếu kiến thức và kỷ luật; Nhóm Dinh Dưỡng có HLV đồng hành Daily, môi trường năng lượng và 21 bài học.", "Cả hai môi trường đều cung cấp lượng kiến thức và kết quả giống hệt nhau.", "Sinh hoạt tại Nhóm Dinh Dưỡng chỉ dành cho những người không biết tự nấu ăn."], "answer": "B", "explain": "Sức mạnh của Môi trường & HLV! Tự giảm cân ở nhà dễ bị cám dỗ bởi đồ ăn, thiếu kiến thức chọn thực phẩm và nhanh nản lòng. Tại Nhóm Dinh Dưỡng, bạn có HLV theo sát chỉ số hàng ngày, có cộng đồng tiếp năng lượng an vui và được học bài học thay đổi tư duy trọn đời.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Giảm cân một mình tỷ lệ thất bại và bỏ cuộc lên tới 90% do thiếu kỷ luật.\n• Phương án C chưa đúng: Môi trường Nhóm Dinh Dưỡng mang lại động lực và sự uốn nắn chuẩn mực mà ở nhà không có.\n• Phương án D chưa đúng: Nhóm Dinh Dưỡng là nơi giáo dục lối sống và chăm sóc sức khỏe cho tất cả mọi người."}, {"n": 8, "q": "So sánh giữa \"Mỡ Dưới Da\" và \"Mỡ Nội Tạng\" về mức độ ảnh hưởng đến tính mạng con người?", "opts": ["Mỡ dưới da chủ yếu gây mất thẩm mỹ; Mỡ nội tạng tiết ra chất gây viêm mạn tính, gây xơ vữa mạch, tiểu đường và đột quỵ.", "Mỡ dưới da nguy hiểm cho tính mạng gấp 10 lần mỡ nội tạng.", "Hai loại mỡ này có độc tính và tác hại sinh học hoàn toàn giống hệt nhau.", "Mỡ nội tạng dễ dàng loại bỏ bằng các phương pháp phẫu thuật hút mỡ thẩm mỹ."], "answer": "A", "explain": "So sánh sát thủ ngầm! Mỡ dưới da (ở bắp tay, đùi) chỉ làm bạn mặc đồ không đẹp. Mỡ nội tạng (quấn chặt tim, gan, ruột) là \"ổ độc tố\" gây ra hàng loạt bệnh mãn tính không lây nguy hiểm. Phẫu thuật hút mỡ chỉ hút được mỡ dưới da, KHÔNG THỂ hút được mỡ nội tạng!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mỡ dưới da ít gây nguy hiểm cho tính mạng hơn mỡ nội tạng rất nhiều.\n• Phương án C chưa đúng: Mỡ nội tạng tàn phá sức khỏe chuyển hóa nghiêm trọng hơn mỡ dưới da.\n• Phương án D chưa đúng: Mỡ nội tạng nằm sâu trong khoang bụng quanh tạng phủ, không thể hút bằng thẩm mỹ."}, {"n": 9, "q": "So sánh việc bổ sung \"Chất Béo Xấu (Trans Fat / Béo bão hòa)\" và \"Chất Béo Tốt (Omega-3 Herbalifeline)\" đối với lòng mạch máu?", "opts": ["Chất béo xấu giúp làm sạch lòng mạch, còn Omega-3 làm dính bết mạch máu.", "Chất béo xấu làm xơ vữa, vón quánh lòng mạch; Omega-3 dọn dẹp mỡ bẩn, làm dẻo dai thành mạch và bảo vệ tim.", "Cả hai loại chất béo này đều làm tăng hàm lượng mỡ máu xấu như nhau.", "Chất béo xấu giúp tăng cường thị lực và trí nhớ tốt hơn Omega-3."], "answer": "B", "explain": "So sánh Rác thải vs Chổi quét! Chất béo xấu (đồ chiên, mỡ heo) đóng mảng xơ vữa làm hẹp lòng mạch. Omega-3 (Herbalifeline) giống như \"chiếc chổi quét\" giúp bóc tách mỡ bẩn, giảm triglyceride, giúp máu lưu thông êm ái và ngăn ngừa rủi ro đột quỵ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Trái ngược hoàn toàn với bản chất sinh học của hai loại chất béo.\n• Phương án C chưa đúng: Béo xấu làm tăng mỡ máu xấu, còn Omega-3 giúp làm giảm mỡ máu xấu.\n• Phương án D chưa đúng: Omega-3 nuôi dưỡng tế bào não và mắt, trong khi béo xấu tàn phá vi mạch máu não/mắt."}, {"n": 10, "q": "So sánh giữa thói quen \"Uống Nước Đá Lạnh\" và \"Uống Nước Lọc Ấm\" đối với hệ tiêu hóa và việc giảm mỡ bụng?", "opts": ["Nước đá làm hạ thân nhiệt dạ dày, săn co mạch máu, tích mỡ bụng; Nước ấm giãn mạch, làm sạch vi nhung mao và hỗ trợ tiêu mỡ.", "Uống nước đá lạnh giúp đốt Calo và giảm mỡ bụng nhanh gấp 3 lần nước ấm.", "Hai loại nước này có tác động giống hệt nhau đối với tốc độ chuyển hóa.", "Nước ấm làm cho đường ruột bị nhiễm khuẩn nhanh hơn nước đá."], "answer": "A", "explain": "So sánh nhiệt độ nước! Uống nước đá làm dội dòng lạnh vào dạ dày, khiến cơ thể phải tự tích tụ lớp mỡ vùng bụng để sưởi ấm ổ tạng và làm đông quánh dầu mỡ thức ăn. Nước ấm giúp xoa dịu niêm mạc, tráng rửa mảng bám vi nhung mao và giúp chuyển hóa mỡ mượt mà.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nước đá không giúp giảm mỡ bụng mà ngược lại còn làm tích mỡ bụng để bảo vệ ổ tạng.\n• Phương án C chưa đúng: Nước ấm hỗ trợ tuần hoạt và tiêu hóa tốt hơn nước đá rất nhiều.\n• Phương án D chưa đúng: Nước ấm đun sôi sạch sẽ, giúp đường ruột khỏe mạnh hơn."}, {"n": 11, "q": "So sánh tác động của \"Ăn Trái Cây Nguyên Quả GI Thấp\" và \"Ăn Bánh Kẹo Ngọt\" khi cơ thể lên cơn thèm ăn vặt?", "opts": ["Bánh kẹo ngọt tốt hơn vì cung cấp năng lượng nhanh mà không chứa Calo.", "Trái cây tươi cung cấp xơ và vi chất, đường thấm chậm; Bánh kẹo chứa Calo rỗng, đường vọt cao làm bật công tắc tích mỡ.", "Cả hai món ăn này đều làm đường huyết tăng chậm và an toàn như nhau.", "Trái cây tươi làm gia tăng hormone stress Cortisol nhiều hơn bánh kẹo."], "answer": "B", "explain": "So sánh Calo rỗng vs Calo vi chất! Bánh kẹo ngọt chứa Calo rỗng và đường tinh luyện, ăn vào làm vọt Insulin khóa chặt kho mỡ. Trái cây tươi GI thấp (táo, ổi, thanh long) đong đầy chất xơ, vitamin, giúp giải tỏa thèm ngọt mà vẫn giữ đường huyết an toàn.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Bánh kẹo ngọt chứa rất nhiều Calo rỗng và đường xấu.\n• Phương án C chưa đúng: Bánh kẹo ngọt có GI rất cao gây vọt đường huyết nhanh, không an toàn.\n• Phương án D chưa đúng: Bánh kẹo ngọt làm xáo trộn đường huyết mới gây tăng hormone stress."}, {"n": 12, "q": "So sánh tư duy \"Ăn cho No Cái Bụng\" và tư duy \"Nạp Đúng Nguyên Liệu Cho Tế Bào\"?", "opts": ["Ăn no bụng tập trung vào thể tích/Calo rỗng; Nạp cho tế bào chọn lọc vi chất tinh sạch, ít Calo, nuôi cơ thể khỏe từ gốc.", "Ăn no cái bụng giúp trẻ hóa tế bào nhanh hơn nạp dinh dưỡng tế bào.", "Hai tư duy này hoàn toàn giống nhau về mục đích nuôi dưỡng cơ thể.", "Nạp cho tế bào bắt buộc phải ăn thật nhiều thức ăn thô chiên xào."], "answer": "A", "explain": "So sánh Thể tích vs Chất lượng! Ăn no bụng là thói quen ăn theo bản năng, nhồi nhét cơm thịt chiên xào làm dạ dày quá tải nhưng tế bào vẫn đói vi chất. Nạp cho tế bào là tư duy thông thái: chọn Bữa ăn F1 ít Calo nhưng đong đầy 21 vi chất để nuôi dưỡng từng tế bào khỏe mạnh.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Ăn no bụng Calo rỗng làm dạ dày vất vả tiêu hóa và mau lão hóa hơn.\n• Phương án C chưa đúng: Một bên ăn theo cảm giác sướng miệng, một bên ăn theo khoa học nuôi dưỡng.\n• Phương án D chưa đúng: Nạp cho tế bào ưu tiên dinh dưỡng tinh sạch, hấp thu nhanh, 0 béo xấu."}, {"n": 13, "q": "So sánh giữa \"Ngũ Cốc Nguyên Cám (Gạo lứt, yến mạch)\" và \"Ngũ Cốc Tinh Chế (Gạo trắng, bánh mì trắng)\"?", "opts": ["Ngũ cốc tinh chế tốt hơn vì đã được loại bỏ lớp vỏ cám sần sùi.", "Nguyên cám giữ lại vỏ xơ & vi chất (GI thấp, no lâu); Tinh chế bị chà sạch xơ, chỉ còn tinh bột nhanh (GI cao, mau đói).", "Ngũ cốc nguyên cám chứa hàm lượng chất béo xấu cao gấp 10 lần ngũ cốc tinh chế.", "Cả hai loại ngũ cốc này có chỉ số đường huyết hoàn toàn bằng nhau."], "answer": "B", "explain": "So sánh Giá trị của Lớp vỏ cám! Ngũ cốc nguyên cám giữ lại lớp vỏ cám giàu chất xơ và vitamin B, đóng vai trò như bộ phanh hãm tốc độ xả đường. Ngũ cốc tinh chế bị chà xát mất vỏ, tan nhanh như đường trong máu, kích hoạt hormone tích mỡ bụng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Lớp vỏ cám bị xát bỏ chính là phần giàu chất xơ và vi chất nhất.\n• Phương án C chưa đúng: Ngũ cốc nguyên cám giàu xơ và khoáng chất, không chứa chất béo xấu.\n• Phương án D chưa đúng: Chỉ số GI của gạo lứt/yến mạch (thấp/trung bình) khác xa gạo trắng/bánh mì trắng (cao)."}, {"n": 14, "q": "So sánh hiệu quả vận động giữa \"Chạy bộ 60 phút nhưng ăn uống sai\" và \"Tập nhẹ 30 phút nhưng ăn đúng Dinh Dưỡng chuẩn\"?", "opts": ["Ăn đúng dinh dưỡng chiếm 80% quyết định vóc dáng; tập điên cuồng mà ăn sai vẫn bị béo bụng do dư Calo và tích mỡ.", "Chạy bộ 60 phút giúp giảm mỡ bụng tốt hơn ăn đúng dinh dưỡng rất nhiều.", "Vận động quyết định 100% kết quả vóc dáng, dinh dưỡng không quan trọng.", "Hai trường hợp này sẽ cho ra kết quả giảm mỡ bụng hoàn toàn bằng nhau."], "answer": "A", "explain": "Quy tắc 80/20 thực chiến! Chạy 60 phút chỉ đốt ~300 Calo, nhưng sau đó ăn 1 bát phở hay ly trà sữa (500 Calo) thì vẫn dư 200 Calo và tích mỡ. Ăn đúng chuẩn F1 + PPP kiểm soát chuẩn Calo đầu vào kết hợp tập nhẹ 30 phút sẽ cho vóc dáng thon gọn thần tốc.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập nhiều mà nạp dư Calo và đường cao vẫn bị béo bụng như thường.\n• Phương án C chưa đúng: Dinh dưỡng mới là gốc rễ quyết định 80% vóc dáng.\n• Phương án D chưa đúng: Người ăn đúng dinh dưỡng sẽ có vóc dáng và sức khỏe vượt trội hơn hẳn."}, {"n": 15, "q": "So sánh kết quả làn da giữa \"Người giảm cân cắt đạm, nhịn ăn\" và \"Hội viên giảm mỡ nạp đủ Đạm Sạch (F1 + PPP)\"?", "opts": ["Nhịn ăn giúp làn da căng bóng và giảm nếp nhăn nhanh hơn nạp đạm.", "Nhịn ăn làm sụt giảm Collagen khiến da nhăn nheo, chảy xệ; Nạp đủ đạm sạch giúp tái tạo Collagen, da căng mịn, săn chắc.", "Cả hai phương pháp này đều làm cho làn da bị sạm xịt và nổi mụn như nhau.", "Đạm sạch chỉ nuôi cơ bắp, hoàn toàn không có tác dụng gì đối với làn da."], "answer": "B", "explain": "So sánh Collagen dưới da! Collagen thực chất là một chuỗi đạm. Nhịn ăn cắt đạm khiến cơ thể rút đạm từ da và cơ ra dùng, làm da mặt chùng nhão, nhăn nheo. Nạp đủ đạm sạch PPP + F1 cung cấp nguyên liệu đúc Collagen, giúp da căng hồng rạng rỡ sau khi thu nhỏ vòng eo.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Nhịn ăn làm tàn phá cấu trúc Collagen khiến da hốc hác già nua.\n• Phương án C chưa đúng: Dinh dưỡng chuẩn nạp đủ đạm và vi chất giúp trẻ hóa da rõ rệt.\n• Phương án D chưa đúng: Đạm sạch là nguyên liệu cốt lõi cấu tạo nên độ đàn hồi của làn da."}, {"n": 16, "q": "So sánh về \"Độ an toàn cho sức khỏe\" giữa sản phẩm Herbalifeline (Omega-3) và các loại Dầu cá thô giá rẻ trôi nổi?", "opts": ["Herbalifeline lọc bóc tách hoàn toàn thủy ngân/kim loại nặng, có tinh dầu thảo mộc; Dầu cá thô dễ nhiễm độc chì, thủy ngân.", "Dầu cá thô trôi nổi an toàn hơn vì không qua công nghệ chế biến.", "Hai loại dầu cá này có độ tinh khiết và chất lượng hoàn toàn bằng nhau.", "Herbalifeline chứa nhiều chất béo bão hòa hơn dầu cá thô."], "answer": "A", "explain": "So sánh Công nghệ bóc tách độc tố! Dầu cá thô chiết xuất từ cá biển nông dễ nhiễm độc chì, thủy ngân và kim loại nặng do ô nhiễm đại dương. Herbalifeline chiết xuất từ cá biển sâu tinh khiết, áp dụng công nghệ lọc độc tố đỉnh cao, an toàn tuyệt đối cho tim mạch và não bộ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dầu cá thô không qua lọc chì/thủy ngân rất nguy hiểm cho gan và thận.\n• Phương án C chưa đúng: Độ tinh khiết của Herbalifeline đạt tiêu chuẩn kiểm nghiệm nghiêm ngặt toàn cầu.\n• Phương án D chưa đúng: Herbalifeline cung cấp Omega-3 tinh sạch, 0 chứa chất béo bão hòa xấu."}, {"n": 17, "q": "So sánh thói quen \"Ăn Dồn Một Bữa Thật To Trong Ngày\" và \"Chia Nhỏ Bữa Ăn Kết Hợp Bữa Phụ Lành Mạnh (F1/PPP)\"?", "opts": ["Ăn dồn 1 bữa tốt hơn vì giúp dạ dày được nghỉ ngơi 23 tiếng.", "Ăn dồn làm quá tải tuyến tụy, vọt đường, tích mỡ; Chia nhỏ giúp đường huyết phẳng lặng, đốt Calo liên tục và giữ cơ.", "Hai cách ăn này có tác động lên hormone Insulin hoàn toàn như nhau.", "Chia nhỏ bữa ăn làm cho cỗ máy đốt Calo bị suy yếu đi."], "answer": "B", "explain": "So sánh áp lực chuyển hóa! Ăn dồn 1 bữa to nạp ngập Calo làm tuyến tụy quá tải xả hormone tích mỡ dữ dội, thời gian còn lại tế bào bị bỏ đói gây teo cơ. Chia nhỏ bữa ăn giúp giữ dòng dinh dưỡng đều đặn, đường huyết phẳng lặng và giữ cỗ máy đốt Calo chạy mượt mà.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Ăn dồn 1 bữa to làm tàn phá dạ dày và tuyến tụy do quá tải đột ngột.\n• Phương án C chưa đúng: Ăn dồn gây cú sốc vọt Insulin, còn chia nhỏ giữ Insulin ở mức thấp an toàn.\n• Phương án D chưa đúng: Chia nhỏ bữa ăn đúng cách giúp nâng cao tốc độ chuyển hóa tự nhiên."}, {"n": 18, "q": "So sánh giữa \"Việc Đọc Nhãn Dinh Dưỡng Mặt Sau Bao Bì\" và \"Chỉ Tin Vào Lời Quảng Cáo Mặt Trước\"?", "opts": ["Mặt trước là lời tiếp thị hoa mỹ (bẫy ăn kiêng); Mặt sau là con số SỰ THẬT về Calo, Đường ngầm, Béo xấu và Natri.", "Mặt trước bao bì luôn cung cấp thông tin chính xác 100% hơn mặt sau.", "Hai mặt bao bì có giá trị thông tin hoàn toàn giống hệt nhau.", "Đọc nhãn mặt sau chỉ làm tốn thời gian, không giúp ích gì cho giảm mỡ."], "answer": "A", "explain": "So sánh Quảng cáo vs Sự thật! Mặt trước bao bì ghi \"Bánh yến mạch ăn kiêng\", \"0% chất béo\" chỉ là chiêu trò tiếp thị. Lật mặt sau đọc bảng dinh dưỡng mới thấy Calo cao ngất, đường ngầm đứng đầu bảng. Người thông thái luôn nhìn con số sự thật ở mặt sau!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mặt trước là hình ảnh và từ khóa quảng cáo thu hút mua hàng.\n• Phương án C chưa đúng: Mặt sau mới là bảng kiểm nghiệm dinh dưỡng minh bạch theo quy định pháp luật.\n• Phương án D chưa đúng: Lật mặt sau đọc nhãn giúp bạn bóc trần bẫy Calo rỗng và bảo vệ sức khỏe."}, {"n": 19, "q": "So sánh tâm thái giữa \"Người Coi Việc Ăn Đúng Là Sự Ép Buộc Khổ Sở\" và \"Hội Viên Coi Ăn Đúng Là Sự Yêu Thương Bản Thân\"?", "opts": ["Coi là ép buộc sẽ giúp duy trì kết quả giảm mỡ bền vững trọn đời.", "Ép buộc gây căng thẳng, dễ bỏ cuộc và béo lại; Yêu thương bản thân mang lại sự an vui, biến ăn đúng thành LỐI SỐNG tự nhiên.", "Hai tâm thái này không ảnh hưởng gì đến kết quả vóc dáng dài hạn.", "Tâm thái khổ sở giúp cơ thể tiết ra nhiều hormone Endorphin hơn."], "answer": "B", "explain": "So sánh Khổ hạnh vs An vui! Coi ăn kiêng là ép buộc sẽ khiến bạn luôn thèm thuồng, căng thẳng (vọt Cortisol tích mỡ) và rình rập ăn bù khi dừng chương trình. Coi ly F1 và đĩa ăn lành mạnh là sự yêu thương tế bào sẽ giúp bạn vui vẻ thực hành mỗi ngày, giữ dáng thon bền vững trọn đời!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Ép buộc khổ sở chỉ giữ được ngắn hạn, sau đó sẽ bỏ cuộc và béo lại sồ sề.\n• Phương án C chưa đúng: Tâm thái an vui quyết định 90% sự bền vững của lối sống lành mạnh.\n• Phương án D chưa đúng: Khổ sở làm vọt hormone stress Cortisol gây hại, không tiết Endorphin."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 10 \"HÃY SO SÁNH THỬ\" tại Nhóm Dinh Dưỡng là gì?", "opts": ["\"HÃY THÔNG THÁI SO SÁNH ĐỂ CHỌN GIÁ TRỊ THỰC SỰ: Thay thế thực phẩm Calo rỗng bằng Dinh dưỡng tế bào F1 là quyết định đầu tư thông thái nhất cho vóc dáng và sức khỏe An Vui trọn đời!\"", "So sánh để thấy rằng ăn món gì cũng như nhau, không cần phải thay đổi thói quen.", "Chỉ cần chọn món ăn rẻ tiền nhất, không cần quan tâm đến giá trị vi chất.", "So sánh chỉ để tích lũy lý thuyết, không cần áp dụng vào thực tế hàng ngày."], "answer": "A", "explain": "\"So sánh để thấu hiểu – Thấu hiểu để làm chủ!\" Khi đặt lên bàn cân so sánh giữa Calo rỗng & Calo vi chất, giữa Chữa bệnh & Chăm sóc chủ động, bạn sẽ nhận ra ly F1 mỗi sáng chính là món quà kỳ diệu nhất để bảo vệ bản thân và gia đình trọn đời!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mỗi thực phẩm có giá trị dinh dưỡng trái ngược, không thể coi như nhau.\n• Phương án C chưa đúng: Món ăn rẻ tiền Calo rỗng sẽ tốn chi phí chữa bệnh rất đắt về sau.\n• Phương án D chưa đúng: So sánh để thay đổi hành vi đi chợ và ăn uống hàng ngày mới mang lại kết quả vóc dáng."}];
const TKP_LESSON=10;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI SO SÁNH<br>BÓC TRẦN SỰ THẬT</h1><div class="subtitle">LÀM CHỦ LỰA CHỌN – KIẾN TẠO SỨC KHỎE</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
</body></html>
