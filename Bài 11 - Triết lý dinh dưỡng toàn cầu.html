<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Triết lý dinh dưỡng toàn cầu | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Công thức cơ cấu năng lượng cân bằng chuẩn xác nhất trong \"Triết lý Dinh dưỡng Toàn cầu\" (Herbalife Global Nutrition Philosophy) là gì?", "opts": ["70% Tinh bột + 20% Đạm + 10% Chất béo.", "40% Carbohydrate (tinh bột tốt) + 30% Protein (đạm sạch) + 30% Chất béo tốt (ưu tiên Omega-3).", "50% Đạm + 50% Chất béo (cắt bỏ 100% tinh bột).", "80% Chất béo bão hòa + 10% Đạm + 10% Tinh bột xát trắng."], "answer": "B", "explain": "Triết lý Dinh dưỡng Toàn cầu được xây dựng bởi các nhà khoa học hàng đầu thế giới dựa trên sự cân bằng hoàn hảo: 40% Tinh bột tốt (GI thấp, giàu xơ) để nuôi não và giữ năng lượng; 30% Đạm sạch để bảo tồn cơ bắp và BMR; 30% Chất béo tốt (nhất là Omega-3) để bảo vệ tim mạch và chống viêm.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: 70% Tinh bột là tỷ lệ quá cao của chế độ ăn truyền thống dễ gây vọt đường huyết và béo bụng.\nPhương án C chưa đúng: Cắt bỏ 100% tinh bột là chế độ cực đoan gây tổn thương não bộ và mất cân bằng chuyển hóa.\nPhương án D chưa đúng: 80% Chất béo bão hòa sẽ tàn phá hệ tim mạch và gây xơ vữa động mạch nghiêm trọng."}, {"n": 2, "q": "Lượng \"Chất Xơ\" khuyến nghị tối thiểu mỗi ngày trong Triết lý Dinh dưỡng Toàn cầu để bảo vệ hệ tiêu hóa là bao nhiêu?", "opts": ["Từ 1g đến 5g mỗi ngày.", "Tối thiểu từ 25g đến 30g chất xơ mỗi ngày (kết hợp xơ hòa tan và xơ không hòa tan).", "Từ 100g đến 200g chất xơ mỗi ngày.", "Hoàn toàn không cần chất xơ nếu đã uống đủ nước lọc."], "answer": "B", "explain": "Con số chuẩn khoa học! Cơ thể cần 25g–30g chất xơ/ngày để đóng vai trò như \"chổi quét\" làm sạch mảng bám vi nhung mao ruột, nuôi dưỡng lợi khuẩn microbiom, làm chậm hấp thu đường và loại bỏ cholesterol xấu ra ngoài.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Mức 1g–5g là quá nghèo nghèo, dễ gây táo bón, tích độc tố và vọt đường huyết.\nPhương án C chưa đúng: Nạp 100g–200g xơ quá mức gây cản trở hấp thu vi khoáng chất và gây trướng bụng.\nPhương án D chưa đúng: Nước lọc không thể thay thế cấu trúc xơ quét dọn cơ học trong đường ruột."}, {"n": 3, "q": "Khái niệm \"Nạn đói tiềm ẩn\" (Hidden Hunger) được Triết lý Dinh dưỡng Toàn cầu cảnh báo ở con người hiện đại là gì?", "opts": ["Hiện tượng dạ dày bị nhịn đói cồn cào trong 3 ngày liên tục.", "Hiện tượng cơ thể bị THỪA CALO RỖNG (mỡ, đường) nhưng lại BỊ THIẾU HỤT MẠN TÍNH VI CHẤT (vitamin, khoáng chất).", "Hiện tượng không có đủ thực phẩm thô để ăn hàng ngày.", "Hiện tượng cơ thể bị thiếu hụt nghiêm trọng chất béo bão hòa."], "answer": "B", "explain": "\"Thừa Calo - Thiếu Vi Chất!\" Do thói quen ăn đồ siêu chế biến, chiên xào, nước ngọt, con người nạp quá nhiều Calo rỗng khiến béo phì, nhưng tế bào lại \"kêu cứu\" vì thiếu trầm trọng 21 vitamin & khoáng chất thiết yếu để vận hành chuyển hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nạn đói tiềm ẩn diễn ra ngay cả khi bụng đang no căng thức ăn.\nPhương án C chưa đúng: Thực phẩm thô hiện nay rất sẵn có nhưng bị rỗng vi chất do đất đai bạc màu và chế biến nhiệt.\nPhương án D chưa đúng: Cơ thể hiện đại đang dư thừa chất béo bão hòa chứ không bị thiếu."}, {"n": 4, "q": "Sự kết hợp đỉnh cao giữa \"Dinh Dưỡng\" và \"Vận Động\" theo Triết lý Toàn cầu được đúc kết qua công thức nào?", "opts": ["100% Vận động + 0% Dinh dưỡng.", "80% Dinh Dưỡng + 20% Vận Động = 100% Lối Sống Lành Mạnh & Sức Khỏe An Vui.", "50% Vận động + 50% Uống thuốc giảm cân.", "90% Nhịn ăn + 10% Thức khuya."], "answer": "B", "explain": "\"Đôi cánh của sức khỏe!\" Dinh dưỡng chiếm 80% quyết định nguyên liệu nuôi tế bào, kiểm soát Calo và vóc dáng. Vận động chiếm 20% đóng vai trò chất xúc tác giúp dẻo dai khớp, tăng tuần hoàn và kích thích cơ bắp phát triển.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Coi trọng vận động 100% mà ăn sai vẫn bị béo bụng và kiệt sức.\nPhương án C chưa đúng: Thuốc giảm cân tàn phá sức khỏe, không nằm trong triết lý sống lành mạnh.\nPhương án D chưa đúng: Nhịn ăn thức khuya tàn phá tủy xương và hệ thần kinh nghiêm trọng."}, {"n": 5, "q": "Vai trò của \"Dưỡng chất thực vật\" (Phytonutrients) đại diện qua 5 màu sắc rau củ quả trong Triết lý Dinh dưỡng Toàn cầu?", "opts": ["Cung cấp các hoạt chất chống oxy hóa mạnh mẽ, bảo vệ tế bào khỏi gốc tự do, tăng đề kháng và chống lão hóa.", "Dưỡng chất thực vật chỉ có tác dụng tạo màu sắc đẹp mắt cho đĩa ăn, không có giá trị sinh học.", "Giúp thay thế hoàn toàn nguồn đạm thực vật trong bữa ăn.", "Làm tăng hàm lượng chất béo bão hòa trong cơ thể."], "answer": "A", "explain": "\"Đa dạng màu sắc - Bảo vệ tế bào!\" Đĩa ăn hội tụ 5 màu (Đỏ, Xanh, Tím, Cam/Vàng, Trắng) cung cấp đầy đủ các Phytonutrients quý giá, giúp vô hiệu hóa các gốc tự do gây hại, bảo vệ ADN tế bào và phòng ngừa bệnh mãn tính.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Màu sắc thực vật chứa các chất chống oxy hóa cực kỳ mạnh mẽ cho cơ thể.\nPhương án C chưa đúng: Dưỡng chất thực vật bảo vệ tế bào, không thay thế vai trò cấu tạo của chất đạm.\nPhương án D chưa đúng: Thực phẩm rau củ quả màu sắc không chứa chất béo bão hòa xấu."}, {"n": 6, "q": "Tại sao \"Dinh dưỡng Cá nhân hóa\" (Personalized Nutrition) lại là trụ cột cốt lõi của Triết lý Toàn cầu?", "opts": ["Vì mỗi cơ thể có Cân nặng, Chiều cao, Tỷ lệ Cơ Mỡ, Mức độ vận động và Mục tiêu hoàn toàn khác nhau.", "Vì tất cả mọi người trên thế giới đều có nhu cầu Calo và Đạm giống hệt nhau.", "Vì dinh dưỡng cá nhân hóa giúp bắt buộc mọi người phải ăn chay 100%.", "Vì cá nhân hóa giúp triệt tiêu hoàn toàn nhu cầu uống nước lọc."], "answer": "A", "explain": "\"Không có một chiếc áo cào bằng cho tất cả mọi người!\" Một vận động viên 80kg cần lượng đạm và Calo hoàn toàn khác một nữ văn phòng 45kg. Dinh dưỡng cá nhân hóa thiết kế đúng Con số Calo kỳ diệu và Con số đạm riêng biệt giúp mỗi người đạt kết quả tối ưu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Cào bằng nhu cầu dinh dưỡng là sai lầm gây teo cơ hoặc dư Calo tăng mỡ.\nPhương án C chưa đúng: Triết lý toàn cầu linh hoạt cho cả người ăn chay lẫn ăn mặn.\nPhương án D chưa đúng: Nước lọc là nhu cầu thiết yếu bắt buộc cho mọi cá nhân."}, {"n": 7, "q": "Ý nghĩa sinh học của \"Dinh Dưỡng Cấp Độ Tế Bào\" (Cellular Nutrition) trong chương trình Herbalife?", "opts": ["Là việc đưa thức ăn nhồi căng đầy dạ dày để dạ dày không bị rỗng.", "Làm sạch vi nhung mao ruột, phục hồi tổn thương hấp thu, rồi nuôi dưỡng từng TẾ BÀO bằng vi chất tinh sạch.", "Là việc tiêm trực tiếp vi chất vào trong tế bào máu.", "Là việc bắt tế bào phải tự phân hủy mỡ mà không cần nạp đạm."], "answer": "B", "explain": "\"Làm sạch trước - Nuôi dưỡng sau!\" Muốn tế bào khỏe thì đường ruột phải sạch. Lô hội thảo mộc giúp tráng rửa mảng bám vi nhung mao; sau đó Bữa ăn F1 + F2 cung cấp 21 vi chất phân tử nhỏ được vi nhung mao hấp thu 100% đi thẳng vào nuôi tế bào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Ăn no căng dạ dày Calo rỗng chỉ làm quá tải tiêu hóa, không nuôi được tế bào.\nPhương án C chưa đúng: Dinh dưỡng tế bào hấp thu qua đường tiêu hóa tự nhiên đã được làm sạch.\nPhương án D chưa đúng: Tế bào bắt buộc phải có đạm sạch để duy trì cấu trúc và sự sống."}, {"n": 8, "q": "Tầm quan trọng của \"Giấc Ngủ & Sự Thư Giãn\" trong tổng thể Triết lý Dinh dưỡng Toàn cầu?", "opts": ["Giúp xua tan Cortisol (hormone stress tích mỡ), giúp tủy xương tái tạo máu, chữa lành tế bào và cân bằng nội tiết.", "Giấc ngủ chỉ để làm tốn thời gian, không ảnh hưởng gì đến vóc dáng.", "Thức khuya giúp cỗ máy đốt Calo hoạt động mạnh hơn nên giúp giảm mỡ bụng.", "Giấc ngủ làm triệt tiêu toàn bộ khối lượng cơ bắp chân tay."], "answer": "A", "explain": "Giấc ngủ sâu từ 23h00–05h00 là \"khung giờ vàng bảo dưỡng cơ thể\"! Lúc này tủy xương tạo máu, gan lọc độc tố và tế bào phục hồi. Ngủ đủ 7–8 tiếng giúp hạ hormone stress Cortisol, ngăn ngừa béo bụng và giúp tinh thần an vui.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thiếu ngủ tàn phá chuyển hóa và khiến cơ thể tích mỡ bụng dữ dội.\nPhương án C chưa đúng: Thức khuya làm vọt Cortisol gây thèm ăn đêm và tăng mỡ nội tạng.\nPhương án D chưa đúng: Giấc ngủ giúp tiết hormone HGH phục hồi và phát triển cơ bắp."}, {"n": 9, "q": "Sự hỗ trợ mạnh mẽ từ \"Ban Cố Vấn Dinh Dưỡng Toàn Cầu\" (Nutrition Advisory Board - NAB) mang lại giá trị gì?", "opts": ["Đảm bảo mọi sản phẩm và triết lý đều dựa trên Khoa học đỉnh cao, kiểm nghiệm lâm sàng bởi hơn 300 Giáo sư, Bác sĩ hàng đầu.", "Để quảng cáo sản phẩm bán chạy hơn mà không cần nghiên cứu.", "Ban cố vấn chỉ có nhiệm vụ thiết kế bao bì cho sản phẩm.", "Ban cố vấn bắt buộc tất cả người dùng phải trở thành Bác sĩ."], "answer": "A", "explain": "Nền tảng Khoa học vững chắc! Herbalife sở hữu Ban Cố vấn Dinh dưỡng tụ hội hơn 300 nhà khoa học, Bác sĩ, Giáo sư Y khoa uy tín thế giới (như GS. David Heber, TS. Louis Ignarro đạt giải Nobel Y học), đảm bảo từng ly F1 đạt độ an toàn và hiệu quả tối ưu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sản phẩm trải qua hàng ngàn kiểm nghiệm lâm sàng nghiêm ngặt toàn cầu.\nPhương án C chưa đúng: Ban cố vấn chịu trách nhiệm nghiên cứu công thức sinh học và phát triển khoa học.\nPhương án D chưa đúng: Ban cố vấn tạo ra giải pháp dinh dưỡng đơn giản cho mọi người dân tự chăm sóc sức khỏe."}, {"n": 10, "q": "Tại sao \"Sự Bổ Sung Dinh Dưỡng\" (Dietary Supplementation) lại trở thành xu hướng BẮT BUỘC trong thời đại ngày nay?", "opts": ["Vì thực phẩm thô bị rỗng vi chất do đất bạc màu, bảo quản lâu và bị thất thoát qua đun nấu nhiệt độ cao.", "Vì thực phẩm thô hiện nay chứa quá nhiều chất xơ gây cản trở tiêu hóa.", "Vì bổ sung dinh dưỡng giúp con người không cần phải uống nước lọc nữa.", "Vì thực phẩm bổ sung có khả năng biến mỡ thừa thành xương lập tức."], "answer": "A", "explain": "Khoảng trống dinh dưỡng! Rau củ hiện nay trồng canh tác công nghiệp nên hàm lượng vitamin giảm 50–80% so với 50 năm trước. Đun nấu chiên xào lại làm phân hủy hết vitamin nhạy cảm. Bổ sung F1, F2 là giải pháp thông thái để lấp đầy khoảng trống vi chất thiếu hụt.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thực phẩm thô hiện đại đang bị xát trắng mất bớt chất xơ.\nPhương án C chưa đúng: Bổ sung dinh dưỡng vẫn bắt buộc phải đi kèm uống đủ nước ấm.\nPhương án D chưa đúng: Dinh dưỡng bổ sung hỗ trợ chuyển hóa lành mạnh, không biến mỡ thành xương."}, {"n": 11, "q": "Khái niệm \"Mật Độ Dinh Dưỡng\" (Nutrient Density) trong việc lựa chọn thực phẩm theo Triết lý Toàn cầu?", "opts": ["Ưu tiên thực phẩm chứa HÀM LƯỢNG VI CHẤT CAO NĂM TRONG LƯỢNG CALO THẤP (như Bữa ăn F1, rau xanh, đạm sạch).", "Ưu tiên thực phẩm có lượng Calo cao thật nhiều mỡ động vật.", "Chọn thực phẩm có thể tích thật to nhưng hoàn toàn không có vi chất.", "Mật độ dinh dưỡng chỉ áp dụng cho các loại nước ngọt có ga."], "answer": "A", "explain": "Chỉ số Mật độ Dinh dưỡng = Dinh dưỡng / Calo. Thực phẩm lý tưởng (như F1) có mật độ dinh dưỡng siêu cao (21 vi chất, đạm, xơ) nhưng Calo cực thấp (90 Calo). Ngược lại, trà sữa hay quẩy chiên có mật độ dinh dưỡng gần bằng 0 nhưng Calo cao ngất ngưởng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thực phẩm Calo cao mỡ động vật là nhóm Calo rỗng, mật độ dinh dưỡng rất thấp.\nPhương án C chưa đúng: Thể tích to Calo rỗng chỉ làm nặng bụng chứ không nuôi được tế bào.\nPhương án D chưa đúng: Nước ngọt có ga là thực phẩm Calo rỗng điển hình, không có mật độ dinh dưỡng tốt."}, {"n": 12, "q": "Vai trò cốt lõi của \"Huấn Luyện Viên Dinh Dưỡng\" (Wellness Coach) trong việc đưa Triết lý Toàn cầu vào cuộc sống hội viên?", "opts": ["Là người đồng hành Daily, thấu hiểu, uốn nắn thói quen ăn uống, tiếp năng lượng an vui và giúp hội viên đạt mục tiêu.", "Là người chỉ bán sản phẩm rồi mặc kệ hội viên tự sử dụng.", "Là người thay thế Bác sĩ để kê đơn thuốc chữa bệnh.", "Là người bắt buộc hội viên phải tập luyện kiệt sức 4 tiếng/ngày."], "answer": "A", "explain": "\"Kiến thức nằm trên trang sách, kết quả nằm ở sự đồng hành!\" HLV Dinh dưỡng là linh hồn của chương trình. HLV không chỉ trao giải pháp mà còn sát sao chỉ số mỗi ngày, giải đáp thắc mắc, truyền động lực và biến triết lý thành thói quen sống lành mạnh trọn đời.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: HLV Herbalife trao sự chăm sóc chu đáo Daily chứ không bỏ mặc hội viên.\nPhương án C chưa đúng: HLV không chữa bệnh hay kê đơn thuốc; HLV hướng dẫn lối sống dinh dưỡng.\nPhương án D chưa đúng: HLV hướng dẫn vận động hợp lý 30 phút/ngày theo quy tắc 80/20."}, {"n": 13, "q": "Ý nghĩa của môi trường \"Nhóm Dinh Dưỡng\" (Nutrition Club) – nơi thực hành Triết lý Dinh dưỡng Toàn cầu?", "opts": ["Tạo không gian văn hóa An Vui, giao lưu học hỏi 21 bài học, nhận năng lượng tích cực và kỷ luật nhóm để thay đổi.", "Là nơi để mọi người đến so sánh và chê bai vóc dáng của nhau.", "Là nơi chỉ dành riêng cho những người đang mắc bệnh nặng.", "Là nơi kinh doanh thức ăn nhanh chiên xào ngập dầu."], "answer": "A", "explain": "Môi trường quyết định vận mệnh! Nhóm Dinh Dưỡng là \"ngôi nhà thứ hai\" ngập tràn tình yêu thương, nụ cười và sự động viên. Tại đây, hội viên được thưởng thức ly F1 thơm ngon, uống trà thảo mộc, học bài học dinh dưỡng mỗi ngày và cùng nhau khỏe đẹp.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nhóm Dinh Dưỡng tôn trọng, yêu thương và khích lệ sự tiến bộ của từng cá nhân.\nPhương án C chưa đúng: Nhóm Dinh Dưỡng là không gian trải nghiệm lối sống cho tất cả cộng đồng.\nPhương án D chưa đúng: Nhóm Dinh Dưỡng hoàn toàn nói KHÔNG với đồ chiên xào béo xấu."}, {"n": 14, "q": "Sự khác biệt giữa \"Chế độ Ăn Kiêng Ngắn Hạn\" và \"Triết lý Thay Đổi Lối Sống Bền Vững\"?", "opts": ["Ăn kiêng ép buộc dễ bỏ cuộc và béo lại; Lối sống bền vững biến việc ăn đúng thành niềm vui, giữ vóc dáng đẹp trọn đời.", "Chế độ ăn kiêng ngắn hạn giúp cơ thể trẻ hóa bền vững hơn lối sống.", "Hai khái niệm này có kết quả duy trì hoàn toàn giống hệt nhau.", "Thay đổi lối sống chỉ cần thực hiện trong đúng 3 ngày rồi ngưng."], "answer": "A", "explain": "\"Đừng ăn kiêng, hãy thay đổi lối sống!\" Ăn kiêng cực đoan giống như việc nín thở, bạn không thể nín thở cả đời. Triết lý Toàn cầu giúp bạn thấu hiểu cơ thể, làm chủ đĩa ăn, uống đủ nước, vận động an vui – biến dinh dưỡng lành mạnh thành hơi thở tự nhiên trọn đời.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Ăn kiêng ngắn hạn tàn phá cơ bắp và làm béo lại sồ sề.\nPhương án C chưa đúng: Ăn kiêng ngắn hạn thất bại 95%, chỉ có thay đổi lối sống mới giữ dáng vĩnh viễn.\nPhương án D chưa đúng: Lối sống là thói quen rèn luyện hành trình mỗi ngày suốt cuộc đời."}, {"n": 15, "q": "Ý nghĩa của việc bù đắp \"Nước & Điện Giải\" theo công thức 3Đ trong Triết lý Toàn cầu?", "opts": ["Uống Đúng cách (nhấp từng ngụm ngồi), Đủ lượng (0.4l/10kg), Đều đặn giúp tế bào căng mịn và tối ưu chuyển hóa.", "Uống dồn 2 lít nước đá lạnh một lúc khi đang đứng.", "Chỉ uống nước khi nào cơ thể cảm thấy khát khô cổ họng.", "Thay thế toàn bộ nước lọc bằng các loại nước ngọt có ga."], "answer": "A", "explain": "Quy tắc 3Đ huyền thoại! Nước là chất dẫn truyền dinh dưỡng. Uống Đúng (tư thế ngồi, nhấp từng ngụm báo tín hiệu thần kinh), Đủ (tối thiểu 0,4l/10kg cân nặng), Đều (rải rác cả ngày) giúp làm sạch vi nhung mao và giữ cỗ máy đốt Calo vận hành trơn tru.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Uống dồn đứng làm nước tuột thẳng xuống bàng quang, gây áp lực cho thận.\nPhương án C chưa đúng: Khát khô cổ họng là lúc tế bào đã bị mất 2% nước và bắt đầu suy giảm chức năng.\nPhương án D chưa đúng: Nước ngọt có ga chứa nhiều đường xấu gây tích mỡ bụng và mất nước tế bào."}, {"n": 16, "q": "Tác động của việc tuân thủ Triết lý Dinh dưỡng Toàn cầu đối với việc \"Phòng Ngừa Bệnh Mãn Tính Không Lây\"?", "opts": ["Giúp giảm mỡ nội tạng, ổn định đường huyết, làm sạch lòng mạch, đẩy lùi nguy cơ tiểu đường, cao huyết áp, đột quỵ.", "Triết lý dinh dưỡng chỉ làm tăng nguy cơ mắc các bệnh về xương khớp.", "Triết lý dinh dưỡng không có bất kỳ liên quan nào tới bệnh mãn tính.", "Triết lý dinh dưỡng bắt buộc người dùng phải ngưng sử dụng tất cả các liệu trình y tế."], "answer": "A", "explain": "\"Phòng bệnh hơn chữa bệnh!\" 80% các bệnh mãn tính không lây (tiểu đường tuýp 2, tim mạch, xơ vữa, gan nhiễm mỡ) đều bắt nguồn từ lối sống ăn uống sai lệch. Tuân thủ Triết lý Toàn cầu giúp cơ thể tự chữa lành, làm sạch mỡ máu và kiến tạo nền tảng sức khỏe vững chắc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dinh dưỡng chuẩn bổ sung Canxi và đạm giúp xương khớp dẻo dai khỏe mạnh.\nPhương án C chưa đúng: Dinh dưỡng là gốc rễ quyết định sự phát triển hay đẩy lùi bệnh mãn tính.\nPhương án D chưa đúng: Dinh dưỡng hỗ trợ kết hợp song hành làm tăng hiệu quả điều trị của y khoa."}, {"n": 17, "q": "Tại sao Triết lý Dinh dưỡng Toàn cầu lại nhấn mạnh việc \"Hạn chế tối đa Chất Béo Chuyển Hóa (Trans Fat) & Béo Bão Hòa\"?", "opts": ["Vì chúng gây xơ vữa động mạch, làm vón quánh mỡ máu, tăng mỡ nội tạng và tàn phá hệ tim mạch.", "Vì chất béo chuyển hóa làm cho cơ thể bị gầy đi quá nhanh.", "Vì chất béo chuyển hóa giúp làm sạch lòng mạch máu.", "Vì chúng chứa quá nhiều chất xơ gây nặng bụng."], "answer": "A", "explain": "Nói KHÔNG với béo xấu! Trans Fat (đồ chiên đi chiên lại, mỡ thực vật hydro hóa) và béo bão hòa (mỡ heo, da gà, nội tạng) là \"kẻ thù số 1\" của tim mạch. Chúng làm đông đặc lòng mạch, kích hoạt phản ứng viêm và biến vòng 2 thành xưởng sản xuất mỡ nội tạng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Trans Fat làm tích mỡ bụng và béo phì chứ không làm gầy đi.\nPhương án C chưa đúng: Trans Fat là nguyên nhân chính gây xơ vữa dính bết lòng mạch.\nPhương án D chưa đúng: Chất béo xấu hoàn toàn không chứa chất xơ."}, {"n": 18, "q": "Ý nghĩa của việc duy trì \"Tinh Thần An Vui & Tích Cực\" trong hành trình chăm sóc sức khỏe toàn diện?", "opts": ["Giúp não bộ tiết Endorphin & Oxytocin, giảm hormone stress Cortisol, tối ưu hóa quá trình trao đổi chất và tiêu mỡ.", "Tinh thần an vui chỉ có tác dụng làm cho tóc mọc dài hơn.", "Tinh thần không liên quan gì đến việc đốt mỡ hay tăng cơ.", "Tinh thần tích cực làm cho cỗ máy tiêu hóa bị ngừng trệ."], "answer": "A", "explain": "\"Tâm an thì Thân khỏe!\" Khi bạn sống trong trạng thái an vui, biết ơn và tích cực, não bộ xả ra các hormone hạnh phúc giúp hạ huyết áp, làm dịu dạ dày, tăng cường miễn dịch và giúp công tắc đốt mỡ thừa hoạt động mượt mà nhất.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Tinh thần an vui tác động tích cực tới toàn bộ cỗ máy sinh học cơ thể.\nPhương án C chưa đúng: Tinh thần stress làm vọt Cortisol gây tích mỡ bụng và teo cơ bắp rất rõ rệt.\nPhương án D chưa đúng: Tinh thần tích cực giúp hệ tiêu hóa co bóp êm ái và hấp thu dưỡng chất tốt nhất."}, {"n": 19, "q": "Tại sao việc \"Bắt đầu ngày mới bằng 1 ly Bữa ăn lành mạnh F1\" lại là thói quen vàng thực hành Triết lý Toàn cầu?", "opts": ["Khởi động chuyển hóa chuẩn, nạp đủ 21 vi chất & đạm sạch, chỉ 90 Calo, GI rất thấp, giúp tỉnh táo cả ngày.", "Vì F1 giúp thay thế hoàn toàn việc uống nước trong cả ngày.", "Vì F1 giúp cơ thể không cần phải ngủ ban đêm nữa.", "Vì F1 chứa nhiều chất béo bão hòa giúp tích mỡ nọng cằm."], "answer": "A", "explain": "Bữa sáng thông thái nhất thế giới! Chỉ với 1 phút pha chế, ly F1 cung cấp trọn vẹn dinh dưỡng của một bữa ăn chuẩn Cấp độ Tế bào: 21 vi chất, đạm đậu nành phân lập, xơ sạch, 0 béo xấu, chỉ số GI siêu thấp (17–29) – giúp bạn đánh thức cỗ máy đốt Calo đầu ngày.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Vẫn cần uống đủ nước ấm trong ngày theo công thức 3Đ.\nPhương án C chưa đúng: Giấc ngủ đêm vẫn là trụ cột bắt buộc để phục hồi tế bào.\nPhương án D chưa đúng: F1 hoàn toàn 0 béo bão hòa xấu, giúp thon gọn nọng cằm và vòng eo."}, {"n": 20, "q": "Thông điệp cốt lõi và sứ mệnh cao quý nhất của Triết lý Dinh dưỡng Toàn cầu Herbalife là gì?", "opts": ["\"XÂY DỰNG MỘT THẾ GIỚI KHỎE MẠNH HƠN VÀ HẠNH PHÚC HƠN: Nâng tầm chất lượng cuộc sống thông qua Dinh dưỡng Lành mạnh & Lối sống Năng động!\"", "Ép buộc tất cả mọi người phải nhịn ăn để có thân hình thật gầy.", "Chỉ tập trung vào việc bán sản phẩm mà không quan tâm đến sức khỏe cộng đồng.", "Thay thế hoàn toàn các ngành Y tế và Bệnh viện trên toàn cầu."], "answer": "A", "explain": "\"Making the World Healthier and Happier!\" Triết lý Dinh dưỡng Toàn cầu không chỉ dừng lại ở một ly Shake, mà là một sứ mệnh phụng sự cộng đồng: lan tỏa kiến thức dinh dưỡng, truyền cảm hứng lối sống năng động, trao nụ cười an vui và giúp hàng triệu gia đình trên thế giới sống khỏe mạnh, hạnh phúc trọn đời!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Triết lý hướng tới sự cân bằng dinh dưỡng, nuôi dưỡng tế bào khỏe mạnh chứ không nhịn ăn ép cân.\nPhương án C chưa đúng: Sứ mệnh cốt lõi là trao giá trị sức khỏe và hạnh phúc cho cộng đồng.\nPhương án D chưa đúng: Dinh dưỡng lành mạnh đồng hành song hành cùng Y tế để bảo vệ sức khỏe nhân loại."}];
const TKP_LESSON=11;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI TRIẾT LÝ<br>DINH DƯỠNG TOÀN CẦU</h1><div class="subtitle">LÀM CHỦ LỐI SỐNG – CÂN BẰNG CHUYỂN HÓA</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
