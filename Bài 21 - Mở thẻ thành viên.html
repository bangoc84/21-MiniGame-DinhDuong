<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái tận hưởng | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Bản chất cốt lõi và ý nghĩa pháp lý - sức khỏe quan trọng nhất của việc mở \"Thẻ thành viên / Mã số thành viên Herbalife\" đối với một hội viên là gì?", "opts": ["Là một hợp đồng ràng buộc tài chính bắt buộc hội viên phải mua hàng hàng tháng.", "Là tấm \"Thẻ căn cước sức khỏe\" giúp mở cửa kho hàng chính hãng, mua trực tiếp từ Tập đoàn với giá gốc và được pháp luật bảo vệ.", "Là một loại thẻ tín dụng cho phép hội viên vay tiền mua thực phẩm chức năng.", "Là tấm thẻ chỉ có giá trị sử dụng nội bộ tại duy nhất một Nhóm Dinh Dưỡng cố định."], "answer": "B", "explain": "\"Tấm hộ chiếu chính hãng!\" Mã số thành viên do Herbalife Việt Nam cấp là sự công nhận chính thức. Nó giúp bạn trở thành người tiêu dùng thông thái: Đặt hàng trực tiếp từ kho tập đoàn, hưởng giá niêm yết gốc, có hóa đơn VAT đứng tên mình và được công ty bảo vệ 100% quyền lợi người tiêu dùng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Thẻ thành viên hoàn toàn không ép buộc chỉ tiêu mua hàng hay ràng buộc tài chính hàng tháng.\n• Phương án C chưa đúng: Thẻ thành viên là mã định danh tiêu dùng/kinh doanh, không phải thẻ vay nợ tín dụng.\n• Phương án D chưa đúng: Mã số thành viên Herbalife có giá trị sử dụng toàn cầu và trên toàn bộ hệ thống Herbalife Việt Nam."}, {"n": 2, "q": "Sự nguy hiểm lớn nhất khi hội viên \"Ham rẻ vài chục nghìn\" mua sản phẩm Herbalife trôi nổi trên các sàn thương mại điện tử (Shopee, Lazada, TikTok Shop) thay vì mua qua Thẻ thành viên?", "opts": ["Nguy cơ mua phải hàng giả, hàng hết hạn đục sửa date, bị biến chất gây ngộ độc và KHÔNG ĐƯỢC Công ty bảo vệ hay bồi thường.", "Hàng trên mạng chất lượng tốt hơn nhưng giao hàng hơi chậm hơn công ty.", "Mua trên mạng vẫn được tích điểm Volume Points vào thẻ thành viên cá nhân như bình thường.", "Công ty Herbalife vẫn chịu trách nhiệm bảo hành cho tất cả hàng mua trôi nổi trên mạng."], "answer": "A", "explain": "\"Rẻ một đồng - Hại một đời!\" Herbalife nghiêm cấm bán hàng trên các sàn thương mại điện tử. Hàng trôi nổi trên mạng thường là hàng thu gom hết hạn đục xóa hạn sử dụng, hàng giả công nghệ cao pha hóa chất. Khi gặp sự cố ngộ độc hay hỏng dạ dày, Công ty tuyệt đối không chịu trách nhiệm vì bạn không có hóa đơn VAT mua từ kho chính thức!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Hàng trôi nổi không được bảo quản chuẩn nhiệt độ/độ ẩm ISO, chất lượng bị biến tính rất nguy hiểm.\n• Phương án C chưa đúng: Mua trôi nổi bên ngoài hoàn toàn không được ghi nhận điểm tích lũy (VP) vào tài khoản cá nhân.\n• Phương án D chưa đúng: Công ty chỉ bảo vệ và bồi thường cho các đơn hàng xuất kho trực tiếp có hóa đơn VAT chính chủ."}, {"n": 3, "q": "Hàng rào chính sách bảo đảm \"Hoàn tiền / Trả lại hàng trong 30 ngày\" của Herbalife dành riêng cho người có Thẻ thành viên mua hàng chính hãng mang lại sự an tâm ra sao?", "opts": ["Nếu hội viên không hài lòng về sản phẩm hoặc gặp kích ứng, Công ty cam kết nhận lại hàng và hoàn tiền 100% theo quy định.", "Chính sách hoàn tiền chỉ áp dụng cho các Huấn luyện viên cấp cao, hội viên mới không được hưởng.", "Hội viên phải thanh toán thêm 50% phí phạt nếu muốn trả lại hàng cho công ty.", "Hàng đã mua trực tiếp từ công ty thì tuyệt đối không được đổi trả trong bất kỳ trường hợp nào."], "answer": "A", "explain": "\"Lọc sạch rủi ro cho người tiêu dùng!\" Đây là cam kết vàng về chất lượng của Tập đoàn Herbalife toàn cầu. Khi mua qua Mã số thành viên chính thức, trong vòng 30 ngày, nếu bạn có bất kỳ lý do không hài lòng nào, công ty sẵn sàng nhận lại sản phẩm và hoàn trả tiền theo quy định pháp lý.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cam kết 30 ngày áp dụng bình đẳng cho tất cả người tiêu dùng có Mã số thành viên.\n• Phương án C chưa đúng: Công ty tuân thủ chính sách bảo vệ người tiêu dùng, không phạt tiền vô lý.\n• Phương án D chưa đúng: Quyền đổi trả trong 30 ngày là quyền lợi chính thức được pháp luật bảo hộ."}, {"n": 4, "q": "Thang bậc giảm giá / chiết khấu khởi điểm và cơ chế tăng dần theo điểm tích lũy (Volume Points - VP) dành cho người có Thẻ thành viên là gì?", "opts": ["Khởi điểm 25% và tăng dần lên 35%, 42% và tối đa 50% (Giám sát viên) khi tích lũy đủ điểm Volume Points.", "Tất cả mọi người có thẻ thành viên đều cố định mức giảm giá 10% trọn đời.", "Mức giảm giá bắt đầu từ 50% ngay khi vừa mở thẻ thành viên mà không cần tích lũy điểm.", "Mức chiết khấu sẽ bị giảm dần xuống 0% nếu hội viên không mua hàng hàng tuần."], "answer": "A", "explain": "\"Càng ăn càng tiết kiệm!\" Ngay khi mở Thẻ thành viên, bạn lập tức được giảm 25% giá gốc. Khi bạn mua cho bản thân và gia đình dùng, điểm Volume Points (VP) cộng dồn sẽ giúp bạn nâng nấc chiết khấu lên 35%, 42% và đỉnh cao là 50% (Giám sát viên) để dùng sản phẩm giá nửa tiền trọn đời!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Chiết khấu khởi điểm là 25% chứ không phải 10%.\n• Phương án C chưa đúng: Mức 50% đòi hỏi quá trình tích lũy điểm Volume Points đạt chuẩn Giám sát viên.\n• Phương án D chưa đúng: Mức chiết khấu đã đạt được sẽ được giữ vững theo quy định tích lũy của tập đoàn, không bị hạ xuống 0%."}, {"n": 5, "q": "Điểm tích lũy (Volume Points - VP) trong hệ thống Herbalife có ý nghĩa sinh học và kinh tế như thế nào đối với tài khoản thành viên?", "opts": ["Là đơn vị đo lường giá trị sản phẩm quy chuẩn toàn cầu, giúp cộng dồn để nâng nấc chiết khấu giảm giá và xếp hạng thành viên.", "VP là số tiền mặt được công ty rút thẳng từ tài khoản ngân hàng của hội viên.", "VP là số kg mỡ mà hội viên đã giảm được trong tháng.", "Chỉ số VP sẽ tự động biến mất sau 24 giờ nếu hội viên không sử dụng hết."], "answer": "A", "explain": "\"Đồng tiền quy chuẩn toàn cầu!\" Vì Herbalife có mặt trên 90 quốc gia với các đồng tiền khác nhau, Volume Points (VP) là đơn vị điểm thống nhất. Mỗi hộp F1 hay đạm PPP đều tương ứng với số VP cố định. Tích lũy VP giúp tài khoản của bạn thăng hạng chiết khấu và nhận các phần quà thưởng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: VP là điểm quy đổi sản phẩm, không phải tiền bị rút từ tài khoản ngân hàng.\n• Phương án C chưa đúng: VP đo lường giá trị sản phẩm tích lũy, không phải chỉ số cân nặng hay mỡ.\n• Phương án D chưa đúng: Điểm VP tích lũy theo chu kỳ tháng và năm chuẩn xác, không mất sau 24 giờ."}, {"n": 6, "q": "Khái niệm \"Hóa đơn tài chính VAT chính chủ\" phát hành khi mua hàng qua Thẻ thành viên Herbalife khẳng định điều gì?", "opts": ["Chứng minh nguồn gốc xuất xứ 100% chính hãng, tuân thủ pháp luật Việt Nam và bảo vệ quyền lợi người tiêu dùng tuyệt đối.", "Hóa đơn VAT làm cho giá sản phẩm bị tăng lên gấp 2 lần so với giá niêm yết.", "Hóa đơn VAT chỉ phát hành cho các doanh nghiệp lớn, cá nhân không được nhận.", "Là chứng từ bắt buộc hội viên phải nộp phạt cho cơ quan thuế hàng tháng."], "answer": "A", "explain": "\"Minh bạch pháp lý 100%!\" Mỗi đơn hàng đặt qua Mã số thành viên đều xuất Hóa đơn điện tử VAT đứng tên trực tiếp người mua. Hóa đơn này là bằng chứng pháp lý bảo vệ bạn: Xác nhận sản phẩm nạp vào cơ thể là hàng nhập khẩu chính ngạch, đã nộp thuế cho Nhà nước và đạt chuẩn an toàn thực phẩm.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Giá niêm yết của Herbalife đã bao gồm thuế VAT theo quy định pháp luật.\n• Phương án C chưa đúng: Bất kỳ cá nhân nào có Thẻ thành viên đều nhận được Hóa đơn VAT chính chủ.\n• Phương án D chưa đúng: Hóa đơn VAT là chứng từ chứng minh hàng thật, không phải giấy phạt."}, {"n": 7, "q": "Tại sao việc mở Thẻ thành viên Herbalife lại KHÔNG tạo ra áp lực tài chính hay chỉ tiêu doanh số đối với người tiêu dùng cá nhân?", "opts": ["Công ty không quy định doanh số tối thiểu bắt buộc; hội viên mua theo nhu cầu ăn uống của bản thân và gia đình.", "Hội viên bắt buộc phải ôm một lượng hàng lớn trị giá hàng trăm triệu ngay khi mở thẻ.", "Nếu tháng đó không mua hàng, thẻ thành viên sẽ lập tức bị phạt tiền ngân hàng.", "Công ty sẽ tự động trừ tiền trong thẻ ATM của hội viên mỗi tháng."], "answer": "A", "explain": "\"Hoàn toàn tự do và chủ động!\" Herbalife tôn trọng nhu cầu thực tế của bạn. Mở Thẻ thành viên giống như bạn làm thẻ hội viên siêu thị: Bạn dùng tháng nào đặt tháng đó, mua 1 hộp F1 vẫn được tính giá giảm 25%, không bị ép doanh số, không bị áp lực tồn kho!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Herbalife nghiêm cấm hành vi xúi giục ôm hàng; hội viên mua theo nhu cầu tiêu dùng thực.\n• Phương án C chưa đúng: Không có bất kỳ hình phạt tài chính nào nếu bạn không mua hàng.\n• Phương án D chưa đúng: Công ty chỉ thu tiền khi bạn chủ động thao tác đặt đơn hàng."}, {"n": 8, "q": "Đặc quyền tiếp cận \"Hệ thống Đào tạo & Kho Tri thức Chính thống\" dành cho người sở hữu Mã số thành viên Herbalife?", "opts": ["Được học trực tiếp từ Ban Cố vấn Y khoa NAB (các Giáo sư, Bác sĩ thế giới), tham gia sự kiện STS, HOM và nhận cẩm nang chính thức.", "Chỉ được xem các video ngắn giải trí trên các mạng xã hội tự do.", "Phải trả thêm hàng chục triệu đồng mỗi tháng mới được truy cập tài liệu học tập.", "Hệ thống đào tạo chỉ dạy về kỹ năng bán hàng, không dạy về kiến thức chăm sóc sức khỏe."], "answer": "A", "explain": "\"Mở khóa kho tàng tri thức sức khỏe!\" Sở hữu Thẻ thành viên giúp bạn bước vào hệ sinh thái giáo dục sức khỏe đỉnh cao. Bạn được tham dự các buổi đào tạo trực tuyến của Giáo sư David Heber, các Bác sĩ dinh dưỡng Việt Nam, hiểu sâu về cơ thể để trở thành \"Bác sĩ của chính mình\".\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bạn được tiếp cận nguồn tài liệu khoa học chuẩn mực đã qua kiểm duyệt Y tế.\n• Phương án C chưa đúng: Các chương trình huấn luyện kiến thức dinh dưỡng cơ bản hoàn toàn miễn phí cho thành viên.\n• Phương án D chưa đúng: Trọng tâm đào tạo của Herbalife là Tri thức Dinh dưỡng Tế bào và Lối sống Lành mạnh."}, {"n": 9, "q": "Khái niệm \"Quyền Bảo Trợ\" (Sponsor) khi bạn sở hữu Thẻ thành viên Herbalife mở ra cơ hội giá trị nào?", "opts": ["Quyền được hướng dẫn, mở thẻ và giúp đỡ người thân/bạn bè cùng sở hữu mã số mua hàng giá gốc và xây dựng nhóm tiêu dùng.", "Quyền được thu tiền phế trực tiếp từ những người mình giới thiệu.", "Quyền bắt buộc người khác phải mua hàng theo sự chỉ định của mình.", "Quyền bảo trợ chỉ dành riêng cho các bác sĩ và chuyên gia dinh dưỡng."], "answer": "A", "explain": "\"Trao đi giải pháp an toàn!\" Khi bạn dùng tốt, có Thẻ thành viên giúp bạn có quyền bảo trợ (giới thiệu) mở mã số cho cha mẹ, anh chị em, bạn bè. Họ cũng được mua hàng giá gốc từ công ty như bạn, giúp cả gia đình cùng ăn sạch, tiết kiệm và an toàn!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mọi giao dịch tiền bạc đều thực hiện trực tiếp giữa người dùng và Công ty Herbalife.\n• Phương án C chưa đúng: Sự chia sẻ dựa trên sự tự nguyện và trao giá trị giúp đỡ, không gượng ép.\n• Phương án D chưa đúng: Bất kỳ Thành viên độc lập nào cũng có quyền bảo trợ mở mã số cho người khác."}, {"n": 10, "q": "Giá trị văn hóa và kinh tế vượt trội của \"Quyền Thừa Kế Mã Số Thành Viên\" Herbalife dành cho thế hệ tương lai (con cháu)?", "opts": ["Mạng lưới người tiêu dùng và cấp bậc kinh doanh bạn xây dựng có thể chuyển giao trọn vẹn cho con cháu tiếp tục hưởng quyền lợi.", "Mã số thành viên sẽ tự động hủy bỏ hoàn toàn khi người sở hữu qua đời.", "Con cháu phải đóng một khoản tiền phạt rất lớn mới được nhận lại mã số thừa kế.", "Quyền thừa kế chỉ áp dụng cho tài sản đất đai, không áp dụng cho mã số Herbalife."], "answer": "A", "explain": "\"Xây dựng sự nghiệp nhân văn bền vững!\" Khác với công việc làm thuê (khi nghỉ là hết), sự nghiệp bạn xây dựng tại Herbalife được quy định trong luật hoạt động: Thành quả tích lũy và hệ thống tiêu dùng bạn tạo ra có thể thừa kế lại cho con cái, mang lại sự đảm bảo tài chính lâu dài cho thế hệ sau.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Quyền thừa kế mã số được quy định rõ ràng trong chính sách pháp lý của Tập đoàn.\n• Phương án C chưa đúng: Thủ tục thừa kế chuyển nhượng thực hiện theo đúng quy định pháp luật không bị phạt tiền.\n• Phương án D chưa đúng: Mã số Herbalife là một tài sản kinh doanh hợp pháp được phép thừa kế."}, {"n": 11, "q": "Tính tiện lợi đỉnh cao của việc sở hữu Thẻ thành viên khi sử dụng ứng dụng di động MyHerbalife hoặc Tổng đài công ty?", "opts": ["Tự tay đặt hàng 24/7, theo dõi đơn hàng trực tuyến, công ty giao hàng tận nhà toàn quốc nhanh chóng và an toàn.", "Hội viên bắt buộc phải trực tiếp đến tận kho hàng ở Hà Nội hoặc TP.HCM mới lấy được hàng.", "Đặt hàng qua app MyHerbalife sẽ bị tính thêm 30% phí dịch vụ.", "Ứng dụng MyHerbalife chỉ dành riêng cho nhân viên văn phòng của tập đoàn."], "answer": "A", "explain": "\"Mua sắm thông thái thời công nghệ!\" Chỉ với chiếc điện thoại thông minh, người có Thẻ thành viên có thể mở app MyHerbalife, chọn hộp F1 hay lọ Omega-3, bấm thanh toán. Trong 1–3 ngày, đơn hàng đóng gói cẩn thận từ kho công ty sẽ gửi về tận cửa nhà bạn dù ở bất kỳ tỉnh thành nào!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Công ty giao hàng tận nhà trên 63 tỉnh thành toàn quốc.\n• Phương án C chưa đúng: Ứng dụng MyHerbalife sử dụng miễn phí và áp dụng đúng giá giảm niêm yết.\n• Phương án D chưa đúng: Ứng dụng thiết kế riêng phục vụ tất cả các Thành viên có mã số chính thức."}, {"n": 12, "q": "Sự kết hợp giữa \"Thẻ thành viên mua giá gốc\" và \"Sự đồng hành Daily của HLV tại Nhóm Dinh Dưỡng\" mang lại lợi ích kép gì?", "opts": ["Vừa tiết kiệm chi phí tài chính tiêu dùng lâu dài, vừa được HLV bám sát đĩa ăn, đo Tanita và đảm bảo đạt kết quả tối ưu.", "Có thẻ thành viên rồi thì HLV sẽ ngừng hoàn toàn việc chăm sóc và tư vấn.", "Đến Nhóm Dinh Dưỡng sẽ bị hủy bỏ mức chiết khấu giảm giá của thẻ thành viên.", "Hai yếu tố này hoàn toàn tách biệt và không hỗ trợ gì cho nhau."], "answer": "A", "explain": "\"Công cụ tốt + Người hướng dẫn giỏi!\" Mở thẻ giúp bạn mua được dinh dưỡng xịn giá gốc từ công ty. Đến Nhóm Dinh Dưỡng giúp bạn có HLV hướng dẫn cách ăn ly Shake sao cho đúng, soi đĩa ăn cơm hàng ngày. Bộ đôi này đảm bảo bạn vừa tiết kiệm tiền vừa đạt vóc dáng mơ ước!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: HLV càng tận tâm đồng hành sát sao hơn khi bạn quyết định gắn bó lâu dài.\n• Phương án C chưa đúng: Nhóm Dinh Dưỡng là môi trường hỗ trợ, tuyệt đối không làm ảnh hưởng đến chiết khấu thẻ của bạn.\n• Phương án D chưa đúng: Đây là sự kết hợp hoàn hảo nhất tại mô hình Nhóm Dinh Dưỡng."}, {"n": 13, "q": "Mối liên hệ giữa việc mở Thẻ thành viên Herbalife và Nghị định 40/2018/NĐ-CP của Chính phủ Việt Nam?", "opts": ["Đảm bảo hoạt động kinh doanh/tiêu dùng minh bạch, đúng pháp luật, được Nhà nước bảo hộ và chống lại các hành vi biến tướng.", "Nghị định 40 cấm cá nhân mở thẻ thành viên tiêu dùng trực tiếp.", "Mở thẻ thành viên là hành vi vi phạm quy định quản lý thị trường.", "Nghị định 40 chỉ quản lý các mặt hàng điện tử, không quản lý dinh dưỡng."], "answer": "A", "explain": "\"Thượng tôn pháp luật!\" Herbalife Việt Nam hoạt động hoàn toàn tuân thủ Nghị định 40/2018/NĐ-CP quản lý bán hàng đa cấp. Việc bạn mở Thẻ thành viên chính thức giúp bạn tham gia vào một hệ thống tiêu dùng hợp pháp, công khai, được Bộ Công Thương và Cục Cạnh tranh & Bảo vệ người tiêu dùng bảo vệ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nghị định 40 quy định rõ quyền lợi hợp pháp của người tiêu dùng mở thẻ.\n• Phương án C chưa đúng: Mở thẻ thành viên trực tiếp với công ty là hành vi tiêu dùng hoàn toàn chuẩn mực và hợp pháp.\n• Phương án D chưa đúng: Nghị định 40 quản lý trực tiếp ngành kinh doanh bán hàng trực tiếp và thực phẩm bổ sung."}, {"n": 14, "q": "Bẫy tư duy sai lầm: \"Tôi chỉ là người ăn tiêu dùng cho khỏe, KHÔNG KINH DOANH thì KHÔNG CẦN mở Thẻ thành viên\"?", "opts": ["Sai lầm! Mở thẻ giúp người tiêu dùng mua hàng chuẩn 100% từ công ty, hưởng giảm giá tích lũy và tiết kiệm ngân sách gia đình.", "Đúng! Chỉ có những người muốn đi bán hàng chuyên nghiệp mới cần mở thẻ thành viên.", "Mở thẻ thành viên sẽ bắt buộc người tiêu dùng phải đi tuyển dụng người khác.", "Người tiêu dùng mua qua thẻ thành viên sẽ bị đắt hơn mua trôi nổi bên ngoài."], "answer": "A", "explain": "\"Tiêu dùng thông thái!\" Dù bạn chỉ ăn 1 ly F1 mỗi ngày để giữ sức khỏe, việc mở Thẻ thành viên vẫn mang lại giá trị to lớn: Đảm bảo không bao giờ nuốt phải hàng giả trôi nổi vào bụng, đồng thời được giảm giá 25%–50%, tiết kiệm hàng triệu đồng mỗi năm cho gia đình.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đại đa số người mở Thẻ thành viên Herbalife trên thế giới xuất phát từ nhu cầu người tiêu dùng thuần túy.\n• Phương án C chưa đúng: Bạn hoàn toàn có quyền chỉ sử dụng sản phẩm mà không cần giới thiệu hay kinh doanh.\n• Phương án D chưa đúng: Mua qua thẻ là mua giá gốc chiết khấu từ công ty, rẻ và an toàn hơn rất nhiều so với mua trôi nổi rủi ro."}, {"n": 15, "q": "Sự an toàn cho sức khỏe gia đình khi người chủ bếp sở hữu Thẻ thành viên Herbalife chính chủ?", "opts": ["An tâm 100% nguồn dinh dưỡng nạp vào cơ thể cha mẹ và con cái là tinh sạch, còn nguyên tem seal, bảo quản chuẩn ISO.", "Sản phẩm mua qua thẻ thành viên có chất lượng thấp hơn sản phẩm mua ngoài chợ đen.", "Có thẻ thành viên thì không cần phải kiểm tra hạn sử dụng của sản phẩm.", "Sản phẩm mua qua thẻ thành viên chứa nhiều chất bảo quản hơn hàng trôi nổi."], "answer": "A", "explain": "\"Bảo vệ tổ ấm từ gốc!\" Khi bạn là chủ bếp mua hàng có Mã số chính chủ, bạn cầm trên tay hộp sản phẩm còn nguyên màng niêm phong (seal), nguồn gốc rõ ràng. Bạn hoàn toàn an tâm khi pha ly F1 cho con nhỏ uống hay mời cha mẹ già thưởng thức mà không nơm nớp lo sợ hàng trôi nổi giả mạo.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Hàng từ kho công ty là nguồn hàng gốc chất lượng cao nhất.\n• Phương án C chưa đúng: Sản phẩm từ kho công ty luôn đảm bảo hạn sử dụng mới nhất và chuẩn xác nhất.\n• Phương án D chưa đúng: Sản phẩm chính hãng tuân thủ tiêu chuẩn chất lượng sinh học tinh sạch 100%."}, {"n": 16, "q": "Cơ hội phát triển bản thân và mở rộng mối quan hệ chất lượng khi gia nhập Cộng đồng Thành viên Herbalife Toàn cầu?", "opts": ["Giao lưu cùng hàng triệu người sống tích cực, tham gia đại hội quốc tế (Extravaganza), nâng tầm tư duy và phong cách sống.", "Gia nhập cộng đồng khiến hội viên bị cô lập khỏi xã hội bên ngoài.", "Cộng đồng thành viên chỉ tập trung vào việc mua bán hàng hóa gượng ép.", "Các sự kiện quốc tế chỉ dành riêng cho Ban giám đốc công ty."], "answer": "A", "explain": "\"Nâng tầm môi trường sống!\" Mở Thẻ thành viên không chỉ là mua sản phẩm, mà là tấm vé gia nhập cộng đồng những người yêu sức khỏe, sống tích cực. Bạn có cơ hội tham dự các sự kiện lớn như Sự kiện Tưởng thưởng STS, Đại hội Extravaganza khu vực, mở rộng tầm nhìn và kết nối bạn bè khắp nơi!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Môi trường giúp bạn tự tin hơn, mở rộng các mối quan hệ xã hội tích cực.\n• Phương án C chưa đúng: Cộng đồng tập trung vào sự phát triển bản thân, tri thức dinh dưỡng và tình yêu thương.\n• Phương án D chưa đúng: Tất cả các Thành viên đạt chuẩn thi đua đều có quyền tham dự các sự kiện quốc tế."}, {"n": 17, "q": "Quyền lợi được tham gia các \"Chương trình thi đua Tưởng thưởng & Du lịch đẳng cấp 5 sao\" của Herbalife dành cho ai?", "opts": ["Dành cho tất cả Thành viên đạt chuẩn thi đua tích lũy điểm Volume Points, được vinh danh và trải nghiệm dịch vụ cao cấp miễn phí.", "Chỉ dành riêng cho những người có quan hệ thân thiết với nhân viên công ty.", "Tất cả chuyến du lịch tưởng thưởng đều do thành viên tự bỏ 100% tiền túi ra trả.", "Chương trình du lịch tưởng thưởng chỉ là lời hứa ảo, không có thật."], "answer": "A", "explain": "\"Tưởng thưởng xứng đáng cho sự nỗ lực!\" Herbalife có văn hóa tưởng thưởng tuyệt vời. Khi bạn nỗ lực tích lũy điểm Volume Points giúp đỡ nhiều người có sức khỏe, công ty tài trợ 100% các chuyến du lịch nghỉ dưỡng 5 sao trong và ngoài nước, vinh danh bạn trên sân khấu lớn trước hàng ngàn người!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tiêu chuẩn thi đua hoàn toàn công bằng và minh bạch cho mọi Thành viên dựa trên kết quả điểm VP.\n• Phương án C chưa đúng: Công ty tài trợ toàn bộ chi phí vé máy bay, khách sạn 5 sao và ăn uống cho thành viên đạt chuẩn.\n• Phương án D chưa đúng: Hàng ngàn thành viên Việt Nam đã trải nghiệm những chuyến du lịch 5 sao thực tế trên thế giới."}, {"n": 18, "q": "Sự khác biệt cơ bản giữa \"Khách hàng thành viên (Nhiệm vụ tiêu dùng)\" và \"Thành viên kinh doanh độc lập (Independent Distributor)\"?", "opts": ["Khách hàng thành viên tập trung mua dùng cho bản thân/gia đình; Thành viên kinh doanh học chuyên sâu để xây dựng sự nghiệp chuyên nghiệp.", "Khách hàng thành viên không được hưởng bất kỳ mức giảm giá nào.", "Thành viên kinh doanh bị cấm không được sử dụng sản phẩm.", "Hai đối tượng này có quy định pháp lý và quyền lợi hoàn toàn trái ngược nhau."], "answer": "A", "explain": "\"Linh hoạt theo nhu cầu!\" Bạn có thể lựa chọn trở thành Khách hàng thành viên chỉ để mua dùng ăn uống giá tốt; hoặc khi yêu thích công việc, bạn đăng ký chuyển đổi thành Thành viên kinh doanh độc lập để được công ty đào tạo kỹ năng kinh doanh, mở Nhóm Dinh Dưỡng và tạo thu nhập.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Khách hàng thành viên vẫn được hưởng đầy đủ các mức giảm giá tiêu dùng từ 25%–50%.\n• Phương án C chưa đúng: Thành viên kinh doanh bắt buộc phải là người tiêu dùng sản phẩm có kết quả rực rỡ nhất.\n• Phương án D chưa đúng: Cả hai đều nằm trong hệ thống quản lý chính thức của Herbalife với các quyền lợi minh bạch."}, {"n": 19, "q": "Tại sao việc sở hữu Thẻ thành viên chính chủ lại giúp bảo vệ \"Danh dự và Uy tín cá nhân\" khi bạn giới thiệu giải pháp cho người khác?", "opts": ["Giúp người thân mua đúng nguồn hàng xịn của công ty, có hóa đơn tên họ, không lo bị trách móc vì mua phải hàng giả trôi nổi.", "Khiến người thân nghi ngờ bạn đang cố tình lợi dụng họ.", "Làm giảm uy tín cá nhân vì mua hàng trực tiếp từ tập đoàn.", "Việc sở hữu thẻ không ảnh hưởng gì tới uy tín cá nhân."], "answer": "A", "explain": "\"Gieo sự an tâm - Nhận sự tin tưởng!\" Khi bạn giúp bạn bè/người thân mở Thẻ thành viên mua hàng trực tiếp từ công ty, họ nhận đơn hàng có tên họ, hóa đơn rõ ràng. Họ biết bạn đang giúp họ mua chuẩn giá gốc chính hãng chứ không phải mua đi bán lại kiếm lời hay đưa cho họ hàng nhái kém chất lượng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Sự minh bạch mở mã số chính chủ giúp củng cố niềm tin tuyệt đối giữa bạn và người thân.\n• Phương án C chưa đúng: Mua hàng chính ngạch từ tập đoàn toàn cầu càng làm tăng uy tín và sự chuyên nghiệp của bạn.\n• Phương án D chưa đúng: Sở hữu thẻ và mua chuẩn gốc là lá chắn bảo vệ uy tín lâu dài cho bạn."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 21 \"QUYỀN LỢI LÀM THẺ THÀNH VIÊN\" tại Nhóm Dinh Dưỡng?", "opts": ["\"THẺ THÀNH VIÊN - TẤM HỘ CHIẾU SỨC KHỎE & AN TOÀN: Mua chuẩn gốc, Tích điểm tăng chiết khấu, Bảo vệ gia đình & Mở ra tương lai An Vui!\"", "Làm thẻ thành viên chỉ là thủ tục rườm rà không mang lại lợi ích gì.", "Nên mua hàng trôi nổi giá rẻ trên mạng để tiết kiệm chi phí tối đa.", "Thẻ thành viên chỉ dành cho những người giàu có."], "answer": "A", "explain": "\"Quyết định thông thái ngay hôm nay!\" Mở Thẻ thành viên Herbalife là quyết định bảo vệ sức khỏe và tài chính thông minh nhất cho bản thân và gia đình. Hãy chủ động sở hữu cho mình một Mã số thành viên chính thức, tận hưởng sản phẩm sạch 100% từ tập đoàn và cùng nhau đón nhận một tương lai Khỏe Mạnh - An Vui trọn vẹn!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thẻ thành viên mang lại vô vàn quyền lợi từ giảm giá, bảo mật an toàn đến cơ hội tương lai.\n• Phương án C chưa đúng: Mua hàng trôi nổi là đánh cược tính mạng và sức khỏe của bản thân với hàng giả.\n• Phương án D chưa đúng: Thẻ thành viên dành cho tất cả mọi người muốn tiêu dùng thông thái và bảo vệ gia đình."}];
const TKP_LESSON=21;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI TẬN HƯỞNG<br>QUYỀN LỢI THẺ THÀNH VIÊN</h1><div class="subtitle">KHÁM PHÁ GIÁ TRỊ THÀNH VIÊN</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
