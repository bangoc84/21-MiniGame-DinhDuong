:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Vai trò cốt lõi và sứ mệnh hàng đầu của Ban Cố Vấn Dinh Dưỡng Toàn Cầu Herbalife (NAB - Nutrition Advisory Board) là gì?", "opts": ["Chịu trách nhiệm trực tiếp phân phối sản phẩm và bán hàng tới tay người tiêu dùng.", "Đảm bảo nền tảng khoa học đỉnh cao, nghiên cứu sản phẩm, kiểm nghiệm lâm sàng và huấn luyện chuyên môn dinh dưỡng.", "Thiết kế bao bì, nhãn mác và chiến dịch quảng cáo tiếp thị thị trường.", "Thay thế hoàn toàn vai trò của các bệnh viện và bác sĩ điều trị Y tế."], "answer": "B", "explain": "Ban Cố Vấn Dinh Dưỡng (NAB) là \"trái tim khoa học\" của Herbalife! Quy tụ những trí tuệ Y khoa hàng đầu thế giới, NAB chịu trách nhiệm nghiên cứu phát triển công thức sản phẩm, tiến hành kiểm nghiệm lâm sàng nghiêm ngặt và đào tạo kiến thức dinh dưỡng chuẩn mực cho đội ngũ Huấn luyện viên.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: NAB hoạt động chuyên sâu về nghiên cứu khoa học Y học, không làm công tác phân phối bán hàng.\nPhương án C chưa đúng: Thiết kế bao bì và tiếp thị là chức năng của phòng Marketing, không phải nhiệm vụ của các nhà khoa học NAB.\nPhương án D chưa đúng: NAB phát triển dinh dưỡng bổ sung hỗ trợ lối sống, hoàn toàn không thay thế y tế điều trị."}, {"n": 2, "q": "Quy mô và đẳng cấp chuyên môn của Ban Cố Vấn Dinh Dưỡng Herbalife quy tụ sự góp mặt của bao nhiêu chuyên gia Y khoa hàng đầu?", "opts": ["Khoảng 10 bác sĩ gia đình tại Mỹ.", "Hơn 300 Nhà khoa học, Giáo sư, Bác sĩ Y khoa uy tín hàng đầu thế giới trên các lĩnh vực dinh dưỡng và sức khỏe.", "Bao gồm toàn bộ các HLV Dinh dưỡng xuất sắc nhất tại các Nhóm Dinh Dưỡng.", "Chỉ gồm các chuyên gia kiểm nghiệm thực phẩm công nghiệp."], "answer": "B", "explain": "Đội ngũ đỉnh cao Y học! NAB là sự quy tụ của hơn 300 Giáo sư, Tiến sĩ, Bác sĩ Y khoa và các chuyên gia sức khỏe đại diện cho các châu lục. Sự đa dạng và uy tín của họ đảm bảo các sản phẩm đạt tiêu chuẩn an toàn và tương thích với thể trạng con người toàn cầu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Con số 10 bác sĩ là quá nhỏ bé so với quy mô khoa học toàn cầu của tập đoàn.\nPhương án C chưa đúng: HLV Dinh dưỡng là người học tập và truyền tải triết lý, không phải là thành viên trong Ban Cố vấn Khoa học NAB.\nPhương án D chưa đúng: Thành viên NAB là các Giáo sư Bác sĩ Y khoa danh tiếng từ các trường Đại học Y hàng đầu."}, {"n": 3, "q": "Sự kiện khoa học lừng lẫy chứng minh đẳng cấp quốc tế của NAB là sự đóng góp của Nhà khoa học nào từng đạt Giải Nobel Y Học?", "opts": ["Giáo sư, Tiến sĩ Louis Ignarro (Giải Nobel Y Học năm 1998 với công trình nghiên cứu về Nitric Oxide bảo vệ tim mạch).", "Giáo sư David Heber.", "Tiến sĩ Luigi Gratton.", "Nhà sáng lập Mark Hughes."], "answer": "A", "explain": "Bảo chứng từ Nobel Y học! GS. Louis Ignarro nhận giải Nobel Y học năm 1998 nhờ phát hiện ra Nitric Oxide (NO) – phân tử kỳ diệu giúp giãn mạch máu. Ông đã hợp tác cùng Herbalife phát triển sản phẩm Niteworks giúp bảo vệ trái tim và dọn dẹp lòng mạch ban đêm.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: GS. David Heber là Chủ tịch Viện Dinh dưỡng Herbalife (HNI), chuyên gia hàng đầu về dinh dưỡng nhưng không phải người nhận giải Nobel.\nPhương án C chưa đúng: TS. Luigi Gratton là Phó Chủ tịch phụ trách Đào tạo, không phải chủ nhân giải Nobel.\nPhương án D chưa đúng: Mark Hughes là Nhà sáng lập Herbalife, không phải nhà khoa học đoạt giải Nobel."}, {"n": 4, "q": "Vị trí Chủ tịch Ban Cố Vấn Dinh Dưỡng Herbalife & Viện Dinh Dưỡng Herbalife (HNI) do Giáo sư hàng đầu nào đảm nhiệm?", "opts": ["GS. Louis Ignarro.", "Giáo sư, Bác sĩ David Heber (Chuyên gia hàng đầu thế giới về chống béo phì, Giám đốc Trung tâm Dinh dưỡng Con người tại UCLA).", "Bác sĩ Solomon Pascha.", "Tiến sĩ Antero Pasqual."], "answer": "B", "explain": "Tượng đài Dinh dưỡng thế giới! GS.TS.BS David Heber được bình chọn là một trong \"Những người trí tuệ nhất thế giới\" và nhiều năm liền nằm trong danh sách Bác sĩ tốt nhất nước Mỹ. Ông dẫn dắt NAB định hình triết lý dinh dưỡng đa sắc màu và kiểm soát cân nặng bền vững.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: GS. Louis Ignarro là thành viên Ban cố vấn chuyên sâu về tim mạch, không phải Chủ tịch NAB.\nPhương án C chưa đúng: Bác sĩ Solomon là tác giả sách dinh dưỡng, không giữ vị trí Chủ tịch NAB.\nPhương án D chưa đúng: TS. Antero Pasqual là thành viên phụ trách khu vực, không phải Chủ tịch hội đồng."}, {"n": 5, "q": "Quy trình kiểm soát chất lượng nghiêm ngặt \"Từ Hạt Mầm Đến Bàn Ăn\" (Seed to Feed) do NAB cố vấn cam kết điều gì?", "opts": ["Kiểm soát chặt chẽ 14 bước từ khâu chọn giống, trồng trọt, thu hoạch, chiết xuất đến sản phẩm thành phẩm giao tận tay người dùng.", "Chỉ kiểm tra chất lượng sản phẩm khi đã đóng hộp hoàn chỉnh ở khâu cuối cùng.", "Mua lại các nguồn nguyên liệu thô trôi nổi trên thị trường rồi đóng gói.", "Quy trình chỉ tập trung vào việc làm cho hương vị sản phẩm thật ngọt ngào."], "answer": "A", "explain": "Đẳng cấp kiểm soát toàn diện! Quy trình \"Seed to Feed\" đảm bảo từng hạt đậu nành hay búp trà được trồng tại các trang trại chuẩn sinh học, trải qua 14 bước kiểm định chất lượng khắt khe với hơn 150.000 lượt kiểm nghiệm mỗi năm để đạt độ tinh khiết tuyệt đối.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Kiểm tra khâu cuối là quá muộn; Herbalife kiểm soát từ nguyên liệu thô ban đầu.\nPhương án C chưa đúng: Herbalife tự chủ các trang trại trồng trọt sinh học đạt chuẩn quốc tế.\nPhương án D chưa đúng: Quy trình ưu tiên hàng đầu cho độ an toàn, Mật độ Dinh dưỡng và tính sinh học của tế bào."}, {"n": 6, "q": "Khái niệm \"Dinh Dưỡng Cấp Độ Tế Bào\" (Cellular Nutrition) được các nhà khoa học NAB nghiên cứu dựa trên nguyên lý nào?", "opts": ["Nhồi nhét thật nhiều Calo vào cơ thể để tế bào bị phình to ra.", "Làm sạch mảng bám vi nhung mao ruột, phục hồi khả năng hấp thu, rồi nuôi dưỡng từng tế bào bằng các vi chất phân tử nhỏ.", "Sử dụng chất hóa học để kích thích tế bào tự chia tách liên tục.", "Ép tế bào phải tiêu thụ mỡ thừa mà không cần nạp đạm sạch."], "answer": "B", "explain": "Đột phá khoa học! Cơ thể muốn khỏe thì 75 ngàn tỷ tế bào phải khỏe. Công trình của NAB tập trung làm sạch niêm mạc ruột (nhờ Lô hội), sau đó đưa 21 vi chất phân tử nhỏ trong F1 hấp thu thẳng qua vi nhung mao vào máu nuôi dưỡng tế bào tức thì.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Dinh dưỡng tế bào ưu tiên Calo thấp và vi chất cao, không nhồi nhét Calo rỗng.\nPhương án C chưa đúng: Sản phẩm dinh dưỡng hoàn toàn tự nhiên, không dùng hóa chất kích thích tế bào.\nPhương án D chưa đúng: Tế bào bắt buộc phải có đạm sạch để duy trì sự sống và phục hồi."}, {"n": 7, "q": "Ý nghĩa của các \"Kiểm Nghiệm Lâm Sàng\" (Clinical Trials) đối với các sản phẩm do NAB cố vấn phát triển?", "opts": ["Chứng minh hiệu quả sinh học thực tế và độ an toàn tuyệt đối trên cơ thể người trước khi lưu hành toàn cầu.", "Chỉ là thủ tục giấy tờ mang tính hình thức để quảng cáo.", "Kiểm nghiệm lâm sàng chỉ được thực hiện trên động vật nhỏ trong phòng thí nghiệm.", "Để làm cho giá thành sản phẩm tăng lên gấp 10 lần."], "answer": "A", "explain": "Bằng chứng khoa học không thể chối cãi! Các sản phẩm như F1, PPP, Niteworks đều trải qua các nghiên cứu lâm sàng độc lập tại các Đại học Y khoa uy tín (như UCLA, Đại học Ulm - Đức, Đại học Quốc gia Seoul) chứng minh khả năng giảm mỡ, giữ cơ và an toàn cho sức khỏe.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Kiểm nghiệm lâm sàng là tiêu chuẩn khắt khe nhất của Y học, không phải hình thức.\nPhương án C chưa đúng: Kiểm nghiệm lâm sàng của Herbalife được thực hiện trực tiếp trên cơ thể người volunteer.\nPhương án D chưa đúng: Kiểm nghiệm lâm sàng là để bảo vệ sức khỏe người dùng, không phải để nâng giá."}, {"n": 8, "q": "Sự hợp tác giữa GS. Louis Ignarro và Herbalife đã cho ra đời sản phẩm độc đáo nào giúp bảo vệ hệ Tim Mạch ban đêm?", "opts": ["Bột Protein Cá Nhân PPP.", "Niteworks (Công thức hỗ trợ sản sinh Nitric Oxide giúp giãn mạch máu, giữ thành mạch dẻo dai và ngăn ngừa đột quỵ đêm).", "Lô Hội Thảo Mộc Cô Đặc.", "Trà Thảo Mộc Cô Đặc."], "answer": "B", "explain": "Đột phá từ Giải Nobel! Ban đêm là lúc hàm lượng Nitric Oxide (NO) trong cơ thể sụt giảm xuống mức thấp nhất, dễ gây co thắt mạch máu và đột quỵ. Niteworks chứa L-Arginine và L-Citrulline kích thích cơ thể tự sản xuất NO mạnh mẽ, bảo vệ trái tim lúc ngủ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: PPP là sản phẩm bổ sung đạm sạch nuôi cơ bắp.\nPhương án C chưa đúng: Lô hội giúp tráng rửa và làm sạch hệ tiêu hóa.\nPhương án D chưa đúng: Trà thảo mộc hỗ trợ tỉnh táo và đốt mỡ ban ngày."}, {"n": 9, "q": "Tiêu chuẩn chất lượng \"Informed-Sport / NSF\" mà dòng sản phẩm Herbalife 24 đạt được do NAB cố vấn nghĩa là gì?", "opts": ["Chứng nhận hoàn toàn không chứa bất kỳ chất cấm (Doping) nào, an toàn tuyệt đối cho các vận động viên thi đấu Olympic.", "Chứng nhận sản phẩm chỉ dành riêng cho môn bóng đá.", "Chứng nhận sản phẩm giúp người dùng tăng 10kg cơ bắp trong 3 ngày.", "Chứng nhận sản phẩm được sản xuất bằng thủ công truyền thống."], "answer": "A", "explain": "Đỉnh cao an toàn thể thao! Dòng Herbalife 24 được kiểm nghiệm bởi LGC/Informed-Sport – tổ chức kiểm định chất cấm hàng đầu thế giới. Các siêu sao thể thao như Cristiano Ronaldo (CR7) hoàn toàn yên tâm sử dụng hàng ngày để thi đấu đỉnh cao.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Chứng nhận áp dụng cho tất cả các môn thể thao vận động đỉnh cao.\nPhương án C chưa đúng: Tăng cơ cần quá trình dinh dưỡng rèn luyện chuẩn, không có chuyện thần tốc 3 ngày.\nPhương án D chưa đúng: Dòng H24 được sản xuất trên dây chuyền công nghệ sinh học hiện đại nhất thế giới."}, {"n": 10, "q": "Tại sao các sản phẩm Dinh dưỡng Herbalife lại được Bộ Y Tế hơn 95 quốc Gia cấp phép lưu hành an toàn?", "opts": ["Vì Herbalife sử dụng chiến dịch tiếp thị đắt tiền ở từng quốc gia.", "Vì sản phẩm đáp ứng hoàn toàn các tiêu chuẩn kiểm nghiệm khắt khe nhất về Vệ sinh An toàn Thực phẩm và Dinh dưỡng Y tế.", "Vì tất cả các quốc gia đều áp dụng một chuẩn cấp phép sơ sài giống nhau.", "Vì sản phẩm không chứa bất kỳ thành phần dinh dưỡng nào."], "answer": "B", "explain": "Hộ chiếu lưu hành toàn cầu! Mỗi quốc gia có cơ quan quản lý thực phẩm/dược phẩm cực kỳ nghiêm ngặt (như FDA Mỹ, Cục An toàn Thực phẩm - Bộ Y tế Việt Nam). Việc được hơn 95 quốc gia cấp phép là minh chứng cho độ an toàn và chất lượng vượt trội.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Tiếp thị không thể can thiệp vào quy trình kiểm định pháp lý Y tế của một quốc gia.\nPhương án C chưa đúng: Mỗi quốc gia có hàng rào pháp lý Y tế và tiêu chuẩn kiểm nghiệm hoàn toàn độc lập.\nPhương án D chưa đúng: Sản phẩm đong đầy vi chất và đạm sạch mới đạt chuẩn kiểm nghiệm."}, {"n": 11, "q": "Triết lý \"Đĩa ăn đa sắc màu\" (Phytonutrients) do GS. David Heber khởi xướng mang lại giá trị bảo vệ sức khỏe nào?", "opts": ["Mỗi màu sắc rau củ chứa các hoạt chất chống oxy hóa riêng biệt giúp bảo vệ tế bào khỏi gốc tự do và phòng bệnh mãn tính.", "Màu sắc đĩa ăn chỉ có tác dụng kích thích thị giác để ăn ngon miệng hơn.", "Ăn đĩa ăn đa sắc màu giúp triệt tiêu hoàn toàn nhu cầu nạp đạm.", "Đĩa ăn đa sắc màu làm gia tăng hàm lượng chất béo bão hòa."], "answer": "A", "explain": "Y học dinh dưỡng màu sắc! GS. David Heber chỉ ra: Màu Đỏ (bảo vệ tim), Xanh (sức khỏe tế bào), Tím (não bộ), Cam (mắt/miễn dịch), Trắng (xương khớp). Bổ sung đa dạng màu sắc giúp cơ thể sở hữu lá chắn chống oxy hóa toàn diện.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Màu sắc thực vật chứa các vi chất sinh học Phytonutrients quý giá nuôi tế bào.\nPhương án C chưa đúng: Phytonutrients bảo vệ tế bào, không thay thế vai trò xây dựng của đạm.\nPhương án D chưa đúng: Rau củ quả đa sắc màu hoàn toàn không chứa chất béo bão hòa xấu."}, {"n": 12, "q": "Sự khác biệt cốt lõi giữa \"Bữa ăn F1 có bảo chứng từ NAB\" và các loại \"Bột Ngũ Cốc / Bột Đậu Xay Thô\" trên thị trường?", "opts": ["Bột đậu xay thô chứa nhiều vitamin và khoáng chất hơn F1.", "Bột đậu thô chưa tách béo xấu, GI cao, nghèo vi chất; F1 tách sạch béo xấu, bổ sung 21 vi chất, GI siêu thấp (17–29).", "Cả hai loại bột này có giá trị dinh dưỡng và công nghệ sản xuất giống hệt nhau.", "Bột đậu xay thô giúp hạ đường huyết nhanh hơn Bữa ăn F1."], "answer": "B", "explain": "Đẳng cấp công nghệ sinh học! Bột đậu xay thô chưa qua tách lọc chứa nhiều chất béo khó tiêu, chỉ số GI cao và dễ gây đầy hơi. F1 trải qua công nghệ phân lập loại bỏ tạp chất, đong đầy 21 vi chất được NAB tính toán cân bằng chuẩn xác.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Bột đậu thô bị thất thoát vi chất qua chế biến thủ công và không đủ 21 vi chất như F1.\nPhương án C chưa đúng: F1 là công trình dinh dưỡng tế bào công nghệ cao, bột đậu thô là chế biến thô sơ.\nPhương án D chưa đúng: Bột đậu thô chưa tách lọc có chỉ số GI cao hơn F1 rất nhiều."}, {"n": 13, "q": "Vai trò của Ban Cố Vấn Dinh Dưỡng NAB trong việc Đào Tạo kiến thức cho các Huấn Luyện Viên Dinh Dưỡng?", "opts": ["Cung cấp giáo trình khoa học chuẩn xác, giúp HLV thấu hiểu dinh dưỡng, hướng dẫn hội viên ăn đúng - sống khỏe mỗi ngày.", "Bắt buộc các HLV Dinh dưỡng phải mở phòng khám Y khoa.", "Đào tạo HLV kỹ năng kê đơn thuốc chữa bệnh cho hội viên.", "Đào tạo HLV kỹ thuật phẫu thuật hút mỡ thẩm mỹ."], "answer": "A", "explain": "Chuyển giao tri thức chuẩn mực! Các thành viên NAB trực tiếp đứng lớp tại các kỳ Đại hội Dinh dưỡng Toàn cầu, truyền dạy kiến thức chuẩn khoa học cho các HLV để họ trở thành \"nhà giáo dục lối sống\" tận tâm và am hiểu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: HLV hướng dẫn lối sống tại Nhóm Dinh Dưỡng, không mở phòng khám Y khoa.\nPhương án C chưa đúng: HLV không kê đơn thuốc; HLV hướng dẫn ăn uống và chọn lựa thực phẩm lành mạnh.\nPhương án D chưa đúng: HLV hướng dẫn giảm mỡ tự nhiên qua dinh dưỡng và vận động, không phẫu thuật."}, {"n": 14, "q": "Tại sao các nhà khoa học NAB lại khuyến nghị sử dụng \"Đạm Đậu Nành Phân Lập\" làm nguồn đạm nền tảng trong Bữa ăn F1 & PPP?", "opts": ["Là đạm thực vật hoàn chỉnh duy nhất chứa đủ 9 axit amin thiết yếu, 0 chất béo bão hòa, đạt chỉ số hấp thu tuyệt đối PDCAAS = 1.", "Vì đạm đậu nành phân lập có giá thành sản xuất rẻ nhất trong các loại thực phẩm.", "Vì đạm đậu nành phân lập giúp làm tăng chỉ số mỡ máu nhanh chóng.", "Vì đạm đậu nành phân lập làm cho dạ dày bị tiêu hóa chậm trong 24 giờ."], "answer": "A", "explain": "Nguồn đạm thực vật hoàn hảo nhất! Đậu nành phân lập được NAB lựa chọn vì nó cung cấp trọn vẹn 9 axit amin thiết yếu mà cơ thể không tự tổng hợp được, không chứa cholesterol bẩn, an toàn tuyệt đối cho tim mạch và hấp thu siêu tốc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Công nghệ phân lập đậu nành đòi hỏi chi phí dây chuyền khoa học rất đắt đỏ.\nPhương án C chưa đúng: Đạm đậu nành phân lập giúp làm giảm mỡ máu xấu và bảo vệ tim mạch.\nPhương án D chưa đúng: Đạm phân lập đã loại bỏ chất gây đầy hơi nên hấp thu rất nhẹ nhàng."}, {"n": 15, "q": "Trách nhiệm kiểm tra \"Độ An Toàn Tuyệt Đối không chứa Độc tố / Kim loại nặng\" trong từng lô sản phẩm do NAB giám sát?", "opts": ["Áp dụng hệ thống kiểm định tự động ISO/IEC 17025, loại bỏ sạch thủy ngân, chì, nấm mốc và vi khuẩn gây hại.", "Chỉ kiểm tra bằng cảm quan màu sắc và mùi vị bên ngoài.", "Tin tưởng tuyệt đối vào nhà cung cấp mà không cần kiểm tra phòng thí nghiệm.", "Chỉ kiểm tra độ an toàn 5 năm một lần."], "answer": "A", "explain": "Tiêu chuẩn phòng thí nghiệm đỉnh cao! Phòng thí nghiệm của Herbalife đạt chứng nhận ISO/IEC 17025 – tiêu chuẩn khắt khe nhất dành cho các phòng kiểm nghiệm Y tế, đảm bảo từng sản phẩm đến tay hội viên hoàn toàn tinh khiết.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Kiểm tra bằng máy phân tích sinh học hiện đại, không dùng cảm quan mắt thường.\nPhương án C chưa đúng: Mọi lô nguyên liệu đều bị kiểm tra nghiêm ngặt trước khi đưa vào sản xuất.\nPhương án  nhiên GI siêu thấp, không phải ngọt gắt như bánh kẹo.\nPhương án C chưa đúng: Tỷ lệ chuẩn giúp đốt mỡ nội tạng chứ không gây tích mỡ.\nPhương án D chưa đúng: Tỷ lệ dinh dưỡng quyết định phản ứng hormone và chuyển hóa của cơ thể."}, {"n": 18, "q": "Ý nghĩa của việc NAB hợp tác nghiên cứu cùng các Viện Nghiên Cứu và Trường Đại Học Y Khoa danh tiếng (như UCLA)?", "opts": ["Đảm bảo tính độc lập, khách quan, minh bạch và liên tục cập nhật những phát minh Y học dinh dưỡng tiên tiến nhất.", "Để mượn tên tuổi trường đại học để bán hàng dễ hơn.", "Các trường đại học sẽ sản xuất trực tiếp sản phẩm cho Herbalife.", "Hợp tác chỉ mang tính chất giao lưu văn hóa nghệ thuật."], "answer": "A", "explain": "Minh bạch và Đỉnh cao! Việc đặt Trung tâm Nghiên cứu Dinh dưỡng Con người tại Đại học California, Los Angeles (UCLA) giúp các nghiên cứu của Herbalife luôn nằm ở tiền tuyến của khoa học Y học hiện đại, được phản biện độc lập và công nhận toàn cầu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sự hợp tác dựa trên các đề tài nghiên cứu khoa học nghiêm túc được xuất bản trên tạp chí Y khoa.\nPhương án C chưa đúng: Đại học là nơi nghiên cứu, sản xuất do các nhà máy chuẩn GMP của Herbalife đảm nhiệm.\nPhương án D chưa đúng: Hợp tác chuyên sâu về sinh học tế bào, dinh dưỡng lâm sàng và y học chuyển hóa."}, {"n": 19, "q": "Thái độ đúng đắn của một Hội viên thông thái khi đứng trước các tin đồn tiêu cực trôi nổi về sản phẩm dinh dưỡng?", "opts": ["An tâm tin tưởng vào bảo chứng của hơn 300 nhà khoa học NAB, chứng nhận Bộ Y tế 95 quốc gia và kết quả cơ thể mình.", "Hoang mang lo sợ và ngay lập tức quay lại thói quen ăn uống đồ chiên xào béo xấu.", "Tự ý tăng gấp 10 lần liều lượng sử dụng mà không hỏi HLV.", "Bỏ qua hoàn toàn các bài học dinh dưỡng tại Nhóm Dinh Dưỡng."], "answer": "A", "explain": "Niềm tin dựa trên tri thức khoa học! Sản phẩm Herbalife được bảo chứng bởi giải Nobel Y học, Chủ tịch Viện Dinh dưỡng UCLA, hơn 300 nhà khoa học NAB và sự phê duyệt của Bộ Y tế 95 quốc gia. Sự thay đổi vòng eo và sức khỏe tốt lên từng ngày của chính bạn là câu trả lời đắt giá nhất!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Hoang mang quay lại thói quen cũ sẽ lại rước mỡ nội tạng và bệnh tật vào người.\nPhương án C chưa đúng: Sử dụng dinh dưỡng cần sự điều độ theo đúng hướng dẫn của HLV.\nPhương án D chưa đúng: Học bài học dinh dưỡng giúp bạn có \"bộ lọc tri thức\" để không bị xao động."}, {"n": 20, "q": "Thông điệp cốt lõi và giá trị tự hào nhất về Ban Cố Vấn Dinh Dưỡng Herbalife mang lại cho mỗi hội viên?", "opts": ["\"KHOA HỌC ĐỈNH CAO - BẢO CHỨNG NIỀM TIN: Tự hào trải nghiệm giải pháp dinh dưỡng được nghiên cứu bởi các Giáo sư Y học hàng đầu thế giới!\"", "Sản phẩm dinh dưỡng Herbalife được sản xuất dựa trên cảm tính cá nhân.", "Càng uống nhiều sản phẩm thì càng không cần phải tập thể dục hay uống nước.", "Ban Cố Vấn Dinh Dưỡng chỉ phục vụ cho người giàu có."], "answer": "A", "explain": "Tự hào người tiêu dùng thông thái! Mỗi lần thưởng thức ly Shake F1 hay ly trà thảo mộc, bạn đang thụ hưởng thành quả nghiên cứu khoa học của hơn 300 Giáo sư, Tiến sĩ hàng đầu nhân loại. Đó là tấm lá chắn bảo vệ sức khỏe an toàn và giá trị nhất cho bạn và gia đình!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sản phẩm dựa trên 100% bằng chứng khoa học và kiểm nghiệm lâm sàng khắt khe.\nPhương án C chưa đúng: Dinh dưỡng chuẩn luôn đi kèm lối sống năng động: uống nước 3Đ và vận động 20%.\nPhương án D chưa đúng: Dinh dưỡng Herbalife hướng tới phục vụ sức khỏe cho toàn bộ cộng đồng nhân loại."}];
const TKP_LESSON=12;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}

function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}

function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI KHOA HỌC<br>BẢO CHỨNG BAN CỐ VẤN DINH DƯỠNG</h1><div class="subtitle">KHÁM PHÁ BAN CỐ VẤN DINH DƯỠNG TOÀN CẦU</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
