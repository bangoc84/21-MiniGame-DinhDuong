:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Đâu là nguồn gốc cốt lõi tạo nên \"Sức Mạnh Nội Tại\" giúp một hội viên kiên trì thay đổi vóc dáng và sức khỏe bền vững tại Nhóm Dinh Dưỡng?", "opts": ["Nhờ sự ép buộc gắt gao và đe dọa từ những người xung quanh.", "Xác định được \"Lý do đủ lớn\" (Big Why) xuất phát từ tình yêu thương bản thân và gia đình.", "Nhờ vào việc mua tích trữ thật nhiều sản phẩm về để ở nhà.", "Phụ thuộc hoàn toàn vào may mắn và yếu tố di truyền của cơ thể."], "answer": "B", "explain": "\"Khi Lý do đủ lớn - Mọi rào cản chỉ là chuyện nhỏ!\" Động lực bên ngoài (lời chê bai, sự ép buộc) chỉ tồn tại trong vài ngày. Nguồn sức mạnh vô tận giúp hội viên thức dậy mỗi sáng, vượt qua bẫy đồ ăn vặt và giữ kỷ luật chính là ước mơ thấy mình sống khỏe, sống an vui để chăm sóc con cháu và tận hưởng cuộc sống.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Sự ép buộc chỉ tạo ra áp lực tâm lý tiêu cực và rất dễ dẫn đến phản ứng bỏ cuộc giữa chừng.\nPhương án C chưa đúng: Mua nhiều sản phẩm nhưng thiếu lý do và kỷ luật thì sản phẩm vẫn nằm yên trong tủ.\nPhương án D chưa đúng: Di truyền chỉ quyết định 20%, 80% sức mạnh chuyển hóa nằm ở sự lựa chọn lối sống của bạn."}, {"n": 2, "q": "Sự khác biệt về mặt sức mạnh giữa \"Tri Thức Dinh Dưỡng (Biết cách ăn)\" và \"Sự Nỗ Lực Mù Quáng (Nhịn ăn ép cân)\"?", "opts": ["Tri thức mang lại sự tự do và kết quả trọn đời; Nỗ lực mù quáng gây tổn hại sức khỏe và dẫn đến bẫy tăng cân lại.", "Nỗ lực mù quáng giúp giảm cân nhanh hơn và bền vững hơn tri thức.", "Tri thức dinh dưỡng chỉ dành cho các chuyên gia, người bình thường không cần học.", "Hai yếu tố này có giá trị chuyển hóa vóc dáng hoàn toàn giống hệt nhau."], "answer": "A", "explain": "\"Tri thức là Sức mạnh - Sự thiếu hiểu biết phải trả giá đắt!\" Nhịn ăn mù quáng là cuộc chiến chống lại sinh lý cơ thể, khiến teo cơ, hạ BMR và tích mỡ nặng hơn khi ăn lại. Trong khi đó, học 21 bài học dinh dưỡng giúp bạn làm chủ đĩa ăn, biết chọn thực phẩm GI thấp, ăn no mà vẫn giảm mỡ an toàn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nhịn ăn ép cân chỉ giảm nước và cơ cấp tốc, gây hậu quả béo phì dội ngược (Yo-Yo effect).\nPhương án C chưa đúng: Tri thức dinh dưỡng là kỹ năng sống còn bắt buộc mọi người cần có để tự bảo vệ mình.\nPhương án D chưa đúng: Một bên phá hủy cỗ máy chuyển hóa, một bên nuôi dưỡng và tái sinh tế bào."}, {"n": 3, "q": "\"Sức Mạnh của Môi Trường Nhóm Dinh Dưỡng\" được ví như điều gì trong việc giúp hội viên giữ vững kỷ luật?", "opts": ["Giống như một phòng khám Y tế nghiêm ngặt đầy áp lực bệnh lý.", "Như \"Lò than hồng\": Năng lượng tích cực, sự vinh danh và đồng điệu giúp hòn than nguội cũng phải rực cháy.", "Giống như một nơi chỉ để đến mua bán hàng hóa rồi đi về ngay.", "Như một cuộc thi đấu căng thẳng để phân biệt thắng thua giữa các hội viên."], "answer": "B", "explain": "\"Cộng hưởng năng lượng!\" Một mình thay đổi thói quen rất dễ bị năng lượng tiêu cực bên ngoài dập tắt. Tại Nhóm Dinh Dưỡng, nụ cười, lời động viên, tiếng vỗ tay vinh danh từng 0,5kg mỡ giảm được tạo thành \"lò than rực cháy\", tiếp thêm sức mạnh cho bất kỳ ai bước chân vào!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nhóm Dinh Dưỡng là ngôi nhà thứ hai ngập tràn tình yêu thương, không phải phòng khám Y tế.\nPhương án C chưa đúng: Giá trị lớn nhất của Nhóm Dinh Dưỡng là Môi trường trải nghiệm và Giáo dục thói quen.\nPhương án D chưa đúng: Nhóm Dinh Dưỡng không có sự cạnh tranh gay gắt mà là sự đồng hành nâng đỡ nhau cùng khỏe."}, {"n": 4, "q": "Bẫy tâm lý: \"Tôi sẽ có sức mạnh thay đổi khi nào tôi RẢNH RỖI và HẾT CẮNG THẲNG CÔNG VIỆC\"?", "opts": ["Sai lầm! Sức mạnh thực sự đến từ sự KỶ LUẬT TRONG CHÍNH LÚC BẬN RỘN; Dinh dưỡng đúng giúp tăng năng lượng để giải quyết bận rộn.", "Đúng! Bận rộn thì không thể nào áp dụng được lối sống dinh dưỡng lành mạnh.", "Khi bận rộn nên ăn nhiều đồ chiên xào để bổ sung năng lượng nhanh nhất.", "Dinh dưỡng lành mạnh chỉ dành cho những người đã nghỉ hưu."], "answer": "A", "explain": "\"Đừng chờ thời điểm hoàn hảo!\" Rảnh rỗi tuyệt đối là điều không bao giờ đến. Chính ly F1 pha nhanh 1 phút lại là giải pháp dinh dưỡng cứu tinh cho người bận rộn, giúp bộ não minh mẫn, cơ thể dẻo dai để vượt qua áp lực công việc một cách nhẹ nhàng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dinh dưỡng F1 thiết kế tối ưu cho người bận rộn (chỉ mất 1 phút chuẩn bị).\nPhương án C chưa đúng: Đồ chiên xào Calo cao làm trì trệ não bộ, gây buồn ngủ và kiệt sức nhanh hơn.\nPhương án D chưa đúng: Doanh nhân, người trẻ làm việc cường độ cao lại càng cần Dinh dưỡng tế bào."}, {"n": 5, "q": "Vai trò của \"Huấn Luyện Viên Dinh Dưỡng (HLV)\" đóng góp vào 80% sức mạnh thành công của hội viên như thế nào?", "opts": ["Người thắp sáng niềm tin, bám sát Daily 1:1, chỉnh đĩa ăn, tháo gỡ rào cản tâm lý và giữ kỷ luật cho hội viên.", "HLV là người thay thế hoàn toàn việc ăn uống và tập luyện cho hội viên.", "HLV chỉ xuất hiện khi hội viên gặp sự cố sức khỏe nghiêm trọng.", "Vai trò của HLV chỉ là tính tiền sản phẩm mỗi cuối tháng."], "answer": "A", "explain": "\"Đồng hành tạo nên kỳ tích!\" Sản phẩm tốt có ở khắp nơi, nhưng người đồng hành Daily 1:1 mới là chìa khóa hiếm có. HLV như người dẫn đường: nhắc uống nước, soi từng bức ảnh đĩa ăn, động viên lúc nản lòng và định hướng tư duy chuẩn xác cho bạn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: HLV hướng dẫn và đồng hành, sự lựa chọn ăn uống vẫn thuộc về chính hội viên.\nPhương án C chưa đúng: HLV đồng hành hàng ngày (Daily) để phòng ngừa nguy cơ, không chờ đến khi có sự cố.\nPhương án D chưa đúng: HLV là chuyên gia khai vấn thói quen và nâng tầm chất lượng sống cho hội viên."}, {"n": 6, "q": "Khái niệm \"Sức Mạnh của Sự Tích Tiểu Thành Đại\" (Quy luật 1% mỗi ngày) áp dụng trong Dinh Dưỡng nghĩa là gì?", "opts": ["Thay đổi 1% thói quen nhỏ mỗi ngày (uống thêm 1 ly nước, bớt 1 thìa cơm) tạo nên bước nhảy vọt vóc dáng sau 90 ngày.", "Phải làm điều gì đó thật đùng đùng, giảm 10kg trong 3 ngày mới gọi là sức mạnh.", "Mỗi ngày thay đổi 1% nghĩa là không cần phải tập luyện hay kiểm soát Calo.", "Sự thay đổi nhỏ hàng ngày không có giá trị sinh học đối với tế bào."], "answer": "A", "explain": "\"Hạt mầm nhỏ tạo nên cổ thụ!\" Không ai béo lên sau 1 đêm và cũng không ai khỏe ngay sau 1 bữa ăn. Sức mạnh vĩ đại nằm ở sự liên tục: Mỗi ngày giảm chút Calo rỗng, nhấp thêm ngụm nước ấm, uống 1 ly Shake F1 – sau 3 tháng bạn sẽ có một cỗ máy sinh học hoàn toàn mới!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Giảm 10kg trong 3 ngày là phản khoa học (mất nước nguy hiểm), gây hậu quả teo cơ.\nPhương án C chưa đúng: 1% là sự tiến bộ nhỏ có định hướng kỷ luật hàng ngày, không phải buông xả.\nPhương án D chưa đúng: Tế bào nhân đôi từng giây, tích lũy sự thay đổi nhỏ sẽ tạo nên sự chuyển hóa toàn diện."}, {"n": 7, "q": "Sức mạnh khoa học bảo chứng chất lượng đằng sau Bữa Ăn F1 và các Sản phẩm Herbalife đến từ đâu?", "opts": ["Chuỗi khép kín 14 bước Seed to Feed, 150.000 kiểm nghiệm/năm & Ban Cố Vấn NAB gồm 300 Giáo sư, Tiến sĩ, Nobel Y học.", "Đến từ các quảng cáo rầm rộ trên truyền hình và sự thuê người nổi tiếng nói tốt.", "Do sản phẩm được chế biến bằng phương pháp thủ công gia truyền.", "Do sản phẩm chứa các hóa chất làm sụt cân thần tốc."], "answer": "A", "explain": "\"Khoa học tạo nên niềm tin vững chắc!\" Sức mạnh sản phẩm không nằm ở lời đồn mà nằm ở nền tảng khoa học Y sinh vượt trội. Ban cố vấn NAB (dẫn đầu bởi GS. David Heber, GS. Louis Ignarro đạt giải Nobel) trực tiếp nghiên cứu, mang lại sự an tâm tuyệt đối cho hội viên.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Herbalife không chi tiền quảng cáo thương mại rầm rộ mà tập trung ngân sách cho nghiên cứu khoa học.\nPhương án C chưa đúng: Sản phẩm sản xuất tại nhà máy HIM đạt chuẩn Dược phẩm GMP, hoàn toàn không phải thủ công.\nPhương án D chưa đúng: Sản phẩm là dinh dưỡng thảo mộc tinh khiết 100%, tuyệt đối không chứa hóa chất hại thân."}, {"n": 8, "q": "Đâu là \"Sức Mạnh của Sự Chịu Trách Nhiệm 100%\" đối với Sức Khỏe cá nhân tại Nhóm Dinh Dưỡng?", "opts": ["Ngừng đổ lỗi cho hoàn cảnh/di truyền; làm chủ quyết định nạp gì vào miệng và chủ động chăm sóc sức khỏe cho chính mình.", "Đổ toàn bộ trách nhiệm sức khỏe của mình cho Bác sĩ và Thuốc tây.", "Đổ lỗi cho HLV Dinh dưỡng khi mình tự ý ăn uống sai kỷ luật ngoài đường.", "Nghĩ rằng sức khỏe tốt hay xấu hoàn toàn do số phận an an an bài."], "answer": "A", "explain": "\"Bác sĩ tốt nhất là chính mình!\" Khi bạn thôi đổ lỗi cho thời tiết, thức ăn cám dỗ hay gen di truyền và nhận thức rằng: \"Mọi thứ nạp qua miệng là do tay mình chọn\", bạn chính thức sở hữu sức mạnh làm chủ vận mệnh sức khỏe của mình!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bác sĩ chỉ hỗ trợ điều trị khi có bệnh, không thể ăn uống lành mạnh thay bạn hàng ngày.\nPhương án C chưa đúng: HLV hướng dẫn giải pháp, hội viên phải là người trực tiếp thực hành kỷ luật.\nPhương án D chưa đúng: Sức khỏe do 80% lối sống quyết định, hoàn toàn nằm trong tầm tay lựa chọn của bạn."}, {"n": 9, "q": "Ý nghĩa của việc vượt qua \"Tiếng ồn & Sự cản trở từ môi trường xung quanh\" khi bạn bắt đầu hành trình thay đổi?", "opts": ["Giữ vững niềm tin nội tại, hiểu rằng người khác cản trở vì chưa có tri thức; dùng KẾT QUẢ RỰC RỠ để chứng minh.", "Ngay lập tức tranh cãi gay gắt và mắng chửi những người phản đối mình.", "Từ bỏ ngay lập tức chương trình dinh dưỡng vì sợ người khác dị nghị.", "Giấu kín không dám uống nước ấm hay ăn F1 trước mặt ai."], "answer": "A", "explain": "\"Kết quả là câu trả lời đanh thép nhất!\" Khi thấy bạn ăn uống khác biệt, người thân có thể lo lắng vì chưa hiểu. Đừng tranh cãi lời nói! Hãy kiên trì thực hành, khi bạn giảm 5kg mỡ, da sáng hồng, tinh thần tràn đầy năng lượng, chính họ sẽ xin bạn chỉ bí quyết!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Tranh cãi bằng lời nói chỉ làm rạn nứt mối quan hệ và tạo năng lượng tiêu cực.\nPhương án C chưa đúng: Từ bỏ ước mơ sức khỏe của mình chỉ vì sự thiếu hiểu biết của người khác là quyết định sai lầm.\nPhương án D chưa đúng: Hãy tự hào vì bạn đang đón nhận giải pháp dinh dưỡng thông thái hàng đầu thế giới."}, {"n": 10, "q": "Tác động của \"Sức Mạnh Lòng Biết Ơn\" đối với sự phục hồi Tế Bào và sự An Vui trong tâm thức?", "opts": ["Biết ơn cơ thể, biết ơn bữa ăn F1, biết ơn HLV giúp dập tắt Cortisol, hạ huyết áp và nâng cao tần số năng lượng tự chữa lành.", "Lòng biết ơn chỉ là lý thuyết suông, không có tác động sinh học nào.", "Lòng biết ơn làm cho tế bào bị thụ động và ngưng trệ chuyển hóa.", "Biết ơn chỉ cần thiết khi chúng ta đã giảm được 20kg mỡ."], "answer": "A", "explain": "\"Biết ơn là chất xúc tác kỳ diệu!\" Y học chứng minh: Khi bạn dành lòng biết ơn cho trái tim đang đập, cho ly Shake F1 thanh sạch nuôi tế bào, não bộ lập tức xả Endorphin. Tần số cảm xúc tích cực này giúp mạch máu thư giãn, vi nhung mao ruột phục hồi và tế bào trẻ hóa.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lòng biết ơn được chứng minh bằng khoa học thần kinh làm thay đổi nồng độ hormone trong máu.\nPhương án C chưa đúng: Lòng biết ơn kích hoạt cỗ máy sinh học làm việc trong sự hưng phấn và chữa lành.\nPhương án D chưa đúng: Hãy thực hành lòng biết ơn ngay từ ngụm nước ấm đầu tiên mỗi sáng."}, {"n": 11, "q": "Khái niệm \"Sức Mạnh của Sự Lan Tỏa Giá Trị\" (Giúp người khác chính là giúp mình) tại Nhóm Dinh Dưỡng?", "opts": ["Khi bạn giúp một người thân/bạn bè khỏe mạnh, năng lượng hạnh phúc dội ngược lại giúp bạn giữ kỷ luật và vóc dáng bền vững.", "Lan tỏa chỉ nhằm mục đích kiếm lợi nhuận tài chính đơn thuần.", "Chỉ nên giữ bí quyết sức khỏe cho riêng mình, không nên chia sẻ cho ai.", "Giúp đỡ người khác sẽ làm mất đi lượng vi chất trong cơ thể mình."], "answer": "A", "explain": "\"Gieo hạt sức khỏe - Nhận gặt An Vui!\" Khi bạn trao giải pháp F1 cho người khác và thấy họ ngủ ngon hơn, giảm mỡ bụng, hết đau khớp, niềm vui phụng sự đó là nguồn sức mạnh tinh thần to lớn, củng cố kỷ luật bản thân lên gấp mười lần!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lan tỏa xuất phát từ tình yêu thương và sứ mệnh phụng sự cộng đồng \"Cho là Nhận\".\nPhương án C chưa đúng: Giấu giếm bí quyết là tư duy ích kỷ, ngăn cản dòng chảy hạnh phúc dội lại bản thân.\nPhương án D chưa đúng: Chia sẻ tri thức giúp bạn càng khắc sâu kiến thức dinh dưỡng cho chính mình."}, {"n": 12, "q": "Sức mạnh của \"Chỉ số Đường Huyết GI siêu thấp (17-29)\" trong ly Bữa ăn F1 mang lại sự ổn định tâm trạng ra sao?", "opts": ["Giữ đường huyết phẳng lặng, không gây vọt Insulin, giúp tâm trí êm ái, tỉnh táo, ngăn sóng cảm xúc thất thường & thèm ăn.", "Làm cho đường huyết bị sụt giảm nghiêm trọng gây ngất xỉu.", "Làm cho cơ thể bị dư thừa lượng đường tích mỡ nội tạng.", "Không có tác động gì tới tâm trạng hay thần kinh."], "answer": "A", "explain": "\"Đường huyết ổn định - Tâm trí An Vui!\" Ăn thực phẩm GI cao (bánh mì, phở) làm đường huyết tăng vọt rồi tụt dốc thảm hại, gây hiện tượng \"Cơn giận do đói\" (Hangry), gắt gỏng và thèm ngọt. Ly F1 GI rất thấp giúp dòng đường vào máu chậm rãi, giữ thần kinh luôn phẳng lặng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: F1 cung cấp tinh bột phức hợp giải phóng chậm, duy trì đường huyết an toàn, không gây hạ đường.\nPhương án C chưa đúng: GI thấp giúp ngăn chặn sản sinh Insulin, chống tích mỡ bụng tối đa.\nPhương án D chưa đúng: Đường huyết quyết định 70% sự trồi sụt cảm xúc và độ tập trung của bộ não."}, {"n": 13, "q": "\"Sức Mạnh của Sự Tự Do Lựa Chọn\" trong triết lý dinh dưỡng Herbalife khác biệt gì so với các phương pháp Ăn Kiêng Ép Buộc?", "opts": ["Ăn kiêng ép buộc là sự chịu đựng khổ sở; Dinh dưỡng Herbalife mang lại sự TỰ DO LỰA CHỌN thông thái dựa trên tri thức.", "Dinh dưỡng Herbalife bắt buộc hội viên phải nhịn ăn hoàn toàn các món ăn truyền thống.", "Ăn kiêng ép buộc giúp tinh thần thoải mái hơn.", "Hai phương pháp này hoàn toàn giống nhau về mặt tư duy."], "answer": "A", "explain": "\"Từ Chịu đựng chuyển sang Tự nguyện!\" Phương pháp cũ ép bạn cắt bỏ món yêu thích khiến bạn luôn thèm khát và bùng nổ ăn bù. Tại Nhóm Dinh Dưỡng, bạn hiểu Calo và GI, bạn hoàn toàn tự do chọn ăn miếng gà luộc hay ly F1 trong sự chủ động và hạnh phúc!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Chương trình dạy bạn cách đi chợ ăn đồ truyền thống thông thái kết hợp bữa ăn F1.\nPhương án C chưa đúng: Ăn kiêng gượng ép gây stress, trầm cảm và kiệt quệ năng lượng sống.\nPhương án D chưa đúng: Một bên là sự gượng ép ngắn hạn, một bên là thói quen lối sống tự do bền vững."}, {"n": 14, "q": "Tại sao \"Sự Kiên Trì Dài Hạn\" lại tạo nên sức mạnh làm mới toàn bộ 75 ngàn tỷ tế bào trong cơ thể?", "opts": ["Chu kỳ sống của tế bào đỏ là 120 ngày, tế bào da 28 ngày; cần thời gian kiên trì để tế bào mới sinh ra hoàn toàn tinh sạch.", "Tế bào cơ thể người có khả năng thay mới hoàn toàn chỉ sau 24 giờ.", "Dài hạn hay ngắn hạn không ảnh hưởng gì tới chất lượng tế bào.", "Sự kiên trì làm cho cỗ máy chuyển hóa bị mệt mỏi."], "answer": "A", "explain": "\"Quy luật sinh học của sự tái tạo!\" Tế bào dạ dày thay mới mỗi 5 ngày, tế bào máu thay sau 120 ngày, tế bào gan sau 500 ngày. Duy trì dinh dưỡng sạch liên tục trong vài tháng là bạn đang \"đúc\" lại một cơ thể hoàn toàn mới khỏe mạnh từ cấp độ tế bào!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sinh học tế bào cần thời gian chu kỳ nhất định, không thể làm mới trong 24h.\nPhương án C chưa đúng: Ăn sạch ngắt quãng vài ngày rồi ăn bẩn lại sẽ làm gián đoạn tiến trình tái tạo tế bào.\nPhương án D chưa đúng: Kiên trì đúng cách giúp cỗ máy chuyển hóa ngày càng khỏe mạnh và trẻ trung."}, {"n": 15, "q": "Sức mạnh của việc \"Bắt đầu ngày mới bằng Bộ Ba Hoàn Hảo: Lô Hội + Trà Thảo Mộc + Ly Shake F1\"?", "opts": ["Lô hội tráng rửa ruột, Trà đánh thức chuyển hóa & bóc mỡ, F1 nạp 21 vi chất – tạo bệ phóng năng lượng đỉnh cao cả ngày.", "Bộ ba này khiến cho dạ dày bị quá tải không tiêu hóa nổi.", "Bộ ba này thay thế hoàn toàn nhu cầu uống nước lọc rải rác trong ngày.", "Chỉ dành riêng cho các vận động viên chuyên nghiệp."], "answer": "A", "explain": "\"Khởi đầu minh triết cho cỗ máy triệu đô!\" Buổi sáng: Lô hội giúp \"tắm\" đường ruột sạch sẽ; Trà thảo mộc \"quét\" sạch mốc sương thần kinh, bóc tách mỡ thừa; Ly F1 + PPP \"nạp\" năng lượng tế bào. Bộ ba hoàn hảo giúp bạn làm chủ ngày mới!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bộ ba thiết kế dạng lỏng lỏng sinh học, siêu nhẹ bụng, hấp thu êm ái vào máu.\nPhương án C chưa đúng: Vẫn bắt buộc duy trì uống nước lọc ấm theo quy tắc 3Đ suốt cả ngày.\nPhương án D chưa đúng: Bộ ba bữa sáng lành mạnh phục vụ cho tất cả mọi người từ trẻ nhỏ đến người già."}, {"n": 16, "q": "Đâu là sức mạnh của sự \"Chuyển Hóa Kết Quả Bản Thân\" (Becoming a Product of the Product)?", "opts": ["Vóc dáng thon gọn, làn da căng sáng & năng lượng rạng rỡ của chính bạn là lời quảng cáo chân thực và có sức mạnh nhất.", "Kết quả bản thân không có ý nghĩa gì bằng lời nói suông.", "Cần phải đợi đến khi người khác thay đổi thì mình mới thay đổi theo.", "Chỉ cần dùng sản phẩm, không cần thay đổi vóc dáng hay sức khỏe."], "answer": "A", "explain": "\"Bằng chứng sống hơn ngàn lời nói!\" Khi bạn từ một người mệt mỏi, béo bụng trở thành người dẻo dai, vòng eo thon gọn, thần thái an vui – chính kết quả thực tế của bạn có sức mạnh truyền cảm hứng tự nhiên mạnh mẽ nhất đến gia đình và bạn bè.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lời nói suông không có giá trị bằng sự thay đổi vóc dáng và sức khỏe thực tế.\nPhương án C chưa đúng: Bạn phải là người tiên phong làm chủ sức khỏe của mình trước tiên.\nPhương án D chưa đúng: Mục tiêu tối thượng của dinh dưỡng là tạo ra sự chuyển hóa sức khỏe và vóc dáng thực sự."}, {"n": 17, "q": "Khái niệm \"Sức Mạnh của Sự Buông Bỏ Thói Quen Xấu\" (Cắt giảm đường ngầm, béo xấu, thức khuya) tại Nhóm Dinh Dưỡng?", "opts": ["Dọn dẹp không gian nội bào, trút bỏ gánh nặng cho Gan & Thận, giúp cỗ máy cơ thể tự do kích hoạt cơ thể tự chữa lành.", "Buông bỏ thói quen xấu làm cho cuộc sống trở nên nhàm chán và thiếu năng lượng.", "Thói quen xấu không gây ảnh hưởng gì nếu chúng ta uống bù sản phẩm.", "Buông bỏ thói quen xấu là điều hoàn toàn không thể thực hiện được."], "answer": "A", "explain": "\"Trút bỏ đá nặng khỏi đôi cánh!\" Bạn không thể bay cao nếu chân còn buộc đá nặng. Ngừng nạp đường ngầm, béo xấu và thức khuya chính là trút bỏ gánh nặng độc tố, giúp cỗ máy cơ thể dồn toàn bộ nguồn lực vào việc phục hồi và trẻ hóa tế bào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Loại bỏ thói quen xấu mang lại sự nhẹ nhõm, minh mẫn và năng lượng sống đỉnh cao.\nPhương án C chưa đúng: Dinh dưỡng không phải là \"vật thế thân\" để bạn tiếp tục tàn phá cơ thể bằng thói quen xấu.\nPhương án D chưa đúng: Bạn hoàn toàn làm được khi có Môi trường Nhóm Dinh Dưỡng và HLV đồng hành."}, {"n": 18, "q": "\"Sức Mạnh của Văn Hóa Tuyên Dương & Vinh Danh\" tại Nhóm Dinh Dưỡng tác động đến tâm lý hội viên như thế nào?", "opts": ["Đánh thức sự tự tin ẩn giấu, khẳng định giá trị bản thân, tạo động lực mạnh mẽ để tiếp tục chinh phục các mục tiêu cao hơn.", "Tuyên dương chỉ làm cho hội viên trở nên chủ quan và dễ bỏ cuộc.", "Vinh danh làm gia tăng sự ganh ghét và chia rẽ trong Nhóm.", "Hoạt động vinh danh hoàn toàn không có giá trị tinh thần nào."], "answer": "A", "explain": "\"Ghi nhận từng tiến bộ nhỏ!\" Con người rất khao khát được công nhận. Một cái vỗ tay, một chiếc chứng nhận giảm 3kg mỡ hay quà vinh danh Lô hội tại Nhóm Dinh Dưỡng là nguồn nước mát tưới tắm tâm hồn, giúp hội viên tin vào chính mình và tiếp tục tỏa sáng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sự ghi nhận chân thành giúp củng cố niềm tin và kỷ luật bản thân mạnh mẽ hơn.\nPhương án C chưa đúng: Văn hóa Nhóm Dinh Dưỡng dạy sự mừng vui trước thành công của đồng đội.\nPhương án D chưa đúng: Tuyên dương là công cụ giáo dục cảm xúc và động lực đỉnh cao trong khoa học hành vi."}, {"n": 19, "q": "Tác động của \"Sức Mạnh Tri Thức 21 Bài Học Dinh Dưỡng\" đối với sự an toàn sức khỏe của cả Gia Đình hội viên?", "opts": ["Hội viên trở thành \"Bác sĩ dinh dưỡng của chính gia đình\", biết đi chợ thông thái, thay đổi góc bếp và bảo vệ nhiều thế hệ.", "Tri thức 21 bài học chỉ áp dụng được cho bản thân hội viên tại Nhóm Dinh Dưỡng.", "Học xong 21 bài học sẽ làm cho bữa ăn gia đình trở nên phức tạp và đắt đỏ hơn.", "Tri thức dinh dưỡng làm mất đi sự ấm cúng của mâm cơm gia đình."], "answer": "A", "explain": "\"Thay đổi một người - Cứu cả một thế hệ!\" Khi người phụ nữ/người chủ gia đình nắm vững 21 bài học, họ biết cách chọn thực phẩm GI thấp, luộc hấp thay vì chiên xào, cắt bớt gia vị mặn ngầm. Cả nhà (chồng, con, cha mẹ) tự động được hưởng nguồn dinh dưỡng sạch!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Tri thức dinh dưỡng là tài sản vô giá dùng để chăm sóc cho toàn bộ người thân yêu.\nPhương án C chưa đúng: Biết chọn thực phẩm giúp tiết kiệm tiền chợ và giảm thiểu chi phí viện phí tương lai.\nPhương án D chưa đúng: Mâm cơm tròn vị, chuẩn dinh dưỡng mang lại sự An Vui và kết nối gia đình sâu sắc hơn."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 19 \"ĐIỀU GÌ TẠO NÊN SỨC MẠNH\" tại Nhóm Dinh Dưỡng?", "opts": ["\"SỨC MẠNH TỪ LÝ DO ĐỦ LỚN - KẾT NỐI MÔI TRƯỜNG AN VUI: Hãy làm chủ tri thức, giữ vững kỷ luật 1% mỗi ngày để Kiến tạo Cuộc đời Khỏe Mạnh & Trọn Vẹn!\"", "Sức mạnh chỉ đến từ việc mua thật nhiều sản phẩm bổ sung.", "Sức mạnh là sự thắng thua và tranh cãi dinh dưỡng với người khác.", "Không cần làm gì cả, sức khỏe sẽ tự động tốt lên theo thời gian."], "answer": "A", "explain": "\"Đột phá từ bên trong!\" Sức mạnh thực sự không nằm ở cơ bắp bên ngoài mà nằm ở Lý do đủ lớn, Tri thức làm chủ đĩa ăn, Môi trường Nhóm Dinh Dưỡng ngập tràn năng lượng và Sự kiên trì kỷ luật mỗi ngày. Hãy kích hoạt nguồn sức mạnh này để sống một cuộc đời ý nghĩa và An Vui!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Sản phẩm là công cụ hỗ trợ, sức mạnh thực sự nằm ở sự chuyển hóa tư duy và thói quen.\nPhương án C chưa đúng: Sức mạnh là sự chiến thắng chính thói quen xấu của bản thân ngày hôm qua.\nPhương án D chưa đúng: Sức khỏe là một tài sản phải chủ động chăm sóc và vun bồi hàng ngày."}];
const TKP_LESSON=19;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI TÂM THỨC<br>KHÁM PHÁ SỨC MẠNH VƯỢT TRỘI</h1><div class="subtitle">LÝ DO ĐỦ LỚN • TRI THỨC • MÔI TRƯỜNG • KỶ LUẬT</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
