<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái vận động | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Quy tắc vàng \"80/20\" định hình vóc dáng và sức khỏe bền vững tại Nhóm Dinh Dưỡng được hiểu chuẩn xác nhất là gì?", "opts": ["80% dựa vào việc tập thể dục cường độ cao; 20% phụ thuộc vào việc ăn uống giảm cân.", "80% quyết định từ Dinh dưỡng tế bào chuẩn xác; 20% đến từ Vận động thể chất hợp lý.", "80% nhờ vào việc nhịn ăn tối đa; 20% nhờ vào việc uống các loại nước ép trái cây.", "100% kết quả hoàn toàn do vận động thể thao quyết định, dinh dưỡng không có vai trò quan trọng."], "answer": "B", "explain": "\"Dinh dưỡng kiến tạo vóc dáng - Vận động nâng tầm sức khỏe!\" 80% kết quả giảm mỡ, tăng cơ và cải thiện vóc dáng đến từ việc kiểm soát Calo đầu vào, nạp đủ đạm sạch và vi chất qua đĩa ăn. 20% vận động đóng vai trò như chất xúc tác kích thích tuần hoàn, săn chắc cơ bắp, tăng chỉ số BMR và giải giải phóng tâm trí an vui.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Tập thể dục dốc sức nhưng ăn sai (thừa Calo, thiếu đạm) sẽ không thể giảm mỡ và gây kiệt sức.\n• Phương án C chưa đúng: Nhịn ăn tàn phá cỗ máy chuyển hóa, gây teo cơ và sụt giảm miễn dịch nghiêm trọng.\n• Phương án D chưa đúng: Bỏ qua dinh dưỡng sẽ khiến 100% nỗ lực tập luyện trên phòng tập bị đổ sông đổ biển."}, {"n": 2, "q": "Khái niệm \"NEAT\" (Non-Exercise Activity Thermogenesis - Tiêu hao năng lượng từ vận động không tập luyện) có giá trị đốt Calo kỳ diệu như thế nào?", "opts": ["Là toàn bộ năng lượng tiêu hao từ các hoạt động nhỏ hàng ngày (đi bộ, leo cầu thang, dọn dẹp) chiếm tới 15–30% tổng Calo đốt cháy.", "NEAT là chỉ số Calo tiêu hao chỉ sinh ra khi bạn chạy bộ trên máy chạy chuyên nghiệp.", "NEAT là tên một loại thực phẩm chức năng giúp tiêu mỡ nội tạng thần tốc.", "NEAT chỉ có giá trị đối với các vận động viên thi đấu Olympic."], "answer": "A", "explain": "\"Tích tiểu thành đại!\" Nhiều người nghĩ chỉ 1 tiếng tập gym mới đốt Calo. Thực tế, NEAT (đi lại, đứng làm việc, quét nhà, leo thang bộ...) diễn ra suốt 16 tiếng thức mỗi ngày mới là cỗ máy âm thầm đốt hàng trăm Calo rỗng, giúp bạn năng động và giữ phom dáng mỏng nhẹ tự nhiên.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: NEAT bao gồm tất cả các cử động tự nhiên ngoài giờ tập thể thao cố định.\n• Phương án C chưa đúng: NEAT là chỉ số sinh lý học về chuyển hóa năng lượng vận động, không phải sản phẩm.\n• Phương án D chưa đúng: NEAT đặc biệt quan trọng với người làm văn phòng và người muốn kiểm soát cân nặng bền vững."}, {"n": 3, "q": "Tác hại âm thầm của \"Lối sống tĩnh tại\" (Ngồi liên tục trên 60 phút không di chuyển) đối với cỗ máy chuyển hóa và mạch máu?", "opts": ["Tắt ngấm enzym Lipoprotein Lipase tiêu mỡ, giảm 50% tốc độ lưu thông máu, gây ngưng trệ chuyển hóa và tăng mỡ nội tạng.", "Ngồi nhiều giúp bảo vệ cơ khớp không bị xói mòn và làm tăng chỉ số BMR.", "Ngồi tĩnh tại giúp não bộ sản sinh ra nhiều hormone hạnh phúc Endorphin.", "Lối sống tĩnh tại hoàn toàn không gây ảnh hưởng gì nếu buổi tối bạn có tập 30 phút."], "answer": "A", "explain": "\"Ngồi nhiều là Kẻ sát nhân thầm lặng!\" Khi ngồi liên tục quá 1 tiếng, enzym phân rã mỡ Lipoprotein Lipase sụt giảm 90%, dòng máu chảy chậm lại khiến đường và mỡ tích tụ thẳng vào nội tạng. Kể cả buổi tối bạn tập 30 phút cũng không bù đắp nổi tác hại của 8 tiếng ngồi im một chỗ!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Ngồi nhiều làm suy yếu cơ mông/đùi, gây thoái hóa đĩa đệm và làm tụt chỉ số BMR.\n• Phương án C chưa đúng: Tĩnh tại làm ngưng trệ tuần hoàn, gây uể uể, buồn ngủ và mệt mỏi tinh thần.\n• Phương án D chưa đúng: Tập 30 phút không thể trung hòa hoàn toàn tác hại chuyển hóa của việc ngồi tĩnh tại cả ngày."}, {"n": 4, "q": "Bẫy nguy hiểm: \"Tập luyện thật nặng để ăn uống thả ga / Ăn bù Calo sau khi tập thể thao\"?", "opts": ["Chạy bộ 30 phút chỉ đốt ~200 Calo, nhưng 1 bát phở/ly trà sữa nạp lại ~500–600 Calo khiến bạn TĂNG CÂN & TÍCH MỠ nhanh hơn.", "Tập luyện nặng giúp cỗ máy cơ thể tự động tiêu biến toàn bộ Calo nạp vào dù ăn bao nhiêu.", "Ăn bù Calo sau khi tập là bắt buộc để tránh bị hạ đường huyết.", "Việc ăn bù Calo giúp gia tăng khối lượng cơ bắp gấp 3 lần."], "answer": "A", "explain": "\"Đốt thì khó - Nạp thì dễ!\" Đa số mọi người phóng đại lượng Calo tiêu hao khi tập. Chạy vãi mồ hôi 30 phút mới tiêu 200 Calo (bằng 1/2 tô phở). Nếu sau tập bạn thưởng cho mình ly trà sữa hay tô bún riêu (600 Calo), bạn đã dư thừa 400 Calo rỗng – nguyên nhân khiến càng tập càng béo!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập luyện không thể vượt qua nguyên lý nhiệt động lực học tiêu thụ Calo.\n• Phương án C chưa đúng: Cần nạp ĐẠM SẠCH và Calo chuẩn, không phải ăn bù Calo rỗng béo bão hòa.\n• Phương án D chưa đúng: Ăn dư Calo từ đồ ngọt/dầu mỡ chỉ làm tăng mỡ bụng, không làm tăng cơ."}, {"n": 5, "q": "\"Khung Giờ Vàng 30 Phút Sau Khi Vận Động\" có ý nghĩa sinh học như thế nào đối với việc phục hồi và đúc cơ bắp?", "opts": ["Cửa sổ hấp thu đạm mở rộng tối đa; bổ sung Đạm sạch (F1+PPP hoặc Rebuild Strength) giúp vá lại vi sợi cơ bị xé rách.", "Là khung giờ bắt buộc phải nhịn ăn hoàn toàn để cơ thể tiếp tục đốt mỡ.", "Là lúc nên ăn nhiều đồ chiên xào để bù đắp lượng mỡ bị mất.", "Khung giờ này chỉ có tác dụng đối với việc làm đẹp da mặt."], "answer": "A", "explain": "\"Cửa sổ cơ bắp 30 phút!\" Trong lúc tập, các sợi cơ bị tổn thương xé rách li ti. Trong 30 phút sau tập, dòng máu dồn về cơ bắp đỉnh cao. Bổ sung ngay 1 ly Shake F1 + PPP hoặc Rebuild Strength cung cấp đạm phân lập giúp chữa lành vết rách, làm sợi cơ nở to và săn chắc.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nhịn ăn sau tập khiến cơ thể bị \"dị hóa cơ\" (tự ăn cơ bắp của chính mình để lấy năng lượng).\n• Phương án C chưa đúng: Đồ chiên xào chứa béo xấu gây cản trở sự hấp thu đạm và gây viêm cơ.\n• Phương án D chưa đúng: Dinh dưỡng sau tập tập trung phục hồi toàn bộ hệ thống cơ bắp toàn thân."}, {"n": 6, "q": "Khái niệm \"Vùng Nhịp Tim Đốt Mỡ\" (Fat Burning Zone - 60% đến 70% Nhịp tim tối đa) giúp hội viên tối ưu hóa việc giảm mỡ ra sao?", "opts": ["Vận động ở nhịp tim vừa phải giúp cơ thể ưu tiên sử dụng MỠ THỪA làm nguyên liệu đốt cháy thay vì đốt đường glycogen.", "Nhịp tim càng đập nhanh tối đa (trên 90%) thì tỷ lệ đốt mỡ càng đạt 100%.", "Nhịp tim khi nghỉ ngơi nằm ngủ là vùng nhịp tim đốt mỡ tốt nhất.", "Nhịp tim hoàn toàn không liên quan gì đến việc đốt mỡ hay đốt đường."], "answer": "A", "explain": "\"Đốt mỡ thông minh!\" Nhịp tim tối đa = $220 - \\text{Tuổi}$. Ở vùng 60–70% nhịp tim tối đa (như đi bộ nhanh, đạp xe nhẹ, zumba – thở hơi dốc nhưng vẫn nói được câu ngắn), cỗ máy sinh học ưu tiên huy động chất béo ra làm nhiên liệu. Tập quá nhanh sẽ khiến cơ thể chuyển sang đốt đường và vắt kiệt cơ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nhịp tim >90% cơ thể chuyển sang chế độ kị khí (Anaerobic), chỉ đốt đường và gây tích axit lactic mỏi cơ.\n• Phương án C chưa đúng: Nhịp tim nghỉ ngơi có tốc độ chuyển hóa Calo rất thấp.\n• Phương án D chưa đúng: Nhịp tim là thước đo chính xác phản ánh nguồn nhiên liệu (Mỡ hay Đường) đang bị đốt."}, {"n": 7, "q": "Tầm quan trọng của việc bổ sung \"Nước & Điện Giải\" (CR7 Drive / Nước lọc ấm) TRONG LÚC VẬN ĐỘNG?", "opts": ["Giữ thể tích máu, bù đắp Natri/Kẽm mất qua mồ hôi, ngăn ngừa co thắt chuột rút và duy trì sự dẻo dai của cơ bắp.", "Uống nước trong lúc tập sẽ làm dạ dày bị sa tụt xuống và gây sóc hông nặng.", "Giúp cơ thể không bị đổ mồ hôi nữa.", "Nước uống trong lúc tập làm giảm 100% hiệu quả đốt Calo."], "answer": "A", "explain": "\"Nhiên liệu vận hành cơ bắp!\" Mất 2% nước làm sụt giảm 20% sức bền. Nhấp từng ngụm nước ấm hoặc thức uống điện giải CR7 Drive giúp duy trì nồng độ ion Natri, Magie, Kali trong máu, giúp cơ bắp co bóp mượt mà, phòng chống chuột rút và kiệt sức giữa chừng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nhấp từng ngụm nhỏ ở tư thế thích hợp hoàn toàn không gây sa dạ dày hay sóc hông.\n• Phương án C chưa đúng: Đổ mồ hôi là cơ chế làm mát tự nhiên, uống nước giúp mồ hôi thoát ra an toàn.\n• Phương án D chưa đúng: Đủ nước giúp cỗ máy chuyển hóa đốt Calo mượt mà hơn."}, {"n": 8, "q": "Hiện tượng \"Dị hóa cơ bắp\" (Muscle Catabolism) nguy hiểm như thế nào khi bạn tập thể thao cường độ cao lúc BỤNG ĐÓI RỖNG?", "opts": ["Cơ thể hết đường Glygen buộc phải phân hủy mô CƠ BẮP ra làm năng lượng, gây teo cơ, sụt BMR và da chùng nhão.", "Giúp tiêu biến 100% mỡ nội tạng chỉ sau 1 buổi tập.", "Giúp làm gia tăng mật độ xương khớp nhanh gấp 2 lần.", "Dị hóa cơ bắp là hiện tượng tốt giúp cơ bắp săn chắc hơn."], "answer": "A", "explain": "\"Tự ăn thịt chính mình!\" Khi tập nặng lúc bụng rỗng (thiếu đạm và tinh bột tốt tiền vận động), cơ thể rơi vào khủng hoảng năng lượng. Nó sẽ tiết Cortisol phá hủy các chuỗi axit amin trong cơ bắp để chuyển hóa thành glucose. Kết quả: Giảm cân nhưng mỡ còn nguyên, cơ teo đét!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập đói rỗng làm teo cơ bắp trước khi đốt tới mỡ nội tạng sâu.\n• Phương án C chưa đúng: Dị hóa cơ làm suy giảm áp lực lên xương, khiến xương kém phát triển.\n• Phương án D chưa đúng: Dị hóa cơ là hiện tượng tiêu cực tàn phá cỗ máy chuyển hóa, cần tuyệt đối tránh."}, {"n": 9, "q": "Ý nghĩa của việc \"Khởi động kỹ (Warm-up) và Giãn cơ sau tập (Cool-down)\" đối với hệ cơ xương khớp?", "opts": ["Khởi động làm tăng nhiệt độ cơ & bôi trơn khớp chống chấn thương; Giãn cơ giúp xả Axit Lactic giảm đau nhức cơ.", "Chỉ là thủ tục tốn thời gian, không mang lại giá trị sinh học nào.", "Khởi động làm tiêu tốn hết năng lượng khiến không tập được bài chính.", "Giãn cơ sau tập làm cho cơ bắp bị chảy xệ."], "answer": "A", "explain": "\"Bảo vệ cỗ máy vận động!\" Khởi động 5–10 phút giúp tiết dịch khớp bôi trơn, nâng nhịp tim từ từ. Sau tập, giãn cơ 5 phút giúp đẩy Axit Lactic (chất gây mỏi cơ) ra ngoài, đưa máu về tim an toàn và duy trì độ dẻo dai của các dây chằng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bỏ qua khởi động là nguyên nhân hàng đầu gây rách cơ, trật khớp và đứt dây chằng.\n• Phương án C chưa đúng: Khởi động đúng cách giúp kích hoạt thần kinh tập luyện tốt hơn.\n• Phương án D chưa đúng: Giãn cơ giúp sợi cơ dài dẻo dai và săn chắc, không làm chảy xệ."}, {"n": 10, "q": "Tác động của thói quen Vận Động Thể Chất đối với việc giải phóng các Hormone Hạnh Phúc (Endorphin & Dopamine)?", "opts": ["Đánh tan căng thẳng stress, cải thiện tâm trạng an vui, tăng sự tự tin và mang lại giấc ngủ sâu tự nhiên ban đêm.", "Kích thích cơ thể tiết ra nhiều hormone stress Cortisol gây gắt gỏng.", "Làm cho hệ thần kinh bị tê liệt hoàn toàn.", "Vận động làm cho người tập rơi vào trạng thái trầm cảm."], "answer": "A", "explain": "\"Liều thuốc bổ cho tâm trí!\" Khi vận động 20-30 phút, tuyến yên xả mạnh Endorphin (chất giảm đau tự nhiên) và Dopamine (hormone phần thưởng). Chúng dập tắt Cortisol stress, mang lại cảm giác sảng khoái, yêu đời và giúp bạn ngủ sâu giấc hơn.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Vận động hợp lý giúp dập tắt Cortisol, mang lại sự thư thái thần kinh.\n• Phương án C chưa đúng: Vận động kích hoạt thần kinh nhạy bén và minh mẫn hơn.\n• Phương án D chưa đúng: Vận động là phương pháp liệu pháp tự nhiên hỗ trợ điều trị trầm cảm hàng đầu."}, {"n": 11, "q": "Sự kết hợp hoàn hảo giữa \"Trà Thảo Mộc Cô Đặc\" và một \"Bài tập Vận động vừa sức\" tại Nhóm Dinh Dưỡng?", "opts": ["Trà thảo mộc kích thích bóc tách mảng mỡ thừa; Vận động giúp cỗ máy cơ bắp đốt cháy lượng mỡ đã bóc tách thành năng lượng.", "Trà thảo mộc làm cho cơ thể không thể vận động được.", "Kết hợp này làm gia tăng tỷ lệ mỡ nội tạng.", "Trà thảo mộc thay thế hoàn toàn cho các bài tập thể thao."], "answer": "A", "explain": "\"Đòn bẩy đốt mỡ kép!\" Thưởng thức 1 ly Trà Thảo Mộc ấm trước khi tập 15-20 phút giúp tỉnh táo thần kinh, kích thích phân rã tế bào mỡ xấu. Khi bước vào bài tập, cỗ máy cơ bắp sẵn sàng lôi lượng mỡ đã rã đó ra đốt sạch thành Calo tiêu hao!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Trà thảo mộc chứa caffeine tự nhiên giúp tăng sự tỉnh táo và hưng phấn vận động.\n• Phương án C chưa đúng: Bộ đôi này là giải pháp tiêu mỡ nội tạng đỉnh cao tại Nhóm Dinh Dưỡng.\n• Phương án D chưa đúng: Trà là dinh dưỡng bóc tách, vẫn cần 20% vận động để đốt cháy năng lượng."}, {"n": 12, "q": "Tại sao thói quen \"Đi thang bộ thay vì thang máy / Đứng làm việc linh hoạt\" lại được gọi là bí quyết vóc dáng thon gọn trọn đời?", "opts": ["Kích hoạt nhóm cơ lớn nhất cơ thể (Mông - Đùi) làm việc liên tục, tăng chỉ số BMR và tiêu ngầm Calo cả ngày.", "Khiến cho khớp gối bị tàn phá hoàn toàn sau 1 tuần.", "Đi thang bộ làm cho cơ bắp tay bị teo nhỏ.", "Việc này hoàn toàn không có tác động gì tới Calo tiêu hao."], "answer": "A", "explain": "\"Bí mật của người không bao giờ béo!\" Cơ mông và cơ đùi là hai \"nhà máy tiêu thụ Calo\" lớn nhất cơ thể. Chọn đi thang bộ hay đứng lên đi lại mỗi 45 phút giúp hai nhà máy này hoạt động liên tục, duy trì BMR cao và đốt sạch Calo rỗng ngay khi nạp vào.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đi thang bộ đúng kỹ thuật giúp củng cố dây chằng gối chắc khỏe (trừ người thoái hóa quá nặng).\n• Phương án C chưa đúng: Vận động cơ chân giúp tăng cường chuyển hóa toàn thân, không làm teo cơ tay.\n• Phương án D chưa đúng: Đây là nguồn tiêu hao Calo NEAT cực kỳ to lớn và bền vững."}, {"n": 13, "q": "Tác hại nghiêm trọng của thói quen \"Tập luyện ngắt quãng (Tập hăng hái 1 tuần rồi nghỉ liền 1 tháng)\"?", "opts": ["Cơ thể không kịp thích nghi, gây đau nhức cơ mạn tính, dễ chấn thương và làm thất bại mục tiêu hình thành thói quen.", "Giúp cơ thể có thời gian nghỉ ngơi để cơ bắp phát triển gấp 5 lần.", "Tập ngắt quãng giúp bảo vệ hệ tim mạch tốt hơn tập đều đặn.", "Không ảnh hưởng gì vì tổng lượng Calo đốt cháy vẫn giữ nguyên."], "answer": "A", "explain": "\"Thói quen quyết định kết quả!\" Tế bào cần tính TẬP TRUNG và LIÊN TỤC. Tập dốc sức vài ngày làm cơ bắp bị tổn thương nặng, sau đó nghỉ cả tháng khiến cỗ máy chuyển hóa quay lại vạch xuất phát. Nhẹ nhàng 20 phút MỖI NGÀY tốt hơn gấp nghìn lần tập 3 tiếng rồi bỏ xó!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nghỉ quá dài làm teo cơ và sụt giảm thể lực nghiêm trọng.\n• Phương án C chưa đúng: Tim mạch cần sự rèn luyện điều đặn, tập dốc sức ngắt quãng gây gánh nặng cho tim.\n• Phương án D chưa đúng: Sự ngắt quãng làm mất hiệu ứng tăng tốc chuyển hóa dài hạn."}, {"n": 14, "q": "Sự đóng góp của \"Dòng Sản Phẩm Dinh Dưỡng Thể Thao Herbalife 24\" đối với các Vận động viên và Người vận động nâng cao?", "opts": ["Cung cấp dinh dưỡng chuẩn xác cho từng giai đoạn (Trước - Trong - Sau tập), đạt chứng nhận 0% Doping (Informed-Sport).", "H24 chứa các chất kích thích thần kinh giúp tăng sức mạnh tức thì.", "H24 chỉ dành riêng cho người muốn giảm 20kg mỡ.", "H24 làm cho các khớp xương bị cứng lại."], "answer": "A", "explain": "\"Đỉnh cao dinh dưỡng thể thao!\" Dòng H24 (Formula 1 Sport, CR7 Drive, Rebuild Strength) được các nhà khoa học cố vấn riêng cho vận động viên đỉnh cao (như CR7). Nó cung cấp hỗn hợp đạm tri-core, carbohydrate chuyển hóa nhanh-chậm, sạch chất cấm Doping 100%.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Sản phẩm hoàn toàn an toàn, không chứa chất kích thích hay Doping.\n• Phương án C chưa đúng: H24 dành cho người tập luyện thể thao, tăng cơ, tối ưu hiệu suất vận động.\n• Phương án D chưa đúng: Dinh dưỡng H24 hỗ trợ phục hồi và làm dẻo dai hệ cơ xương khớp."}, {"n": 15, "q": "Vai trò của việc Vận Động Thể Chất đối với việc cải thiện \"Mật Độ Xương\" ở người trung niên và lớn tuổi?", "opts": ["Lực co cơ & sức ép vận động kích thích tế bào tạo xương (Osteoblast) hoạt động, gắn Canxi chặt vào khung xương.", "Vận động làm cho Canxi trong xương bị bào mòn và thoát ra ngoài.", "Người bị loãng xương tuyệt đối không được vận động thể chất.", "Vận động làm cho xương bị giòn xốp nhanh hơn."], "answer": "A", "explain": "\"Xương cần sức ép để chắc khỏe!\" Tế bào tạo xương chỉ làm việc khi có tác động cơ học. Các bài tập đi bộ, kháng lực nhẹ tạo ra sức ép lên khung xương, gửi tín hiệu buộc xương phải rút Canxi từ máu đắp vào khung xương, giúp phòng chống loãng xương hiệu quả.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Vận động giúp giữ Canxi trong xương, nằm tĩnh tại mới làm mất Canxi.\n• Phương án C chưa đúng: Người loãng xương càng cần vận động nhẹ nhàng hợp lý để phục hồi mật độ xương.\n• Phương án D chưa đúng: Lười vận động mới là nguyên nhân hàng đầu khiến xương bị giòn xốp."}, {"n": 16, "q": "Sự khác biệt giữa việc \"Tập luyện đơn độc một mình tại nhà\" và \"Tập luyện trong Môi Trường Năng Lượng Nhóm Dinh Dưỡng\"?", "opts": ["Môi trường Nhóm tạo không khí vui vẻ, có HLV sửa tư thế, truyền năng lượng tích cực giúp duy trì kỷ luật bền lâu.", "Tập một mình tại nhà giúp đốt cháy Calo nhanh gấp 3 lần tập ở nhóm.", "Tập ở Nhóm Dinh Dưỡng làm cho người tập bị mất tập trung và giảm hiệu quả.", "Hai môi trường này hoàn toàn mang lại kết quả giống hệt nhau."], "answer": "A", "explain": "\"Muốn đi nhanh hãy đi một mình - Muốn đi xa hãy đi cùng nhau!\" Tập một mình rất dễ nản lòng và bỏ cuộc khi mệt mỏi. Tại Nhóm Dinh Dưỡng, âm nhạc sôi động, nụ cười đồng đội và sự đồng hành Daily của HLV giúp bạn vượt qua rào cản lười biếng và biến vận động thành niềm vui mỗi ngày!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập một mình dễ tập sai kỹ thuật và thường bỏ cuộc giữa chừng.\n• Phương án C chưa đúng: Năng lượng nhóm kích thích não xả hormone hào hứng, nâng cao hiệu suất tập.\n• Phương án D chưa đúng: Môi trường quyết định 80% sự kiên trì thói quen dài hạn của con người."}, {"n": 17, "q": "Tác động của thói quen Vận Động Thể Chất đối với độ nhạy hormone \"Insulin\" và việc phòng chống Tiểu Đường Tuýp 2?", "opts": ["Co cơ khi vận động giúp mở kênh GLUT4 tiêu thụ Glucose trực tiếp mà KHÔNG CẦN nhiều Insulin, giúp hạ đường huyết.", "Vận động làm cho chỉ số đường huyết bị vọt cao vĩnh viễn.", "Vận động làm cho tuyến tụy bị tê liệt hoàn toàn.", "Người bị tiểu đường tuyệt đối không được vận động thể chất."], "answer": "A", "explain": "\"Bí quyết hạ đường huyết tự nhiên!\" Khi cơ bắp co bóp lúc vận động, nó tự động mở các \"cánh cửa\" GLUT4 trên màng tế bào để hút đường trong máu vào đốt làm năng lượng mà không phụ thuộc hoàn toàn vào Insulin. Đây là chìa khóa vàng giúp phục hồi độ nhạy Insulin cho người tiểu đường!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Vận động giúp làm giảm chỉ số đường huyết dư thừa trong máu rất an toàn.\n• Phương án C chưa đúng: Vận động giúp giảm tải gánh nặng tiết Insulin cho tuyến tụy.\n• Phương án D chưa đúng: Vận động hợp lý là trụ cột bắt buộc trong liệu trình chăm sóc người tiểu đường."}, {"n": 18, "q": "Lời khuyên chuẩn xác nhất dành cho một Hội viên MỚI BẮT ĐẦU hành trình vận động khi thể trạng đang có Mỡ Nội Tạng Cao?", "opts": ["Bắt đầu nhẹ nhàng (đi bộ 15-20 phút), tăng dần cường độ, ưu tiên ăn đúng 80% dinh dưỡng để bảo vệ khớp gối.", "Ngay lập tức đăng ký chạy marathon 10km hoặc nhảy aerobic cường độ cao 2 tiếng.", "Nhịn ăn hoàn toàn trước và sau khi tập để xả mỡ nhanh nhất.", "Chỉ tập trung tập gập bụng 500 cái mỗi ngày để tiêu mỡ bụng."], "answer": "A", "explain": "\"Dục tốc bất đạt!\" Người mỡ nội tạng cao có trọng lượng áp lên khớp gối rất lớn. Lao vào tập nặng ngay sẽ tàn phá khớp và gây kiệt sức. Cần lắng nghe cơ thể: Ăn chuẩn 80% dinh dưỡng F1 để mỡ rút đi, kết hợp đi bộ nhẹ nhàng 20 phút rồi nâng dần thể lực.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập quá sức ngay từ đầu gây chấn thương khớp, rách cơ và sợ hãi bỏ cuộc.\n• Phương án C chưa đúng: Nhịn ăn tập nặng gây hạ đường huyết ngất xỉu và dị hóa teo cơ bắp.\n• Phương án D chưa đúng: Không thể giảm mỡ cục bộ ở bụng bằng gập bụng; mỡ giảm toàn thân nhờ thâm hụt Calo."}, {"n": 19, "q": "Thái độ đúng đắn của một người làm chủ \"Lối Sống Năng Động Lành Mạnh\" trọn đời?", "opts": ["Tự giác biến vận động thành niềm vui sống, lắng nghe cơ thể, kết hợp dinh dưỡng chuẩn xác và lan tỏa năng lượng tích cực.", "Coi vận động là hình phạt nặng nề phải chịu đựng sau khi lỡ ăn nhiều.", "Chỉ vận động khi nào cảm thấy cân nặng bị tăng lên.", "So sánh thành tích vận động của mình với người khác để cảm thấy tự ti."], "answer": "A", "explain": "\"Vận động là món quà - Không phải hình phạt!\" Hãy vận động vì bạn yêu thương cơ thể mình, muốn trái tim khỏe mạnh, muốn đôi chân dẻo dai. Khi kết hợp cùng Bữa ăn F1 và tư duy an vui, vận động sẽ trở thành một phần thói quen tự nhiên như hơi thở mỗi ngày!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Coi vận động là hình phạt sẽ tạo tâm lý ức chế, tiêu cực và không bền vững.\n• Phương án C chưa đúng: Vận động là thói quen bảo dưỡng sức khỏe hàng ngày, không phải giải pháp chữa cháy.\n• Phương án D chưa đúng: Mỗi người có một xuất phát điểm và thể trạng riêng, hãy chỉ so sánh với chính mình ngày hôm qua."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 18 \"LỐI SỐNG NĂNG ĐỘNG\" tại Nhóm Dinh Dưỡng?", "opts": ["\"80% DINH DƯỠNG + 20% VẬN ĐỘNG = 100% SỨC KHỎE AN VUI: Hãy đứng dậy, vận động chủ động mỗi ngày để Kiến tạo Vóc dáng & Năng lượng Sống trọn vẹn!\"", "Chỉ cần vận động thể thao là đủ, không cần quan tâm đến dinh dưỡng và nước uống.", "Vận động chỉ dành cho người trẻ tuổi, người trung niên và lớn tuổi nên ngồi yên.", "Vận động tại Nhóm Dinh Dưỡng chỉ là hoạt động mang tính hình thức."], "answer": "A", "explain": "\"Hành động ngay hôm nay!\" Đừng chờ đến khi có thời gian mới vận động. Hãy bắt đầu từ những bước chân nhỏ: đi thang bộ, đứng vươn vai, nhún nhảy cùng bài tập tại Nhóm Dinh Dưỡng. Kết hợp 80% dinh dưỡng tế bào chuẩn xác, bạn sẽ sở hữu một vóc dáng thon gọn, dẻo dai và tràn đầy năng lượng!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bỏ qua dinh dưỡng thì 80% kết quả vận động sẽ bị triệt tiêu.\n• Phương án C chưa đúng: Vận động cần thiết và mang lại giá trị sống còn cho mọi lứa tuổi.\n• Phương án D chưa đúng: Vận động tại Nhóm Dinh Dưỡng là môi trường rèn luyện kỷ luật và tạo thói quen vàng trọn đời."}];
let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VẬN ĐỘNG<br>KÍCH HOẠT LỐI SỐNG NĂNG ĐỘNG</h1><div class="subtitle">LÀNH MẠNH MỖI NGÀY</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();
</script></body></html>
