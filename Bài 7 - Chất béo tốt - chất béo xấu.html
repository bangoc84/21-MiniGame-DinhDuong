<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái về chất béo | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Bản chất sinh học và vai trò thực sự của Chất Béo đối với cơ thể con người là gì?", "opts": ["Chất béo hoàn toàn là chất độc hại, là nguyên nhân duy nhất gây béo phì nên cần cắt bỏ 100%.", "Chất béo là nhóm chất thiết yếu giúp cấu tạo màng tế bào, hòa tan vitamin (A, D, E, K), bảo vệ não bộ và sản sinh hormone.", "Chất béo chỉ có tác dụng làm tăng hương vị thơm ngon cho các món ăn chiên rán.", "Chất béo có thể thay thế hoàn toàn vai trò của chất đạm trong việc xây dựng cơ bắp."], "answer": "B", "explain": "Chất béo là 1 trong 3 nhóm chất dinh dưỡng vĩ mô bắt buộc phải có! Nạp đúng chất béo tốt sẽ giúp cấu tạo màng tế bào, bảo vệ tế bào thần kinh, hỗ trợ hấp thu các vitamin tan trong dầu (A, D, E, K) và duy trì sự cân bằng hormone.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Cắt bỏ 100% chất béo sẽ gây khô da, rụng tóc, rối loạn nội tiết và suy giảm trí nhớ.\n• Phương án C chưa đúng: Tăng hương vị chỉ là đặc tính bên ngoài, không phải vai trò sinh học cốt lõi đối với cơ thể.\n• Phương án D chưa đúng: Chất béo không chứa các chuỗi axit amin nên không thể xây dựng hay phục hồi mô cơ bắp."}, {"n": 2, "q": "Sự khác biệt cốt lõi giữa \"Chất Béo Xấu\" (bão hòa, chuyển hóa) và \"Chất Béo Tốt\" (không bão hòa)?", "opts": ["Chất béo xấu chứa ít năng lượng Calo hơn chất béo tốt rất nhiều.", "Chất béo xấu làm đông quánh mạch máu, tăng mỡ nội tạng; Chất béo tốt giúp làm sạch lòng mạch, bảo vệ tim và chống viêm.", "Chất béo tốt chỉ tồn tại ở dạng chất lỏng, còn chất béo xấu chỉ ở dạng chất rắn.", "Hai loại chất béo này tác động hoàn toàn như nhau đối với chỉ số mỡ máu."], "answer": "B", "explain": "Chất béo xấu (từ mỡ động vật, đồ chiên nướng, bơ thực vật) giống như \"rác thải\" làm xơ vữa dính bết lòng mạch và tăng mỡ nội tạng. Trái lại, chất béo tốt (Omega-3 từ cá biển sâu, hạt, bơ) đóng vai trò như \"chổi quét\" dọn dẹp mỡ xấu, làm sạch lòng mạch và bảo vệ tim.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Tất cả các loại chất béo đều cung cấp năng lượng ngang nhau (1g Chất béo = 9 Calo).\n• Phương án C chưa đúng: Dạng tồn tại ở nhiệt độ phòng không quyết định hoàn toàn bản chất tốt/xấu của chất béo (ví dụ: dầu dừa dạng lỏng vẫn giàu béo bão hòa).\n• Phương án D chưa đúng: Hai nhóm chất béo có tác động hoàn toàn trái ngược nhau đối với sức khỏe tim mạch và mỡ máu."}, {"n": 3, "q": "Mối nguy hiểm đáng sợ nhất của \"Chất Béo Chuyển Hóa\" (Trans Fat) có trong đồ chiên rán đi chiên lại, mì ăn liền, bánh quy ngậy bơ?", "opts": ["Làm vọt tăng mỡ máu xấu, tàn phá lớp lót mạch máu, gây xơ vữa động mạch và tăng nguy cơ đột quỵ, biến chứng tim mạch.", "Làm cho dạ dày bị tiêu chảy ngay lập tức sau khi ăn.", "Làm cho khung xương bị rụt ngắn lại do tích mỡ.", "Làm ngưng trệ quá trình hấp thu nước lọc trong 24 giờ."], "answer": "A", "explain": "Chất béo chuyển hóa là \"sát thủ thầm lặng\"! Khi dầu ăn bị đun nóng ở nhiệt độ cao hoặc tái sử dụng nhiều lần, cấu trúc hóa học bị biến tính thành chất béo độc hại. Khi đi vào máu, nó tàn phá lòng mạch, hình thành các mảng xơ vữa cứng đơ, dẫn tới nguy cơ hẹp tắc mạch máu, nhồi máu cơ tim và đột quỵ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Chất béo chuyển hóa tích tụ âm thầm tàn phá mạch máu chứ không nhất thiết gây tiêu chảy ngay.\n• Phương án C chưa đúng: Chất béo xấu không làm rụt ngắn khung xương.\n• Phương án D chưa đúng: Chất béo xấu không làm ngưng trệ quá trình hấp thu nước lọc."}, {"n": 4, "q": "Tác hại ngầm của thói quen thích ăn \"Mỡ động vật đỏ, da gia cầm (gà, vịt), mỡ nội tạng\" đối với vóc dáng và sức khỏe?", "opts": ["Giúp làm sạch mỡ nội tạng xung quanh tim và gan.", "Nạp lượng lớn chất béo bão hòa làm tăng mỡ máu bẩn, biến cơ thể thành xưởng sản xuất MỠ NỘI TẠNG quanh ổ bụng.", "Giúp tăng cường khối lượng cơ bắp săn chắc ở đùi và tay.", "Giúp giảm chỉ số đường huyết sau bữa ăn."], "answer": "B", "explain": "Da gà, da vịt, mỡ heo, nội tạng rất thơm ngon nhưng lại cực kỳ giàu chất béo bão hòa và cholesterol bẩn. Nạp thường xuyên sẽ khiến mỡ tích tụ dày đặc xung quanh các cơ quan nội tạng (tim, gan, ruột), làm tăng nguy cơ gan nhiễm mỡ và các bệnh chuyển hóa.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Mỡ động vật làm tăng mỡ nội tạng chứ không thể làm sạch.\n• Phương án C chưa đúng: Mỡ động vật chỉ tích tụ thành mô mỡ thừa, không thể tạo thành mô cơ bắp.\n• Phương án D chưa đúng: Chất béo bão hòa không giúp làm giảm chỉ số đường huyết."}, {"n": 5, "q": "\"Mỡ Nội Tạng\" – loại mỡ nguy hiểm nhất cơ thể – nằm ở vị trí nào và sinh ra do đâu?", "opts": ["Nằm ngay sát dưới da mặt và được sinh ra do uống quá nhiều nước ấm.", "Bám chặt xung quanh các cơ quan nội tạng trong ổ bụng (tim, gan, ruột); sinh ra do dư Calo, ăn nhiều chất béo xấu và đường cao.", "Nằm ở trong tủy xương và được sinh ra do thiếu vận động thể thao.", "Nằm ở trong móng tay móng chân do ăn quá nhiều rau xanh."], "answer": "B", "explain": "Mỡ nội tạng là \"kẻ thù giấu mặt\"! Nó nằm sâu trong khoang bụng, quấn chặt lấy tim, gan, thận, ruột. Mỡ nội tạng sinh ra từ thói quen ăn dư thừa Calo, lạm dụng chất béo xấu (chiên xào, mỡ động vật) và đồ ngọt đường cao. Nó tiết ra các chất gây viêm mạn tính tàn phá sức khỏe.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Mỡ dưới da mặt là mỡ ngoại vi, không phải mỡ nội tạng; nước ấm không sinh ra mỡ.\n• Phương án C chưa đúng: Mỡ nội tạng nằm trong ổ bụng quanh tạng phủ, không nằm trong tủy xương.\n• Phương án D chưa đúng: Mỡ không nằm ở móng tay móng chân và rau xanh không tạo ra mỡ nội tạng."}, {"n": 6, "q": "Vai trò kỳ diệu của \"Omega-3\" (Chất béo không bão hòa đa) đối với hệ tuần hoàn máu và tim mạch?", "opts": ["Giúp hòa tan mỡ xấu, làm sạch các mảng xơ vữa bám ở lòng mạch, giữ mạch máu mềm mại, dẻo dai và bảo vệ tim.", "Giúp đóng băng toàn bộ lượng nước trong máu để tăng huyết áp.", "Giúp biến các tế bào mỡ nội tạng thành các tế bào xương.", "Làm tăng hàm lượng cholesterol xấu trong máu lên gấp 2 lần."], "answer": "A", "explain": "Omega-3 được ví như \"chàng công nhân vệ sinh lòng mạch\"! Nó giúp giảm triglyceride trong máu, tăng chỉ số mỡ tốt, bóc tách các mảng xơ vữa bám trên thành mạch, giúp máu lưu thông thông suốt và giảm áp lực cho trái tim.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Omega-3 giúp máu lưu thông dễ dàng và hỗ trợ ổn định huyết áp, không đóng băng máu.\n• Phương án C chưa đúng: Omega-3 không biến mỡ thành xương.\n• Phương án D chưa đúng: Omega-3 giúp giảm mỡ xấu chứ không làm tăng mỡ xấu."}, {"n": 7, "q": "Sự mất cân bằng nghiêm trọng giữa Omega-6 và Omega-3 trong chế độ ăn hiện đại gây ra tác hại gì?", "opts": ["Giúp cơ thể tự động tiêu diệt toàn bộ các loại vi khuẩn có hại.", "Dư thừa Omega-6 (từ dầu ăn công nghiệp, đồ chiên) tạo ra phản ứng VIÊM MẠN TÍNH trong cơ thể; thiếu Omega-3 làm mất phanh chống viêm.", "Làm cho cơ bắp phát triển quá nhanh gây đau mỏi.", "Giúp hạ thấp chỉ số Calo rỗng trong các món ăn chiên xào."], "answer": "B", "explain": "Tỷ lệ vàng Omega-6 / Omega-3 lý tưởng là 1:1 hoặc 4:1. Tuy nhiên, chế độ ăn hiện đại dùng quá nhiều dầu ăn công nghiệp khiến tỷ lệ này vọt lên 20:1! Dư thừa Omega-6 sẽ kích hoạt các phản ứng viêm mạn tính (đau khớp, xơ vữa mạch, dị ứng), trong khi thiếu Omega-3 sẽ mất đi \"bộ phanh\" dập tắt viêm.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Mất cân bằng mỡ không giúp tiêu diệt vi khuẩn mà làm suy yếu hệ miễn dịch.\n• Phương án C chưa đúng: Dư Omega-6 gây viêm chứ không giúp phát triển cơ bắp.\n• Phương án D chưa đúng: Dầu ăn công nghiệp chiên xào chứa mật độ Calo cực cao, không làm hạ Calo."}, {"n": 8, "q": "Tại sao các loại Dầu Thực Vật (dầu đậu nành, dầu mè) khi dùng để CHIÊN NGẬP DẦU ở nhiệt độ cao lại biến thành chất độc hại?", "opts": ["Nhiệt độ cao làm bẻ gãy liên kết đôi kém bền của dầu thực vật, biến chất béo tốt thành chất béo chuyển hóa độc hại.", "Vì dầu thực vật sẽ tự động bốc hơi hết các chất dinh dưỡng thành không khí.", "Vì nhiệt độ cao làm dầu thực vật biến thành đường tinh luyện.", "Dầu thực vật chiên ở nhiệt độ cao càng trở nên bổ dưỡng hơn."], "answer": "A", "explain": "Dầu thực vật chứa chất béo không bão hòa có liên kết hóa học rất nhạy cảm với nhiệt độ. Khi dùng để chiên ngập dầu hoặc xào đun lâu ở nhiệt độ cao, các liên kết này bị oxy hóa và biến tính thành Chất béo chuyển hóa (Trans Fat) cực kỳ độc hại cho mạch máu.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dầu bị biến tính thành chất độc tồn tại trong đĩa thức ăn chứ không chỉ bốc hơi hết.\n• Phương án C chưa đúng: Chất béo không biến thành đường tinh luyện.\n• Phương án D chưa đúng: Chiên nhiệt độ cao làm tàn phá chất béo tốt, hoàn toàn không làm bổ dưỡng hơn."}, {"n": 9, "q": "Các thực phẩm giàu chất béo tốt (như Quả bơ, Hạt óc chó, Hạnh nhân, Cá hồi) rất tốt nhưng tại sao người giảm mỡ vẫn cần KIỂM SOÁT SỐ LƯỢNG khi ăn?", "opts": ["Vì chất béo tốt chứa nhiều vi khuẩn gây hại cho đường ruột.", "Vì tất cả chất béo (kể cả béo tốt) đều có mật độ Calo CỰC KỲ CAO (1g = 9 Calo), ăn quá nhiều vẫn làm dư Calo và tăng mỡ.", "Vì chất béo tốt sẽ tự động biến thành chất béo xấu khi đi vào dạ dày.", "Vì ăn hạt dinh dưỡng sẽ làm teo mô cơ bắp."], "answer": "B", "explain": "Cảnh báo bẫy Calo! Chất béo tốt rất tuyệt vời cho tim mạch, nhưng 1g chất béo vẫn cung cấp 9 Calo (gấp hơn 2 lần đạm hay tinh bột). Vui miệng ăn vài nắm hạt óc chó hay cả quả bơ to có thể nạp thêm 300–400 Calo, khiến bạn vượt Con số Calo kỳ diệu và đứng cân.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Hạt dinh dưỡng và bơ sạch không chứa vi khuẩn gây hại.\n• Phương án C chưa đúng: Chất béo tốt đi vào cơ thể vẫn giữ nguyên bản chất sinh học tốt của nó.\n• Phương án D chưa đúng: Hạt dinh dưỡng và cá hồi chứa đạm và béo tốt hỗ trợ bảo vệ cơ bắp."}, {"n": 10, "q": "Tác động nguy hiểm của Chất Béo Xấu đối với Não Bộ và Thị Lực khi duy trì lối sống ăn uống nghèo nàn kéo dài?", "opts": ["Làm tắc nghẽn vi mạch máu não/mắt, suy giảm trí nhớ, tăng nguy cơ teo não (Alzheimer) và làm mờ mắt sớm.", "Giúp não bộ thông minh hơn gấp 2 lần do nhận được nhiều Calo.", "Giúp mắt nhìn rõ hơn trong đêm tối.", "Chất béo xấu chỉ tác động tới vòng bụng, hoàn toàn không ảnh hưởng tới não và mắt."], "answer": "A", "explain": "Não bộ có 60% cấu trúc là chất béo! Khi bạn nạp toàn chất béo xấu, các vi mạch máu nuôi não và võng mạc mắt sẽ bị dính bết xơ vữa. Thiếu máu nuôi dưỡng kéo dài làm suy giảm trí nhớ, sương mù não và làm suy giảm thị lực nhanh chóng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Chất béo xấu làm tổn thương tế bào thần kinh, gây suy giảm trí nhớ chứ không thông minh hơn.\n• Phương án C chưa đúng: Mỡ xấu làm mờ mắt chứ không giúp nhìn rõ trong đêm.\n• Phương án D chưa đúng: Não và mắt là hai cơ quan chịu tổn thương rất nặng nề từ mỡ xấu bẩn."}, {"n": 11, "q": "Tại sao cơ thể con người KHÔNG THỂ TỰ TỔNG HỢP được Omega-3 mà bắt buộc phải nạp từ thực phẩm bên ngoài?", "opts": ["Vì Omega-3 là một loại hóa chất nhân tạo không có trong tự nhiên.", "Vì cơ thể thiếu các enzyme sinh học để tự tạo ra Omega-3; đây là Axit Béo Thiết Yếu bắt buộc phải nạp từ thức ăn/thực phẩm bổ sung.", "Vì cơ thể chỉ có khả năng tự tổng hợp được chất béo xấu từ nước lọc.", "Vì Omega-3 sẽ bị tiêu diệt hoàn toàn nếu cơ thể tự sản sinh ra."], "answer": "B", "explain": "Trong sinh học, Omega-3 được xếp vào nhóm \"Axit Béo Thiết Yếu\" (Essential Fatty Acids). Từ \"Thiết yếu\" có nghĩa là: Cơ thể cực kỳ cần nó để sống khỏe, nhưng gen con người lại không có enzyme tự tổng hợp được, bắt buộc phải ăn từ bên ngoài vào mỗi ngày!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Omega-3 có dồi dào trong tự nhiên (cá biển sâu, tảo biển, các loại hạt).\n• Phương án C chưa đúng: Cơ thể không tự tạo chất béo từ nước lọc 0 Calo.\n• Phương án D chưa đúng: Cơ thể rất cần Omega-3 chứ không tiêu diệt nó."}, {"n": 12, "q": "Sự khác biệt lớn nhất giữa \"Mỡ Dưới Da\" và \"Mỡ Nội Tạng\" về mặt mức độ nguy hiểm đối với sức khỏe?", "opts": ["Mỡ dưới da nguy hiểm gấp 10 lần mỡ nội tạng vì nó làm xấu bề mặt da.", "Mỡ dưới da chủ yếu gây mất thẩm mỹ vóc dáng; Mỡ nội tạng tiết ra độc tố gây viêm, nguy cơ tiểu đường, cao huyết áp và đột quỵ.", "Hai loại mỡ này có mức độ độc hại cho sức khỏe hoàn toàn giống hệt nhau.", "Mỡ nội tạng dễ dàng hút bỏ bằng phẫu thuật thẩm mỹ hơn mỡ dưới da."], "answer": "B", "explain": "Mỡ dưới da (ở đùi, bắp tay, mông) chỉ làm bạn mặc đồ không đẹp. Nhưng Mỡ nội tạng (quấn quanh tim, gan, ruột) lại là \"ổ độc tố\" liên tục tiết ra chất gây viêm mạn tính, biến đổi chuyển hóa, gây ra các bệnh tim mạch, huyết áp và tiểu đường tuýp 2.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Mỡ dưới da ít nguy hiểm cho tính mạng hơn mỡ nội tạng rất nhiều.\n• Phương án C chưa đúng: Mỡ nội tạng tàn phá sức khỏe nghiêm trọng hơn mỡ dưới da gấp nhiều lần.\n• Phương án D chưa đúng: Hút mỡ thẩm mỹ chỉ hút được mỡ dưới da, hoàn toàn KHÔNG THỂ hút được mỡ nội tạng nằm sâu trong ổ bụng."}, {"n": 13, "q": "Điểm vượt trội của sản phẩm Herbalifeline (Omega-3 Herbalife) so với các loại dầu cá thông thường trên thị trường?", "opts": ["Chiết xuất từ cá biển sâu tinh khiết, loại bỏ hoàn toàn kim loại nặng, kết hợp tinh dầu thảo mộc giúp không bị ợ hơi mùi cá.", "Chứa hàm lượng chất béo bão hòa cao giúp tăng cân nhanh.", "Có thể thay thế hoàn toàn cho Bữa ăn sáng dinh dưỡng F1.", "Được làm từ mỡ heo đun nóng ở nhiệt độ cao."], "answer": "A", "explain": "Herbalifeline là tinh hoa công nghệ! Chiết xuất từ nguồn cá biển sâu ở vùng biển băng tinh khiết, trải qua công nghệ lọc bóc tách toàn bộ thủy ngân và kim loại nặng. Đặc biệt có thêm tinh dầu đinh hương, bạc hà giúp bạn uống dễ dàng, hoàn toàn không bị ợ mùi hôi cá.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Herbalifeline cung cấp Omega-3 tinh khiết, 0 chứa chất béo bão hòa xấu.\n• Phương án C chưa đúng: Herbalifeline bổ sung béo tốt, không thay thế Bữa sáng F1 giàu đạm và 21 vi chất.\n• Phương án D chưa đúng: Herbalifeline chiết xuất 100% từ dầu cá biển tinh khiết, không phải mỡ heo."}, {"n": 14, "q": "Tác hại đối với Làn Da khi hội viên có thói quen ăn nhiều \"Thực phẩm chiên giòn, da gia cầm chiên xù\"?", "opts": ["Giúp da căng bóng, mịn màng và dột phá độ ẩm tức thì.", "Chất béo xấu chiên giòn kích thích tuyến bã nhờn hoạt động quá mức, gây mụn viêm, tắc lỗ lông và làm da mau bị sạm xịt, lão hóa.", "Giúp làm mờ hoàn toàn các nếp nhăn vùng mắt.", "Làm cho các tế bào da tự động sản sinh thêm nhiều collagen."], "answer": "B", "explain": "\"Ăn gì da nấy!\" Ăn nhiều đồ chiên rán nạp lượng lớn chất béo độc hại, khiến gan bị quá tải không lọc kịp độc tố. Cơ thể phải đẩy độc qua da, làm tuyến mồ hôi xả dầu nhờn bẩn, gây mụn bọc, mụn viêm và phá hủy cấu trúc da khiến da mau già nua.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Đồ chiên giòn làm da bị mụn và xỉn màu chứ không mịn màng.\n• Phương án C chưa đúng: Mỡ xấu chiên rán làm gãy nếp collagen gây nhăn da nhiều hơn.\n• Phương án D chưa đúng: Đồ chiên làm phá hủy collagen chứ không giúp sản sinh collagen."}, {"n": 15, "q": "Tại sao khi thực hiện chế độ giảm mỡ, hội viên KHÔNG NÊN cắt bỏ 100% chất béo ra khỏi thực đơn?", "opts": ["Cắt sạch béo sẽ làm ngưng trệ hấp thu vitamin (A,D,E,K), làm rối loạn hormone, khô da, rụng tóc và suy giảm trí nhớ.", "Vì cắt bỏ chất béo sẽ làm cho cỗ máy đốt Calo hoạt động quá nhanh gây nguy hiểm.", "Vì chất béo xấu là nguyên liệu chính để xây dựng cơ bắp.", "Vì cắt chất béo sẽ làm cho dạ dày bị nở to ra gấp 2 lần."], "answer": "A", "explain": "Hãy chọn BÉO TỐT, đừng kiêng sạch béo! Cắt sạch chất béo khiến cơ thể không thể hấp thu các vitamin thiết yếu A, D, E, K. Hậu quả là bạn bị rụng tóc xơ xác, da khô như nứt nẻ, rối loạn kinh nguyệt/nội tiết và tâm trạng hay gắt gỏng, nhớ nhớ quên quên.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cắt béo làm suy rối loạn chuyển hóa chứ không làm cỗ máy đốt Calo chạy quá nhanh.\n• Phương án C chưa đúng: Chất đạm mới là nguyên liệu xây dựng cơ bắp, không phải chất béo.\n• Phương án D chưa đúng: Chất béo không quyết định kích thước co giãn của dạ dày."}, {"n": 16, "q": "Hiện tượng \"Gan Nhiễm Mỡ, Mỡ Máu Cao\" ở những người nhìn bề ngoài RẤT GẦY ỐM được giải thích như thế nào?", "opts": ["Do người gầy uống quá nhiều nước lọc ấm trước bữa ăn.", "Hiện tượng \"Béo ngầm\" (Thin-Outside, Fat-Inside): Dù gầy nhưng ăn nhiều đồ chiên xào, dư đường, thiếu vận động làm mỡ tích trong gan/máu.", "Do gầy ốm nên mạch máu tự động teo lại gom mỡ.", "Do người gầy chứa quá nhiều khối cơ bắp trong cơ thể."], "answer": "B", "explain": "\"Gầy không có nghĩa là không có mỡ nội tạng!\" Nhìn bên ngoài gầy nhom nhưng nếu có thói quen ăn đồ chiên xào, uống nước ngọt, thức khuya, thiếu vận động thì mỡ vẫn âm thầm tích tụ trong gan và tàn phá lòng mạch. Đó gọi là hiện tượng Béo Ngầm rất nguy hiểm!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Nước lọc ấm giúp làm sạch cơ thể, không gây gan nhiễm mỡ.\n• Phương án C chưa đúng: Mạch máu không tự teo lại gom mỡ; mỡ tích tụ do ăn uống sai cách.\n• Phương án D chưa đúng: Người gầy ốm béo ngầm thường rất thiếu cơ bắp và thừa mỡ nội tạng."}, {"n": 17, "q": "Khung giờ và cách sử dụng sản phẩm Herbalifeline (Omega-3) để cơ thể hấp thu tối ưu nhất?", "opts": ["Uống dồn 10 viên vào lúc nửa đêm trước khi đi ngủ.", "Uống ngay TRONG BỮA ĂN hoặc NGAY SAU BỮA ĂN (khi có chất béo trong thức ăn làm dung môi hòa tan tối đa).", "Uống khi bụng đang hoàn toàn trống rỗng và đói cồn cào.", "Hòa tan viên dầu cá vào nước sôi 100°C rồi mới uống."], "answer": "B", "explain": "Nguyên lý hấp thu! Omega-3 là chất béo tan trong dầu. Uống Herbalifeline ngay trong hoặc sau bữa ăn (đặc biệt là bữa ăn có một chút chất béo lành mạnh) sẽ kích thích túi mật tiết dịch, giúp hòa tan và hấp thu trọn vẹn 100% lượng Omega-3 vào máu.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Uống dồn dập lúc đêm muộn gây gánh nặng cho tiêu hóa và giảm hiệu quả hấp thu.\n• Phương án C chưa đúng: Uống khi bụng rỗng hiệu suất hấp thu Omega-3 sẽ bị giảm đi rất nhiều.\n• Phương án D chưa đúng: Nước sôi 100°C sẽ làm chảy vỏ nang gelatin và phá hủy cấu trúc tinh khiết của Omega-3."}, {"n": 18, "q": "Sự thật về các loại \"Bơ Thực Vật (Margin), Mỡ Thực Vật Đóng Hộp\" được quảng cáo là tốt cho sức khỏe?", "opts": ["Thực chất là dầu thực vật được hydro hóa nhân tạo, chứa hàm lượng CHẤT BÉO CHUYỂN HÓA rất cao gây hại tim mạch.", "Là loại chất béo hoàn hảo nhất giúp làm sạch mỡ máu nhanh gấp 10 lần.", "Là thực phẩm hoàn toàn không chứa bất kỳ Calo nào.", "Là loại thực phẩm được chiết xuất 100% từ lá cây tươi."], "answer": "A", "explain": "Bẫy quảng cáo! Bơ thực vật dạng quết hay mỡ đóng hộp làm bánh thực chất là dầu ăn lỏng được ép ép hydro vào để biến thành dạng rắn. Quá trình nhân tạo này tạo ra lượng lớn Chất béo chuyển hóa (Trans Fat) – loại chất béo độc hại bậc nhất cho lòng mạch.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bơ thực vật hydro hóa gây xơ vữa mạch máu chứ không làm sạch mỡ máu.\n• Phương án C chưa đúng: Bơ thực vật là chất béo nguyên chất nên Calo cực kỳ cao.\n• Phương án D chưa đúng: Được sản xuất công nghiệp từ dầu thực vật gia nhiệt hydro hóa, không phải lá cây tươi."}, {"n": 19, "q": "Lợi ích tuyệt vời của Omega-3 đối với hệ Xương Khớp ở người lớn tuổi hoặc người hay bị đau mỏi khớp?", "opts": ["Giúp giảm sản sinh các chất gây viêm, xoa dịu cơn đau sưng khớp, tăng cường độ dẻo dai của dịch khớp.", "Giúp đông cứng các khớp xương để không bị dịch chuyển.", "Thay thế hoàn toàn vai trò của Canxi trong việc xây dựng khung xương.", "Làm cho các khớp xương bị bào mòn nhanh hơn."], "answer": "A", "explain": "Omega-3 là \"chất chống viêm tự nhiên\"! Với người bị viêm khớp, thoái hóa khớp, Omega-3 giúp ức chế các hoạt chất gây sưng đau, làm dịu êm các khớp xương, đồng thời hỗ trợ độ nhờn dịch khớp giúp người lớn tuổi đi lại dẻo dai nhẹ nhàng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Omega-3 giúp khớp linh hoạt dẻo dai chứ không làm đông cứng khớp.\n• Phương án C chưa đúng: Canxi là khoáng chất tạo khung xương, Omega-3 hỗ trợ chống viêm bôi trơn – hai vai trò bổ trợ cho nhau.\n• Phương án D chưa đúng: Omega-3 bảo vệ sụn khớp chứ không làm bào mòn."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 7 \"Chất Béo Tốt - Chất Béo Xấu\" tại Nhóm Dinh Dưỡng?", "opts": ["\"CẮT BỎ BÉO XẤU - NẠP ĐỦ BÉO TỐT (OMEGA-3): Chiếc chìa khóa vàng làm sạch lòng mạch, xóa tan mỡ nội tạng và bảo vệ trái tim An Vui trọn đời!\"", "Cắt bỏ 100% tất cả các loại chất béo ra khỏi cuộc sống vĩnh viễn.", "Ăn đồ chiên xào thoải mái chỉ cần uống thật nhiều nước đá.", "Chất béo xấu không có hại nếu chúng ta vẫn tập thể dục chăm chỉ."], "answer": "A", "explain": "Hãy trở thành người tiêu dùng thông thái! Nói KHÔNG với đồ chiên rán, mỡ động vật bẩn, da gia cầm; đồng thời chủ động bổ sung Chất béo tốt Omega-3 (Herbalifeline) hàng ngày để dọn dẹp lòng mạch, tiêu mỡ nội tạng và tận hưởng một trái tim khỏe mạnh bền lâu!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cắt sạch béo gây tổn hại nghiêm trọng cho da, tóc, não và hormone.\n• Phương án C chưa đúng: Nước đá không thể làm sạch chất béo xấu, ngược lại càng làm đông đặc mỡ trong dạ dày.\n• Phương án D chưa đúng: Tập thể dục không thể xóa bỏ được tác hại phá hủy mạch máu của chất béo chuyển hóa."}];
const TKP_LESSON=7;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VỀ<br>CHẤT BÉO TỐT & CHẤT BÉO XẤU</h1><div class="subtitle">QUÉT SẠCH MỠ MÁU – BẢO VỆ TIM MẠCH</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
</body></html>
