<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông Thái Môi Trường • Mini Game Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#f7cc70;--white:#fff8ee;--ink:#101b34}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--white);background:#090e25}body{background:radial-gradient(ellipse at 12% 5%,#503c85 0,transparent 40%),radial-gradient(ellipse at 95% 90%,#1c777b 0,transparent 42%),linear-gradient(145deg,#111a3c,#090e25);background-attachment:fixed}.shell{min-height:100dvh;display:flex;flex-direction:column;max-width:1460px;margin:auto;padding:clamp(12px,2.5vw,34px);position:relative;isolation:isolate}.shell:before{content:'NHÓM DINH DƯỠNG\\A THIỆU TRUNG\\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-13deg);font-weight:900;font-size:clamp(25px,5vw,80px);line-height:1.7;letter-spacing:.05em;text-align:center;opacity:.035;z-index:-1;width:90%;pointer-events:none}header{display:flex;justify-content:space-between;align-items:center;gap:10px}header .brand{font-size:clamp(12px,1.5vw,19px);font-weight:850;color:var(--gold)}.small{color:#c7d1e7;font-size:clamp(12px,1.2vw,17px)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.sound{background:#ffffff18;border:1px solid #ffffff44;color:white;border-radius:14px;padding:10px 15px}.panel{width:100%;max-width:1160px;margin:auto;background:linear-gradient(140deg,#ffffff16,#ffffff08);border:1px solid #ffffff30;border-radius:28px;padding:clamp(17px,3.4vw,45px);box-shadow:0 24px 80px #0006;backdrop-filter:blur(10px);animation:rise .3s ease}.center{text-align:center}.kicker{color:var(--gold);letter-spacing:.16em;font-weight:900;font-size:clamp(13px,1.4vw,19px)}h1{font-size:clamp(30px,5vw,72px);line-height:1.12;margin:20px 0;color:#ffe7a2;text-shadow:0 0 32px #ffbf5135}h2{font-size:clamp(22px,2.5vw,38px);line-height:1.32;margin:18px 0 24px}.lead{font-size:clamp(17px,2vw,26px);line-height:1.6}.btn{border:0;border-radius:17px;background:linear-gradient(135deg,#ffe9a6,#e9a63c);color:#2e2240;padding:16px 27px;font-weight:900;font-size:clamp(16px,1.65vw,23px);box-shadow:0 8px 25px #f0ae4a30;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#ffffff16;color:white;border:1px solid #ffffff44;box-shadow:none}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:23px;justify-content:center}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:750;color:#e9e3d8}.progress{height:9px;border-radius:9px;background:#ffffff28;overflow:hidden;margin:13px 0 25px}.progress>div{height:100%;background:linear-gradient(90deg,#f0b84f,#6de5c2);transition:width .3s}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid #ffffff42;border-radius:17px;background:#ffffff12;color:white;padding:clamp(14px,1.6vw,23px);font-size:clamp(15px,1.6vw,22px);line-height:1.45;min-height:90px;transition:transform .15s,background .15s}.option:not(:disabled):hover{transform:translateY(-2px);background:#ffffff24}.letter{flex:0 0 43px;display:grid;place-items:center;background:#ffffff22;border-radius:12px;height:43px;color:#ffe6a5;font-weight:900}.option:disabled{cursor:default}.option.correct{background:#116c4b;border-color:#73ffc1}.option.incorrect{background:#842d43;border-color:#ff8d98}.option.dim{opacity:.55}.result{margin-top:20px;padding:18px;border-radius:18px;background:#ffffff14;border:1px solid #ffffff38;animation:rise .25s}.result strong{display:block;color:#ffe2a0;font-size:clamp(17px,2vw,25px);margin-bottom:12px}.explain{max-height:min(34vh,310px);overflow:auto;line-height:1.65;font-size:clamp(15px,1.4vw,19px);padding-right:8px}.explain p{margin:8px 0}.muted{color:#cdd5e8}.score{font-size:clamp(65px,11vw,145px);font-weight:950;color:var(--gold);line-height:1.1}.scoregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.scoregrid>div{background:#ffffff12;border-radius:14px;padding:16px 8px}.scoregrid b{font-size:clamp(24px,3vw,40px);display:block;color:#ffe0a1}.foot{margin-top:16px;text-align:center;color:#c5cde0;font-size:12px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti i{position:absolute;top:-20px;width:9px;height:17px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(800deg);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){.options{grid-template-columns:1fr}.option{min-height:64px}.panel{border-radius:20px}.scoregrid{grid-template-columns:1fr 1fr}.shell{padding:12px}.explain{max-height:34vh}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}</style></head><body><div class="shell"><header><div class="brand">✦ NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="sound" aria-label="Bật hoặc tắt âm thanh">🔊 Âm thanh: BẬT</button></header><main id="app" class="panel" aria-live="polite"></main><footer class="foot">Đồng hành kiến tạo sức khỏe toàn diện • Nội dung câu hỏi theo tài liệu chương trình</footer></div><div id="confetti" class="confetti"></div><script>
const QUESTIONS=[{"q": "Định vị bản chất sinh học và xã hội cốt lõi nhất của \"Nhóm Dinh Dưỡng\" (Nutrition Club) là gì?", "options": ["Là một cửa hàng bán thực phẩm chức năng hoặc một phòng khám chữa bệnh Y khoa.", "Là môi trường trải nghiệm, giáo dục thói quen lối sống và kết nối cộng đồng An Vui.", "Là một quán cà phê/giải khát cao cấp phục vụ đồ uống cho khách qua đường.", "Là một câu lạc bộ thể hình chuyên nghiệp dành cho các vận động viên."], "answer": "B", "explanation": "\"Nơi thay đổi thói quen - Kiến tạo cuộc đời!\" Nhóm Dinh Dưỡng không phải là nơi mua bán sản phẩm đơn thuần hay phòng khám chữa bệnh. Đây là môi trường giáo dục thói quen sinh hoạt lành mạnh, nơi hội viên được giao lưu, học 21 bài học dinh dưỡng, nhận sự chăm sóc Daily và lan tỏa năng lượng tích cực.", "wrong": ["Phương án A chưa đúng: Nhóm Dinh Dưỡng không chẩn đoán hay chữa bệnh và không vận hành theo mô hình cửa hàng bán lẻ.", "Phương án C chưa đúng: Nhóm Dinh Dưỡng phục vụ hội viên chính thức theo chương trình chăm sóc cá nhân hóa, không phải quán giải khát.", "Phương án D chưa đúng: Nhóm Dinh Dưỡng tập trung 80% vào Dinh dưỡng và Giáo dục lối sống cho mọi lứa tuổi, không chỉ là phòng gym."]}, {"q": "Tại sao việc duy trì có mặt \"Daily\" (Mỗi ngày) tại Nhóm Dinh Dưỡng lại quyết định 80% thành công của hội viên?", "options": ["Giúp củng cố kỷ luật, tiếp nhận năng lượng tích cực, được HLV theo sát chỉ số và ngăn chặn sự trỗi dậy của thói quen xấu.", "Để bắt buộc phải mua thêm sản phẩm mới mỗi ngày.", "Để thay thế cho việc điểm danh hành chính bắt buộc.", "Có mặt mỗi ngày chỉ mang tính hình thức, không ảnh hưởng gì tới kết quả giảm mỡ."], "answer": "A", "explanation": "\"Kỷ luật tạo nên sự chuyển hóa!\" Thói quen cũ hàng chục năm rất dễ lấn tạt nếu bạn ở một mình. Việc đến Nhóm Dinh Dưỡng mỗi sáng giúp bạn neo giữ cảm xúc tích cực, uống ly F1 chuẩn kỹ thuật, được HLV soi đĩa ăn và kịp thời tháo gỡ rào cản tâm lý ngay trong ngày.", "wrong": ["Phương án B chưa đúng: Việc có mặt Daily là để được chăm sóc và học tập thói quen, không bắt buộc mua thêm sản phẩm.", "Phương án C chưa đúng: Nhóm Dinh Dưỡng hoạt động trên sự tự nguyện và yêu thương, không mang tính gượng ép hành chính.", "Phương án D chưa đúng: Sự hiện diện Daily là yếu tố then chốt giúp hội viên không bị ngắt quãng kỷ luật."]}, {"q": "Ý nghĩa của việc \"Đo quét chỉ số sinh học Tanita định kỳ\" tại Nhóm Dinh Dưỡng đối với hành trình điều chỉnh vóc dáng?", "options": ["Cung cấp bức tranh thực tế về tỷ lệ Cơ - Mỡ - Mỡ nội tạng - BMR, giúp HLV điều chỉnh Con số Calo kỳ diệu chuẩn xác.", "Đo chỉ số chỉ để hội viên cảm thấy hoang mang và lo lắng hơn.", "Để so sánh xem ai mập hơn ai nhằm mục đích trêu chọc.", "Chỉ số đo quét Tanita hoàn toàn cố định và không bao giờ thay đổi được."], "answer": "A", "explanation": "\"Nói chuyện bằng số liệu thực tế!\" Cân nặng thông thường không phản ánh đúng bản chất giảm mỡ hay giảm cơ. Máy quét sinh học Tanita giúp HLV bóc tách lượng mỡ nội tạng, khối cơ và BMR của bạn. Dựa vào đó, HLV tăng/giảm đạm PPP hay Calo để bạn giảm mỡ mà cơ vẫn săn chắc.", "wrong": ["Phương án B chưa đúng: Chỉ số rõ ràng giúp hội viên an tâm và biết rõ mình đang tiến bộ đúng hướng.", "Phương án C chưa đúng: Số liệu dùng để HLV cá nhân hóa chế độ, văn hóa Nhóm tuyệt đối không so sánh giễu cợt.", "Phương án D chưa đúng: Các chỉ số mỡ, cơ, tuổi sinh học biến đổi tích cực hàng tuần khi bạn ăn đúng uống đủ."]}, {"q": "Bẫy tư duy sai lầm: \"Tôi chỉ cần mua sản phẩm Herbalife về TỰ UỐNG TẠI NHÀ, không cần đến Nhóm Dinh Dưỡng\"?", "options": ["Sai lầm! Thiếu môi trường kỷ luật và sự chăm sóc 1:1 của HLV, 90% người tự uống tại nhà sẽ nản lòng và bỏ cuộc.", "Đúng! Tự uống tại nhà giúp tiết kiệm thời gian và mang lại kết quả nhanh gấp 2 lần.", "Uống tại nhà hay tại Nhóm hoàn toàn giống hệt nhau về mọi mặt.", "Tự uống tại nhà giúp tế bào hấp thu vi chất tốt hơn đến Nhóm."], "answer": "A", "explanation": "\"Môi trường quyết định thói quen!\" Sản phẩm chỉ là công cụ, môi trường Nhóm Dinh Dưỡng mới là nơi vận hành công cụ đó. Ở nhà một mình, bạn rất dễ uống sai liều, pha sai nhiệt độ, ăn lén đồ béo xào và dễ dàng bỏ cuộc khi gặp phản ứng thải độc lành tính.", "wrong": ["Phương án B chưa đúng: Tự uống tại nhà không có HLV chỉnh đĩa ăn thường dẫn đến giảm cân sai cách (mất cơ/mất nước).", "Phương án C chưa đúng: Nhóm Dinh Dưỡng cung cấp kiến thức, năng lượng đồng đội và sự bám sát Daily mà ở nhà không thể có.", "Phương án D chưa đúng: Sự hào hứng và thư thái tâm trí tại Nhóm giúp hệ tiêu hóa hấp thu dinh dưỡng tối ưu hơn."]}, {"q": "Sức mạnh của \"Tri thức 21 Bài học Dinh dưỡng\" được HLV chia sẻ mỗi ngày tại Nhóm Dinh Dưỡng mang lại giá trị gì?", "options": ["Trang bị tư duy làm chủ đĩa ăn, biết chọn thực phẩm GI thấp, đọc nhãn hiệu dinh dưỡng và làm chủ sức khỏe trọn đời.", "Chỉ là những lý thuyết suông để hội viên nghe cho vui tai.", "Nhằm mục đích bắt hội viên phải thuộc lòng để đi thi lấy bằng Bác sĩ.", "Các bài học dinh dưỡng chỉ có giá trị áp dụng trong thời gian sinh hoạt tại Nhóm."], "answer": "A", "explanation": "\"Trao cần câu thay vì cho con cá!\" 21 bài học dinh dưỡng là cẩm nang sống còn giúp hội viên chuyển hóa từ người ăn uống vô thức thành người tiêu dùng thông thái. Bạn sẽ biết cách đi chợ, biết nấu ăn bảo toàn vi chất và tự bảo vệ mình cũng như gia đình khỏi bẫy bệnh tật.", "wrong": ["Phương án B chưa đúng: Đây là tri thức ứng dụng thực chiến vào từng mâm cơm hàng ngày của hội viên.", "Phương án C chưa đúng: Kiến thức đơn giản, dễ hiểu, thiết kế cho mọi lứa tuổi đều có thể áp dụng ngay.", "Phương án D chưa đúng: Tri thức 21 bài học là tài sản đồng hành và bảo vệ sức khỏe của bạn trọn đời."]}, {"q": "Khái niệm \"Sự đồng hành Daily 1:1\" của Huấn luyện viên Dinh dưỡng tại Nhóm được thực hiện như thế nào?", "options": ["Soi từng bức ảnh đĩa ăn, nhắc nhở uống nước 3Đ, kiểm tra giấc ngủ, giải đáp thắc mắc và điều chỉnh thực đơn hàng ngày.", "HLV chỉ gặp và nói chuyện với hội viên 1 lần duy nhất vào ngày đầu tiên.", "HLV bắt buộc hội viên phải báo cáo công việc cá nhân riêng tư.", "Đồng hành Daily nghĩa là HLV sẽ đến nhà nấu ăn cho hội viên mỗi bữa."], "answer": "A", "explanation": "\"Chăm sóc tận tâm như người thân!\" HLV không chỉ cân đo mà là người bạn đồng hành sát sao: Nhìn đĩa ăn để biết bạn thừa/thiếu đạm, nhắc nhở khi bạn quên uống nước, lắng nghe tâm tư khi bạn căng thẳng để giúp bạn vững vàng đạt mục tiêu.", "wrong": ["Phương án B chưa đúng: Đồng hành diễn ra liên tục Daily (hàng ngày) trong suốt 30 ngày và kéo dài về sau.", "Phương án C chưa đúng: HLV chỉ tập trung chăm sóc chỉ số sức khỏe, dinh dưỡng và lối sống, tôn trọng riêng tư.", "Phương án D chưa đúng: HLV hướng dẫn phương pháp để hội viên tự thực hành làm chủ góc bếp của mình."]}, {"q": "Tại sao Nhóm Dinh Dưỡng lại được các hội viên trìu mến gọi là \"Ngôi Nhà Thứ Hai\"?", "options": ["Vì nơi đây ngập tràn tình yêu thương, sự lắng nghe, không phán xét, nơi mọi người cùng nâng đỡ nhau khỏe đẹp.", "Vì hội viên bắt buộc phải dọn về Nhóm Dinh Dưỡng sinh sống toàn thời gian.", "Vì Nhóm Dinh Dưỡng có bán đầy đủ các trang thiết bị nội thất gia đình.", "Tên gọi này chỉ là một slogan quảng cáo không có thực tế."], "answer": "A", "explanation": "\"Chốn an yên cho tâm hồn!\" Giữa cuộc sống bận rộn và nhiều áp lực, Nhóm Dinh Dưỡng là nơi hội viên được chào đón bằng nụ cười ấm áp, được vỗ tay khích lệ, được chia sẻ những niềm vui nho nhỏ trong hành trình trẻ hóa. Tình thân giữa HLV và đồng đội biến nơi đây thành mái nhà ấm áp.", "wrong": ["Phương án B chưa đúng: Hội viên chỉ dành 30-45 phút mỗi sáng tại Nhóm rồi tiếp tục công việc hàng ngày.", "Phương án C chưa đúng: Đây là ngôi nhà về mặt giá trị tinh thần, tình cảm và sức khỏe.", "Phương án D chưa đúng: Cảm nhận \"Ngôi nhà thứ hai\" đến từ trải nghiệm yêu thương thực tế của hàng triệu hội viên."]}, {"q": "Ý nghĩa của việc thưởng thức \"Bữa Ăn Lành Mạnh F1 & Trà Thảo Mộc\" trực tiếp tại không gian Nhóm Dinh Dưỡng?", "options": ["Được pha chuẩn kỹ thuật (đúng lượng nước, đúng nhiệt độ), đảm bảo vệ sinh và tận hưởng năng lượng tích cực cùng đồng đội.", "Để HLV có thể thu thêm phí dịch vụ pha chế.", "Pha tại Nhóm giúp tăng lượng Calo trong ly F1 lên gấp 3 lần.", "Uống tại Nhóm mới có tác dụng, về nhà uống sẽ không có tác dụng gì."], "answer": "A", "explanation": "\"Thưởng thức trọn vẹn giá trị!\" HLV biết cách pha ly Shake F1 mịn sệt thơm ngon, giữ nguyên vẹn 21 vi chất mà không bị phá hủy do nước quá nóng. Thưởng thức ly trà ấm bóc tách mỡ cùng nụ cười của đồng đội giúp bữa sáng trở thành một nghi thức khởi đầu ngày mới an vui.", "wrong": ["Phương án B chưa đúng: Việc pha chế chuẩn là một phần dịch vụ chăm sóc tận tâm của HLV nằm trong chương trình.", "Phương án C chưa đúng: Công thức pha chuẩn giữ nguyên mức Calo lý tưởng (~90 kcal).", "Phương án D chưa đúng: F1 dùng tại nhà vẫn đầy đủ dinh dưỡng, nhưng dùng tại Nhóm có thêm năng lượng tinh thần."]}, {"q": "Văn hóa \"Ghi nhận và Vinh danh từng tiến bộ nhỏ\" tại Nhóm Dinh Dưỡng mang lại sức mạnh tâm lý nào?", "options": ["Xóa bỏ sự tự ti, kích hoạt hormone Dopamine, giúp hội viên có thêm niềm tin và động lực chinh phục các mục tiêu lớn.", "Khiến hội viên trở nên chủ quan và ngừng cố gắng.", "Tạo ra sự ganh đua gay gắt và chia rẽ nội bộ giữa các hội viên.", "Việc vinh danh chỉ là hình thức tốn thời gian."], "answer": "A", "explanation": "\"Ghi nhận để tỏa sáng!\" Dù bạn chỉ mới giảm được 0,5kg mỡ, giảm 1cm vòng eo hay đơn giản là uống đủ 2 lít nước đầu tiên, Nhóm Dinh Dưỡng đều trao tặng những tràng pháo tay nồng nhiệt. Sự ghi nhận này giúp tưới tắm sự tự tin, giúp bạn tin rằng mình làm được!", "wrong": ["Phương án B chưa đúng: Sự khích lệ chân thành giúp hội viên hào hứng và kỷ luật hơn.", "Phương án C chưa đúng: Văn hóa Nhóm dạy sự mừng vui trước thành công của người khác (Cùng thắng - Win-Win).", "Phương án D chưa đúng: Đây là phương pháp giáo dục hành vi và nuôi dưỡng tâm lý đỉnh cao."]}, {"q": "Sự khác biệt giữa thái độ chăm sóc \"Hội Viên\" tại Nhóm Dinh Dưỡng và \"Khách Hàng\" tại cửa hàng truyền thống?", "options": ["Khách hàng kết thúc giao dịch khi trả tiền; Hội viên bắt đầu hành trình chăm sóc, giáo dục và chuyển hóa trọn đời.", "Khách hàng được chăm sóc kỹ hơn Hội viên.", "Hai khái niệm này hoàn toàn giống hệt nhau, chỉ khác tên gọi.", "Hội viên phải đóng tiền duy trì hàng tháng kể cả khi không sinh hoạt."], "answer": "A", "explanation": "\"Trao giải pháp - Không chỉ bán sản phẩm!\" Người bán hàng truyền thống chỉ quan tâm bán xong món hàng. Tại Nhóm Dinh Dưỡng, khi bạn trở thành Hội viên, đó mới là lúc HLV bắt tay vào nhiệm vụ: Đồng hành, hướng dẫn, kiểm tra chỉ số và chịu trách nhiệm cùng bạn đến khi đạt kết quả!", "wrong": ["Phương án B chưa đúng: Hội viên nhận được sự chăm sóc Daily 1:1 sâu sắc và toàn diện hơn rất nhiều.", "Phương án C chưa đúng: Triết lý phục vụ của HLV Dinh dưỡng vượt xa mô hình mua bán hàng hóa thông thường.", "Phương án D chưa đúng: Hội viên chủ động tài chính theo nhu cầu trải nghiệm chương trình của mình."]}, {"q": "Tác động của \"Không gian Năng Lượng Tích Cực\" tại Nhóm Dinh Dưỡng đối với sức khỏe tinh thần và hệ miễn dịch?", "options": ["Giảm hormone stress Cortisol, tăng cường tiết Endorphin & Oxytocin, giúp thư giãn mạch máu và tăng đề kháng.", "Năng lượng tích cực chỉ có giá trị vui vẻ, không tác động đến sinh học tế bào.", "Làm cho hệ thần kinh bị kích thích quá mức gây mệt mỏi.", "Năng lượng tích cực làm giảm khả năng hấp thu dinh dưỡng của ruột."], "answer": "A", "explanation": "\"Tâm an - Thân khỏe!\" Nụ cười, âm nhạc nhẹ nhàng và những lời chào hỏi ấm áp tại Nhóm Dinh Dưỡng giúp dập tắt căng thẳng sau giờ làm việc. Tâm trí thả lỏng giúp hệ thần kinh thực vật cân bằng, huyết áp ổn định và vi nhung mao ruột hấp thu vi chất tốt nhất.", "wrong": ["Phương án B chưa đúng: Khoa học chứng minh cảm xúc tích cực trực tiếp làm thay đổi nồng độ vi chất và hormone trong máu.", "Phương án C chưa đúng: Không gian Nhóm mang lại sự hào hứng lành mạnh và bình an nội tâm.", "Phương án D chưa đúng: Tinh thần vui vẻ giúp tăng tiết enzym tiêu hóa và cải thiện hấp thu."]}, {"q": "Tại sao hoạt động \"Vận Động Tập Thể\" tại Nhóm Dinh Dưỡng lại thu hút và giúp hội viên kiên trì hơn tập tại nhà?", "options": ["Âm nhạc sôi động, HLV hô nhịp và sửa tư thế, sự vui vẻ của đồng đội giúp xua tan mệt mỏi và không bị bỏ cuộc.", "Vì tập tại Nhóm giúp đốt cháy Calo nhanh gấp 10 lần tập tại nhà.", "Tập tại Nhóm bắt buộc phải tập các bài tập vô cùng nặng nhọc.", "Vận động tập thể chỉ dành cho những người đã có thể lực tốt."], "answer": "A", "explanation": "\"Đồng điệu nhịp đập!\" Tập một mình rất dễ nản khi thấy mệt. Tại Nhóm, bài tập được thiết kế vừa sức (nhún nhảy, giãn cơ, zumba nhẹ), không khí ngập tràn tiếng cười khiến 30 phút vận động trôi qua nhanh chóng, biến việc tập luyện thành niềm vui mong chờ mỗi ngày.", "wrong": ["Phương án B chưa đúng: Lượng Calo đốt cháy phụ thuộc vào cường độ, nhưng Nhóm giúp bạn tập đủ thời gian và đều đặn.", "Phương án C chưa đúng: Bài tập tại Nhóm luôn ưu tiên sự an toàn, linh hoạt phù hợp cho cả người lớn tuổi.", "Phương án D chưa đúng: Mọi hội viên ở mọi thể trạng đều được chào đón và hướng dẫn từ mức cơ bản nhất."]}, {"q": "Vai trò của Nhóm Dinh Dưỡng trong việc \"Gieo hạt và Lan tỏa Giá trị Sức khỏe\" ra cộng đồng xung quanh?", "options": ["Mỗi hội viên có kết quả tốt trở thành một \"Đại sứ sức khỏe\", quay về thay đổi góc bếp gia đình và giúp đỡ người thân.", "Nhóm Dinh Dưỡng chỉ tập trung phục vụ cho một cá nhân duy nhất.", "Nhóm Dinh Dưỡng cấm hội viên chia sẻ giải pháp cho người ngoài.", "Sự lan tỏa chỉ mang lại lợi ích cho Huấn luyện viên."], "answer": "A", "explanation": "\"Sứ mệnh thay đổi chất lượng sống!\" Nhóm Dinh Dưỡng không chỉ chăm sóc 1 người. Khi người mẹ/người vợ có kết quả giảm mỡ, hết đau khớp, chị sẽ thay đổi cách nấu ăn cho cả nhà, đưa chồng con đến Nhóm, tạo nên một cộng đồng xung quanh cùng khỏe mạnh!", "wrong": ["Phương án B chưa đúng: Mục tiêu của Nhóm Dinh Dưỡng là phụng sự và nâng cao sức khỏe cho toàn cộng đồng.", "Phương án C chưa đúng: Nhóm khuyến khích hội viên lan tỏa gieo hạt giá trị giúp đỡ những người xung quanh.", "Phương án D chưa đúng: Người được giúp đỡ và chính bản thân hội viên chia sẻ là những người nhận giá trị hạnh phúc lớn nhất."]}, {"q": "Bẫy tâm lý phổ biến của người mới: \"TÔI NGẠI ĐẾN NHÓM DINH DƯỠNG vì sợ đám đông và sợ bị lôi kéo\"?", "options": ["Sự lo lắng ban đầu là tự nhiên; khi đến Nhóm bạn sẽ thấy sự tôn trọng riêng tư, thân thiện và hoàn toàn tự do trải nghiệm.", "Đúng! Nhóm Dinh Dưỡng là nơi luôn gây áp lực bắt buộc hội viên phải phát biểu trước đám đông.", "Nơi đây sẽ giữ giấy tờ tùy thân của hội viên khi đến sinh hoạt.", "Sự ngại ngùng này chứng tỏ bạn hoàn toàn không phù hợp với dinh dưỡng lành mạnh."], "answer": "A", "explanation": "\"Tháo gỡ rào cản e ngại!\" Nhiều người chưa quen với môi trường mới nên có tâm lý phòng thủ. HLV tại Nhóm luôn tinh tế quan sát, tạo không gian tư vấn 1:1 riêng tư, ấm áp, giúp bạn thả lỏng và nhận ra nơi đây hoàn toàn lành mạnh và tôn trọng sự tự do của bạn.", "wrong": ["Phương án B chưa đúng: Nhóm tôn trọng cá tính từng người, bạn có thể ngồi yên tĩnh quan sát và trải nghiệm.", "Phương án C chưa đúng: Nhóm Dinh Dưỡng hoàn toàn minh bạch, tôn trọng quyền tự do cá nhân của mọi hội viên.", "Phương án D chưa đúng: Sự e ngại ban đầu là tâm lý sinh lý bình thường của con người trước môi trường lạ."]}, {"q": "Ý nghĩa của việc học cách \"Đọc nhãn hiệu thực phẩm & Đi chợ thông thái\" được hướng dẫn tại Nhóm Dinh Dưỡng?", "options": ["Giúp hội viên nhận diện Calo ẩn, bẫy đường ngầm, chất béo xấu Trans Fat để bảo vệ túi tiền và vóc dáng khi đi siêu thị.", "Hướng dẫn hội viên cách mua những thực phẩm đắt tiền nhất.", "Bắt buộc hội viên chỉ được phép ăn thực phẩm do Nhóm Dinh Dưỡng cung cấp.", "Việc đọc nhãn hiệu chỉ dành cho các nhà khoa học nghiên cứu."], "answer": "A", "explanation": "\"Thông thái khi cầm thực phẩm trên tay!\" Tại Nhóm Dinh Dưỡng (Chủ đề 8), HLV cầm trực tiếp từng hộp sữa, gói bánh hướng dẫn bạn xem phần Servings, Sugar, Saturated Fat. Từ đó, khi đi s const TKP_LESSON=20;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


const app=document.getElementById('app');let index=0,correct=0,wrong=0,skipped=0,locked=false,soundOn=true,audio=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function beep(kind){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const tones=kind==='good'?[523,659,784,1047]:kind==='win'?[392,523,659,784,1047]:kind==='bad'?[320,260]:kind==='drum'?[160,120,90]:[480];tones.forEach((freq,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.115;o.type=kind==='drum'?'triangle':'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.19);});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: BẬT':'🔇 Âm thanh: TẮT';if(soundOn)beep('click')};
function celebrate(){const c=document.getElementById('confetti');c.innerHTML='';for(let i=0;i<65;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#f8d66e','#6deac0','#ff82b7','#b9a2ff'][i%4];p.style.animationDelay=Math.random()*.5+'s';p.style.animationDuration=1.7+Math.random()*1.7+'s';c.appendChild(p)}setTimeout(()=>c.innerHTML='',3500)}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="kicker">🎮 GAMESHOW KIẾN THỨC & KẾT NỐI</div><h1>THÔNG THÁI<br>MÔI TRƯỜNG</h1><p class="lead">Khám phá giá trị và sức mạnh của <b>NHÓM DINH DƯỠNG</b></p><p class="small">✨ ${QUESTIONS.length} câu hỏi • 4 lựa chọn • Chấm điểm tức thì • Giải thích chi tiết</p><p class="lead">Mỗi câu chỉ chọn một lần. Bạn có thể xem đáp án nhưng sẽ không được cộng điểm.</p><div class="actions"><button class="btn" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button></div>`;document.getElementById('start').onclick=()=>{beep('click');index=correct=wrong=skipped=0;showQuestion()}}
function showQuestion(){locked=false;const q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="stats"><span>✨ CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>✅ Đúng: ${correct} &nbsp; ❌ Sai: ${wrong} &nbsp; 👁 Xem: ${skipped}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><h2>${esc(q.q)}</h2><div class="options" id="options">${q.options.map((v,i)=>`<button class="option" data-i="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="btn ghost" id="reveal">👁 XEM ĐÁP ÁN</button><button class="btn" id="next" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'CÂU TIẾP THEO ➜'}</button></div>`;document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>choose(Number(btn.dataset.i)));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;beep('click');index++;if(index>=QUESTIONS.length)finish();else showQuestion()}}
function choose(choice){if(locked)return;locked=true;const q=QUESTIONS[index],a='ABCD'.indexOf(q.answer),isSkip=choice===null,isRight=choice===a;if(isSkip){skipped++;beep('drum')}else if(isRight){correct++;beep('good');celebrate()}else{wrong++;beep('bad')};document.querySelectorAll('.option').forEach((btn,i)=>{btn.disabled=true;btn.classList.add(i===a?'correct':(!isSkip&&i===choice?'incorrect':'dim'))});document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;let title=isSkip?'👁 ĐÁP ÁN ĐÚNG LÀ: '+q.answer:isRight?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!';document.getElementById('feedback').innerHTML=`<div class="result"><strong>${title}</strong>${!isRight&&!isSkip?`<p>ĐÁP ÁN ĐÚNG LÀ: <b>${q.answer}</b></p>`:''}<div class="explain"><b>💡 LỜI GIẢI THÍCH</b><p>${esc(q.explanation)}</p><p><b>Tại sao các phương án còn lại chưa đúng:</b></p>${q.wrong.map(w=>`<p>• ${esc(w)}</p>`).join('')}</div></div>`;document.getElementById('next').scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);const pct=correct/QUESTIONS.length*100;const praise=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="kicker">🏆 LỄ VINH DANH • TỔNG KẾT</div><h1>HOÀN THÀNH!</h1><div class="score">${Number(pct.toFixed(1))}%</div><h2>${praise}</h2><div class="scoregrid"><div><b>${QUESTIONS.length}</b>Tổng câu</div><div><b>${correct}</b>Trả lời đúng</div><div><b>${wrong}</b>Trả lời sai</div><div><b>${skipped}</b>Xem đáp án</div></div><div class="actions"><button class="btn" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button></div>`;beep('win');if(pct>=70)celebrate();document.getElementById('again').onclick=()=>{beep('click');index=correct=wrong=skipped=0;intro()}}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
</body></html>
