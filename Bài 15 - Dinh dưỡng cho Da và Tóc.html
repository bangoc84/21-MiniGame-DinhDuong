<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dinh dưỡng cho da và tóc | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Quy tắc vàng \"80/20\" trong việc chăm sóc và bảo vệ Làn da & Mái tóc khỏe đẹp tận gốc là gì?", "opts": ["80% dựa vào kem dưỡng bôi bên ngoài; 20% dựa vào việc uống thật nhiều nước ngọt.", "80% quyết định từ Dinh dưỡng nuôi tế bào bên trong; 20% phụ thuộc vào Chăm sóc/Mỹ phẩm bảo vệ bên ngoài.", "50% dựa vào việc đi Spa mỗi tuần và 50% dựa vào việc uốn nhuộm tóc.", "100% vẻ đẹp da tóc hoàn toàn do di truyền, dinh dưỡng không thể thay đổi được."], "answer": "B", "explain": "\"Trong sao – Ngoài vậy!\" Làn da và mái tóc là tấm gương phản chiếu chính xác sức khỏe bên trong cơ thể. 80% vẻ đẹp căng mịn của da và độ bóng mượt của tóc đến từ nguồn vi chất, đạm sạch và nước nạp vào nuôi tế bào; 20% còn lại là các bước làm sạch, chống nắng và dưỡng ẩm bảo vệ bề mặt ngoài.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Dùng kem đắt tiền nhưng bên trong tế bào thiếu đạm và vi chất thì da vẫn sần sùi, chảy xệ.\nPhương án C chưa đúng: Spa chỉ tác động vào lớp thượng bì ngoài da, không thay thế được nguyên liệu tạo Collagen từ bên trong.\nPhương án D chưa đúng: Di truyền chỉ quyết định cấu trúc ban đầu, dinh dưỡng đúng giúp tối ưu hóa và chống lão hóa da tóc vượt trội."}, {"n": 2, "q": "Bản chất sinh học cốt lõi cấu tạo nên sợi Tóc (Keratin) và lớp đệm dưới Da (Collagen) thực chất chính là thành phần nào?", "opts": ["Các phân tử chất béo bão hòa tích tụ.", "Các chuỗi Axit Amin ngắn được liên kết chặt chẽ từ chất ĐẠM (Protein) tinh sạch.", "Lượng đường tinh luyện tích trữ dưới da.", "Các tinh thể Natri từ muối ăn hàng ngày."], "answer": "B", "explain": "\"Đạm là gạch xây nên vẻ đẹp!\" Sợi tóc chứa hơn 85% là Keratin (một loại đạm cứng), còn độ đàn hồi của da do Collagen và Elastin (các sợi đạm dẻo dai) quyết định. Thiếu đạm sạch, cơ thể buộc phải rút đạm từ da và tóc ra dùng, khiến da nhăn nheo, lỏng cơ và tóc gãy rụng từng mảng!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Chất béo bão hòa bẩn chỉ gây bít tắc lỗ chân lông và nổi mụn, không cấu tạo nên Collagen/Keratin.\nPhương án C chưa đúng: Đường tinh luyện là kẻ thù làm tàn phá và đứt gãy cấu trúc Collagen.\nPhương án D chưa đúng: Muối Natri gây tích nước phù nề dưới da, không cấu tạo nên da tóc."}, {"n": 3, "q": "Hiện tượng \"Đường hóa\" (Glycation) – Kẻ thù số 1 âm thầm tàn phá làn da khi bạn nạp quá nhiều tinh bột xấu và đường ngọt?", "opts": ["Đường thừa trong máu dính chặt vào các sợi Collagen, làm đứt gãy cấu trúc đàn hồi, khiến da bị nhăn nheo, xệ nọng và lão hóa sớm.", "Đường làm cho làn da trở nên căng bóng và mịn màng như da em bé.", "Đường chuyển hóa hoàn toàn thành Vitamin C giúp da sáng hồng rạng rỡ.", "Hiện tượng đường hóa chỉ xảy ra đối với móng tay, không ảnh hưởng đến da mặt."], "answer": "A", "explain": "\"Đường làm giòn gãy Collagen!\" Khi nạp nhiều đường tinh luyện (bánh kẹo, trà sữa, cơm trắng), lượng đường dư thừa sẽ phản ứng với protein dưới da tạo thành các hợp chất AGES. Chúng biến các sợi Collagen mềm dẻo thành cứng giòn, dễ gãy sập, làm xuất hiện nếp nhăn sâu và chảy xệ má.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đường thừa gây cắn xé Collagen và làm da xám xịt chứ không thể giúp da căng mịn.\nPhương án C chưa đúng: Đường và Vitamin C có cấu trúc phân tử hoàn toàn khác nhau, đường không biến thành Vitamin C.\nPhương án D chưa đúng: Glycation tàn phá toàn bộ mạng lưới Collagen dưới da mặt và toàn bộ cơ thể."}, {"n": 4, "q": "Vai trò không thể thay thế của Bữa ăn F1 & Đạm PPP trong việc ngăn ngừa tình trạng da chùng nhão và rụng tóc khi giảm mỡ?", "opts": ["Cung cấp Đạm đậu nành phân lập hấp thu siêu tốc, đúc nguyên liệu tạo Collagen nuôi cơ, giữ phom dáng săn chắc.", "F1 và PPP chứa chất làm nhuộm màu tóc đen mượt cấp tốc.", "Giúp làm mất nước nhanh để da ôm sát vào xương.", "Thay thế hoàn toàn việc gội đầu và chăm sóc tóc hàng ngày."], "answer": "A", "explain": "Giảm mỡ không nhăn da! Khi giảm cân thông thường, người ta hay bị teo cơ khiến da xẹp xuống chảy xệ. Bổ sung F1 + PPP cung cấp nguồn đạm đậu nành phân lập tinh sạch (đạt PDCAAS = 1) giúp nuôi dưỡng khối cơ, tái tạo khung nâng đỡ dưới da, giúp vóc dáng thon gọn mà mặt vẫn căng tràn sức sống.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dinh dưỡng nuôi nang tóc chắc khỏe từ gốc, không chứa hóa chất nhuộm màu.\nPhương án C chưa đúng: Mất nước làm da khô héo, nhăn nheo; đạm sạch giữ da đàn hồi săn chắc.\nPhương án D chưa đúng: Dinh dưỡng nuôi tế bào bên trong, vẫn cần vệ sinh gội đầu sạch sẽ bên ngoài."}, {"n": 5, "q": "Tại sao Vitamin C lại được gọi là \"Người dẫn đường bắt buộc\" để cơ thể tự tổng hợp Collagen?", "opts": ["Nếu thiếu Vitamin C, các axit amin không thể liên kết thành chuỗi Collagen hoàn chỉnh, khiến da dễ bị thâm nám và chảy xệ.", "Vitamin C có khả năng thay thế hoàn toàn vai trò của chất đạm trong cơ thể.", "Vitamin C làm cho các sợi Collagen bị phân hủy nhanh hơn.", "Vitamin C chỉ có tác dụng tạo vị chua cho thực phẩm, không có giá trị đối với da."], "answer": "A", "explain": "\"Chìa khóa kích hoạt Collagen!\" Dù bạn nạp bao nhiêu đạm hay uống bao nhiêu Collagen, nếu thiếu Vitamin C (chất xúc tác cho phản ứng Hydroxy hóa Proline và Lysine), cơ thể cũng không thể đúc thành chuỗi Collagen dẻo dai. Vitamin C còn giúp ức chế hắc tố Melanin, giúp da mờ thâm sáng mịn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Vitamin C là chất xúc tác, không thay thế được nguyên liệu gạch xây là chất đạm.\nPhương án C chưa đúng: Vitamin C bảo vệ và kích thích tổng hợp Collagen, không làm phân hủy Collagen.\nPhương án D chưa đúng: Vitamin C là chất chống oxy hóa mạnh mẽ bảo vệ tế bào da khỏi tia UV."}, {"n": 6, "q": "Tác dụng tuyệt vời của Omega-3 (Herbalifeline) đối với việc tạo màng khóa ẩm tự nhiên cho da và ngăn ngừa mụn viêm?", "opts": ["Cung cấp axit béo thiết yếu tạo lớp màng Lipid giữ nước cho da, chống viêm mạn tính và điều hòa tuyến dầu nhờn.", "Omega-3 làm cho da mặt bôi nhờn dầu và dễ gây bít tắc lỗ chân lông hơn.", "Omega-3 chỉ tốt cho mắt, hoàn toàn không có tác động gì tới làn da.", "Omega-3 làm triệt tiêu hoàn toàn màng ẩm bảo vệ da."], "answer": "A", "explain": "\"Khóa ẩm tự nhiên từ bên trong!\" Màng tế bào da cần Omega-3 để giữ sự mềm dẻo và giữ nước không bị bốc hơi. Ngoài ra, tính năng chống viêm cực mạnh của Omega-3 Herbalifeline giúp làm dịu các nốt mụn sưng viêm, củng cố hàng rào bảo vệ da căng bóng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Omega-3 tinh sạch giúp điều hòa và làm cân bằng bã nhờn, không gây bí tắc mụn.\nPhương án C chưa đúng: Màng tế bào da rất giàu axit béo Omega-3, giúp da mịn màng chống khô ráp.\nPhương án D chưa đúng: Omega-3 chính là nguyên liệu củng cố lớp màng ẩm Lipid bảo vệ da."}, {"n": 7, "q": "Áp dụng công thức Uống Nước Chuẩn 3Đ (Đúng - Đủ - Đều) mang lại sự thay đổi kỳ diệu nào cho mái tóc và làn da?", "opts": ["Cung cấp độ ẩm tận cấp độ tế bào, tráng rửa độc tố, giúp da mọng nước và giúp nang tóc tiếp nhận dinh dưỡng mượt mà.", "Làm cho cơ thể bị tích nước gây sưng phù mắt ban sáng.", "Khiến cho các vi chất dinh dưỡng bị trôi tụt ra ngoài mà không kịp hấp thu.", "Nước lọc chỉ có tác dụng làm mát cổ họng, không liên quan đến da tóc."], "answer": "A", "explain": "\"Mỹ phẩm rẻ tiền và hiệu quả nhất chính là Nước!\" Da thiếu nước sẽ trở nên khô ráp, xám xịt và tiết dầu bóng nhờn để bù ẩm. Nang tóc thiếu nước sẽ bị xơ gãy. Uống đủ nước ấm (0,4l/10kg) nhấp từng ngụm giúp tế bào da căng mọng và đẩy luồng dinh dưỡng nuôi tóc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Uống nước đúng cách rải rác trong ngày giúp thải độc, không gây tích nước phù mắt.\nPhương án C chưa đúng: Uống nhấp từng ngụm ngồi giúp nước hòa tan vi chất đi vào nuôi tế bào mượt mà.\nPhương án D chưa đúng: Nước là dung môi chiếm 70% cơ thể, quyết định độ mọng của da và độ ẩm của tóc."}, {"n": 8, "q": "Tác hại nghiêm trọng của thói quen \"Stress mạn tính & Thức khuya sau 23h00\" đối với mái tóc và làn da?", "opts": ["Làm vọt hormone Cortisol gây phân hủy Collagen, tăng tiết dầu mụn, co thắt mạch máu nuôi nang tóc gây rụng tóc hàng loạt.", "Thức khuya giúp làn da tự động sản sinh thêm nhiều Collagen trẻ hóa.", "Stress giúp mái tóc mọc dài và dày hơn gấp 2 lần.", "Thức khuya hoàn toàn không ảnh hưởng đến nội tiết tố cơ thể."], "answer": "A", "explain": "Sát thủ bào mòn nhan sắc! Khi stress và thức khuya, hormone Cortisol vọt cao làm cắt đứt sợi Collagen, tàn phá tế bào gốc da. Đồng thời, mạch máu dưới da đầu bị co thắt khiến nang tóc bị \"bỏ đói\" dinh dưỡng, dẫn đến hiện tượng tóc gãy rụng đống lớn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thức khuya phá hỏng khung giờ tủy xương tạo máu và gan thải độc, làm da sạm sần.\nPhương án C chưa đúng: Stress là nguyên nhân hàng đầu gây hói đầu và rụng tóc mạn tính ở người trẻ.\nPhương án D chưa đúng: Thức khuya tàn phá hệ nội tiết, làm xáo trộn Estrogen/Testosterone gây mụn bọc."}, {"n": 9, "q": "Bẫy tư duy: \"Đầu tư hàng chục triệu mua Serum/Kem dưỡng đắt tiền nhưng tế bào bên trong bị ĐÓI VI CHẤT\"?", "opts": ["Giống như việc sơn phết lên bức tường gạch đã bị mục nát: Kem dưỡng ngoài không thể gánh nổi sự thiếu hụt đạm & vi chất từ bên trong.", "Giúp làn da hoàn hảo 100% mà không cần phải ăn uống bất kỳ chất gì.", "Là phương pháp chăm sóc da thông thái và tiết kiệm nhất.", "Giúp tóc tự động mọc dài mà không cần đạm."], "answer": "A", "explain": "\"Gốc rễ quyết định cành lá!\" Mỹ phẩm bôi ngoài chỉ thẩm thấu tối đa qua lớp sừng thượng bì. Nếu tế bào lớp đáy bị đói đạm, thiếu Vitamin C, A, E, Zinc thì lớp da mới mọc lên vẫn bị yếu ớt, thâm nám. Phải nuôi từ gốc bên trong kết hợp bảo vệ bên ngoài mới đẹp bền vững!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Tế bào da sống nhờ máu mang dinh dưỡng tới, không sống bằng kem bôi bên ngoài.\nPhương án C chưa đúng: Rất tốn kém tài chính nhưng kết quả da vẫn xuống cấp do thiếu dinh dưỡng gốc.\nPhương án D chưa đúng: Tóc mọc từ nang tóc bên trong da đầu, bắt buộc phải có đạm và vi chất từ máu."}, {"n": 10, "q": "Tác dụng của việc làm sạch đường ruột bằng Lô Hội Thảo Mộc Cô Đặc (Aloe) đối với tình trạng mụn nội tiết và da sạm nám?", "opts": ["Tráng rửa mảng bám vi nhung mao, giảm tải độc tố cho Gan, ngăn chặn độc tố ngấm ngược vào máu bộc phát ra da thành mụn.", "Lô hội làm cho da mặt bị bào mòn mỏng đi.", "Lô hội kích thích da tiết ra nhiều bã nhờn hơn.", "Lô hội chỉ có tác dụng đối với gầu trên da đầu."], "answer": "A", "explain": "\"Ruột sạch thì Da mới sáng!\" Khi đường ruột bẩn, độc tố đọng lại vi nhung mao sẽ ngấm ngược vào máu, ép Gan phải làm việc quá tải. Khi Gan không lọc hết, độc tố bắt buộc phải bùng phát qua da dưới dạng mụn bọc, mụn ẩn và sạm nám. Lô hội làm sạch ruột giúp da mịn màng trở lại!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lô hội thảo mộc uống vào giúp làm lành niêm mạc, không bào mòn da.\nPhương án C chưa đúng: Lô hội giúp làm dịu mát cơ thể và hỗ trợ cân bằng nội tiết, giảm mụn nhờn.\nPhương án D chưa đúng: Lô hội hỗ trợ thanh lọc hệ tiêu hóa và toàn bộ tế bào cơ thể."}, {"n": 11, "q": "Vai trò của vi khoáng Kẽm (Zinc) và Biotin (Vitamin B7) đối với sức khỏe chân tóc và tuyến bã nhờn trên da?", "opts": ["Kẽm giúp phục hồi tổn thương mô da & kiểm soát dầu; Biotin tham gia tổng hợp Keratin giúp chân tóc bám chắc, dầy dặn.", "Kẽm và Biotin làm cho chân tóc bị teo nhỏ và dễ gãy hơn.", "Hai vi chất này làm cho da mặt bị đổ nhiều dầu mỡ hơn.", "Kẽm và Biotin chỉ có trong các loại mỡ động vật đun sôi."], "answer": "A", "explain": "\"Bộ đôi quyền năng cho Tóc & Da!\" Biotin là coenzyme thiết yếu để đúc Keratin giúp sợi tóc dày dặn, giảm chẻ ngọn. Kẽm tham gia tái tạo tế bào da, làm lành vết mụn và điều hòa tuyến bã nhờn không bị tăng tiết dầu quá mức.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thiếu Biotin và Kẽm mới khiến chân tóc yếu gãy rụng và da bị vảy nến.\nPhương án C chưa đúng: Kẽm hỗ trợ làm giảm viêm và kiểm soát dầu nhờn trên da mặt rất tốt.\nPhương án D chưa đúng: Biotin và Kẽm giàu trong F1, đạm sạch, hạt dinh dưỡng, không nằm trong mỡ sôi."}, {"n": 12, "q": "Tác hại của các loại \"Chất Béo Chuyển Hóa (Trans Fat) & Béo Bão Hòa\" (đồ chiên rán, mỡ động vật) đối với cấu trúc làn da?", "opts": ["Kích hoạt phản ứng viêm mạn tính dưới da, làm biến tính bã nhờn gây tắc lỗ chân lông, bùng phát mụn viêm dai dẳng.", "Giúp làn da căng bóng mọng nước giống như xoa dầu mỡ.", "Giúp tiêu biến hoàn toàn các nốt mụn trứng cá.", "Chất béo xấu giúp gia tăng sản sinh Collagen dưới da."], "answer": "A", "explain": "Béo xấu tàn phá da! Ăn nhiều đồ chiên xào béo bão hòa sẽ làm chất bã nhờn trên da trở nên đặc quánh, dính bết, kết hợp với vi khuẩn gây bít tắc lỗ chân lông. Đồng thời, Trans Fat kích hoạt ổ viêm làm mụn sưng đỏ, lâu lành và để lại sẹo thâm sâu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Dầu mỡ xấu làm da bóng nhờn bẩn chứ không phải căng bóng khỏe mạnh.\nPhương án C chưa đúng: Béo xấu là nguyên nhân hàng đầu khiến mụn bọc bùng phát dai dẳng.\nPhương án D chưa đúng: Trans Fat gây ra các gốc tự do làm phá hủy mạng lưới Collagen dưới da."}, {"n": 13, "q": "Hậu quả nghiêm trọng của việc \"Nhịn ăn ép cân cực đoan / Cắt giảm dinh dưỡng quá đà\" đối với da và tóc?", "opts": ["Cơ thể thiếu đạm & vi chất buộc phải rút đạm từ tóc và da để duy trì sự sống, gây rụng tóc từng mảng và da xám xịt.", "Nhịn ăn ép cân giúp mái tóc bóng mượt hơn và da căng hồng rạng rỡ.", "Giúp làm gia tăng số lượng nang tóc mọc mới gấp 3 lần.", "Nhịn ăn hoàn toàn không gây ảnh hưởng gì tới da và tóc."], "answer": "A", "explain": "\"Trả giá đắt cho nhịn ăn!\" Khi bị bỏ đói, cơ thể ưu tiên sinh tồn (tim, não, phổi) hơn nhan sắc. Đạm và khoáng chất ở da, tóc sẽ bị xả ra để nuôi cơ quan sinh tồn. Kết quả là tóc gãy rụng khô xơ, da chảy xệ hốc hác, nhăn nheo như người già!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nhịn ăn khiến da khô héo, da xám xịt và rụng tóc nghiêm trọng.\nPhương án C chưa đúng: Thiếu đạm khiến nang tóc bị teo biến chứ không thể mọc mới.\nPhương án D chưa đúng: Tóc và da là nơi gánh chịu hậu quả nặng nề nhất khi cơ thể bị thiếu dinh dưỡng."}, {"n": 14, "q": "Tác dụng chống lão hóa da đỉnh cao của Vitamin E và các Dưỡng chất thực vật (Phytonutrients) đa sắc màu?", "opts": ["Vô hiệu hóa các gốc tự do từ ánh nắng mặt trời, ngăn chặn sự phân hủy Collagen, giúp da đều màu và săn chắc.", "Vitamin E làm cho da bị bắt nắng và sạm đen nhanh hơn.", "Dưỡng chất thực vật làm cho da bị dị ứng và nổi mẫn đỏ.", "Vitamin E chỉ có tác dụng bôi ngoài, không uống được."], "answer": "A", "explain": "\"Áo giáp chống lão hóa tế bào da!\" Vitamin E kết hợp cùng dưỡng chất thực vật 5 màu giúp vô hiệu hóa các gốc tự do sinh ra từ tia UV, ngăn chặn quá trình oxy hóa lipid màng tế bào, giữ da sáng mịn và chậm xuất hiện nếp nhăn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Vitamin E giúp củng cố hàng rào bảo vệ da, giảm tác hại của tia UV ánh nắng.\nPhương án C chưa đúng: Phytonutrients từ rau củ quả giúp tăng cường hệ miễn dịch da và giảm kích ứng.\nPhương án D chưa đúng: Vitamin E nạp từ bên trong giúp bảo vệ màng tế bào da toàn thân."}, {"n": 15, "q": "Khái niệm \"Collagen thủy phân\" (Collagen Peptides) có ưu thế sinh học vượt trội gì so với Collagen phân tử lớn thông thường?", "opts": ["Phân tử siêu nhỏ giúp hấp thu trực tiếp qua niêm mạc ruột vào máu, đi thẳng xuống lớp hạ bì kích thích đúc Collagen mới.", "Collagen thủy phân chỉ dùng để bôi bên ngoài da mặt.", "Collagen thủy phân chứa nhiều năng lượng Calo rỗng gây béo phì.", "Collagen phân tử lớn hấp thu tốt hơn Collagen thủy phân gấp 10 lần."], "answer": "A", "explain": "Hấp thu nhanh gấp hàng chục lần! Collagen thô phân tử quá lớn khó qua được hàng rào tiêu hóa. Công nghệ thủy phân xé nhỏ chuỗi Collagen thành các Peptides siêu mịn, giúp vi nhung mao ruột hấp thu tức thì, đi thẳng về da nuôi dưỡng tế bào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Collagen Peptides đường uống có hiệu quả sinh học vượt trội nuôi dưỡng da toàn thân.\nPhương án C chưa đúng: Collagen Peptides tinh sạch chứa đạm sinh học, hầu như 0 Calo rỗng.\nPhương án D chưa đúng: Collagen phân tử lớn bị dạ dày phân hủy và tỷ lệ hấp thu rất thấp."}, {"n": 16, "q": "Bẫy nguy hiểm của thói quen \"Sử dụng kem trộn / Tẩy trắng da cấp tốc\" so với \"Trẻ hóa da tự nhiên từ Dinh Dưỡng Tế Bào\"?", "opts": ["Kem trộn tàn phá hàng rào bảo vệ da, gây teo da, giãn mạch; Dinh dưỡng nuôi da khỏe mạnh từ gốc, căng sáng bền vững.", "Kem trộn giúp da khỏe mạnh từ bên trong tốt hơn dinh dưỡng tế bào.", "Hai phương pháp này mang lại độ an toàn cho da hoàn toàn giống nhau.", "Dinh dưỡng tế bào làm cho da bị mỏng đi và lộ mạch máu."], "answer": "A", "explain": "\"Sự thật về làn da nhiễm Corticoid!\" Kem trộn cấp tốc tẩy phăng lớp màng bảo vệ, làm da trắng bệch giả tạo nhưng để lại hậu quả teo da, nám mảng sẫm màu và viêm nhiễm mạn tính. Dinh dưỡng tế bào F1, PPP, Vitamin C nuôi da dẻo dai, sáng hồng tự nhiên từ gốc!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Kem trộn tàn phá cấu trúc da, nguy cơ biến chứng nhiễm độc da rất cao.\nPhương án C chưa đúng: Một bên phá hủy hàng rào bảo vệ da, một bên củng cố và tái tạo tế bào da.\nPhương án D chưa đúng: Dinh dưỡng tế bào giúp làm dày lớp hạ bì, làm săn chắc cấu trúc da."}, {"n": 17, "q": "Tác động của thói quen uống \"Nước Ngọt Có Ga & Nước Ép Đóng Chai\" đối với làn da tươi trẻ của chị em phụ nữ?", "opts": ["Nạp lượng lớn đường tự do gây bọt đường huyết, bít tắc tuyến bã nhờn, hủy hoại Collagen làm da bùng phát mụn và chảy xệ.", "Nước ngọt có ga giúp da mát mẻ và giảm tiết dầu nhờn.", "Nước ép đóng chai cung cấp nhiều chất xơ giúp da căng mịn.", "Nước ngọt có ga không chứa bất kỳ Calo hay đường nào."], "answer": "A", "explain": "Bẫy đường lỏng tàn phá nhan sắc! 1 lon nước ngọt chứa 35g–40g đường tinh luyện. Nạp nước ngọt làm vọt Insulin đẩy nhanh quá trình Glycation đứt gãy Collagen, đồng thời khiến da tăng tiết bã nhờn, mụn bọc bùng phát mưng mủ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước ngọt có ga gây mất nước tế bào và tăng phản ứng viêm gây mụn.\nPhương án C chưa đúng: Nước ép đóng chai đã lọc bỏ sạch chất xơ, chỉ còn nước đường Fructose cao.\nPhương án D chưa đúng: Nước ngọt chứa lượng Calo rỗng rất lớn (140–180 Calo/lon)."}, {"n": 18, "q": "Mối liên hệ sinh học giữa tình trạng \"Mỡ Nội Tạng Cao & Độc Tố Ruột\" với tình trạng da sạm nám, đồi mồi mạn tính?", "opts": ["Mỡ nội tạng tiết chất gây viêm mạn tính toàn thân, kích hoạt Melanocyte sản sinh quá mức hắc tố Melanin làm da sạm nám.", "Mỡ nội tạng giúp che chắn bảo vệ da khỏi tia cực tím nắng mặt trời.", "Mỡ nội tạng làm cho làn da trở nên trắng hồng rạng rỡ.", "Mỡ nội tạng chỉ ở vùng bụng, hoàn toàn không liên quan đến da mặt."], "answer": "A", "explain": "\"Mỡ bụng dày thì Da sạm nám!\" Mỡ nội tạng không nằm yên mà là \"nhà máy tiết chất viêm\". Phản ứng viêm mạn tính này kích thích tế bào hắc tố Melanocyte dưới da sản sinh Melanin vô thức để tự vệ, tạo thành các mảng nám nâu, đồi mồi khó chữa trên mặt.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Mỡ nội tạng gây hại cho chuyển hóa, không có khả năng chống tia UV.\nPhương án C chưa đúng: Mỡ nội tạng làm da sạm xịt, thiếu sức sống và mau lão hóa.\nPhương án D chưa đúng: Dòng máu chở chất gây viêm từ mỡ nội tạng đi khắp cơ thể tàn phá làn da."}, {"n": 19, "q": "Giải pháp phục hồi mái tóc bị xơ yếu, chẻ ngọn, gãy rụng do uốn nhuộm hóa chất nhiều lần từ góc độ Dinh Dưỡng?", "opts": ["Bổ sung Đạm sạch (F1+PPP), Biotin, Kẽm, Omega-3 và Nước 3Đ để nuôi lại nang tóc khỏe mạnh từ chân tóc mọc ra.", "Tiếp tục uốn nhuộm thêm nhiều lần nữa để che đi phần tóc xơ.", "Cắt bỏ toàn bộ tóc và không cần ăn uống bổ sung dinh dưỡng.", "Uống các loại nước ngọt để tăng độ bóng cho tóc."], "answer": "A", "explain": "Tái sinh mái tóc từ gốc! Hóa chất uốn nhuộm làm cháy phần ngọn tóc bên ngoài. Muốn có mái tóc mới dầy dặn, bóng mượt, bạn phải nạp đủ đạm Keratin, Biotin, Kẽm và Omega-3 từ bên trong để nuôi lớp tóc mới mọc ra khỏe dẻo dai từ chân tóc.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đè thêm hóa chất làm nang tóc bị nhiễm độc và rụng hói vĩnh viễn.\nPhương án C chưa đúng: Cắt tóc chỉ giải quyết ngọn, nếu thiếu dinh dưỡng tóc mọc ra vẫn xơ yếu.\nPhương án D chưa đúng: Nước ngọt gây tàn phá Collagen và làm suy yếu mầm tóc."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 15 \"DINH DƯỠNG CHO DA VÀ TÓC\" tại Nhóm Dinh Dưỡng?", "opts": ["\"ĐẸP TỪ BÊN TRONG - RẠNG RỠ BÊN NGOÀI: 80% Dinh dưỡng tế bào + 20% Chăm sóc bảo vệ = Mái tóc dầy mượt, Làn da căng mịn An Vui trọn đời!\"", "Chỉ cần phụ thuộc hoàn toàn vào mỹ phẩm bôi ngoài, không cần chú ý ăn uống.", "Muốn đẹp da tóc bắt buộc phải nhịn ăn để gầy hộc hác.", "Dinh dưỡng không có tác dụng gì đối với việc làm đẹp nhan sắc."], "answer": "A", "explain": "\"Nhan sắc bền vững khởi đầu từ đĩa ăn!\" Hãy yêu thương làn da và mái tóc bằng ly F1 đong đầy vi chất, đạm sạch PPP, Omega-3 Herbalifeline, Lô hội và nước ấm mỗi ngày. Khi tế bào bên trong khỏe mạnh, làn da sẽ tự động tỏa sáng và mái tóc sẽ tự tràn đầy sức sống!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Mỹ phẩm bôi ngoài chỉ hỗ trợ 20%, dinh dưỡng bên trong quyết định 80% độ trẻ trung.\nPhương án C chưa đúng: Nhịn ăn làm tàn phá Collagen khiến da chảy xệ và rụng tóc thảm hại.\nPhương án D chưa đúng: Dinh dưỡng tế bào chính là nền tảng gốc rễ tạo nên làn da và mái tóc khỏe đẹp."}];
let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI DINH DƯỠNG<br>CHO DA VÀ TÓC</h1><div class="subtitle">ĐẸP TỪ BÊN TRONG – RẠNG RỠ BÊN NGOÀI</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();
</script></body></html>
