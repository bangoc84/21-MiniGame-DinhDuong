<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái lão hóa lành mạnh | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Khái niệm cốt lõi của \"Lão Hóa Lành Mạnh\" (Healthy Aging) theo Y học Dinh dưỡng hiện đại khác biệt như thế nào so với lão hóa thụ động thông thường?", "opts": ["Lão hóa lành mạnh là việc kéo dài tuổi thọ lịch kể cả khi phải nằm trên giường bệnh và phụ thuộc vào thuốc tây.", "Là quá trình chủ động duy trì năng lượng tế bào, bảo tồn khối cơ, giữ minh mẫn thần kinh và sống khỏe mạnh không bệnh tật.", "Lão hóa lành mạnh là việc phẫu thuật thẩm mỹ liên tục để giữ vẻ ngoài trẻ trung bên ngoài.", "Là việc ngưng hoàn toàn vận động thể chất sau tuổi 50 để tránh tổn thương xương khớp."], "answer": "B", "explain": "\"Thêm tuổi vào cuộc sống - Thêm sức sống vào tuổi tác!\" Lão hóa lành mạnh không đơn thuần là sống thọ về số năm (Tuổi lịch), mà là chất lượng sống (Tuổi sinh học). Bằng dinh dưỡng tế bào chuẩn xác, con người hoàn toàn có thể bước sang tuổi 70, 80 với cơ thể dẻo dai, tâm trí minh mẫn, tự do đi lại và tràn đầy năng lượng an vui.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Sống thọ nhưng nằm bệnh viện chịu đau đớn là lão hóa bệnh lý thụ động, không phải lão hóa lành mạnh.\n• Phương án C chưa đúng: Phẫu thuật thẩm mỹ chỉ can thiệp bề ngoài, không làm trẻ hóa cỗ máy tế bào bên trong.\n• Phương án D chưa đúng: Ngưng vận động sau tuổi 50 làm cơ bắp teo nhanh hơn và xương khớp bị vôi hóa nặng nề."}, {"n": 2, "q": "Hiện tượng \"Suy giảm khối lượng cơ bắp do tuổi tác\" (Sarcopenia) tàn phá cơ thể người lớn tuổi ra sao và đâu là giải pháp khắc phục?", "opts": ["Mất cơ làm tụt BMR, gây lỏng cơ, dễ té ngã; cần bổ sung Đạm sạch (F1+PPP) phân lập kết hợp bài tập kháng lực.", "Mất cơ giúp cơ thể nhẹ nhõm hơn nên người già đi lại sẽ nhanh nhẹn hơn.", "Sarcopenia chỉ xảy ra ở vận động viên, người bình thường không bị ảnh hưởng.", "Cách khắc phục duy nhất là ăn thật nhiều mỡ động vật để bù đắp vào phần cơ bị mất."], "answer": "A", "explain": "\"Cơ bắp là áo giáp của tuổi già!\" Từ sau tuổi 30, mỗi thập kỷ cơ thể bị mất 3–8% khối cơ. Sau tuổi 60, tốc độ này tăng vọt gây teo chân tay, tụt chỉ số BMR, tích mỡ bụng và nguy cơ gãy xương khi té ngã. Bổ sung đạm sạch PPP (hấp thu nhanh) và F1 giúp đúc lại khung cơ dẻo dai.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mất cơ khiến chân tay run rẩy, mất thăng bằng và làm gia tăng nguy cơ té ngã nguy hiểm.\n• Phương án C chưa đúng: Sarcopenia là tiến trình sinh học tự nhiên diễn ra ở tất cả mọi người nếu thiếu đạm và lười vận động.\n• Phương án D chưa đúng: Mỡ động vật nạp vào làm tăng mỡ máu và mỡ nội tạng, hoàn toàn không thể tái tạo khối cơ."}, {"n": 3, "q": "Vai trò của Ti Thể (Mitochondria) – \"Nhà máy sản xuất năng lượng ATP\" đối với quá trình đảo ngược Tuổi Sinh Học?", "opts": ["Ti thể suy yếu làm tế bào kiệt sức và già cỗi; Cell Activator chứa Axit Alpha Lipoic giúp bảo vệ và phục hồi ti thể mạnh mẽ.", "Ti thể là nơi tích trữ các chất béo xấu gây xơ vữa động mạch.", "Ti thể sẽ tự động nhân đôi liên tục mà không cần bất kỳ vi chất chống oxy hóa nào.", "Ti thể chỉ có ở tế bào da, không có ở các cơ quan nội tạng."], "answer": "A", "explain": "\"Sức khỏe ti thể quyết định tuổi thọ!\" Ti thể chuyển hóa thức ăn thành năng lượng ATP nuôi sống cơ thể. Theo thời gian, độc tố và gốc tự do làm ti thể bị hư hỏng, khiến người già luôn cảm thấy mệt mỏi, uể uả. Cell Activator cung cấp chất chống oxy hóa chuyên sâu giúp bảo vệ và trẻ hóa ti thể từ bên trong.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Ti thể là nhà máy đốt Calo tạo năng lượng, không phải kho chứa mỡ xấu.\n• Phương án C chưa đúng: Ti thể rất dễ bị gốc tự do tấn công, bắt buộc phải có vi chất bảo vệ để không bị phân rã.\n• Phương án D chưa đúng: Ti thể có mặt trong hầu hết mọi tế bào cơ thể (đặc biệt là tế bào cơ tim, não và gan)."}, {"n": 4, "q": "Cơ chế \"Tự thực tế bào\" (Autophagy) – Quá trình tự dọn dẹp rác thải nội bào để trẻ hóa cơ thể bị ngưng trệ do thói quen sai lầm nào?", "opts": ["Thói quen ĂN VẶT LIÊN TỤC cả ngày khiến Insulin luôn ở mức cao, dập tắt hoàn toàn công tắc tự dọn dẹp của tế bào.", "Thói quen uống nước ấm rải rác trong ngày theo quy tắc 3Đ.", "Việc vận động thể dục nhẹ nhàng 30 phút mỗi ngày.", "Việc sử dụng Bữa ăn lành mạnh F1 có chỉ số GI thấp."], "answer": "A", "explain": "\"Công thức tự sửa chữa của tế bào!\" Autophagy (phát minh đạt giải Nobel Y học 2016) là cơ chế tế bào tự tiêu hủy các protein lỗi và bào quan già cỗi để tái tạo tế bào mới. Tuy nhiên, khi bạn ăn vặt liên tục (trà sữa, bánh kẹo, hoa quả), Insulin vọt cao sẽ khóa chặt tiến trình Autophagy, khiến rác thải đọng lại làm tế bào nhanh già!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Uống nước ấm giúp làm sạch độc tố, hoàn toàn không cản trở Autophagy.\n• Phương án C chưa đúng: Vận động thể chất kích thích và thúc đẩy cơ chế Autophagy diễn ra mạnh mẽ hơn.\n• Phương án D chưa đúng: Bữa ăn F1 GI thấp giúp giữ ổn định Insulin, hỗ trợ môi trường cho tế bào tự phục hồi."}, {"n": 5, "q": "Tác hại tàn phá của \"Gốc Tự Do\" (Free Radicals) đối với chuỗi ADN và giải pháp vô hiệu hóa từ Hệ thống Dưỡng chất thực vật?", "opts": ["Gốc tự do cướp electron tàn phá màng tế bào & ADN gây ung thư, lão hóa; Vitamin C, E, Selen, Phytonutrients giúp trung hòa.", "Gốc tự do là các dưỡng chất có lợi giúp tăng cường trí nhớ cho người già.", "Gốc tự do sẽ tự động biến mất nếu chúng ta ăn thật nhiều thức ăn chiên xào.", "Gốc tự do chỉ sinh ra khi con người uống thuốc tây."], "answer": "A", "explain": "\"Kẻ sát nhân thầm lặng!\" Gốc tự do sinh ra từ ô nhiễm, tia UV, stress và quá trình chuyển hóa. Chúng đi \"cướp\" electron của tế bào khỏe mạnh, làm biến tính ADN và gây ra hơn 100 loại bệnh mạn tính. Bổ sung đầy đủ Vitamin C, E, Selen và 5 màu rau củ giúp cho đi electron, dập tắt gốc tự do tức thì.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Gốc tự do là độc tố gây hại tàn phá tế bào, không phải dưỡng chất.\n• Phương án C chưa đúng: Thức ăn chiên xào chứa Trans Fat là nguồn sinh ra hàng tỷ gốc tự do tàn phá cơ thể.\n• Phương án D chưa đúng: Gốc tự do sinh ra liên tục ngay trong hơi thở và quá trình đốt Calo hàng ngày."}, {"n": 6, "q": "Khái niệm \"Inflammaging\" (Phản ứng viêm mạn tính dâm ỉ theo tuổi tác) nguy hiểm như thế nào đối với sức khỏe người lớn tuổi?", "opts": ["Là ngọn lửa ngầm tàn phá mạch máu, khớp xương, tế bào não; cần dập tắt bằng Omega-3 (Herbalifeline) & Dinh dưỡng sạch.", "Inflammaging là phản ứng giúp kéo dài tuổi thọ tế bào thêm 20 năm.", "Là hiện tượng da bị mẩn đỏ ngứa ngáy ngoài da khi gặp thời tiết lạnh.", "Inflammaging chỉ xuất hiện ở những người có chỉ số cân nặng quá gầy."], "answer": "A", "explain": "\"Ngọn lửa ngầm tàn phá tuổi già!\" Inflammaging (Inflammation + Aging) là tình trạng viêm mức độ thấp kéo dài dai dẳng do mỡ nội tạng, chất béo xấu và độc tố tích tụ. Ngọn lửa này làm xơ vữa động mạch, thoái hóa khớp và teo tế bào não. Omega-3 Herbalifeline đóng vai trò \"dội nước\" dập tắt ổ viêm ngầm này!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Inflammaging là nguyên nhân chính thúc đẩy tốc độ lão hóa và bệnh tật tuổi già.\n• Phương án C chưa đúng: Đây là phản ứng viêm sinh học cấp độ tế bào toàn thân, không đơn thuần là dị ứng da.\n• Phương án D chưa đúng: Inflammaging đặc biệt bùng phát mạnh ở người có chỉ số mỡ nội tạng cao."}, {"n": 7, "q": "Ý nghĩa sống còn của việc bảo vệ \"Sự Dẻo Dai Thành Mạch Máu\" bằng Nitric Oxide (Niteworks) đối với người lớn tuổi?", "opts": ["Nitric Oxide giúp giãn mở lòng mạch, dọn mảng bám, giữ huyết áp ổn định và ngăn ngừa nguy cơ ĐỘT QUỴ & TAIBIẾN đêm.", "Nitric Oxide làm cho mạch máu bị xơ cứng và co thắt lại.", "Niteworks giúp thay thế hoàn toàn cho các cử tập thể dục hàng ngày.", "Nitric Oxide chỉ có tác dụng đối với hệ tiêu hóa, không liên quan tới tim mạch."], "answer": "A", "explain": "\"Bảo vệ dòng chảy sự sống!\" Theo tuổi tác, khả năng tự sản sinh Nitric Oxide (NO) của nội mạc mạch máu bị sụt giảm 50–75%, khiến mạch máu bị xơ cứng, dễ đứt vỡ hoặc tắc nghẽn ban đêm. Niteworks (phát minh Nobel Y học) bổ sung L-Arginine giúp mạch máu giãn nở êm ái, bảo vệ an toàn cho trái tim.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: NO giúp làm mềm dẻo và giãn mở lòng mạch, ngược lại hoàn toàn với xơ cứng.\n• Phương án C chưa đúng: Niteworks bảo vệ mạch máu, vẫn cần vận động nhẹ nhàng để tăng cường tuần hoàn.\n• Phương án D chưa đúng: NO có tác dụng trực tiếp và quan trọng nhất lên toàn bộ hệ thống mạch máu tim mạch."}, {"n": 8, "q": "Tác động của nhóm chất béo tốt Omega-3 (Herbalifeline) đối với việc phòng ngừa bệnh Mất trí nhớ tuổi già (Alzheimer)?", "opts": ["DHA & EPA trong Omega-3 chiếm 20% cấu trúc não, giúp duy trì màng tế bào thần kinh mềm dẻo, tăng cường trí nhớ.", "Omega-3 làm cho tế bào não bị teo nhỏ và sụt giảm khả năng tư duy.", "Omega-3 làm gia tăng các mảng xơ vữa trong mạch máu não.", "Omega-3 chỉ có tác dụng làm sáng mắt, hoàn toàn không vào được não bộ."], "answer": "A", "explain": "\"Dưỡng chất vàng cho bộ não minh mẫn!\" Tế bào thần kinh được bọc bởi lớp màng Myelin rất giàu chất béo. Omega-3 tinh khiết (giàu DHA) giúp bảo vệ các sợi thần kinh khỏi phản ứng oxy hóa, làm chậm tiến trình thoái hóa não, giúp người lớn tuổi giữ được sự minh mẫn, tinh anh.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thiếu Omega-3 mới làm tế bào thần kinh bị suy thoái và teo nhỏ.\n• Phương án C chưa đúng: Omega-3 giúp bóc tách và dọn dẹp các mảng xơ vữa bẩn trong lòng mạch máu não.\n• Phương án D chưa đúng: DHA trong Omega-3 vượt qua hàng rào máu não để nuôi dưỡng tế bào thần kinh cực tốt."}, {"n": 9, "q": "Sự suy giảm \"Thảm Vi Nhung Mao Ruột\" ở người lớn tuổi dẫn đến hậu quả gì và giải pháp phục hồi từ Lô Hội Thảo Mộc (Aloe)?", "opts": ["Vi nhung mao bị gãy rụng làm kém hấp thu vi chất; Lô hội giúp làm sạch, xoa dịu niêm mạc và tái tạo khả năng hấp thu.", "Vi nhung mao gãy rụng giúp người già không bị tích mỡ bụng.", "Lô hội thảo mộc làm cho đường ruột bị bào mòn mỏng đi.", "Người lớn tuổi không cần vi nhung mao vì dạ dày sẽ tự co bóp nát thức ăn."], "answer": "A", "explain": "\"Gốc rễ hấp thu của tuổi già!\" Càng lớn tuổi, vi nhung mao ruột càng bị xơ hóa và rụng tàn phai do thuốc tây và ăn uống sai cách. Điều này khiến người già ăn nhiều vẫn thiếu chất, gầy yếu hoặc béo trệ. Lô hội thảo mộc làm sạch mảng bám bẩn, xoa dịu vết viêm, giúp vi nhung mao phục hồi lại mượt mà.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Kém hấp thu làm suy dinh dưỡng thể còm hoặc béo phì do rối loạn chuyển hóa.\n• Phương án C chưa đúng: Lô hội thảo mộc làm lành niêm mạc ruột, tuyệt đối không bào mòn.\n• Phương án D chưa đúng: Dạ dày chỉ nhào trộn, 100% vi chất bắt buộc phải hấp thu qua thảm vi nhung mao ruột non."}, {"n": 10, "q": "Sự phối hợp hoàn hảo giữa \"Xtra-Cal Advanced\" (Canxi hữu cơ + D3 + Magie) đối với việc phòng chống Loãng Xương tuổi già?", "opts": ["Canxi hữu cơ dễ tan; Vitamin D3 mở cửa ruột hấp thu Canxi vào máu; Magie gắn Canxi chặt vào khung xương.", "Canxi hữu cơ gây lắng đọng sỏi thận nặng hơn Canxi vô cơ.", "Vitamin D3 làm cho Canxi bị trôi tụt ra ngoài qua đường nước tiểu.", "Người lớn tuổi chỉ cần uống sữa bò thô là đủ Canxi, không cần bổ sung."], "answer": "A", "explain": "Bộ ba kiềng ba chân vững chắc! Khung xương người lớn tuổi bị xốp do mất Canxi. Xtra-Cal cung cấp Canxi hữu cơ sinh học hấp thu êm ái. D3 đóng vai trò \"chìa khóa\" mở cửa ruột chở Canxi vào máu. Magie đóng vai trò \"thợ xây\" gắn Canxi chuẩn xác vào xương, hoàn toàn không gây sỏi thận.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Canxi hữu cơ hòa tan hoàn toàn, không gây đóng cặn sỏi thận như Canxi vô cơ.\n• Phương án C chưa đúng: Vitamin D3 tăng cường hấp thu Canxi, ngăn ngừa thất thoát qua bài tiết.\n• Phương án D chưa đúng: Sữa bò thô chứa nhiều béo bão hòa và lactose khó tiêu, lượng Canxi hấp thu thực tế rất thấp."}, {"n": 11, "q": "Bẫy tư duy sai lầm nghiêm trọng: \"Người lớn tuổi tiêu hóa kém thì NÊN CẮT GIẢM ĐẠM, chỉ nên ăn cháo rau thanh tịnh\"?", "opts": ["Sai lầm! Người lớn tuổi càng thiếu đạm càng teo cơ, giảm sút miễn dịch, dễ gãy xương; cần ĐẠM THỰC VẬT SẠCH hấp thu nhanh.", "Đúng! Người lớn tuổi hoàn toàn không có nhu cầu về chất đạm.", "Ăn cháo rau giúp gia tăng khối lượng cơ bắp nhanh gấp 2 lần.", "Cắt giảm đạm giúp khung xương trở nên dẻo dai hơn."], "answer": "A", "explain": "\"Thanh tịnh sai cách gây teo cơ!\" Người già tiêu hóa kém với đạm động vật dai mỡ (thịt bò, heo), nhưng lại CỰC KỲ CẦN đạm sạch. Nếu chỉ ăn cháo rau, cơ thể sẽ tự xả cơ bắp ra dùng, gây suy kiệt hệ miễn dịch. Solution: Bổ sung Đạm đậu nành phân lập PPP + F1 nhẹ bụng, hấp thu 100%!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đạm là nguyên liệu cấu tạo nên bạch cầu miễn dịch và khung cơ xương cho người lớn tuổi.\n• Phương án C chưa đúng: Cháo rau chỉ chứa tinh bột và ít xơ, hoàn toàn không có đạm để tạo cơ.\n• Phương án D chưa đúng: Thiếu đạm làm suy giảm mật độ Collagen trong xương, khiến xương giòn dễ gãy."}, {"n": 12, "q": "Tác hại nguy hiểm của \"Chỉ số Mỡ Nội Tạng Cao\" đối với tốc độ lão hóa tế bào ở người trung niên và cao tuổi?", "opts": ["Mỡ nội tạng tiết ra các Cytokine gây viêm, tàn phá tế bào gan/tụy, vôi hóa mạch máu và đẩy nhanh tốc độ già hóa.", "Mỡ nội tạng giúp giữ ấm và bảo vệ các cơ quan nội tạng không bị lão hóa.", "Mỡ nội tạng làm tăng cường khả năng tự phục hồi của tế bào.", "Chỉ số mỡ nội tạng hoàn toàn không ảnh hưởng gì tới sức khỏe tuổi già."], "answer": "A", "explain": "\"Ổ độc tố tàn phá tuổi thọ!\" Mỡ nội tạng bám quanh tim, gan, thận, ruột là mô mỡ hoạt tính độc hại. Chúng liên tục tiết ra độc tố viêm Cytokine làm xơ hóa mạch máu, gây kháng Insulin (tiểu đường tuýp 2), gánh nặng cho tim và làm tế bào già đi nhanh chóng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Mỡ nội tạng là mỡ độc, gây tàn phá ổ tạng chứ không phải chăn sưởi bảo vệ.\n• Phương án C chưa đúng: Mỡ nội tạng làm suy giảm trầm trọng khả năng tự chữa lành của cơ thể.\n• Phương án D chưa đúng: Mỡ nội tạng là thước đo hàng đầu dự báo nguy cơ tử vong do bệnh mạn tính."}, {"n": 13, "q": "Lợi ích của thói quen \"Uống Nước Ấm Theo Quy Tắc 3Đ\" đối với việc duy trì thể tích máu và bảo vệ Đĩa Đệm ở người lớn tuổi?", "opts": ["Ngăn ngừa cô đặc máu ban đêm, làm phồng đĩa đệm khớp giúp giảm đau lưng, giảm gánh nặng co bóp cho cơ tim.", "Uống nước ấm làm cho máu bị loãng ra khiến cơ thể bị mất năng lượng.", "Uống nước ấm làm cho các khớp xương bị vôi hóa nhanh hơn.", "Người lớn tuổi không nên uống nước vì dễ gây đi tiểu đêm."], "answer": "A", "explain": "\"Dòng chảy sinh mệnh tuổi già!\" Người già trung bình bị mất cảm giác khát do suy giảm thần kinh. Máu đặc quánh làm tim phải đập dồn dập, dễ gây tai biến. Uống đủ nước ấm rải rác 3Đ giúp máu lưu thông nhẹ nhàng, đĩa đệm phồng xốp bôi trơn khớp xương.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thể tích máu chuẩn giúp tim co bóp nhẹ nhàng, không gây mất năng lượng.\n• Phương án C chưa đúng: Nước ấm giúp làm sạch độc tố và bôi trơn ổ khớp, chống thoái hóa.\n• Phương án D chưa đúng: Nhịn uống nước làm máu đặc nguy hiểm hơn nhiều; chỉ cần hạn chế uống nhiều sau 20h00."}, {"n": 14, "q": "Nguyên tắc \"20% Vận Động Thể Chất Hợp Lý\" dành cho người lớn tuổi tại Nhóm Dinh Dưỡng giúp duy trì điều gì?", "opts": ["Kích thích tuần hoàn máu, tăng cường mật độ xương, duy trì sự dẻo dai của khớp và kích thích tiết Endorphin an vui.", "Vận động cường độ cao 3 tiếng/ngày để ép cơ thể tiêu mỡ thật nhanh.", "Vận động giúp thay thế hoàn toàn nhu cầu nạp đạm và vitamin từ thức ăn.", "Người lớn tuổi chỉ nên nằm nghỉ ngơi 24/24 trên giường."], "answer": "A", "explain": "\"Vận động trong sự an toàn!\" Người lớn tuổi cần các bài tập hợp lý (đi bộ nhanh, yoga, dưỡng sinh, kháng lực nhẹ 20-30 phút/ngày). Vận động giúp đẩy dòng máu chở dinh dưỡng F1 đi nuôi khớp, giữ sự linh hoạt và giúp tinh thần sảng khoái.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tập luyện quá sức làm vọt hormone stress Cortisol và gây chấn thương xương khớp.\n• Phương án C chưa đúng: Vận động là chất xúc tác (20%), bắt buộc phải có Dinh dưỡng (80%) để phục hồi tế bào.\n• Phương án D chưa đúng: Nằm tĩnh tại hoàn toàn làm cơ bắp teo biến nhanh chóng và khớp bị dính cứng."}, {"n": 15, "q": "Ý nghĩa của Giấc Ngủ Sinh Học từ 23h00 đến 05h00 sáng đối với sự tái tạo Tủy Xương và Trẻ Hóa Tế Bào?", "opts": ["Khung giờ vàng tủy xương tạo máu, gan xả độc, não xả hormone HGH giúp sửa chữa tổn thương và tái sinh tế bào.", "Thức khuya sau 24h00 giúp cỗ máy tiêu mỡ hoạt động mạnh mẽ hơn.", "Giấc ngủ ban đêm hoàn toàn không ảnh hưởng gì tới tốc độ lão hóa.", "Ngủ đêm làm cho cơ thể bị tích tụ nhiều độc tố hơn là thức."], "answer": "A", "explain": "\"Bảo dưỡng cỗ máy sự sống!\" Giấc ngủ sâu từ 23h–05h là lúc tuyến yên tiết ra hormone tăng trưởng HGH (Growth Hormone) giúp trẻ hóa màng tế bào. Đây cũng là khung giờ tủy xương tái tạo dòng máu mới và gan lọc sạch độc tố trong ngày.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Thức khuya làm vọt Cortisol phá hủy Collagen và tích mỡ bụng dữ dội.\n• Phương án C chưa đúng: Thiếu ngủ mạn tính là con đường ngắn nhất dẫn đến lão hóa sớm và suy giảm trí nhớ.\n• Phương án D chưa đúng: Giấc ngủ giúp cơ thể tập trung năng lượng dọn dẹp độc tố nội bào."}, {"n": 16, "q": "Sức mạnh của \"Trạng Thái Tinh Thần An Vui & Lòng Biết Ơn\" trong việc làm chậm tiến trình Lão Hóa Sinh Học?", "opts": ["Hạ hormone stress Cortisol, kích hoạt não xả Endorphin & Oxytocin làm dịu mạch máu, tăng miễn dịch và trẻ hóa tế bào.", "Tinh thần an vui chỉ có giá trị cảm xúc, không tác động gì đến sinh học tế bào.", "Sự lo âu và tức giận giúp cơ thể đốt cháy Calo tiêu mỡ nhanh hơn.", "Lòng biết ơn làm cho hệ tiêu hóa bị ngưng trệ hoạt động."], "answer": "A", "explain": "\"Tâm an - Tế bào trẻ!\" Y học tâm thể chứng minh: Sự an vui, nụ cười và lòng biết ơn kích thích não tiết ra Oxytocin (hormone kết nối) và Endorphin (hormone chữa lành). Chúng làm hạ huyết áp, giãn mạch máu, củng cố hàng rào miễn dịch và làm chậm tuổi sinh học vượt trội!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cảm xúc tác động trực tiếp và tức thì đến việc tiết ra các hormone sinh học trong máu.\n• Phương án C chưa đúng: Tức giận làm vọt Adrenaline và Cortisol gây co thắt mạch máu, nguy cơ đột quỵ cao.\n• Phương án D chưa đúng: Tinh thần an vui giúp hệ thần kinh thực vật thả lỏng, giúp dạ dày co bóp êm ái."}, {"n": 17, "q": "Tại sao Bữa Ăn Lành Mạnh F1 lại là sự lựa chọn hoàn hảo nhất khởi đầu ngày mới cho người lớn tuổi?", "opts": ["Đong đầy 21 vi chất & đạm sạch phân lập, chỉ số GI siêu thấp (17-29), Calo chuẩn (90 kcal), cực kỳ nhẹ bụng tiêu hóa.", "F1 chứa nhiều chất béo bão hòa giúp người già tăng cân nhanh.", "F1 làm vọt chỉ số đường huyết lên cao để người già có năng lượng.", "F1 bắt buộc phải nấu đun sôi 3 tiếng trước khi ăn."], "answer": "A", "explain": "Bữa sáng minh triết tuổi già! Người lớn tuổi hệ tiêu hóa yếu, ăn phở/bún xôi dễ đầy hơi, tăng đường huyết. Ly F1 pha nước ấm nguội cung cấp trọn vẹn 21 vi chất, đạm sạch hấp thu tức thì, GI siêu thấp giúp đường huyết phẳng lặng, tràn đầy năng lượng!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: F1 hoàn toàn 0 chất béo bão hòa xấu, giúp bảo vệ tim mạch và tiêu mỡ.\n• Phương án C chưa đúng: F1 có chỉ số GI rất thấp (17-29), rất an toàn cho người tiểu đường và người lớn tuổi.\n• Phương án D chưa đúng: F1 pha nhanh gọn trong 1 phút với nước ấm/nguội <50°C, không đun nấu."}, {"n": 18, "q": "Sự khác biệt giữa \"Tuổi Lịch\" (Chronological Age) và \"Tuổi Sinh Học\" (Biological Age) đo trên máy quét Tanita tại Nhóm Dinh Dưỡng?", "opts": ["Tuổi lịch tính theo năm sinh cố định; Tuổi sinh học phản ánh độ trẻ khỏe của TẾ BÀO (có thể trẻ hơn tuổi lịch 10-15 tuổi).", "Tuổi sinh học luôn luôn lớn hơn tuổi lịch của tất cả mọi người.", "Tuổi lịch là chỉ số duy nhất quyết định sức khỏe của một con người.", "Hai chỉ số tuổi này hoàn toàn giống hệt nhau trong mọi trường hợp."], "answer": "A", "explain": "\"Làm chủ tuổi sinh học!\" Bạn 50 tuổi (Tuổi lịch), nhưng nếu ăn đúng, uống đủ nước, mỡ nội tạng thấp, cơ bắp tốt thì Tuổi sinh học tế bào chỉ như người 35 tuổi! Máy quét Tanita tại Nhóm Dinh Dưỡng giúp bạn đo lường và theo dõi hành trình trẻ hóa sinh học này.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Nếu nuôi dưỡng tế bào chuẩn, Tuổi sinh học có thể trẻ hơn Tuổi lịch rất nhiều.\n• Phương án C chưa đúng: Tuổi lịch chỉ là con số trên giấy tờ; Tuổi sinh học mới quyết định sự dẻo dai thực sự.\n• Phương án D chưa đúng: Tuổi sinh học biến đổi linh hoạt dựa trên lối sống và dinh dưỡng hàng ngày của bạn."}, {"n": 19, "q": "Bẫy tư duy tiêu cực: \"Lão hóa là quy luật tự nhiên, có chăm sóc dinh dưỡng cũng không giải quyết được gì\"?", "opts": ["Thụ động đầu sỏ! Dinh dưỡng chuẩn giúp BẬT các gen trẻ hóa, BẮT TẮT gen bệnh lý, giúp làm chậm và đảo ngược tuổi sinh học.", "Đúng! Dinh dưỡng không thể làm thay đổi bất kỳ tiến trình sinh học nào của cơ thể.", "Sự lão hóa hoàn toàn do số phận quyết định 100%.", "Chăm sóc dinh dưỡng chỉ làm cơ thể già đi nhanh hơn."], "answer": "A", "explain": "Ngành Di truyền học biểu gen (Epigenetics) chứng minh: Gen di truyền chỉ quyết định 20%, 80% còn lại do Lối sống & Dinh dưỡng quyết định! Lựa chọn Dinh dưỡng Cấp độ Tế bào giúp \"bật\" các gen trường thọ, làm chậm tiến trình lão hóa và cho bạn tuổi già rạng rỡ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dinh dưỡng là nguyên liệu trực tiếp nuôi sống và tái tạo tế bào hàng giây hàng phút.\n• Phương án C chưa đúng: Bạn hoàn toàn có quyền làm chủ sức khỏe và vóc dáng của mình thông qua sự lựa chọn hôm nay.\n• Phương án D chưa đúng: Dinh dưỡng tế bào chuẩn khoa học là giải pháp bảo vệ và trẻ hóa cơ thể hàng đầu."}, {"n": 20, "q": "Thông điệp cốt lõi và sứ mệnh cao quý nhất của Chủ đề 17 \"LÃO HÓA LÀNH MẠNH\" tại Nhóm Dinh Dưỡng?", "opts": ["\"LẢO HÓA LÀNH MẠNH - TRẺ HÓA TỪ TẾ BÀO: Chủ động làm chủ sức khỏe, giữ cơ dẻo dai, tâm trí minh mẫn, sống An Vui trọn đời!\"", "Lão hóa lành mạnh là việc uống thuốc giảm cân để gầy hộc hác.", "Chỉ cần sinh hoạt tại Nhóm Dinh Dưỡng 3 ngày là sẽ không bao giờ bị già đi.", "Lão hóa lành mạnh không cần đến sự đồng hành của Huấn luyện viên Dinh dưỡng."], "answer": "A", "explain": "\"Kiến tạo tuổi vàng An Vui!\" Lão hóa lành mạnh là món quà tuyệt vời nhất bạn dành tặng cho chính mình và gia đình. Bằng việc thực hành 21 bài học dinh dưỡng, sinh hoạt đều đặn tại Nhóm Dinh Dưỡng cùng HLV, bạn sẽ sở hữu một tuổi già an nhiên, khỏe mạnh và tràn đầy cảm hứng!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Lão hóa lành mạnh hướng tới sự cân bằng, dẻo dai và khỏe mạnh từ bên trong.\n• Phương án C chưa đúng: Chăm sóc cơ thể là một hành trình lối sống bền vững suốt đời.\n• Phương án D chưa đúng: HLV Dinh dưỡng là người đồng hành Daily giúp bạn giữ kỷ luật và đạt mục tiêu trẻ hóa."}];
const TKP_LESSON=17;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}

const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI LÃO HÓA<br>TÁI SINH NĂNG LƯỢNG TẾ BÀO</h1><div class="subtitle">BÓC TRẦN TUỔI SINH HỌC – LÃO HÓA LÀNH MẠNH</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
