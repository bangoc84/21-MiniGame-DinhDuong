:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Bản chất sinh học và vai trò cốt lõi nhất của Chất Đạm (Protein) đối với vóc dáng con người là gì?", "opts": ["Chất đạm là nguồn cung cấp năng lượng tích trữ dưới dạng lớp mỡ đệm bảo vệ tạng phủ.", "Chất đạm là nguyên liệu xâu dựng cấu trúc tế bào, tạo dựng khối cơ bắp, giữ da săn chắc và vận hành hệ miễn dịch.", "Chất đạm chỉ có tác dụng hỗ trợ ruột già hấp thu nước lọc tốt hơn.", "Chất đạm có thể thay thế hoàn toàn vai trò của nước và chất xơ trong cơ thể."], "answer": "B", "explain": "Đạm chính là \"gạch xây nhà\" của cơ thể! Mọi tế bào, từ mô cơ bắp, làn da, mái tóc, đến các kháng thể miễn dịch đều được cấu tạo từ các chuỗi đạm. Nạp đủ đạm giúp cơ thể săn chắc, không bị chảy xệ và có sức đề kháng vững vàng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Lớp mỡ đệm được tạo thành từ dư thừa Calo và chất béo, không phải vai trò sinh học của đạm.\nPhương án C chưa đúng: Đạm nuôi dưỡng toàn bộ cơ thể chứ không chỉ hỗ trợ ruột già hấp thu nước.\nPhương án D chưa đúng: Đạm không thể thay thế nước và chất xơ – đây là những nhóm chất có vai trò hoàn toàn độc lập."}, {"n": 2, "q": "Công thức chuẩn nhất để tính Nhu cầu Đạm tối thiểu cá nhân hóa cho một người trưởng thành tại Nhóm Dinh Dưỡng là gì?", "opts": ["Tất cả mọi người bất kể cân nặng đều cần ăn đúng 50g đạm mỗi ngày.", "Tối thiểu từ 1,2g đến 2,0g đạm cho mỗi 1kg cân nặng (Ví dụ: Người 50kg cần từ 60g đến 100g đạm sạch/ngày tùy mục tiêu).", "Lấy cân nặng nhân với 5,0g đạm mỗi ngày.", "Chỉ cần ăn đạm khi nào cảm thấy cơ tay chân bị đau mỏi."], "answer": "B", "explain": "Nhu cầu đạm được cá nhân hóa theo cân nặng và mức độ vận động. Người muốn giảm mỡ giữ cơ hoặc tập luyện cần từ 1,2g - 2,0g đạm/kg cân nặng. Đủ đạm giúp bảo vệ khối cơ bắp, đốt mỡ hiệu quả và duy trì cảm giác no lâu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Con số cào bằng 50g sẽ làm người nặng cân bị thiếu đạm nghiêm trọng gây teo cơ.\nPhương án C chưa đúng: Mức 5,0g/kg là quá cao, gây dư thừa Calo và gánh nặng cho gan thận.\nPhương án D chưa đúng: Đợi cơ bắp đau mỏi mới ăn là khi cơ thể đã bị dị hóa và tổn thương sâu."}, {"n": 3, "q": "Mối quan hệ giữa \"Khối lượng Cơ bắp\" (được nuôi bằng Đạm) và \"Tốc độ đốt Calo tự nhiên\" (BMR) của cơ thể là gì?", "opts": ["Khối cơ bắp càng cao thì cỗ máy đốt Calo tự nhiên càng mạnh; 1kg cơ bắp đốt Calo gấp 3–5 lần 1kg mỡ ngay cả khi đang ngủ.", "Khối cơ bắp và khối mỡ thừa tiêu hao năng lượng Calo hoàn toàn bằng nhau khi nghỉ ngơi.", "Càng nhiều cơ bắp thì tốc độ đốt Calo tự nhiên càng bị sụt giảm để tiết kiệm năng lượng.", "Khối cơ bắp chỉ giúp nâng vác nặng chứ không liên quan tới việc tiêu hao Calo."], "answer": "A", "explain": "Cơ bắp là \"động cơ tiêu thụ Calo\" hoạt động 24/7! Khi bạn nạp đủ đạm để giữ và tăng khối cơ, cỗ máy tiêu hóa sẽ tự động đốt Calo rên rỉ ngay cả khi bạn nằm ngủ. Đây là chìa khóa để giữ dáng mà không lo béo lại.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Mô mỡ lười biếng tiêu hao rất ít Calo, trong khi mô cơ bắp tiêu thụ Calo liên tục.\nPhương án C chưa đúng: Trái ngược hoàn toàn, nhiều cơ bắp làm tăng tốc độ đốt Calo chứ không sụt giảm.\nPhương án D chưa đúng: Khối cơ bắp quyết định chính tốc độ chuyển hóa năng lượng của cơ thể."}, {"n": 4, "q": "Sự khác biệt cốt lõi giữa \"Đạm Động Vật\" (thịt đỏ, mỡ heo, nội tạng) và \"Đạm Thực Vật Tinh Sạch\" (đậu nành phân lập, F1, PPP)?", "opts": ["Đạm động vật chứa ít Calo và ít chất béo xấu hơn đạm thực vật.", "Đạm động vật thường đi kèm chất béo bão hòa và cholesterol; Đạm thực vật tinh sạch giúp nuôi cơ mà không nạp chất béo xấu.", "Hai nguồn đạm này tác động hoàn toàn như nhau đối với sức khỏe tim mạch và mạch máu.", "Đạm thực vật gây ra bệnh gút và tăng mỡ máu nhanh hơn đạm động vật."], "answer": "B", "explain": "Thịt đỏ (bò, heo) chứa đạm nhưng lại \"khuyến mãi\" thêm nhiều béo bão hòa và cholesterol gây mỡ máu, gút và gánh nặng cho thận. Đạm thực vật phân lập (từ đậu nành) được tách bỏ chất béo xấu, cung cấp đạm sạch 100% giúp nuôi cơ nhẹ nhàng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Đạm động vật mỡ chứa Calo và béo xấu cao hơn đạm thực vật rất nhiều.\nPhương án C chưa đúng: Đạm động vật mỡ làm tăng nguy cơ xơ vữa động mạch, trong khi đạm thực vật bảo vệ tim mạch.\nPhương án D chưa đúng: Đạm động vật đỏ mới là nguyên nhân chính gây bệnh gút và tăng mỡ máu."}, {"n": 5, "q": "Hậu quả nghiêm trọng nhất của việc \"Thiếu đạm khi đang cắt giảm Calo để giảm cân\" là gì?", "opts": ["Giúp làn da căng bóng và trẻ ra 5 tuổi do cơ thể tự tiêu mỡ mặt.", "Cơ thể bị xả mô cơ bắp ra đốt, gây chảy xệ da, nhão tay đùi, hạ thấp cỗ máy đốt Calo và khiến béo lại nhanh hơn.", "Giúp xương khớp dẻo dai hơn do không phải gánh khối cơ nặng.", "Làm cho tóc và móng tay mọc dài ra gấp 2 lần."], "answer": "B", "explain": "\"Giảm cân sai cách!\" Khi nhịn ăn hoặc ăn thiếu đạm, cơ thể sẽ phân hủy mô cơ ra lấy năng lượng. Kết quả là bạn bị đứng cân, tay chân lỏng nhão, ngực mông chảy xệ, da mặt nhăn nheo và cỗ máy đốt Calo bị phá hủy hoàn toàn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Thiếu đạm làm sụt giảm collagen khiến da nhăn nheo, sạm xịt chứ không căng bóng.\nPhương án C chưa đúng: Mất cơ bắp làm mất chỗ dựa cho xương khớp, gây đau mỏi khớp nghiêm trọng hơn.\nPhương án D chưa đúng: Thiếu đạm khiến tóc xơ xác gãy rụng và móng tay bị giòn dễ gãy."}, {"n": 6, "q": "Điểm vượt trội của \"Đạm Đậu Nành Phân Lập\" có trong Bữa ăn F1 và Bột Protein PPP là gì?", "opts": ["Đã được loại bỏ chất béo bão hòa và các chất gây dị ứng, đạt chỉ số hấp thu tuyệt đối (bằng 1) nuôi cơ tức thì.", "Chứa lượng Calo cao gấp 5 lần so với đạm từ thịt ba chỉ.", "Làm gia tăng lượng mỡ bão hòa tích tụ ở vùng bụng.", "Bắt buộc dạ dày phải co bóp vất vả trong 8 tiếng mới tiêu hóa xong."], "answer": "A", "explain": "Đậu nành phân lập là đỉnh cao khoa học dinh dưỡng! Nó loại bỏ hoàn toàn mỡ xấu và chất gây đầy hơi, chỉ giữ lại chuỗi đạm tinh khiết đạt chỉ số hấp thu PDCAAS = 1 (mức hoàn hảo nhất), giúp tế bào hấp thu ngay để phục hồi cơ bắp.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm PPP và F1 có Calo rất thấp (chỉ khoảng 20–90 Calo/khẩu phần).\nPhương án C chưa đúng: Đạm thực vật phân lập không chứa chất béo bão hòa nên không gây tích mỡ bụng.\nPhương án D chưa đúng: Đạm phân lập hấp thu rất nhanh, không làm dạ dày mệt mỏi."}, {"n": 7, "q": "Ý nghĩa của việc \"Theo dõi Tỷ lệ Mỡ & Cơ định kỳ\" bằng máy quét sinh học thay vì chỉ nhìn vào \"Cân nặng thông thường\"?", "opts": ["Cân nặng thông thường phản ánh chính xác 100% lượng mỡ đã giảm được.", "Giúp nhận diện rõ \"Giảm Mỡ Thật\" (tăng/giữ cơ, giảm mỡ) hay \"Giảm Cân Giả Tạo\" (mất nước, teo cơ, mỡ giữ nguyên).", "Máy quét sinh học chỉ có tác dụng đo chiều cao của hội viên.", "Theo dõi chỉ số làm cho hội viên bị tăng mỡ bụng nhanh hơn."], "answer": "B", "explain": "Cân nặng thông thường là \"chiếc cân dối lừa\"! Nhịn ăn làm mất 2kg nước và cơ thì cân vẫn giảm nhưng người sồ sề. Máy quét Tanita giúp HLV theo dõi chính xác lượng Mỡ nội tạng tụt xuống và khối Cơ bắp tăng lên – đó mới là Giảm Mỡ Thật!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Cân nặng chỉ thể hiện tổng khối lượng (bao gồm cả phân, nước, xương, cơ, mỡ).\nPhương án C chưa đúng: Máy quét đo điện trở mô cơ, mỡ, nước, tuổi sinh học chứ không chỉ đo chiều cao.\nPhương án D chưa đúng: Theo dõi chỉ số giúp HLV điều chỉnh chế độ ăn để giảm mỡ tốt hơn."}, {"n": 8, "q": "Hiện tượng \"Giảm Cân Giả Tạo\" từ các phương pháp uống thuốc xả, nhịn ăn dại dột mang lại tác hại gì?", "opts": ["Làm tụt nước và teo mô cơ bắp, khiến vóc dáng chảy xệ, da xám xịt, người mệt mỏi và béo lại gấp đôi khi ăn lại.", "Giúp tiêu biến hoàn toàn lớp mỡ nội tạng quanh tim và gan.", "Giúp tăng cường khối lượng cơ bắp chân tay một cách nhanh chóng.", "Làm cho cỗ máy đốt Calo tự nhiên hoạt động mạnh mẽ hơn."], "answer": "A", "explain": "Thuốc xả hay nhịn ăn chỉ ép nước và vắt kiệt cơ bắp ra ngoài. Khi bước xuống cân thấy giảm 3kg nhưng thực chất mỡ thừa vẫn nguyên vẹn. Cơ bắp bị teo làm cỗ máy đốt Calo bị hỏng, khiến bạn béo lại sồ sề ngay khi ăn lại.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Giảm cân giả tạo không chạm được đến mỡ nội tạng.\nPhương án C chưa đúng: Nhịn ăn xả nước làm teo cơ chứ không thể tăng cơ.\nPhương án D chưa đúng: Mất cơ làm cỗ máy đốt Calo bị suy yếu nghiêm trọng."}, {"n": 9, "q": "Sản phẩm Bột Đạm Cá Nhân PPP (Personalized Protein Powder) đóng vai trò then chốt gì trong đĩa ăn của hội viên?", "opts": ["Thay thế hoàn toàn cho việc uống nước lọc rải rác trong ngày.", "Bổ sung đạm sạch 0 mỡ, giúp cá nhân hóa lượng đạm theo cân nặng, tạo độ no bền bỉ và giữ cơ bắp săn chắc.", "Làm tăng hàm lượng đường bão hòa trong bữa ăn.", "Giúp tăng mỡ dưới da ở vùng đùi và bụng."], "answer": "B", "explain": "Mỗi người có nhu cầu đạm khác nhau. PPP chứa đạm đậu nành và đạm váng sữa tinh khiết, giúp bạn chủ động nâng lượng đạm trong ly F1 lên chuẩn theo Con số đạm cá nhân, giúp no êm ái 4-5 tiếng và tạo phom dáng thon gọn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: PPP bổ sung đạm, không thay thế cho nước lọc.\nPhương án C chưa đúng: PPP không chứa đường hay béo xấu.\nPhương án D chưa đúng: Đạm sạch PPP giúp săn chắc cơ, giảm mỡ đùi và bụng."}, {"n": 10, "q": "\"Khung giờ vàng 30 phút\" ngay sau khi Vận Động thể thao là thời điểm tuyệt vời để nạp loại dinh dưỡng nào?", "opts": ["Nạp ngay một đĩa thịt mỡ chiên xào ngập dầu để bù Calo.", "Bổ sung ngay ĐẠM SẠCH HẤP THU NHANH (như F1 + PPP hoặc Rebuild Strength) để chữa lành vi sợi cơ và chống dị hóa cơ.", "Tuyệt đối không nạp bất kỳ chất gì kể cả nước lọc.", "Uống ngay một ly nước ngọt có ga đầy đá lạnh."], "answer": "B", "explain": "Trong 30 phút sau tập, các vi sợi cơ đang bị tổn thương và \"kêu cứu\" nguyên liệu. Nạp đạm sạch hấp thu nhanh lúc này giúp đưa ngay axit amin vào tế bào cơ, dập tắt quá trình dị hóa (teo cơ) và giúp cơ bắp săn chắc thần tốc!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Thịt mỡ chiên xào chứa béo xấu làm cản trở hấp thu đạm và tích mỡ.\nPhương án C chưa đúng: Bỏ đói cơ thể sau tập làm cơ bắp bị tự phân hủy để lấy năng lượng.\nPhương án D chưa đúng: Nước ngọt có ga gây vọt đường huyết và tích mỡ bụng sau tập."}, {"n": 11, "q": "Tại sao người GẦY muốn tăng cân lành mạnh bắt buộc phải bổ sung Đạm Sạch rải đều các bữa trong ngày?", "opts": ["Để xây dựng mô CƠ BẮP thật chứ không tích mỡ sồ sề, giúp vóc dáng tràn đầy sức sống và cơ thể khỏe mạnh từ gốc.", "Để đạm biến thành các lớp mỡ dày tích tụ ở nọng cằm và bụng.", "Để cơ thể ngưng hấp thu các loại vitamin từ thực phẩm thô.", "Giúp tiêu biến hoàn toàn khung xương của cơ thể."], "answer": "A", "explain": "Tăng cân thông thái là TĂNG CƠ BẮP, không phải tăng mỡ bụng sồ sề! Đạm sạch rải đều các bữa giúp nguyên liệu nuôi cơ luôn sẵn có, giúp người gầy sở hữu vóc dáng săn chắc, ngực nở đùi thon và gương mặt hồng hào.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm sạch nuôi cơ bắp, không tạo mỡ xấu ở nọng cằm hay bụng.\nPhương án C chưa đúng: Đạm hỗ trợ vận chuyển vi chất và giúp hấp thu vitamin tốt hơn.\nPhương án D chưa đúng: Đạm tạo khung cơ nâng đỡ giúp xương khớp chắc khỏe hơn."}, {"n": 12, "q": "Hậu quả của thói quen \"Dồn toàn bộ lượng đạm trong ngày vào duy nhất bữa ăn tối\" (ăn nhậu nhiều thịt đêm)?", "opts": ["Giúp cơ bắp hấp thu đạm tốt hơn gấp 10 lần so với chia nhỏ.", "Cơ thể không hấp thu kịp lượng đạm dư thừa, gây quá tải cho gan thận, dư Calo tích mỡ bụng và mất ngủ.", "Giúp cỗ máy đốt Calo tự nhiên hoạt động mạnh nhất vào lúc nửa đêm.", "Giúp làm sạch mỡ máu chỉ sau một đêm."], "answer": "B", "explain": "Cơ thể chỉ có thể xử lý khoảng 20–30g đạm trong một thời điểm. Ăn dồn quá nhiều thịt vào bữa tối khiến lượng đạm thừa bị thối vữa trong đường ruột, làm gan thận gồng mình lọc độc tố, gây nặng bụng mất ngủ và tích mỡ nội tạng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Ăn dồn làm giảm hiệu suất hấp thu đạm của cơ thể.\nPhương án C chưa đúng: Đêm là lúc cơ thể cần nghỉ ngơi, tiêu hóa nhiều thịt đêm làm ngưng trệ chuyển hóa.\nPhương án D chưa đúng: Ăn nhiều thịt mỡ đêm làm tăng nguy cơ mỡ máu cao."}, {"n": 13, "q": "Vai trò quan trọng của Chất Đạm đối với Hệ Miễn Dịch và Kháng Thể bảo vệ cơ thể?", "opts": ["Các kháng thể miễn dịch (như Immunoglobulin) được cấu tạo trực tiếp từ Đạm; thiếu đạm làm hệ miễn dịch suy kiệt và dễ ốm vặt.", "Chất đạm làm triệt tiêu các tế bào bạch cầu trong máu.", "Chất đạm không có bất kỳ liên hệ nào với hệ miễn dịch.", "Kháng thể miễn dịch chỉ được tạo thành từ chất béo bão hòa."], "answer": "A", "explain": "Đạm là vũ khí của hệ miễn dịch! Các chiến sĩ bạch cầu và thể kháng bệnh đều được sản xuất từ đạm. Người ăn thiếu đạm sẽ có hệ miễn dịch yếu ớt, rất dễ bị nhiễm trùng, cảm cúm và lâu lành vết thương.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm nuôi dưỡng và tái tạo tế bào bạch cầu.\nPhương án C chưa đúng: Đạm quyết định sức mạnh cốt lõi của hệ miễn dịch.\nPhương án D chưa đúng: Kháng thể cấu tạo từ các chuỗi đạm (protein), không cấu tạo từ chất béo."}, {"n": 14, "q": "Tại sao người lớn tuổi lại rất dễ bị \"Teo cơ bắp\" (Sarcopenia) và cần tăng cường Đạm Thực Vật dễ hấp thu?", "opts": ["Vì người lớn tuổi không còn khả năng tiêu hóa nước lọc.", "Khả năng hấp thu và tiêu hóa đạm thô bị suy giảm; đạm thực vật phân lập giúp nạp đủ đạm nuôi cơ mà không gây nặng bụng.", "Vì người lớn tuổi không cần đến đạm để duy trì sự sống.", "Vì đạm thực vật làm giòn xương ở người già."], "answer": "B", "explain": "Càng lớn tuổi, hệ tiêu hóa càng suy yếu, ăn thịt đỏ rất khó tiêu và đầy bụng, dẫn tới việc ngại ăn đạm và bị teo cơ bắp (chân tay nhỏ thó, đi đứng run rẩy). Đạm thực vật phân lập F1 + PPP là giải pháp hoàn hảo giúp người già hấp thu đạm dễ dàng để giữ cơ bắp dẻo dai.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Người già vẫn tiêu hóa nước lọc bình thường.\nPhương án C chưa đúng: Người lớn tuổi càng cần đạm để bảo vệ khối cơ và chống ngã đổ.\nPhương án D chưa đúng: Đạm thực vật kết hợp Canxi giúp xương chắc khỏe hơn."}, {"n": 15, "q": "Sự kết hợp giữa nạp đủ \"Đạm Sạch\" và việc giữ gìn \"Độ đàn hồi cho làn da\" của chị em phụ nữ?", "opts": ["Đạm sạch cung cấp các axit amin để tổng hợp Collagen tự nhiên, giúp da căng mịn, đàn hồi và không bị nhăn nheo khi giảm mỡ.", "Đạm sạch làm triệt tiêu toàn bộ lớp tế bào da mặt.", "Đạm sạch làm da bị tích nước chảy xệ nhanh hơn.", "Làn da chỉ được nuôi dưỡng bởi các loại kem thoa ngoài, không liên quan tới đạm."], "answer": "A", "explain": "\"Collagen thực chất là một loại Đạm!\" Khi bạn giảm mỡ mà nạp đủ đạm sạch, cơ thể sẽ có nguyên liệu đúc nên các sợi Collagen nâng đỡ dưới da, giúp làn da giữ được độ căng mịn, không bị trùng nhão hay nhăn nheo sau khi thu nhỏ vòng eo.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm nuôi dưỡng và tái tạo tế bào da tươi trẻ.\nPhương án C chưa đúng: Đạm sạch giúp da săn chắc chứ không gây tích nước chảy xệ.\nPhương án D chưa đúng: Thoa kem ngoài chỉ tác động 20% lớp tế bào chết, 80% sức sống làn da đến từ đạm nuôi bên trong."}, {"n": 16, "q": "So sánh giữa việc bổ sung Đạm qua \"Thịt heo ba chỉ chiên rán\" và \"1 ly F1 kết hợp 1 thìa PPP\"?", "opts": ["Thịt ba chỉ chiên rán tốt hơn vì chứa nhiều chất béo giúp no lâu hơn.", "Thịt ba chỉ chứa nhiều béo xấu và Calo vọt cao; Ly F1 + PPP cung cấp 15g đạm sạch, 0 béo xấu, Calo thấp và hấp thu tối đa.", "Hai lựa chọn này có hàm lượng béo xấu và Calo hoàn toàn bằng nhau.", "Ly F1 + PPP làm gia tăng nguy cơ mỡ máu cao hơn thịt ba chỉ."], "answer": "B", "explain": "Sự lựa chọn thông thái! 100g thịt ba chỉ chiên nạp vào tới 300 Calo kèm đầy mỡ bão hòa gây xơ vữa mạch máu. Ly F1 + PPP cung cấp trọn vẹn 15g đạm tinh sạch chỉ với khoảng 110 Calo, 0 béo xấu, giúp bạn thon gọn và bảo vệ tim mạch.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Mỡ chiên rán trong thịt ba chỉ là chất béo xấu gây mỡ máu và béo bụng.\nPhương án C chưa đúng: Calo và chất béo của 2 lựa chọn này trái ngược hoàn toàn.\nPhương án D chưa đúng: F1 + PPP giúp làm sạch mỡ máu chứ không gây mỡ máu."}, {"n": 17, "q": "Ý nghĩa của việc HLV Dinh dưỡng lập \"Nhật ký theo dõi chỉ số hàng ngày (Daily Log)\" cho từng hội viên?", "opts": ["Giúp phát hiện sớm các mắt xích sai sót (uống thiếu nước, ăn thừa Calo, thiếu đạm) để điều chỉnh kịp thời giúp đạt kết quả tối ưu.", "Để bắt buộc hội viên phải mua thêm thật nhiều sản phẩm.", "Nhật ký chỉ để làm kỷ niệm, không có giá trị về mặt khoa học dinh dưỡng.", "Để so sánh và chê bai những hội viên giảm cân chậm."], "answer": "A", "explain": "\"Quản lý chỉ số – Kiểm soát kết quả!\" Nhật ký theo dõi daily giống như chiếc la bàn. Nhìn vào đó, HLV sẽ biết chính xác hôm nay bạn uống đủ nước chưa, nạp đủ Con số đạm chưa để uốn nắn kịp thời, đảm bảo bạn giảm mỡ thành công mỗi tuần!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nhật ký dùng để quản lý lối sống và ăn uống đúng chuẩn.\nPhương án C chưa đúng: Nhật ký là công cụ khoa học kiểm soát chuyển hóa cơ thể.\nPhương án D chưa đúng: HLV luôn đồng hành, yêu thương và hỗ trợ hội viên tiến bộ từng ngày."}, {"n": 18, "q": "Tác hại ngầm của việc nạp quá nhiều \"Đạm Động Vật Đỏ\" (thịt bò, thịt heo mỡ, nội tạng) liên tục nhiều ngày?", "opts": ["Dư thừa axit uric gây gút, tăng mỡ máu bão hòa, tạo môi trường axit hóa cơ thể và gây gánh nặng suy yếu cho thận.", "Giúp làm sạch hoàn toàn hệ vi nhung mao đường ruột.", "Giúp làm giảm chỉ số Calo rỗng trong cơ thể.", "Giúp thận được nghỉ ngơi hoàn toàn."], "answer": "A", "explain": "Ăn quá nhiều thịt đỏ khiến thận phải gồng mình lọc các sản phẩm phụ của đạm (như ure, axit uric). Lượng mỡ bão hòa trong thịt đỏ làm tăng mỡ máu, gây xơ vữa động mạch và tạo môi trường axit – điều kiện thuận lợi cho mầm bệnh phát triển.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thịt đỏ chiên xào nhiều mỡ làm bết dính vi nhung mao chứ không làm sạch.\nPhương án C chưa đúng: Thịt đỏ mỡ chứa Calo rất cao.\nPhương án D chưa đúng: Thịt đỏ ép thận phải làm việc vất vả gấp nhiều lần."}, {"n": 19, "q": "Lợi ích của việc nạp \"Đạm Sạch\" đối với việc kiểm soát Cơn Thèm Ăn Vặt ở hội viên đang giảm mỡ?", "opts": ["Đạm kích thích tiết các hormone báo no kéo dài, giữ đường huyết ổn định, giúp tiêu tan cơn thèm đồ ngọt cồn cào.", "Đạm làm liệt các dây thần kinh vị giác nên không còn cảm nhận được vị ngon.", "Đạm làm dạ dày bị đóng băng hoàn toàn trong 24 tiếng.", "Đạm biến tất cả các món ăn vặt thành chất xơ."], "answer": "A", "explain": "Đạm là chất cho cảm giác no bền bỉ nhất! Nạp đủ Con số đạm cá nhân vào bữa sáng và các bữa phụ giúp đường huyết phẳng lặng, hormone báo no hoạt động tốt, giúp bạn nhẹ nhàng vượt qua các bẫy thèm ăn vặt, trà sữa hay bánh kẹo.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Đạm nuôi dưỡng vị giác khỏe mạnh chứ không làm liệt thần kinh.\nPhương án C chưa đúng: Đạm giúp tiêu hóa bền bỉ chứ không đóng băng dạ dày.\nPhương án D chưa đúng: Đạm không biến đồ ăn vặt thành chất xơ."}, {"n": 20, "q": "Thông điệp cốt lõi và giá trị sâu sắc nhất của Chủ đề 6 \"Tầm Quan Trọng Của Đạm & Việc Theo Dõi\" tại Nhóm Dinh Dưỡng là gì?", "opts": ["\"NẠP ĐỦ ĐẠM SẠCH CÁ NHÂN HÓA - THEO DÕI CHỈ SỐ CƠ MỠ ĐỊNH KỲ: Bí quyết vàng để GIỮ CƠ - GIẢM MỠ - Trẻ hóa vóc dáng và làm chủ sức khỏe An Vui trọn đời!\"", "Cắt bỏ hoàn toàn chất đạm ra khỏi thực đơn là con đường giảm cân tốt nhất.", "Ăn đạm động vật mỡ càng nhiều càng tốt, không cần theo dõi chỉ số cơ mỡ.", "Việc theo dõi chỉ số định kỳ chỉ dành cho những người thi đấu thể hình chuyên nghiệp."], "answer": "A", "explain": "\"Đạm là cội nguồn của phom dáng săn chắc!\" Hiểu đúng Con số đạm cá nhân, ưu tiên Đạm thực vật tinh sạch (F1, PPP) kết hợp với việc bám sát HLV theo dõi chỉ số mỡ cơ định kỳ chính là con đường ngắn nhất giúp bạn sở hữu vóc dáng chuẩn đẹp và sức khỏe bền lâu!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Cắt đạm gây teo cơ, nhão da, phá hỏng chuyển hóa rất nguy hiểm.\nPhương án C chưa đúng: Ăn nhiều đạm động vật mỡ gây gút, mỡ máu và hỏng gan thận.\nPhương án D chưa đúng: Theo dõi chỉ số cơ mỡ là kiến thức chăm sóc sức khỏe chủ động cần thiết cho tất cả mọi người."}];
const TKP_LESSON=6;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}


let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VỀ ĐẠM &amp;<br>BẬC THẦY THEO DÕI CƠ THỂ</h1><div class="subtitle">GIỮ CƠ – GIẢM MỠ – THEO DÕI HIỆU QUẢ</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
