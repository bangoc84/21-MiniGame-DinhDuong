:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Công thức tính lượng nước tối thiểu chuẩn khoa học mà mỗi cơ thể cần bổ sung hàng ngày theo cân nặng là gì?", "opts": ["Bất kể vóc dáng to hay nhỏ, tất cả mọi người đều phải uống đúng 2,0 lít nước mỗi ngày.", "Tối thiểu 0,4 lít nước cho mỗi 10kg cân nặng (Ví dụ: Người 50kg cần tối thiểu $50 \\times 0,4 = 2,0$ lít nước ấm/ngày).", "Lượng nước uống hàng ngày được tính bằng $1,0$ lít nước cho mỗi 10kg cân nặng.", "Chỉ cần uống nước khi nào cổ họng cảm thấy khát khô."], "answer": "B", "explain": "\"Cơ thể to cần nhiều nước, cơ thể nhỏ cần ít hơn!\" Mỗi tế bào đều cần nước để duy trì sự sống. Một người 80kg có thể tích tế bào lớn gấp đôi người 40kg, do đó không thể cào bằng 2 lít cho tất cả. Công thức $0,4\\text{l}/10\\text{kg}$ cân nặng là hạn mức tối thiểu giúp các cơ quan vận hành trơn tru và hỗ trợ tiêu mỡ hiệu quả.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Cào bằng 2 lít nước là tư duy cũ, không đáp ứng đủ nhu cầu cho người có cân nặng lớn.\nPhương án C chưa đúng: Uống 1,0l/10kg (người 60kg uống 6 lít) là quá mức, gây quá tải cho thận và nguy cơ ngộ độc nước.\nPhương án D chưa đúng: Cảm giác khát là lúc tế bào đã bị mất 2% nước và rơi vào trạng thái suy giảm chuyển hóa."}, {"n": 2, "q": "Quy tắc vàng \"3Đ\" trong thói quen uống nước được các Huấn luyện viên Dinh dưỡng nhắc nhở mỗi ngày là gì?", "opts": ["Đắt - Đậm - Đầy.", "Uống ĐÚNG cách - ĐỦ lượng - ĐỀU đặn rải rác trong ngày.", "Đói - Đau - Đầy.", "Đứng - Đáy - Đầy."], "answer": "B", "explain": "Quy tắc 3Đ quyết định 100% hiệu quả thẩm thấu! Đúng là uống ở tư thế ngồi, nhấp từng ngụm nhỏ; Đủ là đúng hạn mức cân nặng ($0,4\\text{l}/10\\text{kg}$); Đều là rải rác từ 15-20 phút/lần suốt từ sáng đến chiều để dòng nước tắm mát tế bào liên tục.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Nước lọc tinh sạch ấm áp rất bình dị, không cần đắt tiền hay pha quá đậm đặc.\nPhương án C chưa đúng: Đây là các dấu hiệu bất ổn của cơ thể, không phải quy tắc uống nước.\nPhương án D chưa đúng: Đứng uống một hơi tuột xuống bàng quang là sai kỹ thuật, gây áp lực lên thận."}, {"n": 3, "q": "Ý nghĩa kỳ diệu của việc uống ngay \"1 Ly Nước Lọc Ấm (300ml - 500ml)\" vào buổi sáng sớm khi vừa ngủ dậy?", "opts": ["Đánh thức cỗ máy chuyển hóa, tráng rửa niêm mạc dạ dày, thải độc sau đêm dài và kích thích nhu động ruột.", "Giúp làm đông quánh dầu mỡ thức ăn từ ngày hôm trước để dễ đào thải.", "Uống nước sáng sớm làm triệt tiêu hoàn toàn các vi chất dinh dưỡng của bữa ăn sáng.", "Giúp hạ nhiệt độ cơ thể xuống mức thấp nhất để phòng chống cảm cúm."], "answer": "A", "explain": "\"Tráng rửa cỗ máy đầu ngày!\" Sau 7-8 tiếng ngủ đêm, cơ thể bị mất nước qua hơi thở và mồ hôi, máu bị đặc lại. Ly nước ấm đầu ngày khi bụng rỗng giúp pha loãng máu, làm sạch mảng bám dạ dày/ruột, bảo vệ niêm mạc và kích thích đi vệ sinh nhẹ nhàng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước đá lạnh mới làm đông quánh mỡ; nước ấm giúp hòa tan và làm mềm mảng bám.\nPhương án C chưa đúng: Nước ấm tráng sạch đường ruột giúp vi nhung mao sẵn sàng hấp thu 100% dinh dưỡng từ ly F1 sau đó.\nPhương án D chưa đúng: Nước ấm giúp giữ ấm ổ bụng và duy trì thân nhiệt ổn định."}, {"n": 4, "q": "Tác hại nguy hiểm của thói quen \"Thường xuyên uống Nước Đá Lạnh\" đối với dạ dày và vòng eo của bạn?", "opts": ["Nước đá lạnh giúp đốt cháy Calo cực nhanh và làm thon gọn vòng eo cấp tốc.", "Làm co thắt mạch máu dạ dày, hạ thân nhiệt ổ tạng buộc cơ thể phải TÍCH MỠ BỤNG để sưởi ấm cơ quan nội tạng.", "Nước đá lạnh làm cho răng và nướu trở nên dẻo dai, chắc khỏe hơn.", "Giúp đường ruột hấp thu vi chất dinh dưỡng tốt hơn gấp 2 lần."], "answer": "B", "explain": "Bẫy tích mỡ từ nước đá! Khi dội dòng nước lạnh vào dạ dày, nhiệt độ ổ bụng bị sụt giảm đột ngột. Cơ thể có phản xạ tự vệ sinh học: tích tụ thêm lớp mỡ quanh vùng bụng và nội tạng để làm \"tấm chăn sưởi ấm\". Ngoài ra, nước lạnh làm đông quánh chất béo trong thức ăn, gây khó tiêu.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Uống nước đá không giúp tiêu mỡ bụng mà ngược lại còn làm tích tụ mỡ bụng nội tạng.\nPhương án C chưa đúng: Nước đá lạnh làm ê buốt răng, hại men răng và gây viêm họng mạn tính.\nPhương án D chưa đúng: Nước lạnh làm co co thắt mạch máu niêm mạc ruột, cản trở sự hấp thu vi chất."}, {"n": 5, "q": "Cơ chế sinh học giải thích hiện tượng: \"Tại sao khi cơ thể THIẾU NƯỚC chúng ta lại hay bị nhầm lẫn thành CƠN THÈM ĂN VẶT\"?", "opts": ["Vùng dưới đồi (Hypothalamus) quản lý cả Cơn Khát và Cơn Đói phát tín hiệu giống nhau, khiến bạn tưởng đói và ăn thêm Calo rỗng.", "Tế bào thiếu nước sẽ lập tức biến thành tế bào mỡ làm bụng bị cồn cào.", "Cảm giác thèm ăn vặt hoàn toàn không liên quan gì đến nước.", "Uống nước làm tăng mức độ hormone thèm ngọt Cortisol."], "answer": "A", "explain": "\"Khát nhưng tưởng Đói!\" Trung khu điều khiển ở não bộ dùng chung một vùng tín hiệu cho cả khát và đói. Khi tế bào thiếu nước, não báo tín hiệu \"Cần năng lượng/dung môi\". Thay vì uống 1 ly nước ấm, nhiều người lại đi ăn bánh kẹo, trà sữa, nạp thêm Calo rỗng làm béo bụng!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Tế bào thiếu nước bị teo héo chứ không biến thành tế bào mỡ.\nPhương án C chưa đúng: Uống 1 ly nước ấm ngay khi cảm thấy cồn cào sẽ giúp dập tắt 80% cơn thèm ăn vặt giả.\nPhương án D chưa đúng: Uống đủ nước giúp hạ hormone stress Cortisol và làm dịu thần kinh."}, {"n": 6, "q": "Tư thế và kỹ thuật uống nước chuẩn nhất giúp tế bào hấp thu tối đa mà KHÔNG gây áp lực lên Thận?", "opts": ["Đứng thẳng lưng, ngửa cổ và uống một hơi thật nhanh nửa lít nước.", "Ngồi xuống thư thái, nhấp từng ngụm nhỏ, đọng nhẹ ở hai bên má trước khi nuốt từ từ.", "Nằm ngửa trên giường và uống nước qua ống hút.", "Vừa chạy bộ nhanh vừa uống nước đá lạnh liên tục."], "answer": "B", "explain": "Kỹ thuật \"Nhai nước\"! Khi ngồi xuống, cơ thể ở trạng thái thả lỏng. Việc đọng nhẹ nước ở hai bên má giúp kích thích các thần kinh cảm nhận ở khoang miệng gửi tín hiệu lên não: \"Dòng nước đang tới!\". Tế bào mở cửa tiếp nhận nước êm ái mà không bị dội thẳng xuống bàng quang.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án A chưa đúng: Đứng uống dồn làm trọng lực đẩy nước rơi thẳng xuống thận và bàng quang, gây mỏi lưng và mau buồn tiểu.\nPhương án C chưa đúng: Nằm uống nước rất dễ gây sặc vào đường hô hấp nguy hiểm.\nPhương án D chưa đúng: Vừa chạy vừa uống nước đá làm sóc hông và co thắt dạ dày đột ngột."}, {"n": 7, "q": "Vai trò cốt lõi của Nước đóng vai trò như \"Người vận chuyển\" trong quá trình nuôi dưỡng Dinh Dưỡng Tế Bào (F1 & PPP)?", "opts": ["Nước là dung môi hòa tan, chở 21 vi chất & đạm sạch thấm qua vi nhung mao ruột vào máu, đồng thời chở rác thải ra ngoài.", "Nước làm phân hủy và tiêu diệt các vitamin trong Bữa ăn F1.", "Nước chỉ có tác dụng làm cho bột Shake F1 dễ nuốt hơn.", "Nước làm cho đạm thực vật bị biến thành đạm động vật bão hòa."], "answer": "A", "explain": "Dòng sông chuyên chở dinh dưỡng! Dù ly F1 đong đầy 21 vi chất đỉnh cao, nhưng nếu cơ thể thiếu nước, máu sẽ bị đặc quánh lại như cháo. Nước đóng vai trò là dung môi làm lỏng máu, chở vi chất tới từng tế bào nghèo khổ và cuốn sạch rác thải chuyển hóa ra đường bài tiết.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước ấm (<50°C) giúp hòa tan và bảo vệ nguyên vẹn các vitamin.\nPhương án C chưa đúng: Nước không chỉ làm trôi thức ăn mà là dung môi sinh học bắt buộc cho mọi phản ứng tế bào.\nPhương án D chưa đúng: Nước là hợp chất $H_2O$, không thể biến đổi cấu trúc hóa học của đạm thực vật."}, {"n": 8, "q": "Tại sao người đang trong hành trình Giảm Mỡ - Giảm Cân bắt buộc phải UỐNG ĐỦ NƯỚC mới tiêu được mỡ?", "opts": ["Quá trình phân rã mỡ (Lipolysis) bắt buộc phải có phân tử $H_2O$ tham gia phản ứng thủy phân để biến mỡ thành $CO_2$ & Nước.", "Uống nhiều nước sẽ làm mỡ bị tan chảy trực tiếp ra đường đi tiểu.", "Uống nước giúp ép cỗ máy BMR hạ xuống mức 0.", "Nước có khả năng hấp thụ trực tiếp khối mỡ dưới da."], "answer": "A", "explain": "\"Không có nước - Không thể đốt mỡ!\" Về mặt sinh hóa, phản ứng bóc tách phân tử Triglyceride (mỡ thừa) thành năng lượng bắt buộc phải có nước (Thủy phân mỡ). Thiếu nước, cỗ máy đốt mỡ bị đình trệ hoàn toàn. Đó là lý do tại sao ăn đúng mà thiếu nước thì cân nặng đứng yên!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Mỡ không tan chảy ra nước tiểu mà bị oxy hóa thành $CO_2$ (qua hơi thở) và $H_2O$ (qua mồ hôi/tiểu).\nPhương án C chưa đúng: Uống đủ nước giúp tăng chỉ số BMR (tốc độ trao đổi chất) chứ không hạ xuống 0.\nPhương án D chưa đúng: Nước là chất xúc tác phản ứng sinh hóa, không tự hấp thụ khối mỡ thô."}, {"n": 9, "q": "Hậu quả nghiêm trọng đối với Não Bộ và Tinh Thần khi cơ thể rơi vào trạng thái \"Khát mới uống\"?", "opts": ["Giảm 2% nước làm sụt giảm 20% hiệu suất trí não, gây sương mù não, đau đầu, giảm tập trung và dễ gắt gỏng.", "Giúp trí não trở nên minh mẫn và sáng tạo hơn gấp 2 lần.", "Càng thiếu nước não bộ càng tiết ra nhiều hormone hạnh phúc Endorphin.", "Thiếu nước chỉ ảnh hưởng đến làn da, hoàn toàn không liên quan tới não."], "answer": "A", "explain": "Mô não chứa tới 80% là nước! Khi bạn cảm thấy khát, tế bào não đã bị co rút lại do mất nước. Hệ thần kinh bị suy giảm dẫn truyền, gây ra hiện tượng sương mù não, ngủ gật giữa ngày, đau nửa đầu và tâm trạng hay bực bội vô cớ.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thiếu nước làm teo nhẹ mô não tạm thời, gây suy giảm trí nhớ nghiêm trọng.\nPhương án C chưa đúng: Thiếu nước kích thích não xả hormone stress Cortisol, không tiết Endorphin.\nPhương án D chưa đúng: Não là cơ quan nhạy cảm nhất với sự thiếu hụt nước trong cơ thể."}, {"n": 10, "q": "Bẫy tư duy: \"Tôi đã uống đủ nước mỗi ngày vì tôi uống nhiều Nước Ngọt, Trà Đặc, Cà Phê và Nước Ép Trái Cây\"?", "opts": ["Sai lầm! Các loại nước có đường/Caffeine chứa chất kích thích đi tiểu và đường xấu, làm CƠ THỂ MẤT NƯỚC TẾ BÀO nhiều hơn.", "Đúng! Loại nước nào cũng là nước, đều có giá trị bù nước cho tế bào giống hệt nhau.", "Nước ngọt có ga giúp tế bào căng mịn nhanh hơn nước lọc.", "Cà phê đặc giúp tích trữ thêm nước trong đĩa đệm xương khớp."], "answer": "A", "explain": "\"Uống vào nhưng lại Mất đi!\" Cà phê, trà đặc chứa Caffeine; nước ngọt chứa muối Natri và đường tinh luyện. Chúng có tác dụng lợi tiểu mạnh, bắt thận phải xả nước ra ngoài để đào thải độc tố, khiến tế bào bên trong bị khát khô hơn! Chỉ có Nước Lọc Ấm mới là chân lý bù nước.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước ngọt/cà phê gây mất nước tế bào và nạp thêm Calo rỗng tàn phá vóc dáng.\nPhương án C chưa đúng: Đường trong nước ngọt làm đứt gãy Collagen khiến da khô xù xì và béo bụng.\nPhương án D chưa đúng: Caffeine làm mất nước ở các mô liên kết và đĩa đệm xương khớp."}, {"n": 11, "q": "Giải mã bẫy tâm lý: \"Tôi không dám uống nhiều nước vì sợ bị TÍCH NƯỚC làm TĂNG CÂN và PHÙ MẶT\"?", "opts": ["Ngược lại! Uống THIẾU NƯỚC mới khiến cơ thể bật chế độ dự trữ, giữ lại Natri gây phù nề; Uống ĐỦ NƯỚC giúp thận xả nước thừa.", "Đúng! Uống trên 1 lít nước sẽ làm cơ thể tự động biến nước thành mô mỡ.", "Uống nước chỉ gây phù mặt đối với phụ nữ, nam giới không bị.", "Tích nước là do cơ thể có quá nhiều đạm sạch PPP."], "answer": "A", "explain": "Phản ứng dự trữ sinh tồn! Khi bạn uống quá ít nước, cơ thể lo sợ bị chết khát nên sẽ kích thích hormone Aldosterone giữ lại từng giọt nước và Natri đọng ở mô dưới da, gây hiện tượng phù bắp chân, phù mắt. Uống đủ nước là tín hiệu báo: \"Môi trường an toàn!\", giúp thận tự động xả hết nước thừa đọng.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước hoàn toàn $0\\text{ kcal}$, không thể biến thành mô mỡ.\nPhương án C chưa đúng: Cơ chế giữ nước do thiếu nước xảy ra ở cả nam và nữ giống nhau.\nPhương án D chưa đúng: Đạm sạch PPP giúp săn chắc cơ bắp, không gây tích nước dưới da."}, {"n": 12, "q": "Hiện tượng \"Phản ứng làm sạch / Thải độc lành tính\" khi một hội viên bắt đầu thói quen Uống Đủ Nước tại Nhóm Dinh Dưỡng?", "opts": ["Cảm giác hơi choáng nhẹ, đi tiểu nhiều hơn, nổi vài nốt mụn ẩn – là do tế bào đang đẩy rác thải độc tố ra ngoài.", "Dấu hiệu cho thấy cơ thể bị dị ứng với nước lọc.", "Cảnh báo cơ thể đang bị suy giảm khối lượng cơ bắp nghiêm trọng.", "Là do nước lọc làm cho đường ruột bị nhiễm khuẩn."], "answer": "A", "explain": "\"Xả rác tế bào!\" Trước đây cơ thể như căn nhà lâu năm không quét. Khi dòng nước ấm $3\\text{Đ}$ nạp vào, nó bóc tách độc tố, mảng bám tích tụ bấy lâu xả vào máu để đào thải qua da và đường tiểu. Đây là phản ứng mừng, thường tự hết sau 3-5 ngày, trả lại cơ thể nhẹ nhõm!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước lọc tự nhiên là thành phần sinh học của cơ thể, không gây dị ứng.\nPhương án C chưa đúng: Uống nước đủ giúp nuôi dưỡng và chống teo cơ bắp.\nPhương án D chưa đúng: Nước đun sôi ấm giúp làm sạch và bảo vệ đường ruột."}, {"n": 13, "q": "Khung giờ vàng thứ 3 trong ngày để uống 1 ly nước ấm: \"Uống 1 ly nước ấm trước khi TẮM 15 phút\" có tác dụng gì?", "opts": ["Giúp ổn định huyết áp, cân bằng nhiệt độ cơ thể và ngăn ngừa rủi ro ĐỘT QUỴ/TAI BIẾN trong phòng tắm.", "Giúp làm da mặt trắng sáng lên ngay lập tức sau khi tắm.", "Giúp cơ thể không bị trôi mất chất béo khi xội nước.", "Khung giờ này chỉ dành riêng cho người bị bệnh tim mạch."], "answer": "A", "explain": "Bảo vệ tính mạng trong phòng tắm! Khi tắm (dù nước nóng hay lạnh), sự thay đổi nhiệt độ bên ngoài khiến mạch máu dưới da co giãn đột ngột, dễ gây biến động huyết áp. 1 ly nước ấm trước khi tắm giúp điều hòa lưu lượng máu, làm dịu thần kinh và ngăn ngừa tai biến.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước uống bảo vệ tuần hoàn, không làm trắng da cấp tốc.\nPhương án C chưa đúng: Tắm rửa làm sạch bên ngoài, không trôi chất béo bên trong cơ thể.\nPhương án D chưa đúng: Đây là thói quen dưỡng sinh an toàn cần thiết cho tất cả mọi người."}, {"n": 14, "q": "Tác động trực tiếp của việc duy trì thói quen Uống Đủ Nước đối với sức khỏe của hệ Xương Khớp & Đĩa Đệm?", "opts": ["Đĩa đệm chứa 80% là nước; uống đủ nước giúp đĩa đệm trơn mượt, giảm ma sát xói mòn khớp và ngăn ngừa đau lưng.", "Uống nhiều nước làm cho Canxi trong xương bị hòa tan bớt ra ngoài.", "Nước làm cho các khớp xương bị khô cứng và dễ gãy hơn.", "Xương khớp chỉ cần Canxi, hoàn toàn không cần tới nước."], "answer": "A", "explain": "\"Dầu bôi trơn sinh học!\" Đĩa đệm cột sống và bao hoạt dịch khớp xương đóng vai trò như nhún giảm xóc. Khi thiếu nước, đĩa đệm bị xẹp lép, các đầu xương xát vào nhau gây đau nhức xói mòn. Uống đủ nước giữ đĩa đệm căng phồng và khớp đi lại dẻo dai!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Uống đủ nước hỗ trợ thận điều hòa khoáng chất, không làm hòa tan Canxi trong xương.\nPhương án C chưa đúng: Nước là chất bôi trơn giúp khớp dẻo dai, ngược lại với khô cứng.\nPhương án D chưa đúng: Khớp xương bắt buộc phải có nước để tạo chất nhờn bôi trơn."}, {"n": 15, "q": "Tại sao khi VẬN ĐỘNG THỂ THAO tại Nhóm Dinh Dưỡng, chúng ta phải bổ sung Nước & Điện Giải đúng cách?", "opts": ["Mồ hôi thoát ra làm mất Nước & Muối khoáng; bổ sung đúng giúp ngăn ngừa chuột rút, kiệt sức và duy trì sức bền.", "Để làm cho cơ thể bị hạ đường huyết nhanh hơn nhằm tiêu mỡ.", "Uống nước khi tập thể dục sẽ làm dạ dày bị sa tụt xuống.", "Chỉ uống nước sau khi tập xong 2 tiếng đồng hồ."], "answer": "A", "explain": "Bù đắp lượng mồ hôi mất đi! Khi tập luyện, mồ hôi mang theo các ion điện giải (Natri, Kali, Magie). Nhấp từng ngụm nước ấm hoặc nước điện giải trong lúc tập giúp giữ thể tích máu, chống chuột rút cơ bắp và duy trì sự dẻo dai.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Bổ sung nước giúp ổn định chuyển hóa, không gây hạ đường huyết nguy hiểm.\nPhương án C chưa đúng: Nhấp từng ngụm nhỏ hoàn toàn không gây sa dạ dày hay nặng bụng.\nPhương án D chưa đúng: Để nhịn nước 2 tiếng sau tập làm cơ thể bị rơi vào trạng thái mất nước cấp tính."}, {"n": 16, "q": "Tác động kỳ diệu của việc Uống Đủ Nước đối với nhan sắc Làn Da và độ thon gọn của Nọng Cằm?", "opts": ["Cung cấp độ ẩm tận tế bào giúp da căng mọng, làm sáng da, đồng thời giúp thận xả mỡ và nước thừa vùng nọng cằm.", "Uống nhiều nước làm da bị chảy xệ và xuất hiện thêm nhiều nếp nhăn.", "Nước lọc làm cho các nốt mụn trứng cá bùng phát dữ dội hơn.", "Da mịn màng chỉ do kem bôi, nước không có tác động gì."], "answer": "A", "explain": "\"Mỹ phẩm tự nhiên số 1!\" Tế bào da đủ nước sẽ căng phồng như quả nho tươi, giúp làm mờ các nếp nhăn li ti. Ngoài ra, uống đủ nước giúp đào thải độc tố và xả lượng nước muối tích tụ ở vùng nọng cằm, giúp gương mặt thanh thoát hơn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Thiếu nước mới làm da khô héo, chùng nhão; đủ nước giúp da đàn hồi căng mịn.\nPhương án C chưa đúng: Uống đủ nước tráng rửa ruột, giúp giảm mụn viêm rõ rệt.\nPhương án D chưa đúng: Kem bôi chỉ tác động 20% bề mặt ngoài, nước nuôi dưỡng 80% tế bào da bên trong."}, {"n": 17, "q": "Mối liên hệ sinh học giữa thói quen \"Lười uống nước mạn tính\" với căn bệnh SỎI THẬN và TÁO BÓN?", "opts": ["Thiếu nước làm nước tiểu cô đặc đọng cặn khoáng thành Sỏi Thận; phân bị rút sạch nước trở nên khô cứng gây Táo Bón.", "Lười uống nước giúp thận được nghỉ ngơi nên không bao giờ bị sỏi.", "Táo bón là do ăn nhiều chất xơ, không liên quan tới nước.", "Lười uống nước giúp đường ruột trơn trượt hơn."], "answer": "A", "explain": "\"Dòng nước lắng cặn!\" Khi lười uống nước, nước tiểu bị đặc quánh lại, các tinh thể Canxi/Oxalate dễ dàng kết dính thành Sỏi Thận. Tại đại tràng, cơ thể rút kiệt nước từ phân để sinh tồn, khiến phân khô cứng như viên sỏi gây táo bón đau đớn.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Lười uống nước làm nước tiểu cô đặc, là nguyên nhân hàng đầu gây sỏi thận.\nPhương án C chưa đúng: Ăn xơ mà thiếu nước thì xơ sẽ đóng thành khối tắc nghẽn gây táo bón nặng hơn.\nPhương án D chưa đúng: Thiếu nước làm niêm mạc ruột khô rát, gây ma sát tổn thương đại tràng."}, {"n": 18, "q": "Khái niệm \"Nhai Nước - Uống Cơm\" theo bí quyết dưỡng sinh sinh hoạt tại Nhóm Dinh Dưỡng nghĩa là gì?", "opts": ["\"Nhai nước\" là nhấp ngụm nhỏ hòa đảo với nước bọt rồi nuốt; \"Uống cơm\" là nhai cơm thật kỹ thành nước mịn mới nuốt.", "\"Nhai nước\" là bỏ đá viên vào miệng nhai; \"Uống cơm\" là chan cơm ngập nước lọc rồi nuốt chửng.", "Là thói quen vừa ăn cơm vừa uống nước ngọt có ga.", "Cả hai thuật ngữ này chỉ là câu nói đùa, không có ý nghĩa khoa học."], "answer": "A", "explain": "Bí quyết tiêu hóa đỉnh cao! \"Nhai nước\" giúp Enzym Amylase trong nước bọt hòa trộn với nước trước khi xuống dạ dày. \"Uống cơm\" là việc nhai kỹ 30-50 lần biến cơm thô thành dạng lỏng như nước, giúp dạ dày không phải làm việc vất vả và giảm tải cho tuyến tụy.\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nhai đá làm hỏng men răng và chan nước vào cơm làm loãng enzym tiêu hóa.\nPhương án C chưa đúng: Vừa ăn vừa uống nước ngọt làm vọt đường huyết và tàn phá dạ dày.\nPhương án D chưa đúng: Đây là triết lý dưỡng sinh Y học cổ truyền và hiện đại ứng dụng chuẩn xác."}, {"n": 19, "q": "Tác dụng nhân đôi khi phối hợp \"Trà Thảo Mộc Cô Đặc\" cùng \"Nước Lọc Ấm\" trong việc giải phóng mỡ thừa?", "opts": ["Trà thảo mộc kích thích phân rã tế bào mỡ; Nước ấm đóng vai trò dòng chảy cuốn mỡ đã phân rã ra ngoài.", "Trà thảo mộc giúp tiêu diệt hoàn toàn nhu cầu uống nước lọc.", "Phối hợp này làm cho cơ thể bị tích mỡ nội tạng nhiều hơn.", "Trà thảo mộc làm cho nước bị biến thành chất béo xấu."], "answer": "A", "explain": "\"Đốt mỡ & Cuốn trôi!\" Chiết xuất trà xanh, trà đen, hạt bạch đậu khấu trong Trà Thảo Mộc giúp kích hoạt chuyển hóa, bóc tách mảng mỡ thừa. Dòng nước ấm 3Đ đóng vai trò như chiếc xe chở mỡ đã rã ra đường bài tiết, giúp cơ thể nhẹ nhõm tức thì!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Trà thảo mộc pha cùng nước ấm chính là phương tiện giúp bạn hoàn thành hạn mức nước dễ dàng.\nPhương án C chưa đúng: Bộ đôi này hỗ trợ tiêu mỡ nội tạng và mỡ dưới da rất mạnh mẽ.\nPhương án D chưa đúng: Trà thảo mộc giàu chất chống oxy hóa, 0 béo xấu."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 16 \"LUÔN UỐNG ĐỦ NƯỚC\" tại Nhóm Dinh Dưỡng?", "opts": ["\"NƯỚC LÀ DÒNG SINH MỆNH - UỐNG ĐÚNG ĐỦ ĐỀU: Hãy yêu thương 75 ngàn tỷ tế bào bằng những ngụm nước ấm mỗi ngày để Kiến tạo Sức khỏe & Vóc dáng An Vui trọn đời!\"", "Uống nước chỉ là việc phụ, thích thì uống không thích thì thôi.", "Có thể thay thế hoàn toàn nước lọc bằng các loại nước ép trái cây ngọt.", "Uống nước chỉ có tác dụng đối với người đang muốn giảm cân."], "answer": "A", "explain": "\"Nước là Rẻ nhất - Nhưng Giá trị nhất!\" Nước chiếm 70% cơ thể. Mọi giải pháp dinh dưỡng hay rèn luyện sẽ giảm 50% hiệu quả nếu bạn lười uống nước. Hãy luôn mang theo bình nước ấm bên mình, thực hành quy tắc 3Đ để làm sạch tế bào và tận hưởng sức khỏe trọn vẹn!\nTẠI SAO CÁC PHƯƠNG ÁN CÒN LẠI CHƯA ĐÚNG:\nPhương án B chưa đúng: Nước là nhu cầu sinh tồn bắt buộc số 1 của cơ thể con người.\nPhương án C chưa đúng: Nước ép đóng chai chứa đường ngọt gây béo bụng và mất nước tế bào.\nPhương án D chưa đúng: Nước cần thiết cho tất cả mọi người (người tăng cân, giảm cân, giữ dáng, người già, trẻ nhỏ)."}];
let index=0,correct=0,wrong=0,revealed=0,locked=false,soundOn=true,ac=null;
const app=document.getElementById('app');const letters=['A','B','C','D'];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI DÒNG CHẢY<br>LÀM CHỦ THÓI QUEN UỐNG ĐỦ NƯỚC</h1><div class="subtitle">NƯỚC LÀ DÒNG SINH MỆNH • UỐNG ĐÚNG – ĐỦ – ĐỀU</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();
</script></body></html>
