<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thông thái dinh dưỡng ưu việt | Thiệu Trung</title><style>
:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Sự khác biệt cốt lõi về vai trò sinh học giữa \"Dinh Dưỡng Nền Tảng\" (F1, PPP, Trà, Lô hội) và \"Dinh Dưỡng Ưu Việt / Chuyên Sâu\" (Niteworks, Prolessa Duo, Cell Activator...)?", "opts": ["Dinh dưỡng nền tảng dành cho người nghèo, Dinh dưỡng ưu việt dành cho người giàu.", "Nền tảng cung cấp năng lượng vi chất cơ bản; Ưu việt tập trung xử lý các mục tiêu chuyên sâu (tim mạch, mỡ lâu năm, xương khớp, chống lão hóa).", "Hai nhóm dinh dưỡng này hoàn toàn giống hệt nhau, chỉ khác nhau về tên gọi và bao bì.", "Dinh dưỡng ưu việt có thể thay thế hoàn toàn vai trò của Bữa ăn nền tảng F1."], "answer": "B", "explain": "Cấu trúc ngôi nhà sức khỏe! Dinh dưỡng nền tảng (F1, PPP) giống như \"móng nhà\", cung cấp đủ đạm, vi chất và làm sạch tiêu hóa cho mọi tế bào. Dinh dưỡng ưu việt là các \"chuyên gia gia cố\", tập trung hỗ trợ chuyên sâu từng cơ quan đích (trái tim, hệ xương khớp, công tắc đốt mỡ ngầm hay ti thể tế bào).\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Dinh dưỡng phân loại theo chức năng sinh học nuôi tế bào, không phân loại theo mức độ giàu nghèo.\n• Phương án C chưa đúng: Hai nhóm có công thức sinh học và cơ chế tác động vào cơ quan đích hoàn toàn khác biệt.\n• Phương án D chưa đúng: Không có móng nhà F1 thì các sản phẩm chuyên sâu không thể phát huy tối đa hiệu quả."}, {"n": 2, "q": "Cơ chế tác động đột phá của sản phẩm Prolessa Duo trong bộ Dinh Dưỡng Ưu Việt hỗ trợ tiêu diệt mỡ bụng cứng đầu?", "opts": ["Làm mất nước cấp tốc để thu nhỏ vòng eo trong 24 giờ.", "Ứng dụng công nghệ nhũ tương đôi (axit linoleic liên hợp CLA & dầu cọ/yến mạch) giúp khóa tổng hợp mỡ mới và tạo cảm giác no dai 8 tiếng.", "Bào mòn niêm mạc dạ dày để người dùng không muốn ăn thêm thức ăn.", "Chuyển hóa toàn bộ khối mỡ bụng thành khối cơ bắp tay chân ngay lập tức."], "answer": "B", "explain": "Công nghệ đốt mỡ thông minh! Prolessa Duo kết hợp CLA và chiết xuất dầu cọ - yến mạch độc quyền. Khi nạp vào, nó gửi tín hiệu no ảo lên não bộ suốt 8 tiếng, đồng thời ngăn chặn các tế bào mỡ hấp thu thêm chất béo, buộc cơ thể phải lôi mỡ nội tạng lâu năm ra đốt làm năng lượng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Prolessa Duo đốt mỡ thực sự, hoàn toàn không gây mất nước hay giảm cân ảo.\n• Phương án C chưa đúng: Sản phẩm xoa dịu đường ruột và hoàn toàn an toàn cho niêm mạc dạ dày.\n• Phương án D chưa đúng: Mỡ và cơ là hai mô hoàn toàn khác nhau, mỡ bị đốt cháy thành năng lượng chứ không biến thành cơ."}, {"n": 3, "q": "Vai trò \"Chìa Khóa Mở Khóa Chuyển Hóa\" của sản phẩm Cell Activator (Hoạt Hóa Tế Bào) trong bộ giải pháp Dinh Dưỡng Ưu Việt?", "opts": ["Bổ sung Axit Alpha Lipoic & Thảo mộc giúp bảo vệ ti thể (nhà máy năng lượng), tối ưu hóa hấp thu vi chất từ bữa ăn.", "Giúp tích trữ thêm nhiều nước dưới da để da bớt khô.", "Thay thế hoàn toàn cho việc tập luyện thể dục hàng ngày.", "Làm ngưng trệ quá trình trao đổi chất để tiết kiệm năng lượng."], "answer": "A", "explain": "\"Đánh thức nhà máy năng lượng!\" Mỗi tế bào có hàng ngàn ti thể giúp đốt Calo. Theo thời gian và độc tố, ti thể bị suy yếu. Cell Activator chứa Axit Alpha Lipoic chống oxy hóa cực mạnh, phục hồi ti thể, giúp tế bào \"mở cờ\" hấp thu trọn vẹn từng hạt vi chất từ F1.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cell Activator hỗ trợ chuyển hóa tế bào, không gây tích nước dưới da.\n• Phương án C chưa đúng: Dinh dưỡng tối ưu chuyển hóa tế bào, luôn đi kèm lối sống năng động 20% vận động.\n• Phương án D chưa đúng: Sản phẩm thúc đẩy và nâng cao tốc độ trao đổi chất tự nhiên của cơ thể."}, {"n": 4, "q": "Sự kết hợp ưu việt giữa Niteworks và Herbalifeline (Omega-3) tạo nên \"Bộ Đôi Vàng\" bảo vệ Tim Mạch như thế nào?", "opts": ["Niteworks làm đông đặc máu, còn Herbalifeline làm đông cứng mạch máu.", "Niteworks sinh Nitric Oxide giãn mở lòng mạch ban đêm; Herbalifeline dọn mỡ bẩn, làm dẻo dai thành mạch, ngăn xơ vữa.", "Cả hai sản phẩm đều làm gia tăng chỉ số mỡ máu bẩn.", "Bộ đôi này chỉ có tác dụng đối với người dưới 18 tuổi."], "answer": "B", "explain": "Hợp đồng bảo vệ trái tim 24/7! Niteworks (phát minh từ giải Nobel Y học) giúp kích thích sản sinh Nitric Oxide làm giãn mở mạch máu, ngăn đột quỵ đêm. Herbalifeline bổ sung Omega-3 tinh khiết giúp bóc tách mảng xơ vữa, cho dòng máu lưu thông êm ái.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Niteworks giãn mạch và Herbalifeline giúp mạch máu dẻo dai, ngược lại hoàn toàn với đông đặc.\n• Phương án C chưa đúng: Cả hai sản phẩm đều giúp làm giảm mỡ máu bẩn và cải thiện chỉ số mỡ máu.\n• Phương án D chưa đúng: Bộ đôi đặc biệt cần thiết cho người trưởng thành, người lớn tuổi và người có nguy cơ tim mạch."}, {"n": 5, "q": "Điểm vượt trội của giải pháp chăm sóc Xương Khớp Ưu Việt khi phối hợp \"Xtra-Cal Advanced\" và \"Joint Support Advanced\"?", "opts": ["Xtra-Cal cung cấp Canxi hữu cơ + Vitamin D3 hấp thu thẳng vào xương; Joint Support bổ sung Glucosamine tái tạo sụn khớp.", "Xtra-Cal làm bào mòn khớp xương, còn Joint Support gây lắng đọng sỏi thận.", "Hai sản phẩm này chỉ dành riêng cho các vận động viên chuyên nghiệp.", "Cung cấp lượng lớn chất béo bão hòa để bôi trơn khớp."], "answer": "A", "explain": "Tác động kép Xương & Khớp! Xtra-Cal chứa Canxi hữu cơ cùng Vitamin D3 và Magie giúp Canxi đọng chuẩn xác vào xương mà không gây sỏi thận. Joint Support cung cấp Glucosamine & Thảo mộc giúp tái tạo lớp sụn khớp bị mòn, giảm xói mòn và giúp đi lại dẻo dai.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Canxi hữu cơ trong Xtra-Cal không gây sỏi thận và Joint Support bảo vệ sụn khớp.\n• Phương án C chưa đúng: Mọi người trưởng thành, người lớn tuổi bị thoái hóa khớp đều rất cần bộ giải pháp này.\n• Phương án D chưa đúng: Sản phẩm hoàn toàn không chứa chất béo bão hòa xấu."}, {"n": 6, "q": "Bổ sung \"Hỗn Hợp Chất Xơ Hoạt Hóa\" (Active Fiber Complex) vào ly F1 tạo nên bữa ăn ưu việt gì cho hệ tiêu hóa?", "opts": ["Làm cho phân bị cứng lại và gây khó tiêu.", "Bổ sung 5g xơ (cân bằng xơ hòa tan & không hòa tan), tạo nguồn thức ăn cho lợi khuẩn (Prebiotics) và làm sạch đường ruột.", "Làm triệt tiêu toàn bộ các vi khuẩn có lợi trong hệ tiêu hóa.", "Thay thế hoàn toàn cho nhu cầu uống nước lọc trong ngày."], "answer": "B", "explain": "Bữa ăn cân bằng vi sinh! 1 muỗng Active Fiber cung cấp 5g xơ tinh sạch chiết xuất từ táo, mía, đậu nành. Xơ hòa tan làm thức ăn nuôi lợi khuẩn probiotics, xơ không hòa tan đóng vai trò \"chổi quét\" cuốn sạch độc tố, giúp bụng êm và tiêu mỡ nhanh.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Chất xơ hoạt hóa giúp phân mềm xốp, hỗ trợ nhuận tràng chống táo bón.\n• Phương án C chưa đúng: Chất xơ hòa tan là thức ăn khoái khẩu giúp lợi khuẩn phát triển mạnh mẽ.\n• Phương án D chưa đúng: Bổ sung xơ bắt buộc phải uống đủ nước 3Đ để xơ trương nở quét dọn đường ruột."}, {"n": 7, "q": "Nguyên tắc \"Cá Nhân Hóa Chuyên Sâu\" trong việc thiết lập chương trình Dinh Dưỡng Ưu Việt tại Nhóm Dinh Dưỡng?", "opts": ["Đánh giá đúng Chỉ số cơ thể (Tanita), độ tuổi, tiểu sử sức khỏe và mục tiêu riêng biệt của từng hội viên để phối bộ.", "Áp dụng chung một bộ sản phẩm ưu việt giống hệt nhau cho tất cả mọi người.", "Cho hội viên dùng tất cả các sản phẩm cùng một lúc ngay ngày đầu tiên.", "Chỉ tập trung vào chiều cao, bỏ qua chỉ số mỡ nội tạng và cơ bắp."], "answer": "A", "explain": "\"Đúng người - Đúng thời điểm - Đúng mục tiêu!\" HLV Dinh dưỡng sẽ phân tích bảng chỉ số: Người mỡ bụng dày cần Prolessa Duo; người tim mạch/huyết áp cần Niteworks; người đau khớp cần Xtra-Cal + Joint Support. Sự cám nhân hóa giúp tối ưu hóa chi phí và kết quả.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Cào bằng sản phẩm là sai lầm, không tối ưu được nhu cầu sinh học riêng biệt.\n• Phương án C chưa đúng: Cần có quá trình làm sạch cơ thể 10–21 ngày trước khi nâng cấp các sản phẩm chuyên sâu.\n• Phương án D chưa đúng: Mỡ nội tạng và tỷ lệ cơ mỡ mới là kim chỉ nam để phối bộ dinh dưỡng ưu việt."}, {"n": 8, "q": "Tác dụng của việc sử dụng sản phẩm \"Cell-U-Loss\" đối với hội viên có tình trạng tích nước dưới da và da sần vỏ cam (Cellulite)?", "opts": ["Làm tăng tích nước dưới da để da trông mọng hơn.", "Bổ sung vi khoáng Kali & Việt quất giúp cân bằng điện giải, đào thải NƯỚC THỪA DƯỚI DA và làm phẳng mịn bề mặt da.", "Bào mòn lớp cơ bắp dưới da.", "Thay thế cho việc uống nước lọc hàng ngày."], "answer": "B", "explain": "Tạm biệt da sần vỏ cam! Cell-U-Loss chứa Kali, Magie và râu ngô giúp điều hòa kênh Natri-Kali, đẩy lượng nước thừa đọng dưới da (nguyên nhân gây phù leg, da sần đùi/bụng) ra ngoài qua đường tiểu, giúp vóc dáng săn chắc khô mỡ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Cell-U-Loss giúp đào thải nước thừa dưới da chứ không gây tích nước.\n• Phương án C chưa đúng: Sản phẩm bảo vệ khối cơ bắp, chỉ đào thải lượng nước muối dư thừa.\n• Phương án D chưa đúng: Vẫn cần uống đủ nước ấm để Kali hỗ trợ cơ chế đảo thải nước thừa hiệu quả."}, {"n": 9, "q": "Bẫy tư duy nguy hiểm: \"Chỉ chi tiền dùng sản phẩm Ưu Việt chuyên sâu mà BỎ QUA Bữa ăn nền tảng F1\"?", "opts": ["Giống như xây nhà lợp mái đắt tiền trên nền đất yếu: Cơ thể thiếu dưỡng chất vĩ mô nền tảng khiến sản phẩm ưu việt khó hấp thu.", "Giúp giảm chi phí và mang lại kết quả giảm mỡ nhanh gấp 10 lần.", "Bữa ăn F1 không có tác dụng gì khi đã dùng sản phẩm ưu việt.", "Giúp tế bào tự động tổng hợp đủ 21 vi chất mà không cần ăn."], "answer": "A", "explain": "Nền tảng quyết định hiệu quả! Bữa ăn F1 cung cấp 21 vi chất, đạm sạch và Calo chuẩn để duy trì sự sống cho 75 ngàn tỷ tế bào. Nếu bỏ F1 mà chỉ uống Niteworks hay Prolessa, tế bào bị đói nguyên liệu nền tảng, các sản phẩm chuyên sâu sẽ không có \"môi trường\" để phát huy tối đa công năng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bỏ nền tảng F1 khiến kết quả chậm lại và làm lãng phí tiền của sản phẩm chuyên sâu.\n• Phương án C chưa đúng: F1 là bữa ăn dinh dưỡng cốt lõi nuôi sống tế bào mỗi ngày.\n• Phương án D chưa đúng: Các sản phẩm chuyên sâu không chứa đủ 21 vi chất vĩ mô như ly F1."}, {"n": 10, "q": "Tại sao người đã đạt vóc dáng chuẩn, chỉ số mỡ an toàn VẪN NÊN duy trì Giải Pháp Dinh Dưỡng Ưu Việt hàng ngày?", "opts": ["Vì độc tố môi trường, lão hóa tự nhiên và gốc tự do liên tục tấn công tế bào; Dinh dưỡng ưu việt giúp bảo vệ và trẻ hóa bền vững.", "Để cố gắng giảm thêm 10kg mỡ nữa cho gầy hộc hác.", "Vì cơ thể sẽ tự động ngừng chuyển hóa nếu không uống sản phẩm.", "Duy trì chỉ nhằm mục đích làm tốn chi phí tài chính."], "answer": "A", "explain": "Bảo dưỡng cỗ máy triệu đô! Đạt chuẩn vóc dáng mới chỉ là bước đầu. Hàng ngày chúng ta vẫn phải hít khói bụi, căng thẳng công việc và già đi. Duy trì Dinh dưỡng ưu việt (như Cell Activator, Herbalifeline) là bí quyết giúp các doanh nhân và người thông thái giữ sự minh mẫn và trẻ hóa trọn đời.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Khi đã chuẩn vóc dáng, dinh dưỡng duy trì để giữ phom dáng săn chắc, không ép giảm thêm.\n• Phương án C chưa đúng: Cơ thể vẫn chuyển hóa nhưng nếu thiếu dinh dưỡng ưu việt sẽ bị lão hóa nhanh hơn.\n• Phương án D chưa đúng: Duy trì sức khỏe chủ động là khoản đầu tư thông minh tiết kiệm tiền viện phí tương lai."}, {"n": 11, "q": "Sự kết hợp giữa \"Lô Hội Thảo Mộc\" và \"Hỗn Hợp Chất Xơ Active Fiber\" tạo thành \"Bộ Đôi Vàng\" cho đường ruột ra sao?", "opts": ["Lô Hội tráng rửa xoa dịu niêm mạc; Chất Xơ quét dọn mảng bám vi nhung mao và nuôi dưỡng hệ vi sinh lợi khuẩn.", "Lô Hội làm bào mòn dạ dày, còn Chất Xơ gây tắc nghẽn quai ruột.", "Cả hai sản phẩm đều làm gia tăng hàm lượng mỡ nội tạng.", "Bộ đôi này thay thế hoàn toàn vai trò của tập thể dục."], "answer": "A", "explain": "Liệu pháp tắm rửa đường ruột! Lô hội thảo mộc đóng vai trò như \"xà phòng sinh học\" xoa dịu tổn thương và làm mềm mảng bám. Chất xơ Active Fiber đóng vai trò như \"chiếc chổi mềm\" quét sạch độc tố ra ngoài, phục hồi khả năng hấp thu 100%.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Lô hội làm lành niêm mạc và xơ sạch giúp nhuận tràng thông suốt.\n• Phương án C chưa đúng: Bộ đôi này giúp thải độc và hỗ trợ giảm mỡ nội tạng rất hiệu quả.\n• Phương án D chưa đúng: Dinh dưỡng làm sạch đường ruột, hỗ trợ nâng cao hiệu quả vận động."}, {"n": 12, "q": "Tại sao dòng sản phẩm \"Dinh Dưỡng Thể Thao Ưu Việt Herbalife 24\" lại được các Vận động viên đỉnh cao (như CR7) tin dùng?", "opts": ["Đạt chứng nhận Informed-Sport 0% Doping, bù đắp chính xác năng lượng/điện giải theo từng giai đoạn (Trước - Trong - Sau tập).", "Vì sản phẩm giúp tăng 5kg cơ bắp chỉ sau 1 buổi tập.", "Vì Herbalife 24 chứa nhiều chất kích thích thần kinh mạnh.", "Sản phẩm giúp vận động viên không cần phải ngủ nghỉ ban đêm."], "answer": "A", "explain": "Đẳng cấp dinh dưỡng thể thao 24h! Dòng H24 (Rebuild Strength, CR7 Drive...) được nghiên cứu cá thể hóa cho vận động viên: Tỷ lệ đạm/tinh bột chuẩn xác giúp phục hồi vi sợi cơ bị xé rách trong 30 phút vàng sau tập, hoàn toàn sạch Doping 100%.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tăng cơ đòi hỏi chuỗi dinh dưỡng và rèn luyện kiên trì, không có thần tốc 1 buổi.\n• Phương án C chưa đúng: Sản phẩm tuyệt đối không chứa chất kích thích hay chất cấm Doping.\n• Phương án D chưa đúng: Dinh dưỡng H24 hỗ trợ phục hồi cơ bắp sâu trong giấc ngủ đêm."}, {"n": 13, "q": "Cơ chế \"Tạo Cảm Giác No Tự Nhiên 8 Tiếng\" của Prolessa Duo giúp hội viên vượt qua bẫy ăn vặt ban đêm như thế nào?", "opts": ["Màng mỡ tự nhiên CLA & Dầu cọ kích thích ruột non tiết hormone Peptide YY gửi tín hiệu \"ĐÃ ĐẦY NĂNG LƯỢNG\" lên não bộ.", "Làm cho hệ thần kinh bị tê liệt hoàn toàn nên không cảm thấy đói.", "Làm dạ dày bị trương nở to gấp 5 lần để tạo cảm giác đầy bụng.", "Cung cấp lượng Calo cực lớn (1.000 Calo) để đè nén cảm giác đói."], "answer": "A", "explain": "Sinh học cảm giác no! Khi Prolessa Duo đi xuống ruột non, công nghệ nhũ tương đôi kích thích tế bào ruột giải phóng hormone Peptide YY. Hormone này đi theo máu lên trung khu thần kinh não bộ báo tín hiệu \"Cơ thể đã đủ năng lượng\", giúp bạn hoàn toàn an vui, không bị cồn cào thèm ăn đêm.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Tác động qua cơ chế hormone tự nhiên của cơ thể, hoàn toàn không gây tê liệt thần kinh.\n• Phương án C chưa đúng: Prolessa Duo dạng bột mịn tan trong Shake, không làm trương nở dạ dày.\n• Phương án D chưa đúng: Prolessa Duo chứa Calo rất thấp, giúp cắt giảm Calo dư thừa hiệu quả."}, {"n": 14, "q": "Tại sao các vi chất chống oxy hóa trong Dinh Dưỡng Ưu Việt lại đặc biệt cần thiết cho người sống ở môi trường đô thị?", "opts": ["Vô hiệu hóa hàng ngàn Gốc Tự Do sinh ra từ khói bụi ô nhiễm, tia UV, căng thẳng công việc – ngăn ngừa lão hóa & bệnh tật.", "Giúp da đổi màu trắng bệch ngay sau 1 ngày sử dụng.", "Giúp cơ thể không bị ảnh hưởng bởi khói thuốc lá dù hít bao nhiêu cũng được.", "Các chất chống oxy hóa làm cho các tế bào bị ngưng trệ hoạt động."], "answer": "A", "explain": "Tấm lá chắn chống ô nhiễm! Cuộc sống đô thị khiến cơ thể sản sinh hàng tỷ Gốc Tự Do (kẻ thù cướp electron tàn phá ADN tế bào). Dinh dưỡng ưu việt giàu Vitamin C, E, Selen, Alpha Lipoic Acid giúp trung hòa gốc tự do, bảo vệ tế bào trẻ trung.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dinh dưỡng giúp da hồng hào khỏe mạnh từ bên trong, không làm trắng bệch cấp tốc.\n• Phương án C chưa đúng: Dinh dưỡng hỗ trợ đào thải độc tố, nhưng vẫn cần chủ động tránh xa khói thuốc độc hại.\n• Phương án D chưa đúng: Chất chống oxy hóa bảo vệ và nâng cao hiệu suất hoạt động của tế bào."}, {"n": 15, "q": "Vai trò của việc phối hợp bộ ba \"F1 + PPP + Prolessa Duo\" được gọi là \"Sát Thủ Tiêu Mỡ Nội Tạng\"?", "opts": ["F1 kiểm soát Calo chuẩn; PPP giữ khối cơ bắp không bị teo; Prolessa Duo khóa mỡ mới & ép cơ thể đốt mỡ nội tạng cũ.", "Bộ ba này giúp tăng 5kg mỡ bụng trong vòng 1 tuần.", "Giúp người dùng có thể ăn uống đồ chiên xào thoải mái mà vẫn giảm mỡ.", "Làm triệt tiêu hoàn toàn lượng nước lọc trong tế bào."], "answer": "A", "explain": "Bộ ba công lực hoàn hảo! F1 tạo khoảng trống hụt Calo an toàn; PPP cung cấp đạm sạch giữ cỗ máy BMR và nuôi cơ săn chắc; Prolessa Duo tung cú đòn quyết định khóa kho mỡ mới và ép mỡ nội tạng lâu năm phân rã thành năng lượng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đây là bộ giải pháp giảm mỡ nội tạng đỉnh cao nhất tại Nhóm Dinh Dưỡng.\n• Phương án C chưa đúng: Vẫn bắt buộc phải tuân thủ kỷ luật ăn uống lành mạnh, nói KHÔNG với đồ chiên rán.\n• Phương án D chưa đúng: Vẫn cần uống đủ nước 3Đ để làm dung môi chở mỡ bị đốt cháy ra ngoài qua đường bài tiết."}, {"n": 16, "q": "Thời điểm vàng (Timing) để uống sản phẩm Niteworks nhằm đạt hiệu quả tối ưu cho hệ tuần hoàn?", "opts": ["Uống ngay trước khi đi chạy bộ thể thao cường độ cao giữa trưa.", "Uống vào BỎI TỐI TRƯỚC KHI ĐI NGỦ 30 phút (thời điểm hàm lượng Nitric Oxide trong cơ thể sụt giảm xuống đáy).", "Uống dồn vào lúc 12h trưa ngay sau bữa ăn trưa no căng.", "Hòa tan vào nước sôi 100°C rồi uống ngay lập tức."], "answer": "B", "explain": "Uống đúng thời điểm vàng! Về đêm khi ngủ sâu, nhịp tim chậm lại và nồng độ Nitric Oxide (NO) trong máu sụt giảm nghiêm trọng, dễ dẫn đến co thắt mạch máu gây đột quỵ. Uống Niteworks trước ngủ 30 phút giúp bơm đầy NO bảo vệ mạch máu suốt đêm.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Niteworks tập trung bảo vệ tuần hoàn ban đêm lúc nghỉ ngơi.\n• Phương án C chưa đúng: Uống lúc bụng quá no làm giảm tốc độ hấp thu L-Arginine vào máu.\n• Phương án D chưa đúng: Nước sôi 100°C làm phân hủy các vitamin C, E và thành phần thảo mộc nhạy cảm trong Niteworks."}, {"n": 17, "q": "Sự khác biệt giữa việc dùng Canxi hữu cơ \"Xtra-Cal Advanced\" và các loại \"Canxi vô cơ giá rẻ\" trên thị trường?", "opts": ["Xtra-Cal là Canxi hữu cơ dễ hòa tan, có Vitamin D3 & Magie dẫn đường vào xương; Canxi vô cơ khó tan, dễ gây lắng đọng SỎI THẬN.", "Canxi vô cơ tốt hơn vì có giá thành rẻ hơn gấp 10 lần.", "Xtra-Cal làm cho xương bị giòn xốp hơn.", "Hai loại Canxi này có tỷ lệ hấp thu vào cơ thể hoàn toàn giống hệt nhau."], "answer": "A", "explain": "Đẳng cấp Canxi hữu cơ! Canxi vô cơ (từ vỏ sò, đá vôi) khó tan, khi uống vào dễ gây táo bón và đóng cặn ở thận thành sỏi thận. Xtra-Cal là Canxi hữu cơ sinh học, kết hợp Vitamin D3 và Magie đóng vai trò \"người dẫn đường\" đưa Canxi vào thẳng khung xương.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Giá rẻ nhưng gây hậu quả sỏi thận và vôi hóa mạch máu thì vô cùng đắt đắt về sau.\n• Phương án C chưa đúng: Xtra-Cal giúp mật độ xương cải thiện, giúp xương chắc khỏe dẻo dai.\n• Phương án D chưa đúng: Canxi hữu cơ có tỷ lệ hấp thu và độ an toàn vượt trội hơn hẳn Canxi vô cơ."}, {"n": 18, "q": "Tác động của Dinh Dưỡng Ưu Việt đối với việc phục hồi \"Vi Nhung Mao Ruột\" sau khi bị tổn thương do thuốc tây hoặc hóa chất?", "opts": ["Lô Hội & Dinh dưỡng tế bào giúp xoa dịu vết viêm, làm sạch mảng bám bẩn, kích thích vi nhung mao mọc lại dẻo dai.", "Làm cho vi nhung mao bị rụng sạch hoàn toàn.", "Dinh dưỡng ưu việt làm cho ruột bị trơn tuột không hấp thu được thức ăn.", "Không có bất kỳ tác động nào tới hệ vi nhung mao."], "answer": "A", "explain": "Tái sinh thảm vi nhung mao! Thuốc tây, rượu bia, đồ chiên rán làm thảm vi nhung mao ruột bị \"cháy xém\" và gãy rụng. Lô hội thảo mộc cùng các vi chất trong dinh dưỡng ưu việt giúp làm lành niêm mạc, nuôi dưỡng các đầu vi nhung mao mọc lại khỏe mạnh.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dinh dưỡng ưu việt giúp vi nhung mao phục hồi, không làm gãy rụng.\n• Phương án C chưa đúng: Vi nhung mao phục hồi giúp tăng khả năng hấp thu dưỡng chất lên tối đa.\n• Phương án D chưa đúng: Hệ vi nhung mao là nơi thụ hưởng lợi ích trực tiếp nhất từ dinh dưỡng tế bào."}, {"n": 19, "q": "Thái độ đúng đắn của Hội viên khi bắt đầu trải nghiệm bổ sung thêm các sản phẩm Dinh Dưỡng Ưu Việt?", "opts": ["Lắng nghe tư vấn của HLV Dinh dưỡng, dùng Đúng - Đủ - Đều, kết hợp nền tảng F1 và theo dõi sự thay đổi chỉ số cơ thể.", "Tự ý mua dồn tất cả các sản phẩm về uống cùng lúc không cần hướng dẫn.", "Vừa uống sản phẩm ưu việt vừa thoải mái thức khuya và ăn đồ chiên xào.", "Ngừng uống nước lọc vì nghĩ sản phẩm đã thay thế được nước."], "answer": "A", "explain": "Trải nghiệm thông thái! Dinh dưỡng ưu việt phát huy sức mạnh tối đa khi bạn dùng Đúng sản phẩm cho mục tiêu, Đủ liều lượng chuẩn kỹ thuật, Đều đặn mỗi ngày dưới sự sát sao chỉ số của HLV Dinh dưỡng tại Nhóm Dinh Dưỡng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Dùng không đúng cách gây lãng phí và không đạt hiệu quả tối ưu.\n• Phương án C chưa đúng: Thói quen xấu (thức khuya, ăn béo) sẽ làm triệt tiêu tác dụng tốt của sản phẩm.\n• Phương án D chưa đúng: Nước lọc ấm vẫn là chất dẫn truyền bắt buộc cho mọi quá trình chuyển hóa."}, {"n": 20, "q": "Thông điệp cốt lõi và bài học hành động sâu sắc nhất của Chủ đề 14 \"DINH DƯỠNG ƯU VIỆT\" tại Nhóm Dinh Dưỡng?", "opts": ["\"DINH DƯỠNG ƯU VIỆT - CHUYÊN SÂU TỚI TỪNG TẾ BÀO: Nâng cấp giải pháp dinh dưỡng để bảo vệ tim mạch, đánh bay mỡ bụng và kiến tạo sức khỏe đỉnh cao!\"", "Dinh dưỡng ưu việt là thần dược có thể chữa khỏi tất cả các bệnh nan y.", "Chỉ cần dùng dinh dưỡng ưu việt 3 ngày là sức khỏe sẽ hoàn hảo cả đời.", "Dinh dưỡng ưu việt không có giá trị gì khác biệt so với ăn thức ăn thô."], "answer": "A", "explain": "Nâng tầm chất lượng sống! Dinh dưỡng Ưu Việt chính là chìa khóa vàng giúp bạn nâng cấp sức khỏe từ mức \"Bình thường\" lên mức \"Tối ưu\". Hãy làm chủ các giải pháp chuyên sâu để bảo vệ trái tim, làm sạch lòng mạch và tận hưởng một cuộc sống An Vui viên mãn!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Sản phẩm là Dinh dưỡng chuyên sâu nuôi tế bào, không phải thuốc chữa bệnh.\n• Phương án C chưa đúng: Tế bào cần được nuôi dưỡng và chăm sóc bảo dưỡng liên tục mỗi ngày.\n• Phương án D chưa đúng: Dinh dưỡng ưu việt ứng dụng công nghệ sinh học cao cấp mà thức ăn thô không thể đáp ứng."}];
const TKP_LESSON=14;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Âm thanh: Bật':'🔇 Âm thanh: Tắt';if(soundOn)play('click')};
function confetti(){for(let i=0;i<55;i++){let e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#ffd36c','#7deeff','#f58dcf','#7bf6a9'][i%4];e.style.animationDelay=Math.random()*.55+'s';e.style.setProperty('--drift',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI DINH DƯỠNG ƯU VIỆT<br>BÓC TRẦN CHUYỂN HÓA</h1><div class="subtitle">TỐI ƯU SỨC KHỎE TẾ BÀO</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script><style id="tkp-voice-css">
#tkp-voice-panel{position:fixed;right:12px;bottom:12px;z-index:99990;max-width:min(460px,calc(100vw - 24px));background:#102d38f2;color:white;border:1px solid #f5d58a;border-radius:16px;padding:11px 13px;box-shadow:0 8px 30px #0009;font:600 14px/1.4 system-ui,Arial,sans-serif}
#tkp-voice-panel button,#tkp-voice-panel select{border:1px solid #f5d58a88;border-radius:9px;background:#f8df9e;color:#142a31;padding:8px 10px;font-weight:800;cursor:pointer;font-size:13px}
#tkp-voice-panel button:disabled{opacity:.5;cursor:not-allowed}
#tkp-voice-panel .tkp-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
#tkp-voice-status{font-size:12px;opacity:.95;max-width:430px}
#tkp-voice-confirm{background:#8be6bb!important;display:none}
#tkp-voice-panel .tkp-heading{font-size:13px;color:#ffdf92;font-weight:900}
@media(max-width:600px){#tkp-voice-panel{left:8px;right:8px;bottom:6px;padding:8px 10px}#tkp-voice-panel button{padding:6px 8px}}
</style>
<div id="tkp-voice-panel" role="region" aria-label="Điều khiển đọc bài bằng tiếng Việt">
 <div class="tkp-heading">🔊 GIỌNG ĐỌC HƯỚNG DẪN TIẾNG VIỆT</div>
 <div id="tkp-voice-status" role="status">Nhấn BẮT ĐẦU để nghe câu hỏi và 4 đáp án.</div>
 <div class="tkp-row">
  <button id="tkp-voice-replay" type="button">🔁 Nghe lại</button>
  <button id="tkp-voice-pause" type="button">⏸ Tạm dừng</button>
  <button id="tkp-voice-mute" type="button">🔊 Giọng đọc: Bật</button>
  <select id="tkp-voice-speed" aria-label="Tốc độ đọc"><option value="0.8">0,8×</option><option value="0.9" selected>0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option></select>
  <button id="tkp-voice-confirm" type="button">✅ Tôi đã đọc hết giải thích</button>
 </div>
</div>
<script id="tkp-voice-script">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const speechSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
 const status=$('tkp-voice-status'), replay=$('tkp-voice-replay'),pause=$('tkp-voice-pause'),mute=$('tkp-voice-mute'),speed=$('tkp-voice-speed'),confirm=$('tkp-voice-confirm');
 let enabled=true,phase='intro',currentSignature='',done=false,activeToken=0,spokenText='',spokenType='',fallback=false,started=false;
 let voice=null;
 try{enabled=localStorage.getItem('tkp21_voice_enabled')!=='false';speed.value=localStorage.getItem('tkp21_voice_speed')||'0.9'}catch(e){}
 function setStatus(s){status.textContent=s}
 function getVoice(){if(!speechSupported)return null;let vs=window.speechSynthesis.getVoices();return vs.find(v=>v.lang.toLowerCase()==='vi-vn')||vs.find(v=>v.lang.toLowerCase().startsWith('vi'))||null}
 function stop(){activeToken++;if(speechSupported){try{window.speechSynthesis.cancel()}catch(e){}}}
 function read(text,type,complete){stop();spokenText=text;spokenType=type;let token=activeToken;if(!enabled||!speechSupported){if(type==='explain')showFallback(!speechSupported?'Trình duyệt không hỗ trợ giọng đọc.':'Giọng đọc đang tắt.');else setStatus('Có thể đọc câu hỏi trên màn hình.');return}
  if(!text.trim()){if(type==='explain')showFallback('Không tìm thấy nội dung giải thích.');return}
  const v=getVoice();if(!v){if(type==='explain')showFallback('Thiết bị không có giọng tiếng Việt.');else setStatus('Thiết bị chưa có giọng tiếng Việt; hãy đọc nội dung trên màn hình.');return}
  voice=v;setStatus(type==='explain'?'🔊 Đang đọc phản hồi và toàn bộ lời giải thích…':'🔊 Đang đọc câu hỏi và 4 đáp án…');
  const u=new SpeechSynthesisUtterance(text);u.lang='vi-VN';u.voice=v;u.rate=Number(speed.value)||0.9;u.pitch=1;u.volume=1;
  u.onend=()=>{if(token!==activeToken)return;if(type==='explain'){done=true;phase='finished';confirm.style.display='none';setStatus('✅ Đã đọc hết lời giải thích. Bạn có thể sang câu tiếp theo.');if(complete)complete()}else setStatus('✅ Đã đọc xong câu hỏi và các đáp án. Hãy chọn câu trả lời.')};
  u.onerror=()=>{if(token!==activeToken)return;if(type==='explain')showFallback('Không thể hoàn tất âm thanh.');else setStatus('Không phát được âm thanh. Bạn có thể đọc câu hỏi trên màn hình.')};
  try{window.speechSynthesis.speak(u)}catch(e){if(type==='explain')showFallback('Thiết bị không thể phát giọng nói.');else setStatus('Không thể phát giọng nói trên thiết bị này.')}
 }
 function showFallback(reason){done=false;fallback=true;phase='fallback';confirm.style.display='inline-block';setStatus('⚠️ '+reason+' Hãy đọc toàn bộ giải thích trên màn hình, rồi nhấn xác nhận để tiếp tục.')}
 function questionElement(){return document.querySelector('#quiz:not(.hidden) #question')||document.querySelector('#app .question h2')||document.querySelector('#app .question')||document.querySelector('#app h2')}
 function answers(){return [...document.querySelectorAll('#quiz:not(.hidden) #answers .option,#app .choice,#app #options .option,#app .answers .option')].filter(el=>el.offsetParent!==null)}
 function getQuestion(){let el=questionElement(),ans=answers();if(!el||ans.length!==4)return null;let q=el.textContent.trim();let a=ans.map((el,i)=>{let text=el.textContent.trim();text=text.replace(/^\s*[ABCD]\s*/,'');return 'Đáp án '+ 'ABCD'[i]+'. '+text});return {signature:q+'|'+a.join('|'),text:'Câu hỏi. '+q+'. '+a.join('. ')}}
 function getFeedback(){let el=document.querySelector('#quiz:not(.hidden) #feedback:not(.hidden)')||document.querySelector('#app #feedback .feedback')||document.querySelector('#app #feedback .result');if(!el||!el.textContent.trim())return null;return el}
 function isQuiz(){return !!getQuestion()}
 function nextBtn(){return document.getElementById('next')}
 function updateLock(){let n=nextBtn();if(!n)return;if(phase==='explaining'||phase==='fallback'){if(!n.disabled)n.disabled=true;n.setAttribute('aria-disabled','true');n.title='Hãy nghe hoặc đọc hết lời giải thích trước khi chuyển câu'}else if(phase==='finished'){if(n.disabled)n.disabled=false;n.removeAttribute('aria-disabled');n.title=''} }
 function startQuestion(q){stop();phase='question';done=false;fallback=false;confirm.style.display='none';currentSignature=q.signature;started=true;read(q.text,'question')}
 function afterAnswer(){if(phase==='explaining'||phase==='fallback'||phase==='finished')return;let f=getFeedback();if(!f)return;phase='explaining';done=false;fallback=false;updateLock();
  let explain=f.querySelector('.explain')||f.querySelector('#explanation')||document.querySelector('#explanation');let explanation=explain?explain.textContent.trim():'';
  let q=null;try{q=QUESTIONS[index]}catch(e){}
  if(!explanation&&q)explanation=[q.explanation||q.explain||'',...(Array.isArray(q.wrong)?q.wrong:[])].join('. ');
  const title=f.textContent||'';let praise=/CHÚC MỪNG|CHÍNH XÁC/i.test(title)&&!/CHƯA CHUẨN XÁC/i.test(title);
  const isReveal=/ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ|XEM ĐÁP ÁN|ĐÁP ÁN ĐÚNG LÀ/i.test(title)&&!/CHÚC MỪNG|CHƯA CHUẨN XÁC/i.test(title);
  let intro=isReveal?'Chúng ta cùng nghe lời giải thích nhé.':praise?'Chúc mừng bạn! Và cũng hãy nghe lời giải thích nhé!':'Rất tiếc! Chúng ta cùng nghe giải thích nhé!';
  const correctChoice=[...answers()].find(x=>x.classList.contains('correct'));
  let correctText=correctChoice?' Đáp án đúng là: '+correctChoice.textContent.trim()+'. ':'';
  read(intro+correctText+' Phần giải thích. '+explanation,'explain');updateLock();
 }
 let queued=false;function inspect(){if(queued)return;queued=true;queueMicrotask(()=>{queued=false;let q=getQuestion();if(!q){if(started){stop();phase='intro';started=false;currentSignature='';confirm.style.display='none'}return}
  if(!started||q.signature!==currentSignature){startQuestion(q)}
  if(getFeedback())afterAnswer();updateLock();})}
 const observer=new MutationObserver(inspect);observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','disabled']});
 document.addEventListener('click',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')){e.preventDefault();e.stopImmediatePropagation();updateLock()}},true);
 document.addEventListener('keydown',e=>{let n=e.target.closest&&e.target.closest('#next');if(n&&(phase==='explaining'||phase==='fallback')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation()}},true);
 confirm.onclick=()=>{if(phase!=='fallback')return;done=true;fallback=false;phase='finished';confirm.style.display='none';setStatus('✅ Bạn đã xác nhận đọc hết lời giải thích. Có thể sang câu tiếp theo.');updateLock()};
 replay.onclick=()=>{if(!started){setStatus('Hãy nhấn BẮT ĐẦU TRÒ CHƠI trước.');return}if(phase==='explaining'||phase==='fallback'||phase==='finished'){phase='explaining';done=false;updateLock();read(spokenType==='explain'?spokenText:((getFeedback()||{}).textContent||''),'explain')}else{let q=getQuestion();if(q)read(q.text,'question')}};
 pause.onclick=()=>{if(!speechSupported)return;try{if(window.speechSynthesis.paused){window.speechSynthesis.resume();pause.textContent='⏸ Tạm dừng'}else if(window.speechSynthesis.speaking){window.speechSynthesis.pause();pause.textContent='▶ Tiếp tục';setStatus('⏸ Đã tạm dừng giọng đọc; chưa thể sang câu tiếp theo.')}}catch(e){}};
 mute.onclick=()=>{enabled=!enabled;try{localStorage.setItem('tkp21_voice_enabled',String(enabled))}catch(e){}mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';if(!enabled){stop();if(phase==='explaining'){showFallback('Bạn đã tắt giọng đọc.')}else setStatus('Đã tắt giọng đọc.')}else{setStatus('Đã bật giọng đọc. Nhấn Nghe lại để phát âm thanh.')}};
 speed.onchange=()=>{try{localStorage.setItem('tkp21_voice_speed',speed.value)}catch(e){}setStatus('Tốc độ đọc đã được cập nhật cho lượt đọc tiếp theo.')};
 mute.textContent=enabled?'🔊 Giọng đọc: Bật':'🔇 Giọng đọc: Tắt';
 if(!speechSupported)setStatus('Thiết bị không hỗ trợ giọng đọc. Khi trả lời, bạn sẽ xác nhận đã đọc giải thích.');
 else {let voices=window.speechSynthesis.getVoices();if(!voices.length)window.speechSynthesis.onvoiceschanged=()=>{voice=getVoice()};}
 inspect();
})();
</script>
</body></html>
