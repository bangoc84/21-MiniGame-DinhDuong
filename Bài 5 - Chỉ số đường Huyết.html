:root{color-scheme:dark;--gold:#ffd978;--blue:#75e6ff;--bg:#08112e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at 20% 10%,#29458c 0,transparent 50%),radial-gradient(ellipse at 85% 80%,#6b236e 0,transparent 45%),#080d27}body{overflow-x:hidden}.shell{width:min(1400px,100%);min-height:100dvh;margin:auto;position:relative;display:flex;flex-direction:column;padding:clamp(12px,2.2vw,28px);isolation:isolate}.shell:before{content:'♥  NHÓM DINH DƯỠNG THIỆU TRUNG  ♥\A ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN';white-space:pre;text-align:center;position:fixed;z-index:-1;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);width:90%;font-size:clamp(18px,3vw,45px);font-weight:900;color:#fff;opacity:.055;pointer-events:none}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .brand{font-weight:900;color:var(--gold);letter-spacing:.04em;font-size:clamp(13px,1.6vw,21px)}button{font:inherit;cursor:pointer;border:0}button:disabled{cursor:not-allowed;opacity:.4}.small{border:1px solid #ffffff50;background:#ffffff16;color:#fff;border-radius:100px;padding:10px 17px}.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,1.8vh,22px);animation:enter .35s ease}.center{text-align:center;align-items:center}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.15em}h1{font-size:clamp(32px,5vw,76px);line-height:1.12;margin:0;color:var(--gold);text-shadow:0 5px 30px #ffae3055}h2{font-size:clamp(23px,2.7vw,42px);line-height:1.24;margin:0}p{line-height:1.55}.subtitle{font-size:clamp(18px,2.3vw,32px);font-weight:750}.chip{display:inline-block;background:#ffffff18;border:1px solid #ffffff35;border-radius:50px;padding:10px 22px}.cta{background:linear-gradient(135deg,#ffe7a4,#f2ad3d);color:#231a30;font-weight:900;border-radius:18px;padding:16px 28px;box-shadow:0 9px 28px #f2ad3d55;transition:transform .2s;font-size:clamp(16px,1.5vw,22px)}.cta:hover,.choice:not(:disabled):hover{transform:translateY(-3px)}.cta:disabled{opacity:.35}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;color:var(--gold)}.progress{height:9px;background:#ffffff25;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#3ee2ff,#ffd16d);transition:width .3s}.question{padding:clamp(12px,2vw,26px);background:#101d49dc;border:1px solid #7199ff60;border-radius:20px;box-shadow:0 10px 35px #0003}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:80px;text-align:left;display:flex;align-items:center;gap:13px;padding:clamp(11px,1.4vw,18px);border:1px solid #799aff66;border-radius:16px;background:linear-gradient(135deg,#243e80,#182855);color:#fff;font-size:clamp(15px,1.3vw,21px);line-height:1.4;transition:.2s;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;border-radius:12px;background:#ffffff22;color:var(--gold);width:42px;height:42px;font-weight:900}.choice.correct{background:linear-gradient(135deg,#14764c,#0d4b3d);border-color:#62ffb3;box-shadow:0 0 18px #33e48a55}.choice.wrong{background:linear-gradient(135deg,#922f47,#5c203c);border-color:#ff8899}.choice.dim{opacity:.48}.feedback{border:1px solid #ffffff40;background:#0c173cfa;border-radius:18px;padding:16px;animation:enter .35s}.feedback.good{border-color:#49d99e}.feedback.bad{border-color:#ff9a9a}.feedback h3{margin:0 0 8px;font-size:clamp(18px,1.9vw,27px)}.explain{max-height:min(24vh,230px);overflow:auto;white-space:pre-line;line-height:1.55;font-size:clamp(14px,1.13vw,18px);padding-right:8px}.actions{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:900px}.stat{padding:16px 8px;background:#ffffff12;border:1px solid #ffffff33;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(25px,3vw,48px);color:var(--gold)}.stat span{font-size:clamp(12px,1.1vw,17px)}.score{font-size:clamp(70px,12vw,150px);line-height:1;font-weight:950;color:var(--gold);text-shadow:0 0 50px #f9c04b77}.notice{font-size:13px;color:#d4def9;text-align:center;max-width:850px}footer{padding-top:12px;color:#bfcdf2;font-size:12px;text-align:center}.confetti{position:fixed;pointer-events:none;z-index:5;top:-15px;width:9px;height:15px;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(750deg);opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:700px){.answers{grid-template-columns:1fr}.choice{min-height:58px}.shell{min-height:100dvh}.panel{justify-content:flex-start;padding-top:20px}.center{justify-content:center}.stats{grid-template-columns:1fr 1fr}.explain{max-height:34vh}}@media(min-width:1000px) and (max-height:760px){.choice{min-height:64px}.panel{gap:10px}.question{padding:14px}.explain{max-height:19vh}}
</style></head><body><div class="shell"><header><div class="brand">💚 NHÓM DINH DƯỠNG TRUNG TÂM THIỆU TRUNG</div><button id="sound" class="small" type="button">🔊 Âm thanh: Bật</button></header><main id="app" class="panel"></main><footer>ĐỒNG HÀNH KIẾN TẠO SỨC KHỎE TOÀN DIỆN</footer></div><script>
const QUESTIONS=[{"n": 1, "q": "Khái niệm \"Chỉ số đường huyết\" của thực phẩm được hiểu chuẩn xác nhất là gì?", "opts": ["Tổng số lượng Calo thực phẩm cung cấp cho cơ thể sau khi ăn 1 giờ.", "Tốc độ làm tăng lượng đường trong máu sau khi ăn thực phẩm đó (so với đường chuẩn).", "Mức độ ngọt hay nhạt của thực phẩm khi nếm trên đầu lưỡi.", "Hàm lượng chất béo bão hòa có trong thực phẩm đó."], "answer": "B", "explain": "Chỉ số đường huyết là thước đo phản ánh tốc độ và mức độ tăng đường trong máu sau khi chúng ta ăn một loại thực phẩm chứa tinh bột/đường. Thực phẩm có chỉ số này cao sẽ xả đường vào máu rất nhanh, trong khi thực phẩm có chỉ số này thấp sẽ giải phóng đường từ từ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Tổng số năng lượng là Calo, không phải chỉ số đường huyết. Hai thực phẩm cùng Calo nhưng tốc độ tăng đường huyết có thể hoàn toàn khác nhau.\n• Phương án C chưa đúng: Vị giác không quyết định chỉ số đường huyết. Nhiều thực phẩm không có vị ngọt (như cơm trắng, bánh mì) lại làm tăng đường huyết cực nhanh.\n• Phương án D chưa đúng: Chỉ số đường huyết đo lường sự ảnh hưởng của đường/tinh bột lên máu, không đo hàm lượng chất béo."}, {"n": 2, "q": "Thang đo Chỉ số đường huyết của thực phẩm được phân loại theo các ngưỡng tiêu chuẩn nào?", "opts": ["Thấp: Dưới 10; Trung bình: 11–30; Cao: Trên 30.", "Thấp: Từ 55 trở xuống; Trung bình: Từ 56 đến 69; Cao: Từ 70 trở lên.", "Thấp: Dưới 100; Trung bình: 101–200; Cao: Trên 200.", "Chỉ số đường huyết chỉ có 2 mức: Rất thấp (0) và Rất cao (100)."], "answer": "B", "explain": "Thang đo chuẩn quốc tế chia làm 3 nhóm: GI Thấp ($\\le 55$) giúp đường huyết ổn định; GI Trung bình (56–69) cần ăn vừa phải; GI Cao ($\\ge 70$) làm vọt tăng đường huyết gây tích mỡ và quá tải tuyến tụy.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Ngưỡng dưới 10 quá thấp, không phải thang chia tiêu chuẩn.\n• Phương án C chưa đúng: Thang đo lấy mốc đường Glucose chuẩn là 100, nên các ngưỡng trên 100 là sai lệch.\n• Phương án D chưa đúng: Chỉ số đường huyết là một dãy số biến thiên từ 0 đến 100 chứ không chỉ có 2 mốc."}, {"n": 3, "q": "Phản ứng sinh học của cơ thể khi chúng ta nạp vào thực phẩm có Chỉ số đường huyết CAO (trên 70) là gì?", "opts": ["Tuyến tụy ngưng hoạt động hoàn toàn để dạ dày tự tiêu hóa đường.", "Đường huyết vọt tăng ngột ngạt, tuyến tụy buộc phải xả ra lượng lớn hormone để thu gom đường thừa biến thành mỡ bụng.", "Cơ thể tự động chuyển hóa toàn bộ lượng đường đó thành khối lượng cơ bắp.", "Lượng đường trong máu bị sụt giảm ngay lập tức xuống mức nguy hiểm."], "answer": "B", "explain": "Khi ăn đồ có chỉ số đường cao, đường tràn vào máu quá nhanh. Để bảo vệ mạch máu không bị ngộ độc đường, tuyến tụy phải hoạt động hết công suất xả ra hormone điều hòa. Hormone này gom đường thừa đẩy về gan và các tế bào mỡ, khóa chặt việc đốt mỡ và bắt cơ thể tích mỡ bụng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Tuyến tụy phải làm việc vất vả hơn gấp bội chứ không được ngưng hoạt động.\n• Phương án C chưa đúng: Đường dư thừa từ thực phẩm chỉ số đường cao sẽ biến thành mỡ, không thể tự biến thành cơ bắp nếu thiếu đạm và vận động.\n• Phương án D chưa đúng: Đường huyết sẽ vọt tăng rất cao trước khi bị hormone hạ xuống."}, {"n": 4, "q": "Bữa ăn lành mạnh F1 của Herbalife được chứng nhận quốc tế có Chỉ số đường huyết là bao nhiêu?", "opts": ["Chỉ số đường huyết bằng 0 (hoàn toàn không có đường).", "Chỉ số đường huyết siêu thấp, chỉ từ 17 đến 29 (tùy từng hương vị).", "Chỉ số đường huyết ở mức trung bình là 65.", "Chỉ số đường huyết ở mức cao là 85 để cung cấp năng lượng nhanh."], "answer": "B", "explain": "Bữa ăn F1 có chỉ số đường huyết cực kỳ lý tưởng (từ 17 đến 29, nằm sâu trong vùng an toàn dưới 55). Uống F1 giúp đường ngấm rất từ từ vào máu, giữ đường huyết êm ả, không làm quá tải tuyến tụy và không gây tích mỡ.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: F1 vẫn chứa một lượng đường tự nhiên lành tính cần thiết cho não bộ nên chỉ số không phải bằng 0.\n• Phương án C chưa đúng: Mức 65 là đường huyết trung bình (như hủ tiếu, bánh mì nguyên cám), F1 thấp hơn nhiều.\n• Phương án D chưa đúng: Mức 85 là chỉ số đường cao gây hại (như xôi, bánh mì trắng), F1 không nằm ở ngưỡng này."}, {"n": 5, "q": "Hiện tượng \"Tụt đường huyết phản ứng\" khiến hội viên hay bị thèm ăn vặt lúc 9–10 giờ sáng bắt nguồn từ đâu?", "opts": ["Do ăn bữa sáng có chỉ số đường cao, khiến hormone tiết ra quá nhiều kéo đường huyết rớt dốc thê thảm.", "Do bữa sáng chứa quá ít Calo làm dạ dày bị rỗng hoàn toàn.", "Do uống quá nhiều nước lọc ấm vào buổi sáng.", "Do cỗ máy đốt Calo tự nhiên ngừng hoạt động hoàn toàn."], "answer": "A", "explain": "Khi ăn bữa sáng đường cao (phở, xôi, bánh mì), đường vọt lên đỉnh. Tuyến tụy xả hormone mạnh tay để thu gom, làm đường huyết tụt dốc không phanh. Lúc đường huyết rớt xuống đáy chính là lúc não bộ phát tín hiệu đói cồn cào, ép bạn đi tìm đồ ngọt ăn tiếp.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Bát phở hay đĩa xôi chứa rất nhiều Calo (500–600 Calo) chứ không ít Calo.\n• Phương án C chưa đúng: Nước lọc ấm giúp làm sạch đường ruột và ổn định cơ thể chứ không gây tụt đường huyết.\n• Phương án D chưa đúng: Cỗ máy chuyển hóa vẫn hoạt động nhưng bị rối loạn do biến động đường huyết."}, {"n": 6, "q": "So sánh Chỉ số đường huyết giữa \"Khoai lang luộc\" và \"Khoai lang nướng/chiên\":", "opts": ["Khoai nướng có chỉ số đường thấp hơn khoai luộc vì nhiệt độ nướng làm bốc hơi toàn bộ lượng đường.", "Khoai luộc có chỉ số đường thấp (khoảng 45–50); Khoai nướng/chiên có chỉ số đường vọt lên cao (trên 70–80) do tinh bột bị biến tính.", "Cả hai phương pháp chế biến đều giữ nguyên chỉ số đường huyết hoàn toàn bằng nhau.", "Khoai lang luộc chứa chỉ số đường cao nhất trong tất cả các loại củ."], "answer": "B", "explain": "Mẹo chế biến quan trọng! Cùng một củ khoai lang, nếu luộc chín tới thì tinh bột giữ nguyên dạng hấp thu chậm (GI thấp). Khi nướng ở nhiệt độ cao hoặc chiên, tinh bột bị cắt nhỏ thành đường đơn hấp thu siêu nhanh, biến củ khoai từ món ăn tốt thành món làm vọt đường huyết!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Nướng nhiệt độ cao không làm bốc hơi đường mà làm tinh bột chuyển hóa thành đường nhanh hơn.\n• Phương án C chưa đúng: Cách chế biến làm thay đổi cấu trúc tinh bột và thay đổi hoàn toàn chỉ số đường huyết.\n• Phương án D chưa đúng: Khoai lang luộc thuộc nhóm tinh bột tốt có chỉ số đường thấp rất an toàn."}, {"n": 7, "q": "Tại sao \"Nước ép trái cây\" lại có Chỉ số đường huyết CAO HƠN RẤT NHIỀU so với việc \"Ăn trái cây nguyên múi/nguyên quả\"?", "opts": ["Việc ép lấy nước đã loại bỏ hoàn toàn bộ phanh chất xơ, khiến đường Fructose tự do thấm thẳng vào máu siêu tốc.", "Vì nước ép trái cây chứa nhiều chất béo bão hòa hơn trái cây nguyên quả.", "Vì khi ép, trái cây tự động sinh ra các loại vi khuẩn làm tăng chỉ số đường.", "Vì trái cây nguyên quả chứa nhiều Calo rỗng hơn nước ép."], "answer": "A", "explain": "Chất xơ trong múi/xác trái cây đóng vai trò như \"bộ phanh\" làm chậm quá trình hấp thu đường. Khi vắt/ép lấy nước, bộ phanh chất xơ bị vứt bỏ, ly nước ép nạp cùng lúc lượng đường của 3–4 quả cam/táo, làm đường huyết vọt tăng áp đảo.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Trái cây tươi hầu như không chứa chất béo bão hòa.\n• Phương án C chưa đúng: Máy ép không tự sinh ra vi khuẩn làm tăng chỉ số đường.\n• Phương án D chưa đúng: Trái cây nguyên quả giàu chất xơ và vi chất nên không phải Calo rỗng."}, {"n": 8, "q": "Người bị \"Tiểu đường\" hoặc \"Tiền tiểu đường\" có nên cắt bỏ 100% tinh bột ra khỏi khẩu phần ăn không?", "opts": ["Nên cắt bỏ 100% tinh bột vĩnh viễn để đường huyết luôn ở mức bằng 0.", "KHÔNG NÊN cắt bỏ hoàn toàn; cần chọn tinh bột tốt có Chỉ số đường THẤP (như F1, gạo lứt, khoai luộc) để nuôi não và tế bào.", "Nên thay thế tinh bột hoàn toàn bằng mỡ động vật và rượu bia.", "Cắt bỏ tinh bột sẽ giúp kéo dài tuổi thọ của bộ não lên gấp đôi."], "answer": "B", "explain": "Não bộ và các tế bào bắt buộc phải có đường Glucose lành mạnh để duy trì sự sống. Cắt bỏ hoàn toàn tinh bột làm suy giảm trí nhớ, mệt mỏi, teo cơ và rối loạn chuyển hóa. Điều thông thái là thay thế tinh bột xấu GI cao bằng tinh bột tốt GI thấp!\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Cắt bỏ hoàn toàn tinh bột kéo dài gây tổn thương não bộ và kiệt sức.\n• Phương án C chưa đúng: Mỡ động vật xấu và rượu bia làm trầm trọng thêm tình trạng kháng đường và hỏng gan thận.\n• Phương án D chưa đúng: Thiếu đường nuôi não sẽ làm suy giảm chức năng não chứ không kéo dài tuổi thọ."}, {"n": 9, "q": "Mối liên hệ giữa việc thường xuyên ăn thực phẩm có Chỉ số đường CAO và hiện tượng \"Lão hóa da, nhăn nheo chảy xệ\" ở phụ nữ?", "opts": ["Đường dư thừa trong máu gắn vào các sợi Collagen và Elastin, làm chúng bị gãy vụn, biến tính, khiến da bị chùng nhão, nám sạm.", "Thực phẩm đường cao làm triệt tiêu toàn bộ lượng nước lọc dưới da.", "Thực phẩm đường cao làm da bị phúng phính và săn chắc quá mức.", "Đường chỉ ảnh hưởng tới vòng bụng, hoàn toàn không liên quan tới làn da."], "answer": "A", "explain": "Hiện tượng \"gắn đường\" (Glycation)! Khi đường huyết vọt cao liên tục, các phân tử đường thừa sẽ \"bám chặt\" vào các sợi khung Collagen dưới da, làm lớp keo đàn hồi này bị giòn cứng và gãy vụn. Hậu quả là da xuất hiện nếp nhăn, chùng nhão và sạm nám rất nhanh.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đường làm phá hủy sợi Collagen chứ không triệt tiêu nước dưới da.\n• Phương án C chưa đúng: Đường cao làm da chảy xệ và lão hóa chứ không làm săn chắc.\n• Phương án D chưa đúng: Làn da là cơ quan thể hiện rất rõ tác hại của việc ăn quá nhiều đường GI cao."}, {"n": 10, "q": "Tại sao việc kết hợp \"Đạm sạch\" (như Bột Protein PPP) và \"Chất xơ\" vào bữa ăn lại giúp KÉO CHỈ SỐ ĐƯỜNG HUYẾT TỔNG THỂ xuống thấp?", "opts": ["Đạm và chất xơ làm chậm tốc độ rỗng của dạ dày, tạo lớp đệm cản trở sự hấp thu đường nhanh vào máu.", "Vì đạm sạch có khả năng tiêu diệt toàn bộ các phân tử đường trong thức ăn.", "Vì chất xơ làm triệt tiêu hoàn toàn Calo của món ăn đó.", "Vì đạm sạch làm dạ dày ngưng co bóp trong 12 tiếng."], "answer": "A", "explain": "Mẹo phối hợp đĩa ăn thông thái! Đạm và chất xơ đóng vai trò như \"người gác cổng\". Khi ăn đạm và rau trước, chúng tạo thành mạng lưới xơ đệm trong ruột, giúp đường từ thức ăn đi vào máu rải rác từ từ, kéo chỉ số đường huyết chung của cả bữa ăn xuống mức an toàn.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Đạm không tiêu diệt phân tử đường mà làm chậm quá trình hấp thu đường.\n• Phương án C chưa đúng: Chất xơ làm giảm tốc độ hấp thu chứ không triệt tiêu Calo của thức ăn.\n• Phương án D chưa đúng: Đạm giúp tiêu hóa bền bỉ êm ả chứ không làm dạ dày bị ngưng co bóp."}, {"n": 11, "q": "So sánh Chỉ số đường huyết giữa \"Cơm trắng\" và \"Cơm gạo lứt\":", "opts": ["Cơm trắng có chỉ số đường thấp hơn cơm gạo lứt vì đã được chà xát sạch sẽ lớp vỏ.", "Cơm trắng có GI cao (khoảng 83) gây vọt đường; Cơm gạo lứt có GI thấp hơn (khoảng 55) nhờ còn lớp vỏ cám giàu xơ.", "Cơm gạo lứt có chỉ số đường bằng 0 nên người tiểu đường có thể ăn 5 chén một lúc.", "Cả hai loại cơm đều có chỉ số đường huyết giống hệt nhau."], "answer": "B", "explain": "Cơm trắng đã bị xát bỏ lớp vỏ cám, chỉ còn lõi tinh bột dễ tiêu hóa nên chỉ số GI rất cao (83). Cơm gạo lứt giữ lại vỏ cám giàu chất xơ và vi chất, giúp bộ phanh chất xơ hãm tốc độ xả đường vào máu (GI khoảng 55).\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Chà xát mất lớp vỏ cám chính là lý do làm cơm trắng bị vọt chỉ số đường lên cao.\n• Phương án C chưa đúng: Gạo lứt vẫn là tinh bột và chứa Calo/đường, ăn quá nhiều vẫn làm tăng đường và dư Calo.\n• Phương án D chưa đúng: Chỉ số GI của 2 loại cơm này hoàn toàn khác nhau."}, {"n": 12, "q": "Tại sao các món ăn ninh nhừ, hầm kỹ (như cháo trắng, soup hầm nhừ, bún phở) lại có Chỉ số đường huyết CAO HƠN dạng nấu chín tới?", "opts": ["Đun nấu quá lâu làm tinh bột bị phân rã hoàn toàn thành các chuỗi đường ngắn, giúp cơ thể hấp thu siêu tốc vào máu.", "Ninh nhừ làm món ăn sinh ra thêm nhiều chất béo bão hòa.", "Ninh nhừ làm triệt tiêu toàn bộ lượng nước có trong món ăn.", "Các món hầm nhừ làm dạ dày bị co thắt mạnh hơn."], "answer": "A", "explain": "Nhiệt độ và thời gian đun nấu dài đóng vai trò như một quá trình \"tiêu hóa sơ bộ\". Tinh bột phức tạp bị bẻ gãy thành các phân tử đường đơn nhỏ. Khi ăn cháo hay đồ hầm nhừ, cơ thể không cần tốn công phân rã mà hấp thu đường thẳng vào máu cực nhanh (GI của cháo trắng lên tới 88!).\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Ninh nhừ tinh bột không tự sinh ra chất béo bão hòa.\n• Phương án C chưa đúng: Món hầm nhừ chứa rất nhiều nước chứ không triệt tiêu nước.\n• Phương án D chưa đúng: Đồ ninh nhừ trôi qua dạ dày rất nhanh chứ không làm co thắt mạnh."}, {"n": 13, "q": "Bữa ăn sáng F1 có Chỉ số đường thấp (17–29) mang lại giá trị kỳ diệu gì cho sự TỈNH TÁO & TẬP TRUNG làm việc cả ngày?", "opts": ["Giữ đường huyết ổn định êm ả, cung cấp dòng năng lượng đều đặn cho não bộ, ngăn ngừa cơn buồn ngủ gật giữa buổi.", "Giúp vọt tăng đường huyết để não bộ hưng phấn cực độ trong 15 phút.", "Làm cho não bộ ngưng hoạt động để tiết kiệm năng lượng.", "Giúp triệt tiêu hoàn toàn nhu cầu ngủ đêm của cơ thể."], "answer": "A", "explain": "Não bộ hoạt động tốt nhất khi dòng đường đi vào máu ổn định như một dòng sông chảy nhẹ nhàng. Uống F1 giữ đường huyết phẳng lặng, giúp não nhận đủ thức ăn liên tục, giúp bạn giữ tinh thần tỉnh táo, minh mẫn và tràn đầy năng lượng suốt cả buổi sáng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Hưng phấn ngột ngạt trong 15 phút sau đó sẽ là cơn mệt mỏi và buồn ngủ gật gù.\n• Phương án C chưa đúng: F1 nuôi dưỡng não bộ hoạt động tối ưu chứ không làm ngưng hoạt động.\n• Phương án D chưa đúng: F1 giúp tỉnh táo ban ngày và ngủ sâu giấc ban đêm chứ không triệt tiêu giấc ngủ."}, {"n": 14, "q": "Tại sao hai thực phẩm có CÙNG LƯỢNG CALO nhưng thực phẩm có GI THẤP lại giúp giảm mỡ tốt hơn thực phẩm có GI CAO?", "opts": ["Vì thực phẩm GI thấp có khả năng tự đốt cháy tế bào mỡ mà không cần vận động.", "Vì thực phẩm GI thấp không làm vọt hormone Insulin (hormone khóa đốt mỡ), giúp cơ thể dễ dàng mở cửa kho mỡ ra tiêu thụ.", "Vì thực phẩm GI cao chứa các phân tử mỡ động vật ngầm.", "Vì thực phẩm GI thấp làm triệt tiêu hoàn toàn lượng nước trong dạ dày."], "answer": "B", "explain": "Bí mật của chuyển hóa! Khi hormone Insulin trong máu ở mức thấp (nhờ ăn đồ GI thấp như F1), \"cánh cửa kho mỡ\" sẽ được mở ra để cơ thể lấy mỡ thừa ra đốt làm năng lượng. Nếu ăn đồ GI cao, Insulin vọt cao sẽ \"khóa chặt\" kho mỡ, khiến bạn dù ăn ít Calo vẫn khó giảm được mỡ bụng.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Thực phẩm GI thấp giúp tạo môi trường thuận lợi để đốt mỡ chứ không tự biến mất mỡ.\n• Phương án C chưa đúng: Chỉ số GI đo tốc độ tăng đường, không phản ánh mỡ động vật ngầm.\n• Phương án D chưa đúng: GI thấp không liên quan đến việc triệt tiêu nước trong dạ dày."}, {"n": 15, "q": "Trái cây nào dưới đây thuộc nhóm có Chỉ số đường huyết THẤP vô cùng an toàn cho người giảm cân?", "opts": ["Dưa hấu chín ngọt, nhãn, vải, sầu riêng, chà là khô.", "Táo tây (táo xanh/đỏ), ổi nguyên vỏ, thanh long, dâu tây, bơ.", "Xoài chín mộng, chuối thắp hương chín cuống, mít chín.", "Tất cả các loại trái cây đều có chỉ số đường huyết cao như nhau."], "answer": "B", "explain": "Táo, ổi nguyên vỏ, thanh long, dâu tây, bơ chứa hàm lượng chất xơ cao và lượng đường vừa phải, có chỉ số GI dưới 55. Đây là những lựa chọn tuyệt vời giúp thỏa mãn cơn thèm ăn mà không làm ảnh hưởng đến đường huyết.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Dưa hấu, nhãn, vải, sầu riêng có chỉ số đường cao (GI từ 60–75 trở lên).\n• Phương án C chưa đúng: Xoài chín, chuối chín mọng, mít chín chứa đường đơn rất cao, làm vọt đường huyết nhanh.\n• Phương án D chưa đúng: Mỗi loại trái cây có chỉ số GI hoàn toàn khác nhau tùy thuộc vào lượng chất xơ và độ chín."}, {"n": 16, "q": "\"Bẫy tích mỡ nội tạng\" từ việc nghiện uống các loại Bún, Phở, Hủ tiếu vào buổi sáng diễn ra như thế nào?", "opts": ["Bánh bún/phở làm từ bột lọc GI cao làm vọt đường huyết, kết hợp nước dùng nhiều mỡ động vật tạo thành công thức tích mỡ nội tạng hoàn hảo.", "Do hành lá trong phở làm ngưng trệ quá trình tiêu hóa của dạ dày.", "Do bánh phở chứa quá nhiều đạm thực vật khiến cơ thể bị quá tải.", "Do nước dùng phở làm tiêu biến toàn bộ khối lượng cơ bắp chân tay."], "answer": "A", "explain": "Công thức béo bụng nguy hiểm! Bánh bún/phở làm từ tinh bột xát trắng (GI cao) làm vọt tăng hormone Insulin. Đúng lúc đó, lượng mỡ từ nước hầm xương dội vào sẽ được Insulin gom trọn gói và tống thẳng vào kho mỡ nội tạng quanh ổ bụng!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Hành lá là rau gia vị lành tính, không gây tích mỡ nội tạng.\n• Phương án C chưa đúng: Bánh phở làm từ tinh bột gạo, chứa rất ít đạm.\n• Phương án D chưa đúng: Nước dùng không trực tiếp làm tiêu biến cơ bắp, mất cơ là do thiếu đạm sạch."}, {"n": 17, "q": "Tại sao Bữa ăn F1 lại được coi là giải pháp \"Giải oan cho đường\" một cách khoa học?", "opts": ["Vì F1 chứng minh rằng đường tinh luyện ăn bao nhiêu cũng không sao.", "Vì F1 cung cấp lượng đường tự nhiên lành tính với GI rất thấp (17–29), nuôi dưỡng não bộ mà hoàn toàn không gây hại cho sức khỏe.", "Vì F1 làm triệt tiêu toàn bộ tác hại của rượu bia và thuốc lá.", "Vì F1 giúp biến đường hóa học thành chất xơ hòa tan."], "answer": "B", "explain": "Cơ thể chúng ta không sợ \"đường\", mà chỉ sợ \"đường GI cao / đường tinh luyện\"! Bữa ăn F1 cung cấp đúng loại đường tự nhiên mà tế bào và não bộ cần, với chỉ số GI siêu thấp giúp nuôi dưỡng cơ thể an toàn mà không gây béo hay tiểu đường.\nTại sao các phương án còn lại chưa đúng:\n• Phương án A chưa đúng: Đường tinh luyện GI cao vẫn là tác nhân gây hại cho sức khỏe.\n• Phương án C chưa đúng: F1 không có chức năng tẩy xóa tác hại của rượu bia thuốc lá.\n• Phương án D chưa đúng: F1 không biến đường hóa học thành chất xơ."}, {"n": 18, "q": "Nguyên tắc chọn lựa đĩa ăn theo Chỉ số đường huyết tại Nhóm Dinh Dưỡng giúp hội viên làm chủ vóc dáng trọn đời là gì?", "opts": ["Ưu tiên thực phẩm GI THẤP (F1, rau xanh, đạm sạch, củ quả nguyên vỏ); Hạn chế tối đa thực phẩm GI CAO (đồ tinh chế, chiên nướng, nước ngọt).", "Chỉ ăn thực phẩm GI cao vào buổi tối trước khi đi ngủ.", "Cắt bỏ hoàn toàn chất đạm và chỉ ăn thực phẩm có GI trung bình.", "Chỉ cần ăn đồ luộc, không cần quan tâm đến chỉ số đường huyết của thực phẩm đó."], "answer": "A", "explain": "Công thức thông thái! Làm chủ chỉ số GI bằng cách chọn thực phẩm nhóm màu xanh (GI thấp), kết hợp đạm sạch và rau xanh trong mỗi bữa ăn giúp bạn bảo vệ tuyến tụy, duy trì vóc dáng thon gọn và tràn đầy sinh lực.\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Ăn đồ GI cao vào buổi tối sát giờ ngủ là con đường nhanh nhất gây tích mỡ bụng và mỡ gan.\n• Phương án C chưa đúng: Đạm sạch là chất bắt buộc phải có để giữ cơ bắp và làm hạ chỉ số đường của bữa ăn.\n• Phương án D chưa đúng: Nhiều đồ luộc (như khoai tây luộc, bánh củ mì luộc) vẫn có chỉ số GI rất cao nên vẫn cần nhận biết."}, {"n": 19, "q": "Tác hại của việc để đường huyết dao động liên tục theo hình \"mô tô cao tốc\" (lúc vọt lên đỉnh, lúc rớt xuống đáy) trong thời gian dài?", "opts": ["Gây kiệt quệ tuyến tụy (dẫn tới tiểu đường tuýp 2), gây viêm mạn tính hệ mạch máu, mệt mỏi mạn tính và tích mỡ nội tạng.", "Giúp tăng cường hệ miễn dịch và làm dẻo dai các khớp xương.", "Giúp cơ thể tự động đào thải các mảng bám mỡ máu ra ngoài.", "Giúp kéo dài tuổi thọ của tế bào tim mạch."], "answer": "A", "explain": "Biến động đường huyết hình sóng thần là sát thủ thầm lặng! Bắt tuyến tụy xả hormone liên tục sẽ gây chai sạn thụ thể (kháng Insulin), làm suy kiệt tuyến tụy, gây tổn thương lòng mạch máu và biến cơ thể thành \"xưởng sản xuất mỡ nội tạng\".\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Biến động đường huyết phá hủy miễn dịch và gây viêm mạn tính.\n• Phương án C chưa đúng: Đường huyết cao làm tổn thương lòng mạch và tăng nguy cơ xơ vữa mỡ máu.\n• Phương án D chưa đúng: Tàn phá hệ tim mạch chứ không kéo dài tuổi thọ."}, {"n": 20, "q": "Thông điệp cốt lõi và giá trị sâu sắc nhất của Chủ đề 5 \"Chỉ Số Đường Huyết (GI)\" tại Nhóm Dinh Dưỡng là gì?", "opts": ["\"LÀM CHỦ CHỈ SỐ GI - LÀM CHỦ VÓC DÁNG & SỨC KHỎE: Chọn Bữa ăn F1 và thực phẩm GI thấp là giải pháp bảo vệ tuyến tụy và trẻ hóa cơ thể trọn đời!\"", "Chỉ cần kiểm soát Calo là đủ, không cần quan tâm đến Chỉ số đường huyết.", "Nhịn ăn tinh bột hoàn toàn là phương pháp sống khỏe duy nhất.", "Chỉ số đường huyết chỉ quan trọng với người đã bị bệnh tiểu đường nặng."], "answer": "A", "explain": "\"Calo quyết định CÂN NẶNG, nhưng Chỉ số GI quyết định VÓC DÁNG & SỨC KHỎE CHUYỂN HÓA!\" Hiểu và ứng dụng chỉ số GI thấp cùng Bữa ăn F1 mỗi ngày là chiếc chìa khóa vàng giúp bạn phòng ngừa bệnh mãn tính, giữ vòng eo thon gọn và an vui trọn đời!\nTại sao các phương án còn lại chưa đúng:\n• Phương án B chưa đúng: Kiểm soát Calo mà ăn đồ GI cao vẫn bị béo bụng và hại tuyến tụy.\n• Phương án C chưa đúng: Nhịn tinh bột hoàn toàn gây tổn thương não bộ và mất cơ bắp.\n• Phương án D chưa đúng: Nhận biết chỉ số GI là kiến thức chăm sóc sức khỏe chủ động cần thiết cho tất cả mọi người."}];
const TKP_LESSON=5;

const TKP_ORIGINAL=QUESTIONS.map(q=>JSON.parse(JSON.stringify(q)));
function tkpShuffle(){
 QUESTIONS.forEach((q,i)=>{
  const orig=TKP_ORIGINAL[i],opts=orig.options||orig.opts;
  const order=[0,1,2,3];for(let k=3;k>0;k--){let j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  const mapping={};order.forEach((old,newIdx)=>mapping['ABCD'[old]]='ABCD'[newIdx]);
  const rewrite=t=>typeof t==='string'?t.replace(/(Phương án|Đáp án|Lựa chọn)\s+([ABCD])\b/gi,(all,prefix,letter)=>prefix+' '+mapping[letter.toUpperCase()]):t;
  if(orig.options)q.options=order.map(j=>opts[j]);else q.opts=order.map(j=>opts[j]);
  const oldAnswer=typeof orig.answer==='number'?orig.answer:'ABCD'.indexOf(orig.answer);
  const newAnswer=order.indexOf(oldAnswer);
  q.answer=typeof orig.answer==='number'?newAnswer:'ABCD'[newAnswer];
  if(orig.explanation!==undefined)q.explanation=rewrite(orig.explanation);
  if(orig.explain!==undefined)q.explain=rewrite(orig.explain);
  if(Array.isArray(orig.wrong))q.wrong=orig.wrong.map(rewrite);
 });
}
function tkpRecord(pct){try{let key='tkp21_best_'+TKP_LESSON;let old=Number(localStorage.getItem(key)||0);if(pct>old)localStorage.setItem(key,String(pct));}catch(e){} }
function tkpGate(){try{if(TKP_LESSON===1||Number(localStorage.getItem('tkp21_best_'+(TKP_LESSON-1))||0)>=80)return;const shield=document.createElement('div');shield.style.cssText='position:fixed;inset:0;z-index:999999;background:#102b35;color:white;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;text-align:center';shield.innerHTML='<div style="max-width:500px"><div style="font-size:54px">🔒</div><h1>BÀI '+TKP_LESSON+' CHƯA ĐƯỢC MỞ</h1><p>Bạn cần đạt ít nhất 80% ở Bài '+(TKP_LESSON-1)+' trước khi học bài này.</p><a href="index.html" style="display:inline-block;padding:15px 22px;border-radius:12px;background:#ffd78a;color:#17323b;font-weight:bold;text-decoration:none">🏠 VỀ TRANG CHỦ</a></div>';document.body.append(shield);}catch(e){}}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function play(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const tunes={click:[440],correct:[523,659,784,1047],wrong:[330,270],reveal:[180,150,120,460],finish:[523,659,784,1047,1318]};(tunes[kind]||[440]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.19);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)});}catch(e){}}

function intro(){tkpShuffle();app.className='panel center';app.innerHTML=`<div class="eyebrow">🎮 GAMESHOW KIẾN THỨC SỨC KHỎE</div><h1>THÔNG THÁI VỀ<br>CHỈ SỐ ĐƯỜNG HUYẾT</h1><div class="subtitle">BẢO VỆ TUYẾN TỤY – KHÓA BẪY TÍCH MỠ</div><div class="chip">✨ ${QUESTIONS.length} CÂU HỎI TRẮC NGHIỆM ĐỘNG NÃO ✨</div><p>Chọn một đáp án A, B, C hoặc D. Kết quả và lời giải thích xuất hiện ngay.<br>Mỗi câu chỉ trả lời một lần; bạn cũng có thể chọn <b>XEM ĐÁP ÁN</b>.</p><button class="cta" id="start">🎮 BẮT ĐẦU TRÒ CHƠI</button><p class="notice">Nội dung học tập được giữ theo tài liệu do đơn vị cung cấp, chưa được kiểm chứng y khoa; không dùng để thay thế tư vấn chuyên môn.</p>`;document.getElementById('start').onclick=()=>{play('click');reset(false)}}
function reset(showIntro=true){index=0;correct=0;wrong=0;revealed=0;locked=false;showIntro?intro():question()}
function question(){locked=false;let q=QUESTIONS[index];app.className='panel';app.innerHTML=`<div class="topline"><span>💡 CÂU ${String(index+1).padStart(2,'0')} / ${QUESTIONS.length}</span><span>⭐ ĐÚNG: ${correct}</span></div><div class="progress"><div style="width:${index/QUESTIONS.length*100}%"></div></div><div class="question"><h2>${escapeHtml(q.q)}</h2></div><div class="answers">${q.opts.map((x,i)=>`<button class="choice" data-answer="${letters[i]}"><span class="letter">${letters[i]}</span><span>${escapeHtml(x)}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button id="reveal" class="small">🥁 XEM ĐÁP ÁN</button><button id="next" class="cta" disabled>${index===QUESTIONS.length-1?'🏆 XEM KẾT QUẢ':'➡️ CÂU TIẾP THEO'}</button></div>`;app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(b.dataset.answer));document.getElementById('reveal').onclick=()=>choose(null);document.getElementById('next').onclick=()=>{if(!locked)return;play('click');if(index===QUESTIONS.length-1)finish();else{index++;question()}}}
function choose(selected){if(locked)return;locked=true;let q=QUESTIONS[index],isCorrect=selected===q.answer;if(selected===null){revealed++;play('reveal')}else if(isCorrect){correct++;play('correct');confetti()}else{wrong++;play('wrong')}app.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;let a=b.dataset.answer;b.classList.add(a===q.answer?'correct':a===selected?'wrong':'dim')});let f=document.getElementById('feedback');f.className='feedback '+(isCorrect?'good':'bad');f.innerHTML=`<h3>${selected===null?'🥁 ĐÁP ÁN ĐÃ ĐƯỢC CÔNG BỐ':isCorrect?'🎉 CHÚC MỪNG BẠN! BẠN ĐÃ TRẢ LỜI CHÍNH XÁC!':'🌷 CHƯA CHUẨN XÁC! HÃY CÙNG TÌM HIỂU NHÉ!'}</h3><p><b>ĐÁP ÁN ĐÚNG LÀ: ${q.answer}</b></p><div class="explain"><b>💡 LỜI GIẢI THÍCH</b>\n${escapeHtml(q.explain)}</div>`;document.getElementById('reveal').disabled=true;document.getElementById('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function finish(){tkpRecord(correct/QUESTIONS.length*100);play('finish');let pct=correct/QUESTIONS.length*100,msg=pct>=90?'🏆 XUẤT SẮC! BẠN THẬT TUYỆT VỜI!':pct>=70?'🎉 RẤT TỐT! CHÚC MỪNG BẠN!':pct>=50?'🌷 KHÁ TỐT! HÃY TIẾP TỤC PHÁT HUY!':'💖 CẢM ƠN BẠN ĐÃ THAM GIA! HÃY THỬ LẠI NHÉ!';app.className='panel center';app.innerHTML=`<div class="eyebrow">🏆 LỄ TRAO GIẢI – TỔNG KẾT</div><h1>KẾT QUẢ TRÒ CHƠI</h1><div class="score">${Number.isInteger(pct)?pct:pct.toFixed(1)}%</div><h2>${msg}</h2><div class="stats"><div class="stat"><strong>${QUESTIONS.length}</strong><span>TỔNG CÂU</span></div><div class="stat"><strong>${correct}</strong><span>TRẢ LỜI ĐÚNG</span></div><div class="stat"><strong>${wrong}</strong><span>TRẢ LỜI SAI</span></div><div class="stat"><strong>${revealed}</strong><span>XEM ĐÁP ÁN</span></div></div><p>Tỷ lệ đúng = ${correct} / ${QUESTIONS.length} × 100%</p><button class="cta" id="again">🔄 CHƠI LẠI TỪ ĐẦU</button>`;document.getElementById('again').onclick=()=>{play('click');reset(true)};if(pct>=70)confetti()}
intro();

setTimeout(tkpGate,0);
</script></body></html>
